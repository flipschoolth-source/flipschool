<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แดชบอร์ดนักเรียน | FlipSchool</title>
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; overflow-x: hidden; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .hero-gradient { background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%); }
        
        .class-card {
            background: white; border-radius: 1.5rem; padding: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            border: 1px solid #e2e8f0; transition: all 0.3s ease; cursor: pointer;
            position: relative; overflow: hidden;
        }
        .class-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.1); border-color: #3b82f6; }
        
        .class-icon-box {
            width: 50px; height: 50px; border-radius: 1rem;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
            background: linear-gradient(135deg, #eff6ff, #dbeafe); color: #2563eb;
        }

        .modal-overlay { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px); }
        .hidden-el { display: none !important; }
        
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #1e3a8a; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes bounceIn { 0% { transform: translateY(-20px); opacity: 0; } 50% { transform: translateY(5px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        .animate-bounce-in { animation: bounceIn 0.4s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center">
        <div class="spinner"></div>
        <p class="mt-4 text-blue-900 font-bold animate-pulse text-sm font-sans" id="loadingText">กำลังเข้าสู่ระบบ...</p>
    </div>

    <!-- กล่องข้อความแจ้งเตือน Toast -->
    <div id="msgBox" class="fixed top-20 right-5 z-[210] hidden bg-white border-l-4 shadow-lg rounded-xl p-4 transition-all animate-bounce-in">
        <p id="msgText" class="text-sm font-bold text-slate-700"></p>
    </div>

    <!-- 🌟 Modal เข้าร่วมห้องเรียน 🌟 -->
    <div id="joinClassModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl transform transition-all scale-95 opacity-0 text-center" id="joinClassCard">
            <div class="w-16 h-16 bg-orange-50 text-orange-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i class="fas fa-door-open"></i>
            </div>
            <h3 class="text-xl font-bold text-slate-800 mb-2 font-sans">เข้าร่วมห้องเรียน</h3>
            <p class="text-xs text-slate-500 mb-6 font-sans">กรอกรหัสห้องเรียน 6 หลักที่ได้รับจากคุณครู</p>
            <input type="text" id="joinCodeInput" maxlength="6" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-orange-500 text-center mb-6 font-bold text-slate-700 font-sans tracking-[0.5em] uppercase text-xl" placeholder="รหัส 6 หลัก">
            <div class="flex gap-3">
                <button onclick="closeJoinModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all font-sans">ยกเลิก</button>
                <button onclick="executeJoinClass()" id="btnJoin" class="flex-1 bg-orange-500 hover:bg-orange-600 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95 font-sans">เข้าร่วม</button>
            </div>
        </div>
    </div>

    <!-- Drawer Menu (Mobile) -->
    <div id="drawerOverlay" onclick="toggleDrawer()" class="fixed inset-0 z-[1000] hidden bg-slate-900/50 backdrop-blur-sm transition-opacity duration-300"></div>
    <div id="sideDrawer" class="fixed top-0 left-0 h-full w-72 bg-white z-[1001] shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out">
        <div class="p-6 border-b border-slate-100 flex items-center gap-4 bg-blue-50/50">
            <img id="drawerProfileImg" src="" class="w-12 h-12 rounded-xl object-cover border-2 border-white shadow-sm">
            <div>
                <h2 id="drawerStudentName" class="font-bold text-slate-800 text-base line-clamp-1">กำลังโหลด...</h2>
                <p class="text-[10px] text-blue-600 font-bold uppercase tracking-wider bg-blue-100 px-2 py-0.5 rounded-full inline-block mt-1">Student</p>
            </div>
        </div>
        <nav class="mt-4 px-4 space-y-2">
            <a href="student-dashboard.html" class="flex items-center gap-3 p-4 rounded-2xl bg-blue-50 text-blue-700 font-bold transition-all"><i class="fas fa-home w-5 text-center"></i> หน้าหลัก</a>
            <a href="#" onclick="openJoinModal(); toggleDrawer();" class="flex items-center gap-3 p-4 rounded-2xl hover:bg-slate-50 text-slate-600 font-bold transition-all"><i class="fas fa-plus-circle w-5 text-center text-orange-500"></i> เข้าร่วมห้องเรียน</a>
            <hr class="my-4 border-slate-100">
            <button onclick="handleLogout()" class="w-full flex items-center gap-3 p-4 rounded-2xl hover:bg-rose-50 text-rose-500 font-bold transition-all"><i class="fas fa-sign-out-alt w-5 text-center"></i> ออกจากระบบ</button>
        </nav>
    </div>

    <!-- Navbar -->
    <nav class="bg-white h-20 shadow-sm sticky top-0 z-50 px-4 md:px-8 flex items-center justify-between border-b border-slate-100">
        <div class="flex items-center gap-4">
            <button onclick="toggleDrawer()" class="md:hidden w-10 h-10 flex items-center justify-center hover:bg-slate-100 rounded-full transition-all text-slate-600">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='student-dashboard.html'">
                <div class="w-10 h-10 bg-blue-900 rounded-xl flex items-center justify-center shadow-md shrink-0">
                    <span class="text-xl text-white">🎓</span>
                </div>
                <div class="flex flex-col hidden sm:flex">
                    <div class="brand-name text-xl font-bold tracking-tight leading-none text-slate-800">
                        Flip<span class="text-orange-500">School</span>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-4">
            <button onclick="openJoinModal()" class="hidden md:flex items-center gap-2 bg-orange-50 hover:bg-orange-100 text-orange-600 px-4 py-2 rounded-xl text-xs font-bold transition-all border border-orange-200">
                <i class="fas fa-plus"></i> เข้าร่วมห้องเรียน
            </button>
            <div class="flex items-center gap-3 cursor-pointer p-1.5 rounded-full hover:bg-slate-50 transition" onclick="toggleDrawer()">
                <div class="text-right hidden sm:block">
                    <p id="navStudentName" class="text-sm font-bold text-slate-700 leading-tight">กำลังโหลด...</p>
                    <p class="text-[10px] text-blue-500 font-bold">นักเรียน</p>
                </div>
                <img id="navProfileImg" src="" class="w-10 h-10 rounded-full object-cover border-2 border-slate-200 shadow-sm">
            </div>
        </div>
    </nav>

    <!-- Hero Section (Profile & Stats) -->
    <header class="hero-gradient text-white py-10 px-6 relative overflow-hidden">
        <div class="container mx-auto relative z-10 max-w-5xl">
            <div class="flex flex-col md:flex-row items-center gap-6">
                <div class="relative">
                    <img id="heroProfileImg" src="" class="w-24 h-24 md:w-28 md:h-28 rounded-full border-4 border-white/30 shadow-xl object-cover">
                    <div class="absolute -bottom-2 -right-2 bg-orange-500 text-white w-10 h-10 rounded-full flex items-center justify-center font-bold border-4 border-blue-600 shadow-lg" title="Level">
                        <i class="fas fa-star text-sm"></i>
                    </div>
                </div>
                <div class="text-center md:text-left flex-grow">
                    <h1 class="text-2xl md:text-4xl font-bold font-sans">สวัสดี, <span id="heroStudentName">...</span>! ✌️</h1>
                    <p class="text-blue-100 mt-2 text-sm">พร้อมลุยภารกิจในวันนี้แล้วหรือยัง?</p>
                </div>
                
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 border border-white/20 flex items-center gap-6 shadow-lg">
                    <div class="text-center">
                        <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mb-1">EXP สะสม</p>
                        <p id="totalExp" class="text-3xl font-black text-white">0</p>
                    </div>
                    <div class="h-10 w-px bg-white/20"></div>
                    <div class="text-center">
                        <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mb-1">ภารกิจสำเร็จ</p>
                        <p id="completedMissions" class="text-3xl font-black text-white">0</p>
                    </div>
                </div>
            </div>
        </div>
        <!-- Decorative bg -->
        <div class="absolute top-0 right-0 w-64 h-64 bg-white/5 rounded-full blur-3xl transform translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 left-0 w-40 h-40 bg-blue-400/20 rounded-full blur-2xl transform -translate-x-1/2 translate-y-1/2"></div>
    </header>

    <!-- Main Content (Classroom List) -->
    <main class="flex-grow container mx-auto px-4 py-10 max-w-5xl relative z-20 -mt-6">
        
        <div class="flex justify-between items-end mb-6">
            <h2 class="text-xl font-bold text-slate-800 font-sans"><i class="fas fa-chalkboard-teacher text-blue-500 mr-2"></i> ห้องเรียนของฉัน</h2>
        </div>

        <div id="classroomGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Data will be loaded here -->
            <div class="col-span-full text-center py-20">
                <div class="spinner mx-auto mb-4 border-blue-200 border-t-blue-600"></div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-8 mt-auto text-center font-sans">
        <p class="text-slate-500 font-bold text-[10px] uppercase tracking-widest">© <span id="currentYear"></span> <span class="brand-name">FlipSchool</span></p>
    </footer>

    <script>
        let currentUserId = null;
        let studentData = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof APP_CONFIG !== 'undefined') {
                document.getElementById('currentYear').innerText = APP_CONFIG.YEAR || new Date().getFullYear();
                if (typeof initAppUI === 'function') initAppUI();
            }

            // รับ Event สำหรับช่อง Input กรอกรหัสห้อง (Auto uppercase)
            const codeInput = document.getElementById('joinCodeInput');
            codeInput.addEventListener('input', function() {
                this.value = this.value.toUpperCase();
            });
            codeInput.addEventListener('keypress', (e) => {
                if(e.key === 'Enter') executeJoinClass();
            });

            const checkDB = setInterval(() => { 
                if (window.sysDB) { 
                    clearInterval(checkDB); 
                    initStudentApp(); 
                } 
            }, 500);
        });

        async function initStudentApp() {
            try {
                const { data: { user } } = await window.sysDB.auth.getUser();
                
                if (!user) {
                    window.location.href = 'login.html';
                    return;
                }
                
                currentUserId = user.id;

                // ตรวจสอบให้ชัวร์ว่าเป็นตารางนักเรียน
                const { data: studentInfo, error } = await window.sysDB
                    .from('students')
                    .select('*')
                    .eq('student_id', currentUserId)
                    .maybeSingle();
                
                if (error || !studentInfo) {
                    // ถ้าไม่ใช่ข้อมูลนักเรียน ให้เตะกลับไปหน้าล็อกอิน (เผื่อเป็นครูหลงเข้ามา)
                    await window.sysDB.auth.signOut();
                    window.location.href = 'login.html';
                    return;
                }

                studentData = studentInfo;
                updateProfileUI();
                await fetchMyClassrooms();
                
                document.getElementById('loadingOverlay').style.display = 'none';

            } catch (err) { 
                console.error("Init Error:", err); 
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function updateProfileUI() {
            const fullName = `${studentData.first_name} ${studentData.last_name}`;
            const avatarUrl = studentData.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${studentData.first_name}&backgroundColor=b6e3f4`;
            
            // อัปเดตข้อมูลบน Navbar
            document.getElementById('navStudentName').innerText = studentData.first_name;
            document.getElementById('navProfileImg').src = avatarUrl;
            
            // อัปเดตข้อมูลบน Drawer
            document.getElementById('drawerStudentName').innerText = fullName;
            document.getElementById('drawerProfileImg').src = avatarUrl;
            
            // อัปเดตข้อมูลบน Hero Section
            document.getElementById('heroStudentName').innerText = studentData.first_name;
            document.getElementById('heroProfileImg').src = avatarUrl;

            // อัปเดตคะแนน (สมมติว่ามี field total_score)
            document.getElementById('totalExp').innerText = studentData.total_score || 0;
            
            // หมายเหตุ: จำนวนภารกิจสำเร็จ ต้องดึงจากตาราง student_scores
            fetchCompletedMissionsCount();
        }

        async function fetchCompletedMissionsCount() {
            try {
                const { count } = await window.sysDB
                    .from('student_scores')
                    .select('*', { count: 'exact', head: true })
                    .eq('student_id', currentUserId);
                
                document.getElementById('completedMissions').innerText = count || 0;
            } catch(e) {}
        }

        async function fetchMyClassrooms() {
            const grid = document.getElementById('classroomGrid');
            
            try {
                // ดึงข้อมูลห้องเรียนที่นักเรียนคนนี้เป็นสมาชิกอยู่
                const { data: myClasses, error } = await window.sysDB
                    .from('classroom_students')
                    .select(`
                        classroom_id,
                        joined_at,
                        classrooms (
                            classroom_id,
                            subject_name,
                            room_name,
                            join_code,
                            academic_year,
                            semester,
                            teachers (
                                first_name,
                                last_name
                            )
                        )
                    `)
                    .eq('student_id', currentUserId)
                    .order('joined_at', { ascending: false });

                if (error) throw error;

                if (!myClasses || myClasses.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-dashed border-slate-300">
                            <i class="fas fa-school text-6xl mb-4 text-slate-200"></i>
                            <h3 class="text-xl font-bold font-sans text-slate-500">ยังไม่มีห้องเรียน</h3>
                            <p class="text-sm font-sans text-slate-400 mt-2 mb-6">กดปุ่มเข้าร่วมห้องเรียน และกรอกรหัสจากคุณครูได้เลย</p>
                            <button onclick="openJoinModal()" class="bg-orange-50 text-orange-600 hover:bg-orange-500 hover:text-white px-6 py-2.5 rounded-xl text-sm font-bold transition border border-orange-200 hover:border-orange-500 shadow-sm">
                                <i class="fas fa-plus"></i> เข้าร่วมห้องเรียน
                            </button>
                        </div>`;
                    return;
                }

                // Render การ์ดห้องเรียน
                grid.innerHTML = myClasses.map(item => {
                    const c = item.classrooms;
                    if(!c) return ''; // กันเหนียวกรณีข้อมูลห้องโดนลบไปแล้ว

                    const teacherName = c.teachers ? `ครู${c.teachers.first_name} ${c.teachers.last_name}` : 'ไม่ระบุผู้สอน';
                    // สร้างสีไอคอนแบบสุ่มจากชื่อวิชา
                    const colors = ['blue', 'emerald', 'purple', 'rose', 'orange', 'teal'];
                    const colorPrefix = colors[c.subject_name.length % colors.length];

                    return `
                        <div class="class-card group" onclick="location.href='student-classroom.html?id=${c.classroom_id}'">
                            <div class="flex items-start justify-between mb-4">
                                <div class="w-12 h-12 rounded-xl bg-${colorPrefix}-50 text-${colorPrefix}-500 flex items-center justify-center text-xl shadow-sm group-hover:scale-110 transition-transform">
                                    <i class="fas fa-book-open"></i>
                                </div>
                                <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded-md">
                                    เทอม ${c.semester}/${c.academic_year}
                                </span>
                            </div>
                            
                            <h3 class="text-lg font-bold text-slate-800 line-clamp-1 mb-1 font-sans group-hover:text-blue-600 transition-colors">${c.subject_name}</h3>
                            <div class="flex items-center gap-2 text-sm text-slate-500 mb-4">
                                <span class="bg-slate-100 px-2 py-0.5 rounded text-xs font-bold text-slate-600"><i class="fas fa-door-open mr-1 opacity-50"></i>ห้อง ${c.room_name}</span>
                            </div>
                            
                            <div class="border-t border-slate-100 pt-3 flex items-center gap-2 text-xs text-slate-500">
                                <div class="w-6 h-6 rounded-full bg-slate-200 flex items-center justify-center text-white text-[10px]"><i class="fas fa-user-tie"></i></div>
                                <span class="truncate">${teacherName}</span>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                console.error("Fetch Classrooms Error:", err);
                grid.innerHTML = `<div class="col-span-full text-center text-rose-500 font-bold">เกิดข้อผิดพลาดในการโหลดข้อมูลห้องเรียน</div>`;
            }
        }

        // ==========================================
        // 🎯 ระบบเข้าร่วมห้องเรียนด้วยรหัส (Join Code)
        // ==========================================
        function openJoinModal() {
            const input = document.getElementById('joinCodeInput');
            input.value = '';
            
            const modal = document.getElementById('joinClassModal');
            const card = document.getElementById('joinClassCard');
            modal.classList.remove('hidden');
            
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
                input.focus();
            }, 10);
        }

        function closeJoinModal() {
            const modal = document.getElementById('joinClassModal');
            const card = document.getElementById('joinClassCard');
            
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        async function executeJoinClass() {
            const input = document.getElementById('joinCodeInput');
            const code = input.value.trim().toUpperCase();
            
            if (!code || code.length < 5) {
                showMessage("⚠️ กรุณากรอกรหัสห้องเรียนให้ครบถ้วน", true);
                input.focus();
                return;
            }

            const btn = document.getElementById('btnJoin');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                // 1. ค้นหาห้องเรียนจากรหัส join_code
                const { data: classroom, error: searchError } = await window.sysDB
                    .from('classrooms')
                    .select('classroom_id, subject_name')
                    .eq('join_code', code)
                    .single();

                if (searchError || !classroom) {
                    throw new Error("ไม่พบห้องเรียนรหัสนี้ หรือรหัสไม่ถูกต้อง");
                }

                // 2. เช็คว่าเคยเข้าร่วมแล้วหรือยัง
                const { data: existingEntry } = await window.sysDB
                    .from('classroom_students')
                    .select('id')
                    .eq('classroom_id', classroom.classroom_id)
                    .eq('student_id', currentUserId)
                    .maybeSingle();

                if (existingEntry) {
                    showMessage(`⚠️ คุณอยู่ในห้องวิชา "${classroom.subject_name}" อยู่แล้วครับ`, true);
                    closeJoinModal();
                    btn.innerHTML = 'เข้าร่วม';
                    btn.disabled = false;
                    return;
                }

                // 3. เพิ่มนักเรียนเข้าห้อง
                const { error: insertError } = await window.sysDB
                    .from('classroom_students')
                    .insert([{
                        classroom_id: classroom.classroom_id,
                        student_id: currentUserId,
                        joined_at: new Date().toISOString()
                    }]);

                if (insertError) throw insertError;

                showMessage(`✅ เข้าร่วมวิชา "${classroom.subject_name}" สำเร็จ!`);
                closeJoinModal();
                
                // โหลดหน้าจอใหม่เพื่อแสดงการ์ดห้องเรียน
                await fetchMyClassrooms();

            } catch (err) {
                showMessage(`❌ ${err.message}`, true);
                input.focus();
                input.select();
            } finally {
                btn.innerHTML = 'เข้าร่วม';
                btn.disabled = false;
            }
        }

        // ==========================================
        // UI & Utils
        // ==========================================
        function showMessage(text, isError = false) {
            const box = document.getElementById('msgBox');
            document.getElementById('msgText').innerText = text;
            box.className = `fixed top-20 right-5 z-[210] bg-white border-l-4 ${isError ? 'border-rose-500' : 'border-emerald-500'} shadow-lg rounded-xl p-4 transition-all animate-bounce-in`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3500);
        }

        function toggleDrawer() {
            const dr = document.getElementById('sideDrawer');
            const ov = document.getElementById('drawerOverlay');
            dr.classList.toggle('-translate-x-full');
            ov.classList.toggle('hidden');
        }

        async function handleLogout() {
            if(confirm('ต้องการออกจากระบบใช่หรือไม่?')) {
                await window.sysDB.auth.signOut();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
