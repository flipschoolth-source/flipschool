<!DOCTYPE html>

    <script>
        const pairsData = ${stringifiedPairs};
        let cards = [];
        
        // Setup Cards
        pairsData.forEach(p => {
            if(p.a_val && p.a_val.trim() !== '') cards.push({ id: p.id, type: p.a_type, content: p.a_val });
            if(p.b_val && p.b_val.trim() !== '') cards.push({ id: p.id, type: p.b_type, content: p.b_val });
        });
        
        // Shuffle
        cards = cards.sort(() => Math.random() - 0.5);

        const board = document.getElementById('game-board');
        let flipped = [];
        let matched = 0;
        let score = 0;
        let timer = 0;
        let isProcessing = false;
        
        // Timer
        let interval = setInterval(() => {
            timer++;
            const m = String(Math.floor(timer/60)).padStart(2,'0');
            const s = String(timer%60).padStart(2,'0');
            document.getElementById('game-timer').innerText = m + ':' + s;

                contentHTML = \`<span class="text-6xl drop-shadow-sm">\${card.content}</span>\`;
            } else {
                contentHTML = \`<span class="text-xl sm:text-2xl font-semibold break-words">\${card.content}</span>\`;

            el.innerHTML = \`
                <div class="card-inner w-full h-full shadow-sm hover:shadow-md rounded-2xl bg-white transition-all">
                    <div class="card-front bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white text-4xl shadow-inner border-4 border-white font-bold opacity-90 group-hover:opacity-100">?</div>

                        \${contentHTML}
                    </div>

                el.classList.add('flipped');
                flipped.push({ el, id: card.id });
                
                if(flipped.length === 2) {
                    isProcessing = true;
                    setTimeout(() => {
                        if(flipped[0].id === flipped[1].id) {
                            flipped[0].el.classList.add('matched');
                            flipped[1].el.classList.add('matched');

                            score += 100;
                            document.getElementById('game-score').innerText = score;

                        } else {
                            flipped[0].el.classList.remove('flipped');
                            flipped[1].el.classList.remove('flipped');
                        }
                        flipped = [];
                        isProcessing = false;
                    }, 700);
                }
            };

        // --- Viewport Toggle (Device Simulator) ---
        function setViewport(type) {
            const wrapper = document.getElementById('preview-wrapper');
            const btns = document.querySelectorAll('.vp-btn');
            const browserBar = document.getElementById('browser-bar');
            
            btns.forEach(btn => {
                btn.classList.remove('bg-slate-800', 'text-slate-300');
                btn.classList.add('text-slate-500');
            });
            
            const activeBtn = document.getElementById('btn-vp-' + type);
            if(activeBtn) {
                activeBtn.classList.remove('text-slate-500');
                activeBtn.classList.add('bg-slate-800', 'text-slate-300');
            }
            
            if(type === 'mobile') {
                wrapper.style.maxWidth = '375px';
                wrapper.style.maxHeight = '812px';
                browserBar.classList.remove('sm:hidden');
            } else if(type === 'tablet') {
                wrapper.style.maxWidth = '768px';
                wrapper.style.maxHeight = '1024px';
                browserBar.classList.add('sm:hidden');
            } else {
                wrapper.style.maxWidth = '100%';
                wrapper.style.maxHeight = '100%';
                browserBar.classList.add('sm:hidden');

            const editor = document.getElementById('editorPanel');
            const preview = document.getElementById('previewPanel');
            
            if (preview.classList.contains('mobile-hidden')) {
                preview.classList.remove('mobile-hidden');
                editor.classList.add('mobile-hidden');
                updatePreview();
            } else {
                preview.classList.add('mobile-hidden');
                editor.classList.remove('mobile-hidden');
            }
        }

        function initResizer() {
            const resizer = document.getElementById('dragBar');
            const leftSide = document.getElementById('editorPanel');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                document.getElementById('previewPanel').style.pointerEvents = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const containerWidth = document.body.clientWidth;
                const newFlexBasis = Math.max(300, Math.min(e.clientX, containerWidth - 300));
                leftSide.style.flex = `0 0 ${newFlexBasis}px`;
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.getElementById('previewPanel').style.pointerEvents = 'auto';
                }
            });
        }

        // --- Notifications ---
        function showMessage(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = isError ? 
                `<i class="fa-solid fa-circle-exclamation text-red-500 text-lg"></i> <span class="text-slate-800">${msg}</span>` : 
                `<i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i> <span class="text-slate-800">${msg}</span>`;
            
            toast.className = `fixed bottom-4 right-4 z-[110] flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl font-medium text-sm border transition-transform duration-300 transform translate-y-0 ${
                isError ? 'bg-red-50 border-red-100' : 'bg-white border-slate-200'

            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-[150%]');

            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            try {
                if (!window.sysDB) throw new Error("Database not initialized");

                const { data: { session }, error: sessionError } = await window.sysDB.auth.getSession();
                if (sessionError || !session) {
                    window.location.href = 'login.html';
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                targetCid = urlParams.get('cid');
                targetFolder = urlParams.get('folder');
                editingMid = urlParams.get('edit_mid');

                if (targetCid) {
                    document.getElementById('classroomSelectorContainer').classList.remove('hidden');
                    const { data: cData } = await window.sysDB.from('classrooms').select('name').eq('classroom_id', targetCid).single();
                    if (cData) {
                        let displayName = cData.name;
                        if (targetFolder) displayName += ` (โฟลเดอร์: ${targetFolder})`;
                        document.getElementById('targetClassroomName').innerText = displayName;
                    }
                }

                if (editingMid) {
                    document.getElementById('loadingText').innerText = "กำลังโหลดข้อมูลภารกิจ...";
                    const { data: mData, error: mError } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
                    
                    if (mError) throw mError;
                    if (mData) {
                        originalTeacherId = mData.created_by; // *UPDATE: อิงโครงสร้าง DB ใหม่
                        document.getElementById('missionTitle').value = mData.title || '';
                        document.getElementById('missionDesc').value = mData.description || '';
                        
                        // *UPDATE: ดึง cover ออกมาจาก content_data
                        document.getElementById('missionCover').value = mData.content_data?.cover_image_url || '';
                        
                        // แปลงข้อมูลเก่า/ใหม่ จาก content_data
                        if (mData.content_data && (mData.mission_type === 'matching-flip' || mData.mission_type === 'matching')) {
                            let rawPairs = mData.content_data.pairs || gamePairs;
                            gamePairs = rawPairs.map(p => {
                                if(p.a_type) return p; 
                                const getOldType = v => (v && (v.match(/\.(jpeg|jpg|gif|png|webp|svg)(\?.*)?$/i) || v.startsWith('http'))) ? 'image' : 'text';
                                return {
                                    id: p.id || Date.now().toString() + Math.random(),
                                    a_type: getOldType(p.a), a_val: p.a || '',
                                    b_type: getOldType(p.b), b_val: p.b || ''
                                };
                            });
                        }
                    }
                }

            } catch (err) {
                console.error("Auth/Load error:", err);
                showMessage("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err.message, true);
            } finally {
                overlay.classList.add('hidden');
            }
        }

        function openSaveModal() {
            if(gamePairs.length === 0 || gamePairs.some(p => p.a_val.trim() === '' || p.b_val.trim() === '')) {
                showMessage("กรุณากรอกข้อมูลคู่การ์ดให้ครบถ้วนก่อนบันทึก", true);
                return;
            }
            document.getElementById('saveModal').classList.remove('hidden');
        }

        function closeSaveModal() {
            document.getElementById('saveModal').classList.add('hidden');
        }

        async function saveMission(mode) {
            const title = document.getElementById('missionTitle').value.trim();
            const desc = document.getElementById('missionDesc').value.trim();
            const cover = document.getElementById('missionCover').value.trim() || 'img/cover01.jpg';
            
            if (!title) {
                showMessage("กรุณาตั้งชื่อภารกิจ", true);
                document.getElementById('missionTitle').focus();
                return;
            }

            try {
                const { data: { session } } = await window.sysDB.auth.getSession();
                if (!session) throw new Error("ไม่พบเซสชัน กรุณาเข้าสู่ระบบใหม่");
                const currentUserId = session.user.id;
                
                const finalHTML = generateGameHTML();

                // โครงสร้างข้อมูลให้ตรงกับ Table missions
                const missionData = {
                    title: title,
                    description: desc,
                    mission_type: 'matching-flip', 
                    content_data: { 
                        type: 'matching-flip',
                        pairs: gamePairs,
                        cover_image_url: cover
                    },
                    content: finalHTML,
                    is_public: true
                };

                if (targetCid) {
                    missionData.classroom_id = targetCid;
                }

                let mid = editingMid;

                // 1. บันทึกหรืออัปเดตข้อมูลลงตาราง missions
                if (editingMid && currentUserId === originalTeacherId) {
                    const { error: updateError } = await window.sysDB.from('missions')
                        .update(missionData).eq('mission_id', editingMid);
                    if (updateError) throw updateError;
                } else {
                    missionData.created_by = currentUserId;
                    const { data, error: insertError } = await window.sysDB.from('missions').insert([missionData]).select();
                    if (insertError) throw insertError;
                    
                    mid = data[0].mission_id;
                    if (editingMid && currentUserId !== originalTeacherId) isNewFork = true;
                }

                // 2. บันทึกข้อมูลการมอบหมายลงตาราง classroom_missions (แก้ไขการใช้ upsert เป็น select แล้วค่อย insert/update)
                if (targetCid) {
                    // ตรวจสอบว่าเคยมอบหมายภารกิจนี้ในห้องเรียนนี้หรือยัง
                    const { data: existingMap, error: checkError } = await window.sysDB.from('classroom_missions')
                        .select('assignment_id')
                        .eq('classroom_id', targetCid)
                        .eq('mission_id', mid)
                        .maybeSingle();

                    if (checkError) throw checkError;

                    if (!existingMap) {
                        // ถ้ายังไม่มี ให้ Insert ใหม่
                        const assignData = {
                            classroom_id: targetCid, 
                            mission_id: mid, 
                            folder_name: targetFolder || 'ทั่วไป'
                        };
                        const { error: mapError } = await window.sysDB.from('classroom_missions').insert([assignData]);
                        if (mapError) throw mapError;
                    } else if (targetFolder) {
                        // ถ้ามีอยู่แล้ว และมีการระบุโฟลเดอร์มา ให้ Update โฟลเดอร์
                        const { error: updateMapError } = await window.sysDB.from('classroom_missions')
                            .update({ folder_name: targetFolder })
                            .eq('assignment_id', existingMap.assignment_id);
                        if (updateMapError) throw updateMapError;
                    }
                }
                
                if (isNewFork) showMessage("✅ บันทึกเป็นสำเนาภารกิจใหม่เรียบร้อย");
                else showMessage("✅ บันทึกภารกิจสำเร็จ!");

                if (mode === 'exit') {
                    document.getElementById('saveModal').classList.add('hidden');
                    setTimeout(() => {
                        window.location.href = targetCid ? `classroom-detail.html?id=${targetCid}` : 'mission-library.html';
                    }, 1500);
                } else {
                    closeSaveModal();
                }

            } catch (err) { 
                showMessage("บันทึกไม่สำเร็จ: " + err.message, true); 
                console.error(err);
            }
        }
    </script>
</body>
