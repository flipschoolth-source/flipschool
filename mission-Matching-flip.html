            { id: (Date.now() + 2).toString(), a: '🍇', b: 'องุ่น' },
            { id: (Date.now() + 3).toString(), a: '🍉', b: 'แตงโม' }
        ];

        // --- Layout Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            initResizer();
            await checkAuthAndLoadData();
            renderPairsEditor();
            updatePreview();
        });

        // --- Data Management ---
        function renderPairsEditor() {
            const container = document.getElementById('pairs-container');
            container.innerHTML = '';

            if(gamePairs.length === 0) {
                container.innerHTML = `
                    <div class="flex flex-col items-center justify-center h-full text-slate-500 text-center p-6">
                        <i class="fa-solid fa-layer-group text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm">ยังไม่มีข้อมูลสำหรับการจับคู่</p>
                        <p class="text-xs mt-1">คลิกปุ่ม "เพิ่มคู่การ์ด" ด้านล่างเพื่อเริ่มต้น</p>
                    </div>
                `;
                return;
            }

            gamePairs.forEach((pair, index) => {
                const el = document.createElement('div');
                el.className = "bg-slate-800 border border-slate-700 rounded-lg p-3 mb-3 relative group transition-colors focus-within:border-blue-500/50";
                
                el.innerHTML = `
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-semibold text-slate-400 bg-slate-900 px-2 py-0.5 rounded">คู่ที่ ${index + 1}</span>
                        <button onclick="removePair('${pair.id}')" class="text-slate-500 hover:text-red-400 transition-colors w-6 h-6 flex items-center justify-center rounded hover:bg-slate-700" title="ลบคู่นี้">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <input type="text" value="${pair.a}" oninput="updatePairData('${pair.id}', 'a', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm transition-colors" placeholder="ไอเทมที่ 1 (เช่น 🍎 หรือลิงก์ภาพ)">
                        </div>
                        <div class="flex items-center text-slate-600 px-1">
                            <i class="fa-solid fa-arrow-right-arrow-left text-xs"></i>
                        </div>
                        <div class="flex-1">
                            <input type="text" value="${pair.b}" oninput="updatePairData('${pair.id}', 'b', this.value)" class="w-full bg-slate-950 border border-slate-700 rounded px-2 py-1.5 text-white placeholder-slate-600 focus:outline-none focus:border-blue-500 text-sm transition-colors" placeholder="ไอเทมที่ 2 (เช่น แอปเปิ้ล)">
                        </div>
                    </div>
                `;
                container.appendChild(el);
            });
        }

        function updatePairData(id, field, value) {
            const pair = gamePairs.find(p => p.id === id);
            if (pair) {
                pair[field] = value;
                // Debounce auto-preview
                clearTimeout(window.previewTimeout);
                window.previewTimeout = setTimeout(updatePreview, 800);
            }
        }

        function addPair() {
            gamePairs.push({ id: Date.now().toString(), a: '', b: '' });
            renderPairsEditor();
            
            // Scroll to bottom
            const container = document.getElementById('pairs-container');
            setTimeout(() => { container.scrollTop = container.scrollHeight; }, 50);
        }

        function removePair(id) {
            gamePairs = gamePairs.filter(p => p.id !== id);
            renderPairsEditor();
            updatePreview();
        }

        <div id="victory" class="hidden fixed inset-0 bg-blue-600/95 backdrop-blur-sm z-50 flex flex-col items-center justify-center text-white p-6">
            <div class="text-7xl mb-6 animate-bounce">🏆</div>
            <h2 class="text-3xl font-bold mb-2 text-center font-heading">ยอดเยี่ยมมาก!</h2>
            <p class="mb-8 text-blue-100 text-lg text-center">คุณใช้เวลาไป <span id="final-time" class="font-bold text-white"></span> วินาที</p>
            <button onclick="location.reload()" class="bg-white text-blue-600 hover:bg-blue-50 px-8 py-3 rounded-2xl font-bold transition-colors shadow-lg shadow-black/10 font-heading">
                เล่นอีกครั้ง
            </button>
        </div>
    </div>

    <script>
        const pairsData = ${stringifiedPairs};
        let cards = [];
        
        // Setup Cards
        pairsData.forEach(p => {
            if(p.a.trim() !== '') cards.push({ id: p.id, content: p.a });
            if(p.b.trim() !== '') cards.push({ id: p.id, content: p.b });
        });
        
        // Shuffle
        cards = cards.sort(() => Math.random() - 0.5);

        const board = document.getElementById('game-board');
        let flipped = [];
        let matched = 0;
        let score = 0;
        let timer = 0;
        let isProcessing = false;
        
        // Timer
        let interval = setInterval(() => {
            timer++;
            const m = String(Math.floor(timer/60)).padStart(2,'0');
            const s = String(timer%60).padStart(2,'0');
            document.getElementById('game-timer').innerText = m + ':' + s;
        }, 1000);

        // Render Cards
        cards.forEach((card, i) => {
            const el = document.createElement('div');
            el.className = 'card h-32 sm:h-40 relative group';
            
            // Basic text rendering, but if looks like image url, render image
            let contentHTML = card.content;
            if(card.content.match(/\\.(jpeg|jpg|gif|png|webp|svg)(\\?.*)?$/i) || card.content.startsWith('http')) {
                contentHTML = \`<img src="\${card.content}" class="max-w-full max-h-full object-contain rounded" onerror="this.outerHTML='<span class=\\'text-xs text-red-500 font-heading\\'>โหลดรูปไม่สำเร็จ</span>'">\`;
            }

            el.innerHTML = \`
                <div class="card-inner w-full h-full shadow-sm hover:shadow-md rounded-2xl bg-white transition-all">
                    <div class="card-front bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white text-4xl shadow-inner border-4 border-white font-bold opacity-90 group-hover:opacity-100">?</div>
                    <div class="card-back bg-white flex items-center justify-center p-3 border-2 border-blue-100 rounded-2xl overflow-hidden">
                        <div class="text-2xl sm:text-4xl text-center break-words w-full flex items-center justify-center font-heading">\${contentHTML}</div>
                    </div>
                </div>
            \`;
            
            el.onclick = () => {
                if(isProcessing || el.classList.contains('flipped') || el.classList.contains('matched')) return;
                
                el.classList.add('flipped');
                flipped.push({ el, id: card.id });
                
                if(flipped.length === 2) {
                    isProcessing = true;
                    setTimeout(() => {
                        if(flipped[0].id === flipped[1].id) {
                            flipped[0].el.classList.add('matched');
                            flipped[1].el.classList.add('matched');
                            matched++;
                            score += 100;
                            document.getElementById('game-score').innerText = score;
                            
                            if(matched === pairsData.length && pairsData.length > 0) {
                                clearInterval(interval);
                                document.getElementById('final-time').innerText = timer;
                                document.getElementById('victory').classList.remove('hidden');
                            }
                        } else {
                            flipped[0].el.classList.remove('flipped');
                            flipped[1].el.classList.remove('flipped');
                        }
                        flipped = [];
                        isProcessing = false;
                    }, 700);
                }
            };
            board.appendChild(el);
        });
    <\/script>
</body>
</html>`;
        }

        function updatePreview() {
            const htmlContent = generateGameHTML();
            const iframe = document.getElementById('preview-frame');
            iframe.srcdoc = htmlContent;
        }

        // --- UI Interactions ---
        function toggleMobileMenu() {
            document.getElementById('mobileMenu').classList.toggle('active');
        }

        function toggleMobileView() {
            const editor = document.getElementById('editorPanel');
            const preview = document.getElementById('previewPanel');
            
            if (preview.classList.contains('mobile-hidden')) {
                preview.classList.remove('mobile-hidden');
                editor.classList.add('mobile-hidden');
                updatePreview();
            } else {
                preview.classList.add('mobile-hidden');
                editor.classList.remove('mobile-hidden');
            }
        }

        function initResizer() {
            const resizer = document.getElementById('dragBar');
            const leftSide = document.getElementById('editorPanel');
            let isResizing = false;

            resizer.addEventListener('mousedown', (e) => {
                isResizing = true;
                document.body.style.cursor = 'col-resize';
                // Prevent iframe from capturing mouse events during drag
                document.getElementById('previewPanel').style.pointerEvents = 'none';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isResizing) return;
                const containerWidth = document.body.clientWidth;
                const newFlexBasis = Math.max(300, Math.min(e.clientX, containerWidth - 300));
                leftSide.style.flex = `0 0 ${newFlexBasis}px`;
            });

            document.addEventListener('mouseup', () => {
                if (isResizing) {
                    isResizing = false;
                    document.body.style.cursor = 'default';
                    document.getElementById('previewPanel').style.pointerEvents = 'auto';
                }
            });
        }

        // --- Notifications ---
        function showMessage(msg, isError = false) {
            const toast = document.getElementById('toast');
            toast.innerHTML = isError ? 
                `<i class="fa-solid fa-circle-exclamation text-red-500 text-lg"></i> <span class="text-slate-800">${msg}</span>` : 
                `<i class="fa-solid fa-circle-check text-emerald-500 text-lg"></i> <span class="text-slate-800">${msg}</span>`;
            
            toast.className = `fixed bottom-4 right-4 z-[60] flex items-center gap-3 px-4 py-3 rounded-lg shadow-xl font-medium text-sm border transition-transform duration-300 transform translate-y-0 ${
                isError ? 'bg-red-50 border-red-100' : 'bg-white border-slate-200'
            }`;
            
            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-[150%]');
            }, 3000);
        }

        // --- Database & Save Logic ---
        async function checkAuthAndLoadData() {
            const overlay = document.getElementById('loadingOverlay');
            overlay.classList.remove('hidden');

            try {
                if (!window.sysDB) throw new Error("Database not initialized");

                const { data: { session }, error: sessionError } = await window.sysDB.auth.getSession();
                if (sessionError || !session) {
                    window.location.href = 'login.html';
                    return;
                }

                const urlParams = new URLSearchParams(window.location.search);
                targetCid = urlParams.get('cid');
                editingMid = urlParams.get('edit_mid');

                if (targetCid) {
                    document.getElementById('classroomSelectorContainer').classList.remove('hidden');
                    const { data: cData } = await window.sysDB.from('classrooms').select('name').eq('classroom_id', targetCid).single();
                    if (cData) document.getElementById('targetClassroomName').innerText = cData.name;
                }

                if (editingMid) {
                    document.getElementById('loadingText').innerText = "กำลังโหลดข้อมูลภารกิจ...";
                    const { data: mData, error: mError } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
                    
                    if (mError) throw mError;
                    if (mData) {
                        originalTeacherId = mData.teacher_id;
                        document.getElementById('missionTitle').value = mData.title || '';
                        document.getElementById('missionDesc').value = mData.description || '';
                        document.getElementById('missionCover').value = mData.cover_image_url || '';
                        
                        // Extract specific format for matching-flip game
                        if (mData.mission_data && (mData.mission_data.type === 'matching-flip' || mData.mission_data.type === 'matching')) {
                            gamePairs = mData.mission_data.pairs || gamePairs;
                        }
                    }
                }

            } catch (err) {
                console.error("Auth/Load error:", err);
                showMessage("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err.message, true);
            } finally {
                overlay.classList.add('hidden');
            }
        }

        function openSaveModal() {
            if(gamePairs.length === 0 || gamePairs.some(p => p.a.trim() === '' || p.b.trim() === '')) {
                showMessage("กรุณากรอกข้อมูลคู่การ์ดให้ครบถ้วนก่อนบันทึก", true);
                return;
            }
            document.getElementById('saveModal').classList.remove('hidden');
        }

        function closeSaveModal() {
            document.getElementById('saveModal').classList.add('hidden');
        }

        async function saveMission(mode) {
            const title = document.getElementById('missionTitle').value.trim();
            const desc = document.getElementById('missionDesc').value.trim();
            const cover = document.getElementById('missionCover').value.trim() || 'img/cover01.jpg';
            
            if (!title) {
                showMessage("กรุณาตั้งชื่อภารกิจ", true);
                document.getElementById('missionTitle').focus();
                return;
            }

            try {
                const { data: { session } } = await window.sysDB.auth.getSession();
                if (!session) throw new Error("ไม่พบเซสชัน กรุณาเข้าสู่ระบบใหม่");
                const currentUserId = session.user.id;
                
                const finalHTML = generateGameHTML();

                const missionData = {
                    title: title,
                    description: desc,
                    mission_type: 'matching-flip', // identifier for this builder
                    cover_image_url: cover,
                    mission_data: { 
                        type: 'matching-flip',
                        pairs: gamePairs,
                        html: finalHTML 
                    },
                    is_public: true
                };

                let mid = editingMid;

                if (editingMid && currentUserId === originalTeacherId) {
                    const { error: updateError } = await window.sysDB.from('missions')
                        .update(missionData).eq('mission_id', editingMid);
                    if (updateError) throw updateError;
                } else {
                    missionData.teacher_id = currentUserId;
                    const { data, error: insertError } = await window.sysDB.from('missions').insert([missionData]).select();
                    if (insertError) throw insertError;
                    
                    mid = data[0].mission_id;
                    if (editingMid && currentUserId !== originalTeacherId) isNewFork = true;
                }

                if (targetCid) {
                    const { error: mapError } = await window.sysDB.from('classroom_missions').upsert({
                        classroom_id: targetCid, mission_id: mid, assigned_at: new Date().toISOString()
                    }, { onConflict: 'classroom_id, mission_id' });
                    if (mapError) throw mapError;
                }
                
                if (isNewFork) showMessage("✅ บันทึกเป็นสำเนาภารกิจใหม่เรียบร้อย");
                else showMessage("✅ บันทึกภารกิจสำเร็จ!");

                if (mode === 'exit') {
                    document.getElementById('saveModal').classList.add('hidden');
                    setTimeout(() => {
                        window.location.href = targetCid ? `classroom-detail.html?id=${targetCid}` : 'mission-library.html';
                    }, 1500);
                } else {
                    closeSaveModal();
                }

            } catch (err) { 
                showMessage("บันทึกไม่สำเร็จ: " + err.message, true); 
                console.error(err);
            }
        }
    </script>
</body>
</html>
