<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>แดชบอร์ด | FlipSchool</title>
    
    <!-- 🌟 PWA Manifest & Icons 🌟 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
        }

        body { 
            font-family: 'Sarabun', 'Kanit', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden; 
            background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%);
            min-height: 100vh; display: flex; flex-direction: column;
        }

        /* Navbar */
        #mainNav { display: flex; justify-content: space-between; align-items: center; padding: 0 clamp(15px, 5%, 50px); height: 80px; background: white; position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; border-bottom: 1px solid #f1f5f9; transition: all 0.3s; }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); border-bottom-color: transparent; }
        .nav-left { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
        .nav-logo-icon { font-size: 24px; background: white; width: 40px; height: 40px; border-radius: 10px; border: 2px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,139,0.1); color: var(--text-main); }
        .nav-brand { font-size: 22px; font-weight: 700; color: var(--primary); font-family: 'Kanit'; margin-bottom: -2px;}
        .nav-brand span { color: var(--accent); }
        .nav-slogan { font-size: 11px; color: var(--text-muted); font-family: 'Sarabun'; }
        
        /* Header Gradient */
        .header-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); position: relative; overflow: hidden; }
        
        /* Classroom Cards */
        .class-card {
            background: white; border-radius: 1.5rem; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer;
            position: relative; display: flex; flex-direction: column; height: 100%;
        }
        .class-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,139,0.1); border-color: #e0e8ff; }
        .class-cover { height: 100px; width: 100%; position: relative; }
        .class-cover::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 40px; background: linear-gradient(to top, white, transparent); }
        .class-icon-circle {
            width: 60px; height: 60px; border-radius: 50%; background: white;
            display: flex; align-items: center; justify-content: center; font-size: 24px;
            position: absolute; bottom: -20px; right: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            z-index: 10; border: 3px solid white;
        }

        .spinner { width: 40px; height: 40px; border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal-overlay { background-color: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px); }
        .hidden-el { display: none !important; }
        .btn-theme { background: var(--primary); color: white; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,139,0.2); }
        .btn-theme:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,139,0.3); }

        .footer { padding: 20px; font-size: 13px; color: #a4b0be; text-align: center; margin-top: auto; background: white; border-top: 1px solid rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" style="display: flex;" class="fixed inset-0 z-[9999] bg-white/90 backdrop-blur-md flex-col items-center justify-center transition-opacity duration-300">
        <div class="spinner"></div>
        <p class="mt-4 text-[var(--primary)] font-bold animate-pulse font-sans">กำลังเตรียมข้อมูล...</p>
    </div>

    <!-- 🌟 Sidebar Drawer 🌟 -->
    <div id="drawerOverlay" onclick="toggleDrawer()" style="display: none; opacity: 0; transition: opacity 0.3s;" class="fixed inset-0 bg-black/50 z-[1999] backdrop-blur-sm"></div>
    <div id="sideDrawer" class="fixed top-0 right-0 h-full w-[300px] bg-white z-[2000] translate-x-full transition-transform shadow-2xl p-6 flex flex-col rounded-l-3xl">
        <div class="text-center mb-6 relative">
            <button onclick="toggleDrawer()" class="absolute top-0 left-0 text-slate-300 hover:text-rose-500 bg-transparent border-none cursor-pointer"><i class="fas fa-times text-xl"></i></button>
            <img id="sidebarProfileImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-slate-50 shadow-md object-cover">
            <h3 id="sidebarName" class="font-bold text-lg font-['Kanit'] text-[var(--primary)] m-0">...</h3>
            <p id="sidebarRole" class="text-xs text-[var(--accent)] font-bold uppercase tracking-widest mt-1 mb-0">STUDENT</p>
            <p id="sidebarEmail" class="text-xs text-slate-400 font-sans mt-1">...</p>
        </div>
        
        <nav class="flex-1 space-y-2 overflow-y-auto pt-2" id="sidebarMenu">
            <!-- เมนูจะถูกสร้างโดย JS ตาม Role -->
        </nav>
        
        <div class="pt-4 border-t border-slate-100 mt-auto">
            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 p-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold transition-all border-none cursor-pointer"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </div>

    <!-- 🌟 Modal: เข้าร่วมห้องเรียนด้วยรหัส (สำหรับนักเรียน) 🌟 -->
    <div id="joinModal" class="hidden fixed inset-0 z-[5050] items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl transform transition-all text-center relative">
            <button onclick="closeJoinModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 bg-transparent border-none cursor-pointer"><i class="fas fa-times text-lg"></i></button>
            <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl"><i class="fas fa-door-open"></i></div>
            <h3 class="text-xl font-bold text-slate-800 mb-2 font-['Kanit']">เข้าร่วมห้องเรียน</h3>
            <p class="text-sm text-slate-500 mb-6 font-sans">กรอกรหัส 6 หลักที่คุณครูให้มาเพื่อเข้าห้อง</p>
            <input type="text" id="classCodeInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-4 outline-none focus:ring-2 focus:ring-blue-500 text-center text-2xl tracking-[0.2em] font-mono font-bold uppercase mb-6 text-slate-700" placeholder="------" maxlength="6">
            <button onclick="submitJoinClass()" id="btnJoinConfirm" class="w-full btn-theme font-bold py-3.5 rounded-xl border-none cursor-pointer font-['Kanit'] text-lg">ยืนยันเข้าร่วม</button>
        </div>
    </div>

    <!-- 🌟 Navbar 🌟 -->
    <nav id="mainNav">
        <a href="dashboard.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div>
                <div class="nav-brand">Flip<span>School</span></div>
                <div class="nav-slogan">พื้นที่เรียนรู้ของทุกคน</div>
            </div>
        </a>
        <div class="flex items-center gap-4">
            <img id="navProfileImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" onclick="toggleDrawer()" class="w-10 h-10 rounded-full border-2 border-slate-200 cursor-pointer object-cover hover:border-[var(--primary)] shadow-sm">
        </div>
    </nav>

    <!-- 🌟 Header Section 🌟 -->
    <header class="header-gradient text-white py-10 px-6 relative rounded-b-[2rem] shadow-sm mb-8">
        <div class="container mx-auto max-w-5xl relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight font-['Kanit'] mb-2">สวัสดี, <span id="welcomeName" class="text-yellow-300">...</span></h1>
                <p class="text-white/80 font-sans" id="welcomeSubtitle">กำลังโหลดข้อมูลของคุณ...</p>
            </div>
            
            <div class="flex gap-3">
                <!-- ปุ่ม Action ตาม Role -->
                <button id="btnActionTeacher" onclick="location.href='classroom-add.html'" class="hidden bg-white text-[var(--primary)] hover:bg-slate-50 px-6 py-3 rounded-2xl font-bold font-['Kanit'] shadow-lg flex-1 md:flex-none items-center justify-center gap-2 border-none cursor-pointer transition-transform hover:-translate-y-1">
                    <i class="fas fa-plus-circle"></i> สร้างห้องเรียนใหม่
                </button>
                <button id="btnActionStudent" onclick="openJoinModal()" class="hidden bg-yellow-400 text-yellow-900 hover:bg-yellow-300 px-6 py-3 rounded-2xl font-bold font-['Kanit'] shadow-lg flex-1 md:flex-none items-center justify-center gap-2 border-none cursor-pointer transition-transform hover:-translate-y-1">
                    <i class="fas fa-sign-in-alt"></i> เข้าร่วมด้วยรหัส
                </button>
            </div>
        </div>
        <div class="absolute -right-20 -bottom-20 w-80 h-80 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
    </header>

    <!-- 🌟 Main Content 🌟 -->
    <main class="flex-grow container mx-auto px-6 pb-12 max-w-5xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800 font-['Kanit'] m-0"><i class="fas fa-chalkboard text-[var(--primary-light)] mr-2"></i> ห้องเรียนของคุณ</h2>
            <span class="text-sm font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-lg" id="classCountBadge">0 ห้อง</span>
        </div>

        <div id="classroomGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- การ์ดห้องเรียนจะถูกแทรกที่นี่ -->
        </div>
        
        <div id="emptyState" class="hidden py-16 text-center">
            <div class="w-24 h-24 bg-blue-50 text-blue-200 rounded-full flex items-center justify-center mx-auto mb-4 text-4xl"><i class="fas fa-box-open"></i></div>
            <h3 class="text-xl font-bold text-slate-700 font-['Kanit'] mb-2" id="emptyTitle">ยังไม่มีห้องเรียน</h3>
            <p class="text-slate-500 font-sans text-sm" id="emptyDesc">...</p>
        </div>
    </main>

    <footer class="footer footer-display-text"></footer>

    <!-- Custom Alert -->
    <div id="customAlertModal" style="display: none; opacity: 0; transition: opacity 0.3s;" class="fixed inset-0 z-[10000] items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-[25px] w-full max-w-[420px] p-8 shadow-2xl text-center transform scale-95 transition-transform" id="customAlertBox">
            <div class="text-[50px] mb-4"><i id="customAlertIcon" class="fas fa-info-circle text-[var(--primary)]"></i></div>
            <h3 id="customAlertTitle" class="text-2xl font-bold font-['Kanit'] text-slate-800 mb-2 m-0">แจ้งเตือน</h3>
            <p id="customAlertMessage" class="text-slate-500 mb-6 font-sans m-0"></p>
            <div class="flex justify-center gap-3">
                <button onclick="closeCustomAlert()" id="customAlertOkBtn" class="bg-[var(--primary)] hover:bg-[var(--primary-light)] text-white px-10 py-3 rounded-full font-bold font-['Kanit'] border-none cursor-pointer transition-all shadow-md">ตกลง</button>
                <button onclick="closeCustomAlert(true)" id="customAlertCancelBtn" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 px-10 py-3 rounded-full font-bold font-['Kanit'] border-none cursor-pointer transition-all shadow-md">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let userRole = 'student'; // ค่าเริ่มต้น

        document.addEventListener('DOMContentLoaded', () => {
            const checkDB = setInterval(() => { 
                if (window.sysDB && typeof window.sysDB.auth !== 'undefined') { 
                    clearInterval(checkDB); 
                    initDashboard(); 
                } 
            }, 300);
        });

        async function initDashboard() {
            try {
                const db = window.sysDB;
                const { data: { session } } = await db.auth.getSession();
                
                // Unified Session check
                const userId = session ? session.user.id : localStorage.getItem('flip_student_session_id');
                
                if (!userId) {
                    window.location.replace('login.html');
                    return;
                }

                // 1. ดึงข้อมูลโปรไฟล์ผู้ใช้ และ Role
                let { data: profile, error } = await db.from('users').select('*').eq('user_id', userId).maybeSingle();
                
                // 🌟 [แก้ไข] หากไม่พบข้อมูลในตาราง users (เช่น โดนลบตอนรวมตาราง) ให้สร้างและกู้คืนบัญชีขึ้นมาใหม่ทันที
                if (!profile) {
                    const { data: { user: authUser } } = await db.auth.getUser();
                    if (authUser) {
                        const newProfile = {
                            user_id: authUser.id,
                            first_name: authUser.user_metadata?.first_name || 'ผู้ใช้งาน',
                            last_name: authUser.user_metadata?.last_name || '(กู้คืน)',
                            email: authUser.email,
                            role: 'teacher' // ให้สิทธิ์เป็นครูไว้ก่อนเพื่อให้ใช้งานได้เต็มรูปแบบ
                        };
                        const { data: created } = await db.from('users').upsert([newProfile]).select().single();
                        profile = created || newProfile;
                    } else {
                        throw new Error("เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่");
                    }
                }
                
                currentUser = profile;
                userRole = profile.role || (profile.is_super_admin ? 'super_admin' : 'student');
                
                // 2. อัปเดต UI ส่วนตัว
                updateProfileUI();

                // 3. ดึงและแสดงห้องเรียน
                await fetchClassrooms();

            } catch (err) {
                console.error("Dashboard Init Error:", err);
                showCustomAlert("เกิดข้อผิดพลาดในการโหลดข้อมูล: " + err.message, "error", () => {
                    if(err.message.includes('หมดอายุ') || err.message.includes('เข้าสู่ระบบ')) window.location.replace('login.html');
                });
            } finally {
                const loader = document.getElementById('loadingOverlay');
                loader.style.opacity = '0';
                setTimeout(() => loader.style.display = 'none', 300);
            }
        }

        function updateProfileUI() {
            const pic = currentUser.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${currentUser.first_name}`;
            const fullName = `${currentUser.first_name || ''} ${currentUser.last_name || ''}`.trim() || 'ผู้ใช้งาน';
            
            document.getElementById('navProfileImg').src = pic;
            document.getElementById('sidebarProfileImg').src = pic;
            document.getElementById('welcomeName').innerText = fullName;
            document.getElementById('sidebarName').innerText = fullName;
            document.getElementById('sidebarEmail').innerText = currentUser.email || `รหัส: ${currentUser.student_code || '-'}`;

            const roleEl = document.getElementById('sidebarRole');
            const subTitleEl = document.getElementById('welcomeSubtitle');
            
            // 🌟 [แก้ไข] เปิดให้เห็นทั้งปุ่ม "สร้างห้องเรียน" และ "เข้าร่วมด้วยรหัส" เสมอ สำหรับทุกคน (แบบ Google Classroom)
            const btnTeacher = document.getElementById('btnActionTeacher');
            const btnStudent = document.getElementById('btnActionStudent');
            const sidebarMenu = document.getElementById('sidebarMenu');

            btnTeacher.classList.remove('hidden');
            btnTeacher.classList.add('flex');
            btnStudent.classList.remove('hidden');
            btnStudent.classList.add('flex');

            roleEl.innerText = (userRole === 'teacher' ? 'TEACHER / INSTRUCTOR' : 'STUDENT');
            roleEl.className = `text-xs font-bold uppercase tracking-widest mt-1 mb-0 ${userRole === 'teacher' ? 'text-[var(--primary)]' : 'text-[var(--accent)]'}`;
            subTitleEl.innerText = 'ยินดีต้อนรับสู่พื้นที่การเรียนรู้ของคุณ';

            let menuHtml = `<a href="dashboard.html" class="flex items-center gap-3 p-3 rounded-xl bg-[#f0f4ff] text-[var(--primary)] font-bold transition-all text-sm"><i class="fas fa-th-large w-5 text-center"></i> แดชบอร์ด</a>`;
            menuHtml += `<a href="mission-library.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50 text-slate-600 hover:text-[var(--primary)] font-bold transition-all text-sm"><i class="fas fa-layer-group w-5 text-center"></i> คลังภารกิจ/สื่อ</a>`;
            
            if (currentUser.is_super_admin || userRole === 'super_admin') {
                menuHtml += `<a href="super_admin.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-rose-50 text-rose-600 font-bold transition-all text-sm mt-2"><i class="fas fa-shield-alt w-5 text-center"></i> ระบบแอดมินกลาง</a>`;
            }

            sidebarMenu.innerHTML = menuHtml;
        }

        async function fetchClassrooms() {
            const db = window.sysDB;
            let classList = [];

            // 🌟 [แก้ไข] ดึงข้อมูลทั้ง "ห้องที่ตัวเองสร้าง (ผู้สอน)" และ "ห้องที่เข้าร่วม (นักเรียน)"
            
            // 1. ดึงห้องเรียนที่ตัวเองเป็นเจ้าของ (สอน)
            const { data: teachingData } = await db.from('classrooms').select('*').eq('owner_id', currentUser.user_id).order('created_at', { ascending: false });
            if (teachingData) {
                teachingData.forEach(c => { c.isTeaching = true; classList.push(c); });
            }

            // 2. ดึงห้องเรียนที่ลงทะเบียนไว้ (เรียน)
            const { data: enrolledData } = await db.from('classroom_users').select('classrooms(*)').eq('user_id', currentUser.user_id).order('created_at', { ascending: false });
            if (enrolledData) {
                enrolledData.forEach(item => { 
                    if (item.classrooms && !classList.find(c => c.classroom_id === item.classrooms.classroom_id)) {
                        item.classrooms.isTeaching = false;
                        classList.push(item.classrooms);
                    }
                });
            }

            // เรียงลำดับรวมกันตามเวลาสร้างล่าสุด
            classList.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            renderClassrooms(classList);
        }

        function renderClassrooms(classes) {
            const grid = document.getElementById('classroomGrid');
            const empty = document.getElementById('emptyState');
            
            document.getElementById('classCountBadge').innerText = `${classes.length} ห้อง`;

            if (classes.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                document.getElementById('emptyTitle').innerText = 'ยังไม่มีห้องเรียน';
                document.getElementById('emptyDesc').innerText = 'กดปุ่ม "สร้างห้องเรียนใหม่" หรือ "เข้าร่วมด้วยรหัส" ด้านบนเพื่อเริ่มต้นใช้งานครับ';
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = classes.map((cls, idx) => {
                const bgGradient = cls.color_code || 'linear-gradient(135deg, #00008B, #0000cd)';
                const title = cls.subject_name || 'ไม่ระบุชื่อวิชา';
                const room = cls.room_name || '-';
                const term = `${cls.semester || '-'}/${cls.academic_year || '-'}`;
                const icon = getSubjectIcon(title);
                const delay = idx * 0.05;

                // 🌟 [แก้ไข] ป้ายกำกับบอกสถานะของห้อง
                const roleBadge = cls.isTeaching 
                    ? `<span class="bg-blue-100 text-blue-700 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase shadow-sm"><i class="fas fa-chalkboard-teacher mr-1"></i> ผู้สอน</span>`
                    : `<span class="bg-yellow-100 text-yellow-700 text-[10px] px-2 py-0.5 rounded-full font-bold uppercase shadow-sm"><i class="fas fa-user-graduate mr-1"></i> นักเรียน</span>`;

                return `
                <div class="class-card animate-slide-up" style="animation-delay: ${delay}s;" onclick="location.href='classroom-detail.html?id=${cls.classroom_id}'">
                    <div class="class-cover" style="background: ${bgGradient};">
                        <div class="absolute top-4 left-4 z-10">${roleBadge}</div>
                        <div class="class-icon-circle text-[var(--primary)]"><i class="${icon}"></i></div>
                    </div>
                    <div class="p-5 flex-grow flex flex-col pt-6">
                        <h3 class="font-bold text-lg md:text-xl text-slate-800 font-['Kanit'] leading-tight mb-1 truncate">${title}</h3>
                        <p class="text-sm font-bold text-slate-500 font-sans mb-4">ห้อง ${room}</p>
                        
                        <div class="mt-auto flex justify-between items-center text-xs text-slate-400 font-sans font-medium border-t border-slate-100 pt-3">
                            <span><i class="fas fa-calendar-alt"></i> เทอม ${term}</span>
                            <span class="text-[var(--primary-light)]">เข้าดู <i class="fas fa-arrow-right ml-1"></i></span>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        // --- ระบบ Join Class สำหรับนักเรียน ---
        function openJoinModal() { document.getElementById('joinModal').style.display = 'flex'; }
        function closeJoinModal() { document.getElementById('joinModal').style.display = 'none'; document.getElementById('classCodeInput').value = ''; }
        
        document.getElementById('classCodeInput').addEventListener('input', function(e) {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
        });

        async function submitJoinClass() {
            const code = document.getElementById('classCodeInput').value.trim();
            const btn = document.getElementById('btnJoinConfirm');
            
            if (code.length !== 6) return showCustomAlert('กรุณากรอกรหัสห้องเรียน 6 หลักให้ครบถ้วน', 'warning');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';

            try {
                const db = window.sysDB;
                // 1. หาห้องเรียนจากรหัส
                const { data: cls } = await db.from('classrooms').select('classroom_id, is_joinable, subject_name').eq('class_code', code).maybeSingle();
                
                if (!cls) throw new Error("ไม่พบห้องเรียนที่ตรงกับรหัสนี้");
                if (cls.is_joinable === false) throw new Error("ห้องเรียนนี้ปิดรับการเข้าร่วมแล้ว");

                // 2. เช็คว่าเคยเข้าหรือยัง
                const { data: ex } = await db.from('classroom_users').select('enrollment_id').eq('classroom_id', cls.classroom_id).eq('user_id', currentUser.user_id).maybeSingle();
                if (ex) throw new Error(`คุณอยู่ในห้อง "${cls.subject_name}" อยู่แล้วครับ`);

                // 3. หาลำดับที่ (เลขที่อัตโนมัติ)
                const { count } = await db.from('classroom_users').select('*', { count: 'exact', head: true }).eq('classroom_id', cls.classroom_id);
                const nextNumber = (count || 0) + 1;

                // 4. บันทึก
                const { error } = await db.from('classroom_users').insert([{
                    classroom_id: cls.classroom_id,
                    user_id: currentUser.user_id,
                    student_number: nextNumber
                }]);

                if (error) throw error;

                closeJoinModal();
                showCustomAlert(`เข้าร่วมห้องเรียน "${cls.subject_name}" สำเร็จ!`, 'success');
                await fetchClassrooms(); // รีเฟรชหน้าจอ

            } catch (err) {
                showCustomAlert(err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'ยืนยันเข้าร่วม';
            }
        }

        // --- UI & Utils ---
        function getSubjectIcon(name) {
            if (/วิทย์|science/i.test(name)) return 'fas fa-flask';
            if (/คณิต|math/i.test(name)) return 'fas fa-calculator';
            if (/อังกฤษ|english/i.test(name)) return 'fas fa-language';
            if (/คอม|com|เทคโน|tech/i.test(name)) return 'fas fa-laptop-code';
            if (/ศิลปะ|art/i.test(name)) return 'fas fa-palette';
            if (/ดนตรี|music/i.test(name)) return 'fas fa-music';
            if (/พละ|sport/i.test(name)) return 'fas fa-running';
            return 'fas fa-book';
        }

        function toggleDrawer() {
            const dr = document.getElementById('sideDrawer');
            const ov = document.getElementById('drawerOverlay');
            if(dr.classList.contains('translate-x-full')) {
                dr.classList.remove('translate-x-full'); dr.classList.add('translate-x-0');
                ov.style.display = 'block'; setTimeout(() => ov.style.opacity = '1', 10);
            } else {
                dr.classList.add('translate-x-full'); dr.classList.remove('translate-x-0');
                ov.style.opacity = '0'; setTimeout(() => ov.style.display = 'none', 300);
            }
        }

        let alertCallback = null;
        let alertCancelCallback = null;
        function showCustomAlert(message, type = 'error', callback = null, cancelCallback = null) {
            const modal = document.getElementById('customAlertModal');
            const box = document.getElementById('customAlertBox');
            const titleEl = document.getElementById('customAlertTitle');
            const iconEl = document.getElementById('customAlertIcon');
            const okBtn = document.getElementById('customAlertOkBtn');
            const cancelBtn = document.getElementById('customAlertCancelBtn');

            document.getElementById('customAlertMessage').innerHTML = message;
            alertCallback = callback; alertCancelCallback = cancelCallback;

            if (type === 'success') { iconEl.className = 'fas fa-check-circle text-emerald-500'; titleEl.innerText = 'สำเร็จ!'; okBtn.style.background = '#10b981'; cancelBtn.classList.add('hidden'); } 
            else if (type === 'info') { iconEl.className = 'fas fa-info-circle text-blue-500'; titleEl.innerText = 'ข้อมูล'; okBtn.style.background = '#3b82f6'; cancelBtn.classList.add('hidden'); } 
            else if (type === 'warning') { iconEl.className = 'fas fa-exclamation-triangle text-amber-500'; titleEl.innerText = 'แจ้งเตือน'; okBtn.style.background = '#f59e0b'; cancelBtn.classList.add('hidden'); } 
            else if (type === 'confirm') { iconEl.className = 'fas fa-question-circle text-rose-500'; titleEl.innerText = 'ยืนยันดำเนินการ'; okBtn.style.background = '#ff4757'; cancelBtn.classList.remove('hidden'); } 
            else { iconEl.className = 'fas fa-times-circle text-rose-500'; titleEl.innerText = 'เกิดข้อผิดพลาด'; okBtn.style.background = '#ef4444'; cancelBtn.classList.add('hidden'); }

            modal.style.display = 'flex';
            setTimeout(() => { modal.style.opacity = '1'; box.classList.remove('scale-95'); }, 10);
        }

        function closeCustomAlert(isCancel = false) { 
            const modal = document.getElementById('customAlertModal');
            const box = document.getElementById('customAlertBox');
            modal.style.opacity = '0'; box.classList.add('scale-95');
            setTimeout(() => {
                modal.style.display = 'none';
                if (isCancel && alertCancelCallback) alertCancelCallback();
                else if (!isCancel && alertCallback) alertCallback();
                alertCallback = null; alertCancelCallback = null;
            }, 300);
        }

        function handleLogout() { 
            showCustomAlert('คุณต้องการออกจากระบบใช่หรือไม่?', 'confirm', async () => {
                await window.sysDB.auth.signOut(); 
                localStorage.clear();
                location.href = 'login.html'; 
            });
        }
    </script>
</body>
</html>
