<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Create ✨ | FlipSchool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: #0f172a;
        }
        .phone-shadow {
            box-shadow: 0 0 0 12px #1e293b, 0 0 0 14px #334155, 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <header class="py-10 px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-fuchsia-400 mb-2">
            Mission Create ✨
        </h1>
        <p class="text-slate-400 text-lg">สร้างสื่อการสอนที่มีชีวิตด้วยพลังแห่ง AI โดย FlipSchool</p>
    </header>

    <main class="container mx-auto px-4 pb-12 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 max-w-7xl">
        
        <!-- Left Panel: Controls -->
        <div class="lg:col-span-7 flex flex-col gap-6">
            <div class="bg-slate-800/50 border border-slate-700 p-6 rounded-3xl backdrop-blur-sm">
                
                <!-- API Key Section -->
                <div class="mb-6 p-4 bg-slate-900/50 rounded-2xl border border-slate-700">
                    <label for="apiKeyInput" class="block text-sm font-semibold mb-2 text-violet-300 flex items-center gap-2">
                        🔑 ใส่ Google Gemini API Key ของคุณ
                    </label>
                    <div class="flex gap-2">
                        <input type="password" id="apiKeyInput" 
                            class="flex-grow bg-slate-800 border border-slate-600 rounded-xl p-3 text-white focus:ring-2 focus:ring-violet-500 outline-none transition-all"
                            placeholder="วาง API Key (AIzaSy...) ที่นี่">
                        <button id="testBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 rounded-xl font-bold transition-all whitespace-nowrap text-sm">
                            🧪 ทดสอบ Key
                        </button>
                    </div>
                    <p class="text-[10px] text-slate-500 mt-2">*Key จะถูกบันทึกไว้ในเบราว์เซอร์ของคุณเท่านั้น</p>
                </div>

                <label for="prompt" class="block text-lg font-semibold mb-4 flex items-center gap-2">
                    <span class="text-2xl">🧠</span> หัวข้อบทเรียนที่ต้องการสร้าง
                </label>
                <textarea id="prompt" 
                    class="w-full h-40 bg-slate-900/50 border border-slate-600 rounded-2xl p-4 text-white focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none transition-all resize-none"
                    placeholder="เช่น: สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมสนุกๆ และแบบทดสอบ 3 ข้อ">สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมและแบบทดสอบ 3 ข้อ</textarea>
                
                <div id="statusBox" class="mt-4 p-4 rounded-xl bg-slate-900/30 border border-slate-700 hidden">
                    <p id="statusText" class="text-sm font-medium text-slate-300 flex items-center gap-3">
                        <span>พร้อมใช้งาน</span>
                    </p>
                </div>

                <div class="mt-6 flex flex-wrap gap-4">
                    <button id="generateBtn" class="flex-grow bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 px-8 rounded-2xl transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-violet-900/20">
                        <span>✨ เริ่มสร้าง Mission</span>
                    </button>
                    <button id="clearBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-4 px-6 rounded-2xl transition-all">
                        ล้างข้อมูล
                    </button>
                </div>
            </div>

            <!-- Instructions/Tips -->
            <div class="bg-indigo-900/20 border border-indigo-500/30 p-6 rounded-3xl">
                <h3 class="font-bold text-indigo-300 mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    วิธีแก้ปัญหา
                </h3>
                <ul class="text-sm text-slate-400 space-y-2 list-disc list-inside">
                    <li>หากปุ่มทดสอบขึ้นสีแดง แสดงว่า Key ไม่ถูกต้อง</li>
                    <li>ตรวจสอบว่าไม่ได้คัดลอกช่องว่างเกินมาตอนวาง Key</li>
                </ul>
            </div>
        </div>

        <!-- Right Panel: Phone Preview -->
        <div class="lg:col-span-5 flex justify-center">
            <div class="relative w-full max-w-[380px]">
                <div class="phone-shadow bg-white w-full aspect-[9/19] rounded-[3rem] overflow-hidden border-[8px] border-slate-800 relative">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-slate-800 rounded-b-2xl z-20"></div>
                    <iframe id="preview" class="w-full h-full border-none bg-slate-50" name="preview"></iframe>
                </div>
                <div class="absolute -bottom-4 -right-4 bg-fuchsia-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl rotate-12">
                    LIVE PREVIEW
                </div>
            </div>
        </div>
    </main>

    <script>
        const MODEL_ID = "gemini-2.5-flash-preview-09-2025";
        
        const promptEl = document.getElementById("prompt");
        const apiKeyInput = document.getElementById("apiKeyInput");
        const generateBtn = document.getElementById("generateBtn");
        const testBtn = document.getElementById("testBtn");
        const clearBtn = document.getElementById("clearBtn");
        const statusBox = document.getElementById("statusBox");
        const statusText = document.getElementById("statusText");
        const previewFrame = document.getElementById("preview");

        window.onload = () => {
            const savedKey = localStorage.getItem("flipschool_api_key");
            if (savedKey) apiKeyInput.value = savedKey;

            previewFrame.srcdoc = `
                <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun', sans-serif; color:#94a3b8; text-align:center; padding:20px;">
                    <div style="font-size:48px; margin-bottom:10px;">✨</div>
                    <p>พิมพ์หัวข้อบทเรียนและกดปุ่มด้านข้าง<br>เพื่อเริ่มสร้าง Mission ของคุณ!</p>
                </div>
            `;
        };

        const updateStatus = (message, type = 'info') => {
            statusBox.classList.remove('hidden');
            let icon = '';
            let color = 'text-slate-300';
            
            if (type === 'loading') {
                icon = '<div class="w-4 h-4 border-2 border-violet-400 border-t-transparent rounded-full animate-spin"></div>';
                color = 'text-violet-400';
            } else if (type === 'success') {
                icon = '✅';
                color = 'text-emerald-400';
            } else if (type === 'error') {
                icon = '❌';
                color = 'text-rose-400';
            }

            statusText.className = `text-sm font-medium ${color} flex items-center gap-3`;
            statusText.innerHTML = `${icon} <span>${message}</span>`;
        };

        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                    const errorData = await response.json();
                    if (response.status === 403 || response.status === 401) throw new Error("API Key ไม่ถูกต้อง");
                    if (response.status !== 429 && response.status < 500) throw new Error(errorData.error?.message || "Error");
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                }
                await new Promise(r => setTimeout(r, delay));
                delay *= 2;
            }
        }

        async function testConnection() {
            const userKey = apiKeyInput.value.trim();
            if (!userKey) {
                updateStatus("กรุณาใส่ API Key ก่อนทดสอบ", "error");
                return;
            }

            testBtn.disabled = true;
            testBtn.textContent = "⌛ กำลังเช็ก...";
            updateStatus("กำลังทดสอบการเชื่อมต่อ...", "loading");

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${userKey}`;
                await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: "Say 'Success'" }] }] })
                });

                localStorage.setItem("flipschool_api_key", userKey);
                updateStatus("API Key ใช้งานได้ปกติ!", "success");
            } catch (error) {
                updateStatus(`การทดสอบล้มเหลว: ${error.message}`, "error");
            } finally {
                testBtn.disabled = false;
                testBtn.textContent = "🧪 ทดสอบ Key";
            }
        }

        async function generateMission() {
            const userPrompt = promptEl.value.trim();
            const userKey = apiKeyInput.value.trim();

            if (!userKey) { updateStatus("กรุณาใส่ API Key ก่อนครับ", "error"); return; }
            if (!userPrompt) { updateStatus("กรุณากรอกหัวข้อบทเรียนก่อนครับ", "error"); return; }

            localStorage.setItem("flipschool_api_key", userKey);
            generateBtn.disabled = true;
            updateStatus("กำลังประมวลผลด้วย AI...", "loading");
            
            previewFrame.srcdoc = `<div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun'; color:#64748b;">⏳ กำลังเนรมิตบทเรียน...</div>`;

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${userKey}`;
                const data = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: userPrompt }] }],
                        systemInstruction: { parts: [{ text: "You are FlipSchool AI. Generate a Thai lesson with Title, Objectives, Content, Activity, and Quiz." }] }
                    })
                });

                const content = data.candidates?.[0]?.content?.parts?.[0]?.text;
                previewFrame.srcdoc = wrapInTemplate(marked.parse(content));
                updateStatus("สร้างบทเรียนสำเร็จ!", "success");
            } catch (error) {
                updateStatus(error.message, "error");
            } finally {
                generateBtn.disabled = false;
            }
        }

        function wrapInTemplate(bodyHtml) {
            return `<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font-family:'Sarabun',sans-serif;line-height:1.7;color:#334155;padding:24px;background:#fdfdff;}h1{color:#7c3aed;border-bottom:4px solid #f0e7ff;padding-bottom:12px;}.footer{text-align:center;padding:30px;color:#94a3b8;font-size:0.8rem;}</style></head><body>${bodyHtml}<div class="footer">สร้างโดย FlipSchool AI 🚀</div></body></html>`;
        }

        generateBtn.addEventListener("click", generateMission);
        testBtn.addEventListener("click", testConnection);
        clearBtn.addEventListener("click", () => {
            promptEl.value = "";
            statusBox.classList.add('hidden');
            previewFrame.srcdoc = "";
        });
    </script>
</body>
</html>
