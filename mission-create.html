<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>✨ Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "Sarabun", sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: #333; min-height: 100vh; }
    header { padding: 40px 20px; text-align: center; color: white; }
    .container { display: grid; grid-template-columns: 1fr 450px; gap: 30px; padding: 30px; max-width: 1300px; margin: auto; }
    .card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
    label { display: block; margin-bottom: 8px; font-weight: 600; }
    select, textarea { width: 100%; padding: 12px; font-size: 1rem; border-radius: 12px; border: 1px solid #e2e8f0; margin-bottom: 20px; box-sizing: border-box; }
    textarea { min-height: 150px; }
    button { width: 100%; padding: 16px; font-size: 1.1rem; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg, #7c3aed, #9333ea); color: white; font-weight: bold; }
    button:disabled { background: #94a3b8; }
    .phone { background: #1e293b; border-radius: 40px; padding: 12px; height: 750px; }
    iframe { width: 100%; height: 100%; border-radius: 30px; border: none; background: white; }
    .status { margin-top: 12px; text-align: center; min-height: 24px; }
    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } .phone { height: 600px; } }
  </style>
</head>
<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>ระบบสร้างแผนการสอนอัจฉริยะด้วย AI</p>
</header>

<div class="container">
  <div class="card">
    <label>🎓 ระดับชั้น</label>
    <select id="grade">
      <option value="ประถมศึกษาปีที่ 1">ป.1</option>
      <option value="ประถมศึกษาปีที่ 2">ป.2</option>
      <option value="ประถมศึกษาปีที่ 3">ป.3</option>
      <option value="ประถมศึกษาปีที่ 4">ป.4</option>
      <option value="ประถมศึกษาปีที่ 5" selected>ป.5</option>
      <option value="ประถมศึกษาปีที่ 6">ป.6</option>
    </select>

    <label>🧠 เรื่องที่ต้องการสอน</label>
    <textarea id="prompt" placeholder="เช่น: แรงโน้มถ่วง, การคัดแยกขยะ, วงจรชีวิตสัตว์">แรงโน้มถ่วง</textarea>

    <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
    <div class="status" id="status"></div>
  </div>

  <div class="phone">
    <iframe id="preview"></iframe>
  </div>
</div>

<script>
  const SUPABASE_URL = "https://hznmvaxjlgjnrvtjosdt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."; // ใช้ Key เดิมของคุณ

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const btn = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const preview = document.getElementById("preview");

  btn.addEventListener("click", generateMission);

  async function generateMission() {
    const prompt = document.getElementById("prompt").value.trim();
    const grade = document.getElementById("grade").value;

    if (!prompt) {
      alert("กรุณากรอกหัวข้อบทเรียน");
      return;
    }

    btn.disabled = true;
    status.style.color = "white";
    status.textContent = "⏳ กำลังส่งข้อมูลให้ AI วิเคราะห์...";

    try {
      // 1. เรียก Invoke โดยส่งทั้ง prompt และ grade
      const { data, error } = await supabaseClient.functions.invoke("generate-mission", {
        body: { prompt, grade }
      });

      if (error) throw error;

      // 2. รับค่า 'content' จาก Edge Function มาแสดงผล
      if (data && data.content) {
        // แปลง Markdown/Text เป็น HTML พื้นฐานเพื่อแสดงใน iframe
        const htmlContent = `
          <div style="font-family:'Sarabun',sans-serif; padding:20px; line-height:1.6; color:#333;">
            <h2 style="color:#7c3aed;">${data.topic} (${data.grade})</h2>
            <div style="white-space: pre-wrap;">${data.content}</div>
          </div>
        `;
        preview.srcdoc = htmlContent;
        status.textContent = "✅ สร้างแผนการสอนสำเร็จ!";
        status.style.color = "#4ade80";
      } else {
        throw new Error("AI ไม่ส่งข้อมูลกลับมา กรุณาลองใหม่");
      }

    } catch (err) {
      console.error("Error:", err);
      status.textContent = "❌ เกิดข้อผิดพลาด: " + err.message;
      status.style.color = "#f87171";
    } finally {
      btn.disabled = false;
    }
  }
</script>
</body>
</html>
