<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #333;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    header p {
      opacity: 0.8;
      font-weight: 300;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 30px;
      padding: 30px;
      max-width: 1300px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 12px;
      color: #1e293b;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: border 0.3s;
    }

    textarea:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .phone {
      background: #1e293b;
      border-radius: 40px;
      padding: 12px;
      height: 750px;
      border: 8px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 20px;
    }

    .phone iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 30px;
      background: white;
    }

    .status {
      margin-top: 15px;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 500;
      min-height: 24px;
    }
    
    .debug-btn {
      margin-top: 10px;
      background: #10b981;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      .phone {
        height: 650px;
        max-width: 450px;
        margin: auto;
        position: static;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>ระบบสร้างบทเรียนอัจฉริยะ (Powered by Gemini AI & Supabase)</p>
</header>

<div class="container">
  <div class="card">
    <label for="prompt">🧠 คุณต้องการสร้างบทเรียนเรื่องอะไร?</label>
    <textarea id="prompt">สอนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมและแบบทดสอบ</textarea>

    <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
    <button id="debugBtn" class="debug-btn">🐛 เปิดโหมด Debug</button>
    
    <div class="status" id="status">พร้อมใช้งาน</div>
  </div>

  <div class="phone">
    <iframe id="preview" name="preview"></iframe>
  </div>
</div>

<script>
// ===================== CONFIG =====================
const SUPABASE_URL = "https://hznmvaxjlgjnrvtjosdt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6bm12YXhqbGdqbnJ2dGpvc2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NjQwMzMsImV4cCI6MjA4MjU0MDAzM30.o5W0oP8mnMOs9DWcvGgZ9F7E1EdysBuUu807UKdbqnE";

// ===================== INITIALIZE =====================
let supabaseClient;
try {
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  console.log("✅ Supabase Client พร้อมทำงาน");
} catch (error) {
  console.error("❌ ไม่สามารถเชื่อมต่อ Supabase:", error);
}

// ===================== MAIN FUNCTION =====================
async function generateMission() {
  const promptEl = document.getElementById("prompt");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const btn = document.getElementById("generateBtn");

  const prompt = promptEl.value.trim();
  if (!prompt) {
    alert("📝 กรุณาพิมพ์หัวข้อบทเรียน");
    return;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const cid = urlParams.get('cid') || "demo-course";

  btn.disabled = true;
  status.textContent = "⏳ กำลังสร้างบทเรียนด้วย AI...";
  status.style.color = "#fbbf24";

  showLoadingScreen(preview, prompt);

  try {
    if (supabaseClient) {
      // เรียกใช้ Edge Function
      const { data, error } = await supabaseClient.functions.invoke("generate-mission", {
        body: { prompt, cid }
      });

      if (error) throw error;

      // ตรวจสอบข้อมูล HTML ที่ได้รับจาก AI
      if (data && data.ok && data.html) {
        console.log("✅ AI สร้าง HTML สำเร็จ");
        preview.srcdoc = data.html; 
        status.textContent = "✅ สร้างบทเรียนสำเร็จ!";
        status.style.color = "#10b981";
      } else {
        throw new Error(data.error || "AI ไม่ส่งข้อมูลกลับมา");
      }
    }
  } catch (error) {
    console.error("❌ Error Detail:", error);
    status.textContent = "❌ เกิดข้อผิดพลาด: " + error.message;
    status.style.color = "#ef4444";
    showErrorScreen(preview, error.message);
  } finally {
    btn.disabled = false;
  }
}

// ===================== HELPER FUNCTIONS =====================
function showLoadingScreen(preview, prompt) {
  preview.srcdoc = `
  <!DOCTYPE html>
  <html>
  <head>
    <meta charset="UTF-8">
    <style>
      body { margin:0; display:flex; justify-content:center; align-items:center; height:100vh; background:linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family:'Sarabun', sans-serif; color:white; text-align:center; }
      .spinner { width:60px; height:60px; border:5px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#7c3aed; animation:spin 1s linear infinite; margin:0 auto 20px; }
      @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
    </style>
  </head>
  <body>
    <div>
      <div class="spinner"></div>
      <h2>✨ กำลังสร้างบทเรียน...</h2>
      <p>"${prompt.substring(0, 50)}..."</p>
    </div>
  </body>
  </html>`;
}

function showErrorScreen(preview, errorMsg) {
  preview.srcdoc = `
  <!DOCTYPE html>
  <html>
  <head><meta charset="UTF-8"><style>body { font-family:'Sarabun', sans-serif; padding:30px; background:#fef2f2; color:#dc2626; } .box { background:white; border-radius:15px; padding:25px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }</style></head>
  <body>
    <div class="box">
      <h2>⚠️ เกิดข้อผิดพลาด</h2>
      <p><strong>สาเหตุ:</strong> ${errorMsg}</p>
      <button onclick="window.parent.location.reload()" style="background:#7c3aed; color:white; border:none; padding:10px 20px; border-radius:8px; cursor:pointer;">🔄 ลองใหม่อีกครั้ง</button>
    </div>
  </body>
  </html>`;
}

// ===================== INITIALIZATION =====================
document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('generateBtn').addEventListener('click', generateMission);
  document.getElementById('debugBtn').addEventListener('click', () => {
    alert(`🐛 Debug Info:\nSupabase: ${typeof supabaseClient !== 'undefined' ? '✅ พร้อม' : '❌ ไม่พบ'}\nURL: ${window.location.href}`);
  });
  
  // หน้าต้อนรับใน Iframe
  document.getElementById('preview').srcdoc = `<!DOCTYPE html><html><body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun', sans-serif; color:#64748b; text-align:center;"><div><div style="font-size:3em;">✨</div><h2>Mission Create</h2><p>พิมพ์หัวข้อบทเรียนด้านซ้ายเพื่อเริ่มสร้าง</p></div></body></html>`;
});
</script>

</body>
</html>
