<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root { --primary: #7c3aed; --secondary: #9333ea; --bg: #0f172a; --card-bg: #ffffff; }
    body { margin: 0; font-family: "Sarabun", sans-serif; background: linear-gradient(135deg, var(--bg), #1e293b); color: #333; min-height: 100vh; }
    header { padding: 40px 20px; text-align: center; color: white; }
    header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    .container { display: grid; grid-template-columns: 1fr 450px; gap: 30px; padding: 30px; max-width: 1300px; margin: auto; }
    .card { background: var(--card-bg); border-radius: 24px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); display: flex; flex-direction: column; }
    label { font-weight: 600; display: block; margin-bottom: 12px; color: #1e293b; font-size: 1.1rem; }
    textarea { width: 100%; min-height: 150px; padding: 16px; font-size: 1rem; border-radius: 12px; border: 2px solid #e2e8f0; resize: vertical; outline: none; transition: all 0.3s; }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1); }
    .button-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 2; padding: 16px; font-size: 1.1rem; font-weight: 600; border-radius: 14px; border: none; cursor: pointer; background: linear-gradient(135deg, var(--primary), var(--secondary)); color: white; transition: all 0.3s ease; }
    button:hover { transform: translateY(-2px); }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .test-btn { flex: 1; background: #10b981; }
    .phone { background: #000; border-radius: 50px; padding: 15px; height: 780px; border: 10px solid #334155; position: sticky; top: 20px; }
    .phone iframe { width: 100%; height: 100%; border: none; border-radius: 35px; background: white; }
    .status { margin-top: 15px; font-size: 0.95rem; text-align: center; font-weight: 500; min-height: 24px; }
    .api-key-section { margin-top: 20px; padding: 15px; background: #f1f5f9; border-radius: 15px; }
    .api-key-input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
    @media (max-width: 1024px) { .container { grid-template-columns: 1fr; } .phone { height: 700px; max-width: 400px; margin: auto; position: static; } }
  </style>
</head>

<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>สร้างสื่อการสอนที่มีชีวิตด้วยพลังแห่ง AI</p>
</header>

<div class="container">
  <div class="card">
    <label for="prompt">🧠 หัวข้อบทเรียนที่ต้องการสร้าง</label>
    <textarea id="prompt">สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมและแบบทดสอบ 3 ข้อ</textarea>
    
    <div class="api-key-section">
      <label for="apiKey">🔑 Google Gemini API Key</label>
      <input type="password" id="apiKey" class="api-key-input" placeholder="วาง API Key (AIzaSy...) ที่นี่">
    </div>

    <div class="button-group">
        <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
        <button id="testBtn" class="test-btn">🧪 Test API</button>
    </div>
    
    <div id="status" class="status">สถานะ: พร้อมใช้งาน</div>
  </div>

  <div class="phone">
    <iframe id="preview" name="preview"></iframe>
  </div>
</div>

<script>
// --- การตั้งค่าที่เสถียรที่สุด ---
const GEMINI_MODEL = "gemini-1.5-flash";

async function callGeminiAPI(apiKey, prompt) {
  // ล้างค่าว่างและอักขระแปลกปลอมออกจาก Key
  const cleanKey = apiKey.trim().replace(/[^a-zA-Z0-9_-]/g, '');
  
  // ใช้ v1 API (เสถียรกว่า v1beta ในบางพื้นที่)
  const url = `https://generativelanguage.googleapis.com/v1/models/${GEMINI_MODEL}:generateContent?key=${cleanKey}`;

  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 3000 }
      })
    });

    const data = await response.json();

    if (!response.ok) {
      return { success: false, error: data.error?.message || "Error " + response.status };
    }
    return { success: true, content: data.candidates[0].content.parts[0].text };
  } catch (error) {
    return { success: false, error: "เชื่อมต่อไม่ได้ (เช็กอินเทอร์เน็ต)" };
  }
}

async function generateMission() {
  const promptEl = document.getElementById("prompt");
  const apiKeyEl = document.getElementById("apiKey");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const btn = document.getElementById("generateBtn");
  
  if (!promptEl.value || !apiKeyEl.value) { alert("กรุณาใส่ข้อมูลให้ครบครับ"); return; }
  
  btn.disabled = true;
  status.textContent = "⏳ กำลังเนรมิตบทเรียน...";
  status.style.color = "#f59e0b";
  preview.srcdoc = "<div style='display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;'><h3>✨ กำลังสร้างบทเรียน...</h3></div>";
  
  try {
    const sysPrompt = `จงสร้างบทเรียนเรื่อง "${promptEl.value}" เป็น Markdown: ชื่อบทเรียน, วัตถุประสงค์, เนื้อหา, กิจกรรม, แบบทดสอบ 3 ข้อพร้อมเฉลย`;
    const response = await callGeminiAPI(apiKeyEl.value, sysPrompt);
    
    if (response.success) {
      preview.srcdoc = convertToFullHTML(marked.parse(response.content));
      status.textContent = "✅ สร้างสำเร็จ!";
      status.style.color = "#10b981";
      localStorage.setItem('gemini_api_key', apiKeyEl.value.trim());
    } else { throw new Error(response.error); }
  } catch (error) {
    preview.srcdoc = `<div style="padding:20px;color:red;"><h3>❌ ข้อผิดพลาด</h3><p>${error.message}</p></div>`;
    status.textContent = "❌ " + error.message;
    status.style.color = "#ef4444";
  } finally { btn.disabled = false; }
}

async function testAPIKey() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const status = document.getElementById("status");
  if (!apiKey) return;
  
  status.textContent = "🧪 กำลังทดสอบ...";
  const response = await callGeminiAPI(apiKey, "Say 'OK'");
  if (response.success) {
    status.textContent = "✅ API Key ใช้งานได้แล้ว!";
    status.style.color = "#10b981";
    localStorage.setItem('gemini_api_key', apiKey);
  } else {
    status.textContent = "❌ " + response.error;
    status.style.color = "#ef4444";
  }
}

function convertToFullHTML(htmlBody) {
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet"><style>body{font-family:'Sarabun',sans-serif;line-height:1.6;padding:25px;color:#334155;}h1{color:#7c3aed;border-bottom:3px solid #f0e7ff;padding-bottom:10px;}h2{color:#1e293b;margin-top:25px;}.badge{background:#7c3aed;color:white;padding:4px 12px;border-radius:99px;font-size:0.8rem;display:inline-block;margin-bottom:10px;}.footer{text-align:center;font-size:0.8rem;color:#94a3b8;margin-top:40px;}</style></head><body><div class="badge">FlipSchool AI</div>${htmlBody}<div class="footer">Powered by Gemini AI 🚀</div></body></html>`;
}

document.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('gemini_api_key');
  if (savedKey) document.getElementById('apiKey').value = savedKey;
  document.getElementById('generateBtn').addEventListener('click', generateMission);
  document.getElementById('testBtn').addEventListener('click', testAPIKey);
});
</script>
</body>
</html>
