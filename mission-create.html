<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #333;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px;
      text-align: center;
      color: white;
    }

    header h1 {
      margin: 0;
      font-size: 2.2rem;
      letter-spacing: 1px;
    }

    header p {
      opacity: 0.8;
      font-weight: 300;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 30px;
      padding: 30px;
      max-width: 1300px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 12px;
      color: #1e293b;
      font-size: 1.1rem;
    }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: border 0.3s;
    }

    textarea:focus {
      border-color: #7c3aed;
      box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .phone {
      background: #1e293b;
      border-radius: 40px;
      padding: 12px;
      height: 750px;
      border: 8px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 20px;
    }

    .phone iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 30px;
      background: white;
    }

    .status {
      margin-top: 15px;
      font-size: 0.95rem;
      text-align: center;
      font-weight: 500;
      min-height: 24px;
    }

    @media (max-width: 1024px) {
      .container {
        grid-template-columns: 1fr;
      }
      .phone {
        height: 650px;
        max-width: 450px;
        margin: auto;
        position: static;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>ระบบสร้างบทเรียนอัจฉริยะ (Powered by Gemini AI & Supabase)</p>
</header>

<div class="container">

  <div class="card">
    <label for="prompt">🧠 คุณต้องการสร้างบทเรียนเรื่องอะไร?</label>
    <textarea
      id="prompt"
      "เช่น: สร้างบทเรียนภาษาไทย ป.1 เรื่อง มาตราแม่กม พร้อมกิจกรรมที่สนุกสนานและแบบทดสอบ 3 ข้อ"
    ></textarea>

    <button id="generateBtn" onclick="generateMission()">
      ✨ เริ่มสร้าง Mission
    </button>

    <div class="status" id="status"></div>
  </div>

  <div class="phone">
    <iframe id="preview" name="preview"></iframe>
  </div>

</div>

<script>
  // 🔐 CONFIG (Production)
  const SUPABASE_URL = "https://hznmvaxjlgjnrvtjosdt.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6bm12YXhqbGdqbnJ2dGpvc2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NjQwMzMsImV4cCI6MjA4MjU0MDAzM30.o5W0oP8mnMOs9DWcvGgZ9F7E1EdysBuUu807UKdbqnE";

  const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function generateMission() {
    const promptEl = document.getElementById("prompt");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const btn = document.getElementById("generateBtn");

    // ดึง cid จาก URL
    const urlParams = new URLSearchParams(window.location.search);
    const cid = urlParams.get('cid');

    const prompt = promptEl.value.trim();
    if (!prompt) {
      alert("กรุณาพิมพ์หัวข้อบทเรียนที่ต้องการสร้างครับ");
      return;
    }

    // เริ่มการทำงาน
    btn.disabled = true;
    status.style.color = "white";
    status.textContent = "⏳ กำลังส่งข้อมูลให้ AI ประมวลผล...";
    preview.srcdoc = `
      <div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:'Sarabun',sans-serif;flex-direction:column;gap:15px;color:#64748b;">
        <div style="width:40px;height:40px;border:4px solid #f3f3f3;border-top:4px solid #7c3aed;border-radius:50%;animation:spin 1s linear infinite;"></div>
        <p>Gemini กำลังออกแบบบทเรียนให้คุณ...</p>
        <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
      </div>
    `;

    try {
      // เรียกใช้ Edge Function "generate-mission"
      const { data, error } = await _supabase.functions.invoke("generate-mission", {
        body: { 
            prompt: prompt,
            cid: cid // ส่ง Course ID ไปด้วย
        }
      });

      if (error) throw error;

      if (data && data.html) {
        preview.srcdoc = data.html;
        status.textContent = "✅ สร้าง Mission สำเร็จแล้ว!";
        status.style.color = "#4ade80";
      } else {
        throw new Error("ไม่ได้รับข้อมูล HTML จากระบบ");
      }

    } catch (err) {
      console.error("Error details:", err);
      
      // แสดงข้อผิดพลาดแบบละเอียด
      const errorMessage = err.message || "กรุณาลองใหม่อีกครั้ง";
      const errorDetails = err.toString();
      
      status.textContent = `❌ เกิดข้อผิดพลาด: ${errorMessage}`;
      status.style.color = "#f87171";
      
      preview.srcdoc = `
        <div style="padding:30px;font-family:Sarabun;color:#1e293b;max-width:600px;margin:auto;">
          <h3 style="color:#dc2626;">⚠️ เกิดข้อผิดพลาด</h3>
          <p><strong>ข้อความ:</strong> ${errorMessage}</p>
          <p><strong>รายละเอียด:</strong> ${errorDetails}</p>
          <div style="margin-top:20px;padding:15px;background:#fef2f2;border-radius:8px;">
            <small>ตรวจสอบว่า:</small>
            <ul style="margin:10px 0;">
              <li>API Key ถูกตั้งค่าใน Supabase Functions แล้ว</li>
              <li>Function "generate-mission" ถูก deploy แล้ว</li>
              <li>อินเทอร์เน็ตทำงานปกติ</li>
            </ul>
          </div>
          <button onclick="location.reload()" style="margin-top:15px;padding:10px 20px;background:#7c3aed;color:white;border:none;border-radius:8px;cursor:pointer;">
            🔄 ลองอีกครั้ง
          </button>
        </div>
      `;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
