<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>✨Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #333;
      min-height: 100vh;
    }
    header {
      padding: 40px 20px;
      text-align: center;
      color: white;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 30px;
      padding: 30px;
      max-width: 1300px;
      margin: auto;
    }
    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
    }
    button:disabled {
      background: #94a3b8;
    }
    .phone {
      background: #1e293b;
      border-radius: 40px;
      padding: 12px;
      height: 750px;
    }
    iframe {
      width: 100%;
      height: 100%;
      border-radius: 30px;
      border: none;
      background: white;
    }
    .status {
      margin-top: 12px;
      text-align: center;
      min-height: 24px;
    }
  </style>
</head>

<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>ระบบสร้างบทเรียนอัจฉริยะ (Gemini + Supabase)</p>
</header>

<div class="container">

  <div class="card">
    <label>🧠 คุณต้องการสร้างบทเรียนเรื่องอะไร?</label>
    <textarea id="prompt"
      placeholder="เช่น: สร้างบทเรียนวิทยาศาสตร์ ป.5 เรื่อง แรงโน้มถ่วง พร้อมกิจกรรมและแบบทดสอบ">สร้างบทเรียนวิทยาศาสตร์ ป.5 เรื่อง แรงโน้มถ่วง พร้อมกิจกรรมและแบบทดสอบ
    </textarea>

    <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
    <div class="status" id="status"></div>
  </div>

  <div class="phone">
    <iframe id="preview"></iframe>
  </div>

</div>

<script>
  // ❗ ป้องกันเปิดผ่าน file://
  if (location.protocol === "file:") {
    alert("กรุณาเปิดผ่าน Web Server (เช่น localhost, Netlify, Vercel)");
  }

  const SUPABASE_URL = "https://hznmvaxjlgjnrvtjosdt.supabase.co";
  const SUPABASE_ANON_KEY = "YOUR_ANON_KEY";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const btn = document.getElementById("generateBtn");
  const status = document.getElementById("status");
  const preview = document.getElementById("preview");

  btn.addEventListener("click", generateMission);

  async function generateMission() {
    const prompt = document.getElementById("prompt").value.trim();
    if (!prompt) {
      alert("กรุณากรอกหัวข้อบทเรียน");
      return;
    }

    btn.disabled = true;
    status.style.color = "white";
    status.textContent = "⏳ กำลังสร้างบทเรียนด้วย AI...";

    try {
      const { data, error } =
        await supabaseClient.functions.invoke(
          "generate-mission",
          {
            body: { prompt },
            headers: {
              "Content-Type": "application/json"
            }
          }
        );

      if (error) {
        throw error;
      }

      if (!data || !data.html) {
        throw new Error("Edge Function ไม่ส่ง html กลับมา");
      }

      preview.srcdoc = data.html;
      status.textContent = "✅ สร้าง Mission สำเร็จแล้ว!";
      status.style.color = "#4ade80";

    } catch (err) {
      console.error("Invoke error:", err);
      status.textContent = "❌ " + err.message;
      status.style.color = "#f87171";
      preview.srcdoc = `
        <div style="padding:20px;font-family:Sarabun;color:red;">
          <h3>เกิดข้อผิดพลาด</h3>
          <pre>${err.message}</pre>
        </div>
      `;
    } finally {
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
