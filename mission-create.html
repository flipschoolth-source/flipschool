<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #7c3aed;
      --secondary: #9333ea;
      --bg: #0f172a;
      --card-bg: #ffffff;
    }

    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: linear-gradient(135deg, var(--bg), #1e293b);
      color: #333;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px;
      text-align: center;
      color: white;
    }

    header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    header p { opacity: 0.8; font-weight: 300; }

    .container {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 30px;
      padding: 30px;
      max-width: 1300px;
      margin: auto;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
    }

    label { font-weight: 600; display: block; margin-bottom: 12px; color: #1e293b; font-size: 1.1rem; }

    textarea {
      width: 100%;
      min-height: 150px;
      padding: 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 2px solid #e2e8f0;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: all 0.3s;
    }

    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1); }

    .button-group { display: flex; gap: 10px; margin-top: 20px; }

    button {
      flex: 2;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); }
    button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

    .test-btn { flex: 1; background: #10b981; }

    .phone {
      background: #000;
      border-radius: 50px;
      padding: 15px;
      height: 780px;
      border: 10px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 20px;
    }

    .phone iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      border-radius: 35px; 
      background: white; 
    }

    .status { margin-top: 15px; font-size: 0.95rem; text-align: center; font-weight: 500; min-height: 24px; }
    
    .api-key-section { 
      margin-top: 20px; 
      padding: 15px; 
      background: #f1f5f9; 
      border-radius: 15px; 
    }
    
    .api-key-input { 
      width: 100%; 
      padding: 12px; 
      border: 1px solid #cbd5e1; 
      border-radius: 8px; 
      font-family: inherit; 
      box-sizing: border-box;
    }

    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; }
      .phone { height: 700px; max-width: 400px; margin: auto; position: static; }
    }
  </style>
</head>

<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>สร้างสื่อการสอนที่มีชีวิตด้วยพลังแห่ง AI</p>
</header>

<div class="container">
  <div class="card">
    <label for="prompt">🧠 หัวข้อบทเรียนหรือไอเดียที่คุณต้องการ</label>
    <textarea id="prompt" placeholder="เช่น: สร้างบทเรียนวิทยาศาสตร์ เรื่อง วงจรชีวิตของผีเสื้อ พร้อมกิจกรรมสนุกๆ">สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมและแบบทดสอบ 3 ข้อ</textarea>
    
    <div class="api-key-section">
      <label for="apiKey">🔑 Gemini API Key</label>
      <input type="password" id="apiKey" class="api-key-input" placeholder="Paste your API key here">
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">
        ยังไม่มี Key? <a href="https://aistudio.google.com/apikey" target="_blank" style="color: var(--primary); font-weight: 600;">รับฟรีที่ Google AI Studio</a>
      </p>
    </div>

    <div class="button-group">
        <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
        <button id="testBtn" class="test-btn">🧪 Test</button>
    </div>
    
    <div class="status" id="status">สถานะ: พร้อมสร้างสรรค์</div>
  </div>

  <div class="phone">
    <iframe id="preview" name="preview"></iframe>
  </div>
</div>

<script>
const GEMINI_MODEL = "gemini-1.5-flash";

// --- ฟังก์ชันหลักในการ Generate ---
async function generateMission() {
  const promptEl = document.getElementById("prompt");
  const apiKeyEl = document.getElementById("apiKey");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const btn = document.getElementById("generateBtn");
  
  const userText = promptEl.value.trim();
  const apiKey = apiKeyEl.value.trim();
  
  if (!userText || !apiKey) {
    alert("กรุณากรอกหัวข้อบทเรียนและ API Key ให้เรียบร้อยครับ");
    return;
  }
  
  btn.disabled = true;
  status.textContent = "⏳ AI กำลังเรียบเรียงบทเรียนให้น้องๆ...";
  status.style.color = "#f59e0b";
  
  showLoadingScreen(preview);
  
  try {
    const systemInstruction = `คุณคือผู้เชี่ยวชาญด้านการออกแบบการเรียนการสอน (Instructional Designer) 
    จงสร้างบทเรียนตามหัวข้อที่ได้รับในรูปแบบ Markdown ที่สวยงาม 
    โดยมีโครงสร้างดังนี้:
    1. ชื่อบทเรียน (Heading 1)
    2. วัตถุประสงค์ (List)
    3. เนื้อหาแบบสรุปเข้าใจง่าย (ใช้ Heading 2 และ 3 แบ่งหัวข้อ)
    4. กิจกรรมสนุกๆ (Activity)
    5. แบบทดสอบ 3-5 ข้อ (พร้อมเฉลยด้านล่างสุด)
    **หมายเหตุ: ใช้ภาษาที่เหมาะสมกับวัยผู้เรียน และเน้นความถูกต้องของภาษาไทย**`;

    const fullPrompt = `${systemInstruction}\n\nหัวข้อบทเรียน: ${userText}`;
    const response = await callGeminiAPI(apiKey, fullPrompt);
    
    if (response.success) {
      // แปลง Markdown เป็น HTML ด้วย marked
      const htmlContent = convertToFullHTML(marked.parse(response.content));
      preview.srcdoc = htmlContent;
      status.textContent = "✅ สร้างบทเรียนเรียบร้อยแล้ว!";
      status.style.color = "#10b981";
      localStorage.setItem('gemini_api_key', apiKey);
    } else {
      throw new Error(response.error);
    }
  } catch (error) {
    showErrorScreen(preview, error.message);
    status.textContent = "❌ เกิดข้อผิดพลาด: " + error.message;
    status.style.color = "#ef4444";
  } finally {
    btn.disabled = false;
  }
}

// --- การเชื่อมต่อ API ---
async function callGeminiAPI(apiKey, prompt) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 4000 }
      })
    });
    const data = await response.json();
    if (!response.ok) return { success: false, error: data.error?.message || "Unknown Error" };
    return { success: true, content: data.candidates[0].content.parts[0].text };
  } catch (error) {
    return { success: false, error: error.message };
  }
}

// --- การจัดรูปแบบ HTML ใน Preview ---
function convertToFullHTML(htmlBody) {
  return `
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; line-height: 1.7; color: #334155; padding: 25px; background: #ffffff; }
    h1 { color: #7c3aed; font-size: 1.8rem; border-bottom: 3px solid #f0e7ff; padding-bottom: 10px; }
    h2 { color: #1e293b; margin-top: 25px; border-left: 5px solid #7c3aed; padding-left: 15px; }
    h3 { color: #4b5563; }
    p, li { font-size: 1.05rem; }
    .badge { background: #7c3aed; color: white; padding: 4px 12px; border-radius: 99px; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
    blockquote { background: #f8fafc; border-radius: 10px; padding: 15px; margin: 0; font-style: italic; color: #64748b; border-left: 4px solid #cbd5e1; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    table, th, td { border: 1px solid #e2e8f0; padding: 10px; }
    th { background: #f1f5f9; }
    hr { border: 0; border-top: 1px solid #e2e8f0; margin: 30px 0; }
    .footer { text-align: center; font-size: 0.8rem; color: #94a3b8; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="badge">FlipSchool Interactive Lesson</div>
  ${htmlBody}
  <div class="footer">สร้างสรรค์ด้วย Gemini AI 🚀</div>
</body>
</html>`;
}

// --- ส่วนจัดการ Loading/UI ---
function showLoadingScreen(preview) {
  preview.srcdoc = `
    <div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun', sans-serif; text-align:center; background:#f8fafc;">
      <div>
        <div style="font-size: 50px; margin-bottom: 20px;">✨</div>
        <h2 style="color:#7c3aed;">กำลังเนรมิตบทเรียน...</h2>
        <p style="color:#64748b;">รอสักครู่ AI กำลังเตรียมเนื้อหาให้คุณ</p>
      </div>
    </div>`;
}

function showErrorScreen(preview, msg) {
  preview.srcdoc = `<div style="padding:30px; color:#ef4444; font-family:'Sarabun', sans-serif;"><h3>❌ เกิดข้อผิดพลาด</h3><p>${msg}</p></div>`;
}

async function testAPIKey() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const status = document.getElementById("status");
  if (!apiKey) { alert("กรุณาใส่ API Key"); return; }
  
  status.textContent = "🧪 กำลังทดสอบ API...";
  const response = await callGeminiAPI(apiKey, "Say 'OK' in Thai");
  if (response.success) {
    status.textContent = "✅ API Key ใช้งานได้จริง!";
    status.style.color = "#10b981";
    localStorage.setItem('gemini_api_key', apiKey);
  } else {
    status.textContent = "❌ API Key ไม่ถูกต้อง";
    status.style.color = "#ef4444";
  }
}

document.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('gemini_api_key');
  if (savedKey) document.getElementById('apiKey').value = savedKey;
  document.getElementById('generateBtn').addEventListener('click', generateMission);
  document.getElementById('testBtn').addEventListener('click', testAPIKey);
});
</script>

</body>
</html>
