<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Mission Create ✨ | FlipSchool</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* ส่วนของหน้าหลัก (Editor) */
    body {
      margin: 0;
      font-family: "Sarabun", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: #333;
      min-height: 100vh;
    }

    header {
      padding: 40px 20px;
      text-align: center;
      color: white;
    }

    header h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; }
    header p { opacity: 0.8; font-weight: 300; }

    .container {
      display: grid;
      grid-template-columns: 1fr 450px;
      gap: 30px;
      padding: 30px;
      max-width: 1300px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
    }

    label { font-weight: 600; display: block; margin-bottom: 12px; color: #1e293b; font-size: 1.1rem; }

    textarea {
      width: 100%;
      min-height: 180px;
      padding: 16px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      resize: vertical;
      font-family: inherit;
      box-sizing: border-box;
      outline: none;
      transition: border 0.3s;
    }

    textarea:focus { border-color: #7c3aed; box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1); }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 16px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      background: linear-gradient(135deg, #7c3aed, #9333ea);
      color: white;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
    }

    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4); }
    button:disabled { background: #94a3b8; cursor: not-allowed; transform: none; box-shadow: none; }

    .phone {
      background: #1e293b;
      border-radius: 40px;
      padding: 12px;
      height: 750px;
      border: 8px solid #334155;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: sticky;
      top: 20px;
    }

    .phone iframe { width: 100%; height: 100%; border: none; border-radius: 30px; background: white; }

    .status { margin-top: 15px; font-size: 0.95rem; text-align: center; font-weight: 500; min-height: 24px; }
    
    .api-key-section { margin-top: 15px; padding: 15px; background: #f8fafc; border-radius: 10px; border: 1px solid #e2e8f0; }
    
    .api-key-input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Sarabun', sans-serif; margin-top: 5px; }
    
    .test-btn { background: linear-gradient(135deg, #10b981, #059669); margin-top: 10px; }

    @media (max-width: 1024px) {
      .container { grid-template-columns: 1fr; }
      .phone { height: 650px; max-width: 450px; margin: auto; position: static; }
    }
  </style>
</head>

<body>

<header>
  <h1>Mission Create ✨</h1>
  <p>ระบบสร้างบทเรียนอัจฉริยะ (Powered by Gemini AI)</p>
</header>

<div class="container">
  <div class="card">
    <label for="prompt">🧠 คุณต้องการสร้างบทเรียนเรื่องอะไร?</label>
    <textarea id="prompt">สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมและแบบทดสอบ 3 ข้อ</textarea>
    
    <div class="api-key-section">
      <label for="apiKey">🔑 Google AI API Key (จำเป็น)</label>
      <input type="password" id="apiKey" class="api-key-input" placeholder="ใส่ API Key ของคุณที่นี่">
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 5px;">
        ดาวน์โหลด API Key ได้ที่: 
        <a href="https://aistudio.google.com/apikey" target="_blank" style="color: #7c3aed;">Google AI Studio</a>
      </p>
    </div>

    <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
    <button id="testBtn" class="test-btn">🧪 ทดสอบ API Key</button>
    
    <div class="status" id="status">พร้อมใช้งาน</div>
  </div>

  <div class="phone">
    <iframe id="preview" name="preview"></iframe>
  </div>
</div>

<script>
// ===================== CONFIGURATION =====================
const GEMINI_MODEL = "gemini-1.5-flash";

// ===================== MAIN FUNCTIONS =====================
async function generateMission() {
  const promptEl = document.getElementById("prompt");
  const apiKeyEl = document.getElementById("apiKey");
  const preview = document.getElementById("preview");
  const status = document.getElementById("status");
  const btn = document.getElementById("generateBtn");
  
  const prompt = promptEl.value.trim();
  const apiKey = apiKeyEl.value.trim();
  
  if (!prompt || !apiKey) {
    alert("กรุณากรอกข้อมูลให้ครบถ้วน");
    return;
  }
  
  btn.disabled = true;
  status.textContent = "⏳ กำลังเชื่อมต่อกับ AI...";
  status.style.color = "#f59e0b";
  
  showLoadingScreen(preview, prompt);
  
  try {
    const aiPrompt = createAIPrompt(prompt);
    const response = await callGeminiAPI(apiKey, aiPrompt);
    
    if (response.success) {
      const htmlContent = convertToFullHTML(response.content, prompt);
      preview.srcdoc = htmlContent;
      status.textContent = "✅ สร้างบทเรียนสำเร็จ!";
      status.style.color = "#10b981";
      localStorage.setItem('gemini_api_key', apiKey);
    } else {
      throw new Error(response.error);
    }
  } catch (error) {
    showErrorScreen(preview, error.message);
    status.textContent = "❌ " + error.message;
    status.style.color = "#ef4444";
  } finally {
    btn.disabled = false;
  }
}

async function callGeminiAPI(apiKey, prompt) {
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
  try {
    const response = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }],
        generationConfig: { temperature: 0.7, maxOutputTokens: 4096 }
      })
    });
    const data = await response.json();
    if (!response.ok) return { success: false, error: data.error?.message };
    return { success: true, content: data.candidates[0].content.parts[0].text };
  } catch (error) {
    return { success: false, error: error.message };
  }
}

async function testAPIKey() {
  const apiKey = document.getElementById("apiKey").value.trim();
  const status = document.getElementById("status");
  if (!apiKey) { alert("กรุณาใส่ API Key"); return; }
  
  status.textContent = "🧪 กำลังทดสอบ...";
  const response = await callGeminiAPI(apiKey, "Say 'OK'");
  if (response.success) {
    status.textContent = "✅ API Key ใช้งานได้!";
    status.style.color = "#10b981";
    localStorage.setItem('gemini_api_key', apiKey);
  } else {
    status.textContent = "❌ API Key ผิดพลาด";
    status.style.color = "#ef4444";
  }
}

function createAIPrompt(userPrompt) {
  return `จงสร้างบทเรียนเรื่อง "${userPrompt}" ในรูปแบบโครงสร้าง Markdown ที่ชัดเจน (ห้ามส่งรหัส HTML มา) โดยประกอบด้วย: ชื่อบทเรียน, วัตถุประสงค์, เนื้อหาละเอียด, กิจกรรม, และแบบทดสอบ 3 ข้อ พร้อมเฉลย`;
}

// แก้ไขฟังก์ชัน convertToFullHTML ให้จัดการ Markdown เป็น HTML ภายใน iframe อย่างถูกต้อง
function convertToFullHTML(content, prompt) {
  // แปลง Markdown เบื้องต้น
  const formattedBody = content
    .replace(/### (.*)/g, '<h3>$1</h3>')
    .replace(/## (.*)/g, '<h2>$1</h2>')
    .replace(/# (.*)/g, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');

  // สร้างไฟล์ HTML เต็มรูปแบบเพื่อฉีดเข้า iframe
  return `
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Sarabun', sans-serif; line-height: 1.6; color: #334155; padding: 20px; background: #f8fafc; }
    .container { max-width: 100%; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    h1 { color: #7c3aed; border-bottom: 2px solid #7c3aed; padding-bottom: 10px; }
    h2 { color: #1e293b; margin-top: 20px; }
    .badge { background: #7c3aed; color: white; padding: 4px 12px; border-radius: 99px; font-size: 0.8rem; display: inline-block; margin-bottom: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">Lesson Create by AI</div>
    ${formattedBody}
    <hr>
    <p style="text-align:center; color:#94a3b8; font-size:0.8rem;">Powered by FlipSchool & Gemini AI</p>
  </div>
</body>
</html>`;
}

// ฟังก์ชันอื่นๆ (Loading/Error)
function showLoadingScreen(preview, prompt) {
  preview.srcdoc = `<div style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; text-align:center;"><div><h2>✨ กำลังสร้างบทเรียน...</h2><p>${prompt}</p></div></div>`;
}

function showErrorScreen(preview, msg) {
  preview.srcdoc = `<div style="padding:20px; color:red; font-family:sans-serif;"><h3>❌ ข้อผิดพลาด</h3><p>${msg}</p></div>`;
}

document.addEventListener('DOMContentLoaded', () => {
  const savedKey = localStorage.getItem('gemini_api_key');
  if (savedKey) document.getElementById('apiKey').value = savedKey;
  document.getElementById('generateBtn').addEventListener('click', generateMission);
  document.getElementById('testBtn').addEventListener('click', testAPIKey);
});
</script>

</body>
</html>
