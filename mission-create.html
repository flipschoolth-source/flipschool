<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <title>Mission Create ✨ | FlipSchool</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* ส่วนการจัดวางพื้นฐาน */
        body {
            margin: 0;
            font-family: "Sarabun", sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #333;
            min-height: 100vh;
        }

        header {
            padding: 30px 20px;
            text-align: center;
            color: white;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 400px; /* ปรับขนาดกรอบมือถือให้เล็กลงเล็กน้อย */
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: auto;
        }

        /* กล่องกรอกข้อมูลด้านซ้าย */
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        label {
            font-weight: 600;
            margin-bottom: 12px;
            color: #1e293b;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            font-size: 1rem;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            font-family: inherit;
            box-sizing: border-box;
            outline: none;
            transition: all 0.3s;
        }

        textarea:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        button {
            margin-top: 15px;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: white;
            transition: all 0.2s;
        }

        #generateBtn {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.3);
        }

        #generateBtn:hover { transform: translateY(-2px); }
        #generateBtn:disabled { background: #94a3b8; cursor: not-allowed; }

        .debug-btn { background: #10b981; margin-top: 10px; }

        /* กรอบจำลองมือถือด้านขวา */
        .phone {
            background: #1e293b;
            border-radius: 45px;
            padding: 12px;
            height: 700px;
            border: 8px solid #334155;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 20px;
        }

        .phone iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 35px;
            background: white;
        }

        .status {
            margin-top: 15px;
            font-size: 0.9rem;
            text-align: center;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .container { grid-template-columns: 1fr; }
            .phone { height: 600px; position: static; }
        }
    </style>
</head>

<body>

<header>
    <h1>Mission Create ✨</h1>
    <p>สร้างบทเรียนด้วย AI และแสดงผลทันที</p>
</header>

<div class="container">
    <div class="card">
        <label for="prompt">🧠 หัวข้อบทเรียนที่ต้องการสร้าง:</label>
        <textarea id="prompt">สอนวิทยาศาสตร์ ป.3 เรื่อง ระบบย่อยอาหาร พร้อมกิจกรรมและแบบทดสอบ</textarea>

        <button id="generateBtn">✨ เริ่มสร้าง Mission</button>
        <button id="debugBtn" class="debug-btn">🐛 ตรวจสอบสถานะระบบ</button>
        
        <div class="status" id="status">ระบบพร้อมใช้งาน</div>
    </div>

    <div class="phone">
        <iframe id="preview" name="preview"></iframe>
    </div>
</div>

<script>
    // 1. ตั้งค่าการเชื่อมต่อ
    const SUPABASE_URL = "https://hznmvaxjlgjnrvtjosdt.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh6bm12YXhqbGdqbnJ2dGpvc2R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjY5NjQwMzMsImV4cCI6MjA4MjU0MDAzM30.o5W0oP8mnMOs9DWcvGgZ9F7E1EdysBuUu807UKdbqnE";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 2. ฟังก์ชันหลักในการสร้างบทเรียน
    async function generateMission() {
        const btn = document.getElementById("generateBtn");
        const status = document.getElementById("status");
        const prompt = document.getElementById("prompt").value.trim();
        const preview = document.getElementById("preview");

        if (!prompt) { alert("กรุณากรอกหัวข้อก่อนครับ"); return; }

        // ปิดการทำงานปุ่มและตั้งสถานะ
        btn.disabled = true;
        status.textContent = "⏳ AI กำลังเรียบเรียงบทเรียน...";
        status.style.color = "#fbbf24";

        // แสดงหน้าจอ Loading ในมือถือ
        preview.srcdoc = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:Sarabun;text-align:center;background:#f8fafc;">
            <div><div style="width:50px;height:50px;border:5px solid #eee;border-top-color:#7c3aed;border-radius:50%;animation:spin 1s linear infinite;margin:auto;"></div>
            <h2 style="color:#7c3aed;">กำลังสร้างบทเรียน...</h2><p>โปรดรอสักครู่</p></div>
            <style>@keyframes spin {100%{transform:rotate(360deg);}}</style>
        </div>`;

        try {
            // เรียกใช้ Supabase Edge Function
            const { data, error } = await supabaseClient.functions.invoke("generate-mission", {
                body: { prompt: prompt, cid: "course-001" }
            });

            if (error) throw error;

            if (data && data.ok && data.html) {
                // ✅ นำ HTML ที่ AI สร้างมาแสดงผล
                preview.srcdoc = data.html;
                status.textContent = "✅ สร้างบทเรียนสำเร็จ!";
                status.style.color = "#10b981";
            } else {
                throw new Error(data.error || "AI ไม่ส่งข้อมูลกลับมา");
            }

        } catch (err) {
            console.error(err);
            status.textContent = "❌ เกิดข้อผิดพลาด";
            status.style.color = "#ef4444";
            preview.srcdoc = `<div style="padding:20px;font-family:Sarabun;color:#ef4444;text-align:center;">
                <h3>⚠️ เกิดข้อผิดพลาด</h3><p>${err.message}</p>
                <button onclick="window.parent.location.reload()" style="padding:10px;background:#7c3aed;color:white;border:none;border-radius:5px;">ลองใหม่อีกครั้ง</button>
            </div>`;
        } finally {
            btn.disabled = false;
        }
    }

    // 3. เริ่มต้นระบบเมื่อโหลดหน้าเสร็จ
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('generateBtn').addEventListener('click', generateMission);
        
        // ปุ่ม Debug
        document.getElementById('debugBtn').addEventListener('click', () => {
            alert(`สถานะ Supabase: ${supabaseClient ? 'เชื่อมต่อแล้ว' : 'ผิดพลาด'}`);
        });

        // หน้าต้อนรับในมือถือ
        document.getElementById('preview').srcdoc = `<div style="display:flex;justify-content:center;align-items:center;height:100vh;font-family:Sarabun;color:#64748b;text-align:center;">
            <div><h1 style="font-size:3rem;margin:0;">✨</h1><h2>Mission Create</h2><p>กรอกข้อมูลด้านซ้ายแล้วกดสร้างได้เลยครับ</p></div>
        </div>`;
    });
</script>

</body>
</html>
