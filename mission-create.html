<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mission Create ✨ | FlipSchool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background: #0f172a;
        }
        .phone-shadow {
            box-shadow: 0 0 0 12px #1e293b, 0 0 0 14px #334155, 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .loading-pulse { animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col">

    <header class="py-10 px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-fuchsia-400 mb-2">
            Mission Create ✨
        </h1>
        <p class="text-slate-400 text-lg">สร้างสื่อการสอนที่มีชีวิตด้วยพลังแห่ง AI โดย FlipSchool</p>
    </header>

    <main class="container mx-auto px-4 pb-12 flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 max-w-7xl">
        
        <!-- Left Panel: Controls -->
        <div class="lg:col-span-7 flex flex-col gap-6">
            <div class="bg-slate-800/50 border border-slate-700 p-6 rounded-3xl backdrop-blur-sm">
                <label for="prompt" class="block text-lg font-semibold mb-4 flex items-center gap-2">
                    <span class="text-2xl">🧠</span> หัวข้อบทเรียนที่ต้องการสร้าง
                </label>
                <textarea id="prompt" 
                    class="w-full h-48 bg-slate-900/50 border border-slate-600 rounded-2xl p-4 text-white focus:ring-2 focus:ring-violet-500 focus:border-transparent outline-none transition-all resize-none"
                    placeholder="เช่น: สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมสนุกๆ และแบบทดสอบ 3 ข้อ">สร้างบทเรียนภาษาไทย ป.1 เรื่อง สระอา พร้อมกิจกรรมและแบบทดสอบ 3 ข้อ</textarea>
                
                <div id="statusBox" class="mt-4 p-4 rounded-xl bg-slate-900/30 border border-slate-700 hidden">
                    <p id="statusText" class="text-sm font-medium text-slate-300 flex items-center gap-3">
                        <!-- Status icon injected here -->
                        <span>พร้อมใช้งาน</span>
                    </p>
                </div>

                <div class="mt-6 flex flex-wrap gap-4">
                    <button id="generateBtn" class="flex-grow bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-bold py-4 px-8 rounded-2xl transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-violet-900/20">
                        <span>✨ เริ่มสร้าง Mission</span>
                    </button>
                    <button id="clearBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-4 px-6 rounded-2xl transition-all">
                        ล้างข้อมูล
                    </button>
                </div>
            </div>

            <!-- Instructions/Tips -->
            <div class="bg-indigo-900/20 border border-indigo-500/30 p-6 rounded-3xl">
                <h3 class="font-bold text-indigo-300 mb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                    เคล็ดลับการใช้งาน
                </h3>
                <ul class="text-sm text-slate-400 space-y-2 list-disc list-inside">
                    <li>ระบุระดับชั้นให้ชัดเจน (เช่น ป.1, ม.3)</li>
                    <li>เพิ่มคีย์เวิร์ดอย่าง "เกมแสนสนุก", "ตัวอย่างในชีวิตประจำวัน"</li>
                    <li>สามารถระบุจำนวนข้อสอบที่ต้องการได้</li>
                </ul>
            </div>
        </div>

        <!-- Right Panel: Phone Preview -->
        <div class="lg:col-span-5 flex justify-center">
            <div class="relative w-full max-w-[380px]">
                <div class="phone-shadow bg-white w-full aspect-[9/19] rounded-[3rem] overflow-hidden border-[8px] border-slate-800 relative">
                    <!-- Notch -->
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-slate-800 rounded-b-2xl z-20"></div>
                    
                    <iframe id="preview" class="w-full h-full border-none bg-slate-50" name="preview"></iframe>
                </div>
                
                <!-- Floating Badge -->
                <div class="absolute -bottom-4 -right-4 bg-fuchsia-600 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl rotate-12">
                    LIVE PREVIEW
                </div>
            </div>
        </div>
    </main>

    <script>
        const apiKey = ""; // Environment provided
        const MODEL_ID = "gemini-2.5-flash-preview-09-2025";
        
        const promptEl = document.getElementById("prompt");
        const generateBtn = document.getElementById("generateBtn");
        const clearBtn = document.getElementById("clearBtn");
        const statusBox = document.getElementById("statusBox");
        const statusText = document.getElementById("statusText");
        const previewFrame = document.getElementById("preview");

        const updateStatus = (message, type = 'info') => {
            statusBox.classList.remove('hidden');
            let icon = '';
            let color = 'text-slate-300';
            
            if (type === 'loading') {
                icon = '<div class="w-4 h-4 border-2 border-violet-400 border-t-transparent rounded-full animate-spin"></div>';
                color = 'text-violet-400';
            } else if (type === 'success') {
                icon = '✅';
                color = 'text-emerald-400';
            } else if (type === 'error') {
                icon = '❌';
                color = 'text-rose-400';
            }

            statusText.className = `text-sm font-medium ${color} flex items-center gap-3`;
            statusText.innerHTML = `${icon} <span>${message}</span>`;
        };

        async function fetchWithRetry(url, options, maxRetries = 5) {
            let delay = 1000;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (response.ok) return await response.json();
                    if (response.status !== 429 && response.status < 500) {
                        const errorData = await response.json();
                        throw new Error(errorData.error?.message || `HTTP Error ${response.status}`);
                    }
                } catch (err) {
                    if (i === maxRetries - 1) throw err;
                }
                await new Promise(resolve => setTimeout(resolve, delay));
                delay *= 2;
            }
        }

        async function generateMission() {
            const userPrompt = promptEl.value.trim();
            if (!userPrompt) {
                updateStatus("กรุณากรอกหัวข้อบทเรียนก่อนครับ", "error");
                return;
            }

            generateBtn.disabled = true;
            updateStatus("กำลังประมวลผลด้วย AI...", "loading");
            
            // Set initial loading state in preview
            previewFrame.srcdoc = `
                <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun', sans-serif; background:#f8fafc; color:#64748b; text-align:center; padding:20px;">
                    <div style="width:50px; height:50px; border:4px solid #7c3aed; border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:20px;"></div>
                    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>
                    <h2 style="color:#1e293b; margin:0;">กำลังสร้างบทเรียน...</h2>
                    <p>ขั้นตอนนี้อาจใช้เวลาประมาณ 10-20 วินาที</p>
                </div>
            `;

            const systemInstruction = `
                You are FlipSchool AI, an expert educational content creator for Thai schools. 
                Your task is to generate a comprehensive, engaging, and interactive lesson in Thai language.
                Follow this structure:
                1. Lesson Title (H1)
                2. Learning Objectives (Bullet points)
                3. Engaging Lesson Content (Use H2 for sections, markdown for bolding)
                4. An Interactive Activity (A "Try this" section)
                5. A Quiz (3 multiple choice questions with answers at the bottom hidden or clearly marked).
                
                Tone: Encouraging, professional, and suitable for the specified grade level.
                Always use standard Thai fonts (Sarabun).
            `;

            try {
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${apiKey}`;
                const payload = {
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemInstruction }] }
                };

                const data = await fetchWithRetry(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const content = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!content) throw new Error("ไม่สามารถสร้างเนื้อหาได้ กรุณาลองใหม่");

                const renderedHtml = marked.parse(content);
                previewFrame.srcdoc = wrapInTemplate(renderedHtml);
                
                updateStatus("สร้างบทเรียนสำเร็จ!", "success");
            } catch (error) {
                console.error(error);
                updateStatus(`เกิดข้อผิดพลาด: ${error.message}`, "error");
                previewFrame.srcdoc = `<div style="padding:20px; color:#e11d48; font-family:sans-serif;"><h3>❌ ข้อผิดพลาด</h3><p>${error.message}</p></div>`;
            } finally {
                generateBtn.disabled = false;
            }
        }

        function wrapInTemplate(bodyHtml) {
            return `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
                    <style>
                        :root { --primary: #7c3aed; }
                        body { 
                            font-family: 'Sarabun', sans-serif; 
                            line-height: 1.7; 
                            color: #334155; 
                            background: #fdfdff; 
                            margin: 0; 
                            padding: 0; 
                        }
                        .content { padding: 24px; }
                        h1 { color: var(--primary); font-size: 1.8rem; margin-top: 0; border-bottom: 4px solid #f0e7ff; padding-bottom: 12px; }
                        h2 { color: #1e293b; font-size: 1.4rem; margin-top: 2rem; display: flex; align-items: center; gap: 8px; }
                        h2::before { content: '🚀'; }
                        blockquote { background: #f5f3ff; border-left: 5px solid var(--primary); padding: 15px; margin: 20px 0; border-radius: 0 12px 12px 0; font-style: italic; }
                        ul, ol { padding-left: 20px; }
                        li { margin-bottom: 10px; }
                        .quiz-box { background: #fff; border: 2px solid #e2e8f0; border-radius: 16px; padding: 20px; margin-top: 30px; }
                        .badge { background: var(--primary); color: white; padding: 4px 12px; border-radius: 99px; font-size: 0.75rem; font-weight: bold; margin-bottom: 10px; display: inline-block; }
                        .footer { text-align: center; padding: 30px; color: #94a3b8; font-size: 0.8rem; border-top: 1px solid #f1f5f9; }
                    </style>
                </head>
                <body>
                    <div class="content">
                        <div class="badge">FlipSchool Mission</div>
                        ${bodyHtml}
                    </div>
                    <div class="footer">
                        สร้างโดย FlipSchool AI 🚀<br>พลังขับเคลื่อนโดย Gemini 2.5 Flash
                    </div>
                </body>
                </html>
            `;
        }

        generateBtn.addEventListener("click", generateMission);
        clearBtn.addEventListener("click", () => {
            promptEl.value = "";
            statusBox.classList.add('hidden');
            previewFrame.srcdoc = "";
        });

        // Initialize empty preview
        window.onload = () => {
             previewFrame.srcdoc = `
                <div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun', sans-serif; color:#94a3b8; text-align:center; padding:20px;">
                    <div style="font-size:48px; margin-bottom:10px;">✨</div>
                    <p>พิมพ์หัวข้อบทเรียนและกดปุ่มด้านข้าง<br>เพื่อเริ่มสร้าง Mission ของคุณ!</p>
                </div>
            `;
        };
    </script>
</body>
</html>
