            { emoji: "🏫", tags: ["โรงเรียน", "school", "building", "study"] },
            { emoji: "⚽", tags: ["ฟุตบอล", "บอล", "soccer", "football", "กีฬา", "sport", "ball"] },
            { emoji: "🏀", tags: ["บาสเกตบอล", "บาส", "basketball", "กีฬา", "sport", "ball"] },
            { emoji: "🧸", tags: ["ตุ๊กตาหมี", "ตุ๊กตา", "ของเล่น", "teddy bear", "toy", "bear"] },
            { emoji: "🎈", tags: ["ลูกโป่ง", "balloon", "party", "ของเล่น", "toy"] },
            { emoji: "🎁", tags: ["ของขวัญ", "กล่องของขวัญ", "gift", "present", "box", "party"] }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');

            const checkDB = setInterval(async () => {
                if(window.sysDB) {
                    clearInterval(checkDB);
                    const { data: { session } } = await window.sysDB.auth.getSession();
                    if (!session) {
                        window.location.href = 'login.html'; 
                        return;
                    }
                    currentUserId = session.user.id;
                    
                    if(editingMid) {
                        await loadExistingMission();
                    } else {
                        renderVocabList();
                        updatePreview();
                    }
                }
            }, 500);
            
            window.addEventListener('message', async function(event) {
                if (event.data && event.data.type === 'SAVE_RESULT') {
                    const score = event.data.score || 0;
                    
                    if (!editingMid) {
                        return showMessage(`🏆 ทดสอบเล่นได้ ${score} คะแนน (ต้องกดบันทึกภารกิจลงระบบก่อน ระบบถึงจะสามารถเก็บคะแนนลง DB ได้จริง)`);
                    }

                    showMessage(`⏳ กำลังบันทึก ${score} คะแนนลงระบบ...`);
                    
                    if (window.sysDB && currentUserId) {
                        try {
                            const { data: existingRecords, error: fetchError } = await window.sysDB
                                .from('student_missions')
                                .select('id, score')
                                .eq('student_id', currentUserId)
                                .eq('mission_id', editingMid);
                                
                            if (fetchError) throw fetchError;
                            
                            if (existingRecords && existingRecords.length > 0) {
                                const currentBestScore = existingRecords[0].score || 0;
                                const newScore = Math.max(currentBestScore, score);
                                
                                const { error: updateError } = await window.sysDB
                                    .from('student_missions')
                                    .update({ 
                                        score: newScore, 
                                        updated_at: new Date().toISOString(),
                                        is_completed: true,
                                        completed_at: new Date().toISOString()
                                    })
                                    .eq('id', existingRecords[0].id);
                                    
                                if (updateError) throw updateError;
                                showMessage(score > currentBestScore ? `🎉 ยินดีด้วย! ทำลายสถิติเดิม อัปเดตคะแนนล่าสุดเป็น ${newScore} คะแนนสำเร็จ!` : `✅ บันทึกการเล่นซ้ำเรียบร้อย (คะแนนสูงสุด: ${newScore})`);
                            } else {
                                const { error: insertError } = await window.sysDB
                                    .from('student_missions')
                                    .insert([{
                                        student_id: currentUserId, 
                                        mission_id: editingMid,
                                        score: score,
                                        is_completed: true,
                                        completed_at: new Date().toISOString(),
                                        updated_at: new Date().toISOString()
                                    }]);

                                if (insertError) throw insertError;
                                showMessage(`✅ บันทึก ${score} คะแนนลงฐานข้อมูลสำเร็จ!`);
                            }
                        } catch (err) {
                            console.error("DB Score Table error:", err);
                            showMessage(`⚠️ เกิดข้อผิดพลาดในการบันทึกคะแนน: ${err.message}`, true);
                        }
                    }
                }
            });
        });

        async function loadExistingMission() {
            try {
                const { data, error } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
                if (error) throw error;
                if (data) {
                    document.getElementById("missionTitleInput").value = data.title || "";
                    document.getElementById("missionDescInput").value = data.description || "";
                    document.getElementById("missionSubjectInput").value = data.subject_group || "ภาษาไทย";
                    document.getElementById("missionGradeInput").value = data.grade_level || "";

                    if (data.content_data) {
                        if (data.content_data.vocab_list) {
                            currentVocabs = data.content_data.vocab_list;
                            renderVocabList();
                        }
                        if (data.content_data.html) {
                            generatedCode = data.content_data.html;
                            document.getElementById("codeView").value = generatedCode;
                            
                            const iframe = document.getElementById("missionFrame");
                            const newIframe = document.createElement('iframe');
                            newIframe.id = 'missionFrame';
                            newIframe.className = "w-full h-full bg-black border-none absolute inset-0 z-10";
                            newIframe.sandbox = "allow-scripts allow-same-origin allow-forms allow-modals";
                            newIframe.title = "Zuma Preview";
                            newIframe.srcdoc = generatedCode;
                            iframe.parentNode.replaceChild(newIframe, iframe);
                        }
                    }
                }
            } catch(e) {
                console.error("Error loading mission:", e);
                renderVocabList();
                updatePreview();
            }
        }

        function switchViewMode(mode) {
            const frame = document.getElementById('missionFrame');
            const codeBox = document.getElementById('codeView');
            const btnPreview = document.getElementById('btn-mode-preview');
            const btnCode = document.getElementById('btn-mode-code');

            if (mode === 'preview') {
                frame.classList.remove('hidden-el');
                codeBox.classList.add('hidden-el');
                
                btnPreview.className = "w-8 h-8 bg-white shadow-sm text-orange-600 rounded-md flex items-center justify-center transition-all text-xs";
                btnCode.className = "w-8 h-8 hover:bg-white text-slate-500 rounded-md transition-all flex items-center justify-center text-xs";
                
                if (codeBox.value && codeBox.value !== generatedCode) {
                    generatedCode = codeBox.value;
                    const newIframe = document.createElement('iframe');
                    newIframe.id = 'missionFrame';
                    newIframe.className = "w-full h-full bg-black border-none absolute inset-0 z-10";
                    newIframe.sandbox = "allow-scripts allow-same-origin allow-forms allow-modals"; 
                    newIframe.title = "Zuma Preview";
                    newIframe.srcdoc = generatedCode;
                    frame.parentNode.replaceChild(newIframe, frame);
                }
            } else {
                frame.classList.add('hidden-el');
                codeBox.classList.remove('hidden-el');
                codeBox.value = generatedCode;
                
                btnCode.className = "w-8 h-8 bg-white shadow-sm text-orange-600 rounded-md flex items-center justify-center transition-all text-xs";
                btnPreview.className = "w-8 h-8 hover:bg-white text-slate-500 rounded-md transition-all flex items-center justify-center text-xs";
            }
        }

        function renderVocabList() {
            const container = document.getElementById('vocabListContainer');
            container.innerHTML = '';
            document.getElementById('vocabCount').innerText = `${currentVocabs.length} คำ`;

            currentVocabs.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'vocab-item bg-white border border-slate-200 rounded-xl p-3 flex flex-wrap gap-2 items-center shadow-sm relative';
                div.innerHTML = `
                    <div class="flex-grow min-w-[100px]">
                        <input type="text" value="${item.word}" oninput="handleWordInput(${index}, this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 outline-none text-sm focus:ring-2 focus:ring-orange-500 font-bold" placeholder="คำศัพท์">
                    </div>
                    <div class="relative w-20 shrink-0 flex items-center">
                        <input type="text" id="emoji-input-${index}" value="${item.emoji}" onchange="updateVocab(${index}, 'emoji', this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg pl-2 pr-7 py-1.5 outline-none text-center text-sm focus:ring-2 focus:ring-orange-500" placeholder="อิโมจิ" maxlength="2">
                        <button type="button" onclick="openEmojiPicker(${index})" class="absolute right-1.5 text-slate-400 hover:text-orange-500 transition-colors" title="เลือกอิโมจิ">
                            <i class="far fa-smile"></i>
                        </button>
                    </div>
                    <div class="w-10 h-8 shrink-0 relative rounded-lg overflow-hidden border border-slate-200 cursor-pointer">
                        <input type="color" value="${item.color}" onchange="updateVocab(${index}, 'color', this.value)" class="absolute -top-2 -left-2 w-16 h-16 cursor-pointer">
                    </div>
                    <button type="button" onclick="removeVocabItem(${index})" class="w-8 h-8 bg-rose-50 hover:bg-rose-100 text-rose-500 rounded-lg transition-all flex items-center justify-center shrink-0">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                `;
                container.appendChild(div);
            });
        }

        function handleWordInput(index, value) {
            currentVocabs[index].word = value;
            
            const cleanWord = value.trim().toLowerCase();
            const found = emojiDatabase.find(item => item.tags.some(tag => tag.toLowerCase() === cleanWord));
            if (found) {
                currentVocabs[index].emoji = found.emoji;
                document.getElementById(`emoji-input-${index}`).value = found.emoji;
            }
        }

        function updateVocab(index, field, value) {
            currentVocabs[index][field] = value;
        }

        let activeEmojiIndex = null;

        function openEmojiPicker(index) {
            activeEmojiIndex = index;
            document.getElementById('emojiSearchInput').value = '';
            filterEmojis(''); 
            document.getElementById('emojiPickerModal').classList.remove('hidden');
            setTimeout(() => document.getElementById('emojiSearchInput').focus(), 100);
        }

        function filterEmojis(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            const grid = document.getElementById('emojiGrid');
            grid.innerHTML = '';
            
            let filtered = emojiDatabase;
            if (term !== "") {
                filtered = emojiDatabase.filter(item => {
                    return item.tags.some(tag => tag.toLowerCase().includes(term));
                });
            }
            
            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-6 text-sm text-slate-400 py-4 text-center">ไม่พบอิโมจิที่ค้นหา</div>';
                return;
            }

            filtered.forEach(item => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "hover:bg-white bg-transparent rounded-lg p-1.5 transition-all transform hover:scale-110 shadow-sm border border-transparent hover:border-slate-200 cursor-pointer";
                btn.innerText = item.emoji;
                btn.onclick = () => selectEmoji(item.emoji);
                grid.appendChild(btn);
            });
        }

        function closeEmojiPicker() {
            document.getElementById('emojiPickerModal').classList.add('hidden');
            activeEmojiIndex = null;
        }

        function selectEmoji(emoji) {
            if (activeEmojiIndex !== null) {
                currentVocabs[activeEmojiIndex].emoji = emoji;
                document.getElementById(`emoji-input-${activeEmojiIndex}`).value = emoji;
            }
            closeEmojiPicker();
        }

        function addVocabItem() {
            const randomColors = ["#FF1493", "#FFD700", "#00CED1", "#32CD32", "#FFB6C1", "#FFA500", "#FF0000", "#DA70D6"];
            currentVocabs.push({ 
                word: "คำใหม่", 
                emoji: "🌟", 
                color: randomColors[Math.floor(Math.random() * randomColors.length)] 
            });
            renderVocabList();
            
            const container = document.getElementById('vocabListContainer');
            container.scrollTop = container.scrollHeight;
        }

        function removeVocabItem(index) {
            if (currentVocabs.length <= 4) {
                showMessage("⚠️ ต้องมีคำศัพท์อย่างน้อย 4 คำเพื่อสร้างเกมครับ", true);
                return;
            }
            currentVocabs.splice(index, 1);
            renderVocabList();
        }

        function generateGameHTML() {
            let title = document.getElementById('missionTitleInput').value.trim() || "Zuma ล่าคำศัพท์";
            const jsonStr = JSON.stringify(currentVocabs).replace(/</g, '\\u003c');
            
            let finalHtml = document.getElementById('zuma-template').value;
            finalHtml = finalHtml.replace(/\/\*%%GAME_TITLE%%\*\//g, title);
            finalHtml = finalHtml.replace(/\/\*%%VOCAB_LIST_JSON%%\*\//g, jsonStr);
            
            return finalHtml;
        }

        function updatePreview() {
            if (currentVocabs.length < 4) {
                showMessage("⚠️ กรุณาเพิ่มคำศัพท์อย่างน้อย 4 คำ", true);
                return;
            }

            generatedCode = generateGameHTML();
            
            const iframe = document.getElementById("missionFrame");
            const newIframe = document.createElement('iframe');
            newIframe.id = 'missionFrame';
            newIframe.className = "w-full h-full bg-black border-none absolute inset-0 z-10";
            newIframe.sandbox = "allow-scripts allow-same-origin allow-forms allow-modals"; 
            newIframe.title = "Zuma Preview";
            newIframe.srcdoc = generatedCode;
            
            iframe.parentNode.replaceChild(newIframe, iframe);
            document.getElementById("codeView").value = generatedCode;

            showMessage("✅ อัปเดตพรีวิวเรียบร้อย ลองเล่นดูได้เลย!");
        }

        function showMessage(text, isError = false) { 
            const msgBox = document.getElementById("msgBox");
            document.getElementById("msgText").innerText = text; 
            msgBox.style.borderLeftColor = isError ? '#ef4444' : '#3b82f6';
            msgBox.style.display = 'block';
            setTimeout(() => msgBox.style.display = 'none', 4000); 
        }

        function openSaveModal() { 
            const title = document.getElementById("missionTitleInput").value.trim();
            if(!title) {
                document.getElementById("missionTitleInput").focus();
                return showMessage("⚠️ กรุณาตั้งชื่อภารกิจก่อนบันทึก", true);
            }
            document.getElementById('saveModal').classList.remove('hidden'); 
        }
        
        function closeSaveModal() { 
            document.getElementById('saveModal').classList.add('hidden'); 
        }

        async function confirmSave(mode) {
            const title = document.getElementById("missionTitleInput").value.trim();
            const desc = document.getElementById("missionDescInput").value.trim();
            const subject = document.getElementById("missionSubjectInput").value.trim() || "อื่นๆ";
            const grade = document.getElementById("missionGradeInput").value.trim() || "";
            
            if (!document.getElementById("codeView").classList.contains('hidden-el')) {
                generatedCode = document.getElementById("codeView").value;
            } else if (!generatedCode) {
                generatedCode = generateGameHTML();
            }

            try {
                const missionData = {
                    title: title,
                    description: desc,
                    subject_group: subject,
                    grade_level: grade,
                    mission_type: "zuma_template",
                    content_data: { 
                        html: generatedCode,
                        vocab_list: currentVocabs
                    },
                    is_public: true,
                    created_by: currentUserId,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString()
                };

                let mid = editingMid;

                if (editingMid) {
                    const { error: updateError } = await window.sysDB.from('missions').update(missionData).eq('mission_id', editingMid);
                    if (updateError) throw updateError;
                } else {
                    const { data, error: insertError } = await window.sysDB.from('missions').insert([missionData]).select();
                    if (insertError) throw insertError;
                    mid = data[0].mission_id;
                    
                    if (targetCid) {
                        const { error: mapError } = await window.sysDB.from('classroom_missions').upsert({
                            classroom_id: targetCid, mission_id: mid, assigned_at: new Date().toISOString()
                        }, { onConflict: 'classroom_id, mission_id' });
                        if (mapError) throw mapError;
                    }
                }

                showMessage("✅ บันทึกเกม Zuma สำเร็จ!");

                if (mode === 'exit') {
                    document.getElementById('saveModal').classList.add('hidden');
                    setTimeout(() => {
                        window.location.href = targetCid ? `classroom-detail.html?id=${targetCid}` : 'mission-library.html';
                    }, 1500);
                } else {
                    closeSaveModal();
                }
            } catch (err) { 
                showMessage("บันทึกไม่สำเร็จ: " + err.message, true); 
            }
        }
    </script>
