<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Code Editor | FlipSchool</title>

    <!-- Config & Database Scripts -->
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Monaco -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        body { font-family: 'Sarabun','Kanit',sans-serif; background:#f1f5f9; color:#1e293b; }
        .nav-gradient { background: linear-gradient(135deg,#00008B,#1e3a8a); }
        .hidden-el { display:none!important; }

        #monaco-container {
            width:100%; height:500px;
            border:1px solid #334155; border-radius:1rem;
            overflow:hidden;
        }

        .ai-reasoning-box {
            background:#f0fdfa;
            border-left:4px solid #0d9488;
            padding:1rem;
            margin-top:1rem;
            border-radius:.75rem;
            font-size:.85rem;
            color:#134e4a;
            display:none;
            animation:fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from { opacity:0; transform:translateY(4px); }
            to { opacity:1; transform:none; }
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

<!-- ========================= MAIN ========================= -->
<main class="flex-grow container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">

<!-- ================= LEFT ================= -->
<div class="lg:col-span-5 bg-white p-6 rounded-[2rem] border border-slate-200 flex flex-col gap-4">

    <input id="missionTitleInput" class="bg-slate-50 border rounded-xl px-4 py-2 text-sm font-bold"
           placeholder="📍 ชื่อภารกิจ">

    <div id="monaco-container"></div>

    <!-- AI PROMPT -->
    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200">
        <div class="flex gap-2">
            <input id="aiPromptInput"
                   class="flex-1 bg-white border rounded-xl px-4 py-3 text-sm"
                   placeholder="✨ สั่ง AI ให้ปรับปรุงโค้ด">
            <button onclick="handleAIModify()"
                    class="bg-teal-600 hover:bg-teal-700 text-white px-4 rounded-xl">
                <i class="fas fa-magic"></i>
            </button>
        </div>

        <!-- AI CHANGE LOG -->
        <div id="aiReasoningBox" class="ai-reasoning-box">
            <div id="aiReasoningText"></div>
        </div>
    </div>
</div>

<!-- ================= RIGHT ================= -->
<div class="lg:col-span-7 bg-white rounded-[2rem] border border-slate-200 p-4">
    <iframe id="missionFrame" class="w-full h-[700px] border rounded-xl"></iframe>
</div>

</main>

<script>
/* =================== MONACO =================== */
let editor;
require.config({ paths:{ vs:'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs'}});
require(['vs/editor/editor.main'], () => {
    editor = monaco.editor.create(document.getElementById('monaco-container'),{
        value:"",
        language:"html",
        theme:"vs-dark",
        automaticLayout:true,
        minimap:{ enabled:false },
        fontSize:14
    });
    editor.onDidChangeModelContent(refreshPreview);
});

/* =================== PREVIEW =================== */
function refreshPreview(){
    document.getElementById('missionFrame').srcdoc = editor.getValue();
}

/* =================== AI LOGIC =================== */
const MODEL_ID = "gemini-2.5-flash-preview-09-2025";

async function handleAIModify(){
    const prompt = aiPromptInput.value.trim();
    const code   = editor.getValue();
    const key    = document.getElementById("apiKeyInput")?.value || "";

    if(!prompt) return alert("กรุณาพิมพ์คำสั่ง");
    if(!key) return alert("กรุณากรอก API Key");

    aiReasoningBox.style.display="none";

    const sysPrompt = `
You are a senior software engineer acting as an AI code editor.

TASK:
Improve or modify the existing HTML code based on user instruction.

USER INSTRUCTION:
"${prompt}"

REQUIREMENTS:
- Modify only what is necessary
- Preserve existing logic
- MUST keep window.parent.postMessage and history.back
- Use Tailwind CSS
- Responsive friendly

OUTPUT (JSON ONLY):
{
  "summary": "Short explanation",
  "changes": ["item 1","item 2"],
  "code": "<FULL UPDATED HTML>"
}

INPUT CODE:
${code}
`;

    const res = await fetch(
        \`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${key}\`,
        {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body:JSON.stringify({ contents:[{ parts:[{ text:sysPrompt }]}] })
        }
    );

    const data = await res.json();
    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
    if(!text) return alert("AI ไม่ตอบกลับ");

    let result;
    try { result = JSON.parse(text); }
    catch { return alert("AI ส่งรูปแบบผิด"); }

    /* ----- SHOW CHANGE LOG ----- */
    aiReasoningText.innerHTML = `
        <div class="font-bold mb-1">✨ ผลการปรับปรุงโดย AI</div>
        <div class="text-xs mb-2">${result.summary || ""}</div>
        <ul class="list-disc pl-5 space-y-1">
            ${(result.changes||[]).map(c=>`<li>${c}</li>`).join("")}
        </ul>
    `;
    aiReasoningBox.style.display="block";

    /* ----- UPDATE CODE ----- */
    if(result.code){
        editor.setValue(result.code);
    }

    aiPromptInput.value="";
}
</script>

</body>
</html>
