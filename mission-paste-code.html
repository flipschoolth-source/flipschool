<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Code Editor | FlipSchool</title>

    <!-- Config & Database Scripts -->
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        
        .preview-outer-container {
            width: 100%; display: flex; justify-content: center; align-items: flex-start;
            padding: 1.5rem; min-height: 700px; overflow: hidden; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px;
        }

        .preview-frame-wrapper {
            background: #fff; border-radius: 2rem; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 10px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 800px; border-radius: 1rem; border: 4px solid #334155; }
        
        /* Message Box */
        .custom-message-box {
            position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem;
            background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 9999; border-left: 5px solid #0d9488; display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hidden-el { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
        .progress-bar-animated { transition: width 0.5s ease-in-out; }
        
        #monaco-container {
            width: 100%; height: 500px; 
            border: 1px solid #334155; border-radius: 1rem; 
            overflow: hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        /* AI Reasoning Box */
        .ai-reasoning-box {
            background-color: #f0fdfa; /* Teal-50 */
            border-left: 4px solid #0d9488;
            padding: 1rem;
            margin-top: 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #134e4a;
            display: none; /* Hidden initially */
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Empty State Animation */
        .empty-state-icon { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Toast Message -->
    <div id="msgBox" class="custom-message-box">
        <div class="flex items-center gap-3">
            <div id="msgIcon" class="text-xl"></div>
            <div id="msgContent">
                <p id="msgText" class="text-sm font-bold text-slate-700"></p>
            </div>
        </div>
    </div>

    <!-- Save Modal -->
    <div id="saveModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl border border-slate-100 transform transition-all scale-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-teal-50 text-teal-900 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-teal-100 shadow-sm animate-bounce">
                    <span class="text-4xl">💾</span>
                </div>
                <h3 class="text-xl font-bold text-slate-800">ยืนยันการบันทึก</h3>
                
                <!-- Dynamic Context Info -->
                <div id="saveConfirmDetails" class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-left space-y-2">
                    <!-- JS will inject content here -->
                </div>
            </div>
            <div class="space-y-3">
                <button onclick="confirmSave('exit')" class="w-full bg-teal-900 hover:bg-black text-white font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-95 text-sm flex justify-center items-center gap-2">
                    <i class="fas fa-save"></i> บันทึกและกลับห้องเรียน
                </button>
                <button onclick="closeSaveModal()" class="w-full text-slate-400 font-semibold py-2 text-sm hover:text-slate-600">ตรวจสอบอีกครั้ง</button>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0">
                    <span class="text-2xl text-blue-900">🎓</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-bold tracking-tight leading-none">
                        <span class="text-white">Flip</span><span class="text-orange-400">School</span>
                    </span>
                    <span id="appSlogan" class="text-[10px] text-blue-200 font-medium mt-1 tracking-wide">Advanced Editor</span>
                </div>
            </div>
            <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs transition-all flex items-center gap-2 border border-white/10 font-bold">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow container mx-auto px-4 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left Panel: Editor & Tools -->
        <div class="lg:col-span-5 flex flex-col gap-5 h-full">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col gap-4 h-full">
                
                <!-- Metadata Section -->
                <div class="flex flex-col gap-3">
                    
                    <!-- Context Badge: Shows linked classroom info -->
                    <div id="classroomContextArea" class="hidden-el bg-gradient-to-r from-teal-50 to-white border-l-4 border-teal-500 p-3 rounded-r-xl shadow-sm transition-all duration-500">
                        <div class="flex items-center gap-2 mb-1">
                            <i class="fas fa-link text-teal-500 animate-pulse" id="linkIcon"></i>
                            <p id="linkStatus" class="text-[10px] font-bold text-teal-600 uppercase tracking-wider">กำลังเชื่อมโยงห้องเรียน...</p>
                        </div>
                        <div class="flex flex-wrap gap-2 items-center opacity-50 transition-opacity duration-300" id="contextTags">
                            <span class="bg-slate-200 text-slate-500 text-xs px-2 py-0.5 rounded-full font-bold">Waiting for data...</span>
                        </div>
                    </div>

                    <!-- API Key Status -->
                    <div id="apiKeyConfiguredView" class="hidden-el flex justify-between items-center bg-emerald-50 px-3 py-2 rounded-lg border border-emerald-100">
                        <span class="text-[10px] font-bold text-emerald-700 flex items-center gap-2"><i class="fas fa-check-circle"></i> AI พร้อมใช้งาน</span>
                        <button onclick="toggleKeyEdit(true)" class="text-[10px] text-emerald-600 underline">เปลี่ยน Key</button>
                    </div>
                    
                    <div id="apiKeyEditView" class="hidden-el p-3 bg-slate-50 rounded-xl border border-slate-200">
                        <label class="text-[10px] font-bold text-slate-500 block mb-1">Gemini API Key</label>
                        <div class="flex gap-2">
                            <input type="password" id="apiKeyInput" class="w-full bg-white border border-slate-200 rounded-lg px-2 py-1 text-xs outline-none focus:ring-1 focus:ring-teal-500" placeholder="วาง API Key ที่นี่...">
                            <button onclick="saveKeyToDB()" class="bg-slate-800 text-white px-3 py-1 rounded-lg text-xs font-bold whitespace-nowrap">บันทึก</button>
                        </div>
                    </div>

                    <!-- Mission Title -->
                    <input type="text" id="missionTitleInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-2.5 outline-none text-sm font-bold focus:ring-2 focus:ring-teal-500 transition-all" placeholder="📍 ชื่อภารกิจ (เช่น เกมตะลุยอวกาศ)">
                </div>

                <!-- Code Editor Area -->
                <div class="flex-grow flex flex-col gap-2 min-h-[400px]">
                    <div class="flex justify-between items-end">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                            <i class="fas fa-code"></i> Source Code
                        </label>
                        <div class="flex gap-1.5">
                            <!-- Tools -->
                            <button onclick="clearEditor()" class="text-[10px] bg-rose-50 hover:bg-rose-100 text-rose-600 px-2 py-1.5 rounded-lg font-bold transition-all border border-rose-100 flex items-center gap-1" title="ล้างโค้ด">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                            <button onclick="smartPaste()" class="text-[10px] bg-orange-50 hover:bg-orange-100 text-orange-600 px-3 py-1.5 rounded-lg font-bold transition-all border border-orange-100 flex items-center gap-1 shadow-sm active:scale-95" title="วางโค้ดจาก Clipboard">
                                <i class="fas fa-paste"></i> วางโค้ด
                            </button>
                            <button onclick="formatCode()" class="text-[10px] bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-1.5 rounded-lg font-bold transition-all border border-slate-200" title="จัดรูปแบบ">
                                <i class="fas fa-indent"></i> จัดสวย
                            </button>
                            <button onclick="forceRefresh()" class="text-[10px] bg-teal-50 hover:bg-teal-100 text-teal-600 px-3 py-1.5 rounded-lg font-bold transition-all border border-teal-100">
                                <i class="fas fa-play"></i> รัน
                            </button>
                        </div>
                    </div>
                    
                    <div class="relative flex-grow">
                        <!-- Monaco Container -->
                        <div id="monaco-container"></div>
                        
                        <!-- AI Overlay -->
                        <div id="editorOverlay" class="absolute inset-0 bg-slate-900/80 rounded-[1rem] flex flex-col items-center justify-center backdrop-blur-sm z-20 hidden-el transition-all">
                            <div class="bg-white/10 p-4 rounded-full mb-4 relative">
                                <div class="absolute inset-0 bg-teal-500/20 rounded-full animate-ping"></div>
                                <i class="fas fa-magic text-teal-300 text-3xl animate-pulse"></i>
                            </div>
                            <span id="aiStatusText" class="text-white font-bold text-sm tracking-wide">กำลังติดต่อ AI...</span>
                            <div class="w-48 bg-slate-700 h-1.5 rounded-full mt-4 overflow-hidden">
                                <div id="aiProgressBar" class="bg-gradient-to-r from-teal-400 to-emerald-400 h-full w-0 progress-bar-animated rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AI Prompt Section -->
                <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200 relative">
                    <div class="flex gap-2 relative z-10">
                        <input type="text" id="aiPromptInput" class="w-full bg-white border border-slate-200 rounded-xl px-4 py-3 outline-none text-sm font-medium focus:ring-2 focus:ring-teal-500 shadow-sm" placeholder="✨ สั่ง AI ให้แก้โค้ด (เช่น เปลี่ยนพื้นหลัง, เพิ่มเสียง)">
                        <button id="aiModifyBtn" onclick="handleAIModify()" class="bg-teal-600 hover:bg-teal-700 text-white px-4 rounded-xl transition-all shadow-md active:scale-95 flex items-center justify-center">
                            <i class="fas fa-magic text-lg"></i>
                        </button>
                    </div>
                    
                    <!-- AI Reasoning Output -->
                    <div id="aiReasoningBox" class="ai-reasoning-box hidden-el">
                        <div class="flex items-center gap-2 mb-2">
                            <i class="fas fa-clipboard-list"></i> 
                            <span class="font-bold uppercase tracking-wider text-[10px]">AI Change Log</span>
                        </div>
                        <p id="aiReasoningText" class="italic leading-relaxed"></p>
                    </div>
                </div>

            </div>
        </div>

        <!-- Right Panel: Preview (Enhanced) -->
        <div class="lg:col-span-7 flex flex-col gap-4">
            <!-- New Toolbar -->
            <div class="bg-white px-4 py-3 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 justify-between items-center">
                <!-- Branding & Status -->
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-teal-50 rounded-xl flex items-center justify-center text-teal-600 border border-teal-100">
                        <i class="fas fa-file-code text-lg"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-bold text-slate-700 leading-tight">Code Preview</h3>
                        <p class="text-[10px] text-slate-400 font-medium">Interactive Mode</p>
                    </div>
                </div>

                <!-- Device Toggles -->
                <div class="flex gap-1 bg-slate-100 p-1 rounded-lg">
                    <button onclick="changeView('mobile')" class="view-btn w-8 h-8 rounded-md flex items-center justify-center text-slate-500 hover:bg-white hover:shadow-sm transition-all text-xs active-view"><i class="fas fa-mobile-alt"></i></button>
                    <button onclick="changeView('tablet')" class="view-btn w-8 h-8 rounded-md flex items-center justify-center text-slate-500 hover:bg-white hover:shadow-sm transition-all text-xs"><i class="fas fa-tablet-alt"></i></button>
                    <button onclick="changeView('desktop')" class="view-btn w-8 h-8 rounded-md flex items-center justify-center text-slate-500 hover:bg-white hover:shadow-sm transition-all text-xs"><i class="fas fa-desktop"></i></button>
                </div>
                
                <!-- Actions -->
                <div class="flex items-center gap-3">
                    <span id="validationStatus" class="hidden md:flex text-[10px] font-bold text-slate-400 items-center gap-1">
                        <i class="fas fa-circle text-[8px]"></i> พร้อม
                    </span>
                    <button id="saveToCloudBtn" onclick="openSaveModal()" disabled class="bg-slate-200 text-slate-400 cursor-not-allowed px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2">
                        <i class="fas fa-cloud-upload-alt"></i> บันทึก
                    </button>
                </div>
            </div>

            <!-- Preview Frame Container -->
            <div class="preview-outer-container rounded-[2.5rem] border border-slate-300 shadow-inner relative">
                <div id="previewWrapper" class="preview-frame-wrapper device-mobile relative bg-slate-100">
                    
                    <!-- Placeholder State (Shows when empty) -->
                    <div id="previewPlaceholder" class="absolute inset-0 flex flex-col items-center justify-center bg-white z-10 transition-opacity duration-300">
                        <div class="w-24 h-24 bg-slate-50 rounded-[2rem] shadow-sm flex items-center justify-center mb-6 border border-slate-100 empty-state-icon">
                            <i class="fas fa-laptop-code text-5xl text-teal-200"></i>
                        </div>
                        <h4 class="font-bold text-slate-700 text-lg">รอรับโค้ด...</h4>
                        <p class="text-xs text-slate-400 mt-2 font-medium">พิมพ์โค้ดฝั่งซ้าย หรือกดวางโค้ดเพื่อแสดงผล</p>
                        <div class="mt-6 flex gap-2">
                             <span class="px-2 py-1 bg-slate-100 rounded text-[10px] text-slate-400 border border-slate-200">HTML5</span>
                             <span class="px-2 py-1 bg-slate-100 rounded text-[10px] text-slate-400 border border-slate-200">Tailwind</span>
                             <span class="px-2 py-1 bg-slate-100 rounded text-[10px] text-slate-400 border border-slate-200">JS</span>
                        </div>
                    </div>

                    <!-- Actual Iframe -->
                    <iframe id="missionFrame" class="w-full h-full bg-white border-none opacity-0 transition-opacity duration-500" sandbox="allow-scripts allow-forms allow-modals allow-same-origin allow-popups" title="Mission Preview"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script>
        const MODEL_ID = "gemini-2.5-flash-preview-09-2025";
        
        let editor = null;
        let targetCid = null, editingMid = null, currentUserId = null, originalTeacherId = null;
        let dbSubject = "ทั่วไป", dbGrade = "ทั่วไป"; 
        let debounceTimer = null;

        // Config Monaco Loader
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');
            editingMid = params.get('mid');

            // Set APP_SLOGAN
            if (typeof APP_SLOGAN !== 'undefined') {
                const sloganEl = document.getElementById('appSlogan');
                if (sloganEl) sloganEl.innerText = APP_SLOGAN;
            }

            // 1. Show waiting state ASAP
            if (targetCid) {
                document.getElementById('classroomContextArea').classList.remove('hidden-el');
            }

            // 2. Load Editor
            require(['vs/editor/editor.main'], function() { initEditor(); });

            // 3. Database & Auth Init (Retry loop ensures Supabase is loaded)
            const checkDB = setInterval(async () => {
                if(window.sysDB && typeof window.sysDB.auth !== 'undefined') {
                    clearInterval(checkDB);
                    
                    try {
                        const { data: { session } } = await window.sysDB.auth.getSession();
                        if (!session) { window.location.href = 'teacher-login.html'; return; }
                        currentUserId = session.user.id;

                        // Load data sequentially to prevent race conditions
                        await loadKeyFromDB();
                        if (targetCid) await fetchClassroomContext(); 
                        if (editingMid) await loadExistingMission();
                        if (!editingMid) loadLocalDraft();

                    } catch (err) {
                        console.error("Auth Init Error:", err);
                        showMessage("❌ การเชื่อมต่อผิดพลาด กรุณารีเฟรช", true);
                    }
                }
            }, 500);
        });

        // --- Context Fetcher ---
        async function fetchClassroomContext() {
            try {
                // Query table: classrooms
                const { data, error } = await window.sysDB
                    .from('classrooms')
                    .select('subject_name, room_name')
                    .eq('classroom_id', targetCid)
                    .single();

                if (error) throw error;

                if (data) {
                    dbSubject = data.subject_name || "ทั่วไป";
                    dbGrade = data.room_name || "ทั่วไป";

                    // Update UI to show connection success
                    document.getElementById('linkIcon').className = "fas fa-check-circle text-teal-500";
                    document.getElementById('linkIcon').classList.remove('animate-pulse');
                    document.getElementById('linkStatus').innerText = "เชื่อมโยงห้องเรียนแล้ว";
                    
                    const tagsContainer = document.getElementById('contextTags');
                    tagsContainer.innerHTML = `
                        <span class="bg-teal-100 text-teal-800 text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-sm">
                            <i class="fas fa-book"></i> ${dbSubject}
                        </span>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-sm">
                            <i class="fas fa-layer-group"></i> ${dbGrade}
                        </span>
                    `;
                    tagsContainer.classList.remove('opacity-50');
                }
            } catch (err) { 
                console.error("Context Error:", err);
                document.getElementById('linkStatus').innerText = "ไม่พบข้อมูลห้องเรียน";
                document.getElementById('linkStatus').className = "text-[10px] font-bold text-orange-500 uppercase tracking-wider";
                document.getElementById('linkIcon').className = "fas fa-exclamation-triangle text-orange-500";
                document.getElementById('contextTags').innerHTML = `<span class="text-xs text-slate-400">ระบบจะใช้วิชา "ทั่วไป" แทน</span>`;
            }
        }

        // --- Smart Paste Logic ---
        async function smartPaste() {
            if (!editor) return;
            editor.focus();

            try {
                // Try direct API first
                const text = await navigator.clipboard.readText();
                if (text) {
                    executePaste(text);
                    showMessage("📋 วางโค้ดสำเร็จ");
                }
            } catch (err) {
                // Fallback: Show User Guide & Focus Editor
                showMessage("⚠️ Browser บล็อกการเข้าถึง Clipboard", true);
                
                // Show Custom Toast with Instructions
                const msgBox = document.getElementById("msgBox");
                const content = document.getElementById("msgContent");
                
                content.innerHTML = `
                    <div class="flex flex-col">
                        <p class="text-sm font-bold text-slate-700">กรุณากดปุ่ม <span class="bg-slate-200 px-1 rounded border border-slate-300 font-mono">Ctrl</span> + <span class="bg-slate-200 px-1 rounded border border-slate-300 font-mono">V</span></p>
                        <p class="text-[10px] text-slate-500">เคอร์เซอร์อยู่ที่ตำแหน่งพร้อมวางแล้วครับ</p>
                    </div>
                `;
                document.getElementById("msgIcon").innerHTML = '<i class="fas fa-keyboard text-orange-500"></i>';
                msgBox.style.borderLeftColor = '#f97316';
                msgBox.style.display = 'block';
                
                setTimeout(() => msgBox.style.display = 'none', 5000);
            }
        }

        function executePaste(text) {
            const selection = editor.getSelection();
            const range = new monaco.Range(selection.startLineNumber, selection.startColumn, selection.endLineNumber, selection.endColumn);
            editor.executeEdits("paste-source", [{ range: range, text: text, forceMoveMarkers: true }]);
            // Auto Format after paste
            setTimeout(formatCode, 100);
        }

        function clearEditor() {
            if(confirm("ต้องการล้างโค้ดทั้งหมดใช่ไหมครับ?")) {
                editor.setValue("");
                refreshPreview();
            }
        }

        function initEditor() {
            const defaultCode = "";

            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: defaultCode,
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14,
                fontFamily: "'JetBrains Mono', 'Courier New', monospace",
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                padding: { top: 16, bottom: 16 }
            });

            editor.onDidChangeModelContent(() => {
                clearTimeout(debounceTimer);
                document.getElementById('validationStatus').innerHTML = '<i class="fas fa-spinner fa-spin text-slate-400"></i> <span class="text-slate-400">กำลังประมวลผล...</span>';
                localStorage.setItem('mission_code_draft', editor.getValue());
                debounceTimer = setTimeout(() => { refreshPreview(); }, 1500);
            });
            
            // Trigger first preview
            refreshPreview();
        }

        // Resize handler
        window.onresize = function (){
            if (editor) editor.layout();
        };

        function formatCode() { if(editor) editor.getAction('editor.action.formatDocument').run(); }
        function forceRefresh() { refreshPreview(); showMessage("🔄 รีเฟรชพรีวิวแล้ว"); }

        function validateCodeStandard(code) {
            if (!code || code.trim().length < 10) return { valid: false, msg: "รอรับโค้ด..." };
            // Remove comments to prevent cheating validation
            const cleanCode = code.replace(/<!--[\s\S]*?-->/g, "").replace(/\/\/.*|\/\*[\s\S]*?\*\//g, "");
            
            const hasBack = /window\.parent\.history\.back\(\)|history\.back\(\)/.test(cleanCode);
            const hasPostMessage = /window\.parent\.postMessage\s*\(\s*\{/.test(cleanCode);
            const hasSaveType = /['"]SAVE_RESULT['"]/.test(cleanCode);

            if (!hasBack) return { valid: false, msg: "❌ ขาดปุ่มย้อนกลับ (history.back)" };
            if (!hasPostMessage || !hasSaveType) return { valid: false, msg: "❌ ขาดระบบส่งคะแนน (SAVE_RESULT)" };
            return { valid: true, msg: "✅ โค้ดถูกต้องตามมาตรฐาน" };
        }

        function refreshPreview() {
            if(!editor) return;
            const code = editor.getValue();
            const iframe = document.getElementById('missionFrame');
            const placeholder = document.getElementById('previewPlaceholder');
            const statusEl = document.getElementById('validationStatus');
            const saveBtn = document.getElementById('saveToCloudBtn');

            // Handle Empty State
            if (!code || code.trim().length === 0) {
                placeholder.classList.remove('opacity-0', 'pointer-events-none');
                iframe.classList.add('opacity-0');
                statusEl.innerHTML = `<span class="text-[10px] font-bold text-slate-400 flex items-center gap-1"><i class="fas fa-circle text-[8px]"></i> ว่างเปล่า</span>`;
                saveBtn.disabled = true;
                saveBtn.className = "bg-slate-200 text-slate-400 cursor-not-allowed px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2";
                return;
            }

            // Show Content
            placeholder.classList.add('opacity-0', 'pointer-events-none');
            iframe.classList.remove('opacity-0');
            
            iframe.srcdoc = code;
            
            const check = validateCodeStandard(code);
            if (check.valid) {
                statusEl.innerHTML = `<span class="text-emerald-600 font-bold text-[10px] bg-emerald-50 px-2 py-1 rounded-md border border-emerald-100 flex items-center gap-1"><i class="fas fa-check"></i> ${check.msg}</span>`;
                saveBtn.disabled = false;
                saveBtn.className = "bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md transition-all flex items-center gap-2 active:scale-95";
            } else {
                statusEl.innerHTML = `<span class="text-rose-600 font-bold text-[10px] bg-rose-50 px-2 py-1 rounded-md border border-rose-100 flex items-center gap-1"><i class="fas fa-times-circle"></i> ${check.msg}</span>`;
                saveBtn.disabled = true;
                saveBtn.className = "bg-slate-200 text-slate-400 cursor-not-allowed px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2";
            }
        }

        // --- Save Logic ---
        function openSaveModal() {
            // Inject context details into modal
            const detailBox = document.getElementById('saveConfirmDetails');
            detailBox.innerHTML = `
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500">ภารกิจ:</span> 
                    <span class="font-bold text-slate-800 truncate max-w-[150px]">${document.getElementById("missionTitleInput").value || "(ยังไม่ตั้งชื่อ)"}</span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2 pt-2">
                    <span class="text-slate-500">วิชา:</span> 
                    <span class="font-bold text-teal-600">${targetCid ? dbSubject : "ไม่ระบุ (ทั่วไป)"}</span>
                </div>
                <div class="flex justify-between pt-2">
                    <span class="text-slate-500">ระดับชั้น:</span> 
                    <span class="font-bold text-blue-600">${targetCid ? dbGrade : "ไม่ระบุ (ทั่วไป)"}</span>
                </div>
            `;
            document.getElementById('saveModal').classList.remove('hidden');
        }
        function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }

        async function confirmSave(mode) {
            const title = document.getElementById("missionTitleInput").value.trim();
            const code = editor.getValue();
            
            if(!title) {
                closeSaveModal();
                document.getElementById("missionTitleInput").focus();
                return showMessage("⚠️ กรุณาตั้งชื่อภารกิจก่อนบันทึก", true);
            }

            try {
                const missionData = {
                    title: title,
                    description: "สร้างด้วย FlipCode Editor",
                    subject_group: targetCid ? dbSubject : "ทั่วไป",
                    grade_level: targetCid ? dbGrade : "ทั่วไป",
                    mission_type: "html_custom",
                    content_data: { html: code },
                    is_public: true,
                    updated_at: new Date().toISOString()
                };

                let mid = editingMid;
                // Check Update vs Insert logic
                if (editingMid && currentUserId === originalTeacherId) {
                    await window.sysDB.from('missions').update(missionData).eq('mission_id', editingMid);
                } else {
                    missionData.created_by = currentUserId;
                    const { data, error } = await window.sysDB.from('missions').insert([missionData]).select();
                    if(error) throw error;
                    mid = data[0].mission_id;
                }

                // Link to Classroom if accessed via CID
                if(targetCid) {
                    await window.sysDB.from('classroom_missions').upsert({
                        classroom_id: targetCid, mission_id: mid, assigned_at: new Date().toISOString()
                    }, { onConflict: 'classroom_id, mission_id' });
                }

                localStorage.removeItem('mission_code_draft');
                if (mode === 'exit') window.location.href = targetCid ? `classroom-detail.html?id=${targetCid}` : 'mission-library.html';

            } catch (err) {
                showMessage("❌ บันทึกไม่สำเร็จ: " + err.message, true);
            }
            closeSaveModal();
        }

        // --- AI & Helpers ---
        async function handleAIModify() {
            const currentCode = editor.getValue();
            const prompt = document.getElementById('aiPromptInput').value.trim();
            const key = document.getElementById('apiKeyInput').value.trim();
            
            if (!key) { toggleKeyEdit(true); return showMessage("🔑 กรุณากรอก API Key ก่อนครับ", true); }
            if (!prompt) return showMessage("⚠️ กรุณาพิมพ์คำสั่งแก้ไข", true);

            const overlay = document.getElementById('editorOverlay');
            const pBar = document.getElementById('aiProgressBar');
            const statusText = document.getElementById('aiStatusText');
            
            // Hide previous log
            document.getElementById('aiReasoningBox').classList.add('hidden-el');
            
            overlay.classList.remove('hidden-el');
            pBar.style.width = "10%";
            statusText.innerText = "🤖 AI กำลังคิด...";

            try {
                // Simulate processing steps
                setTimeout(() => { pBar.style.width = "40%"; statusText.innerText = "🧠 กำลังวางแผนโครงสร้าง..."; }, 1000);
                setTimeout(() => { pBar.style.width = "60%"; statusText.innerText = "🎨 กำลังเขียนโค้ด..."; }, 2000);
                
                // Inject Context into Prompt
                const contextStr = targetCid ? `Context: For Subject "${dbSubject}", Grade Level "${dbGrade}".` : "";

                const sysPrompt = `You are an expert HTML5 Game Developer.
                User Request: "${prompt}".
                ${contextStr}
                
                **TASK:**
                1. Analyze the input code and the user's request.
                2. Modify the code to fulfill the request while strictly preserving 'window.parent.postMessage' logic and 'history.back()' button.
                3. Use Tailwind CSS for styling.
                4. Return a JSON object containing a summary of changes and the complete HTML code.

                **OUTPUT FORMAT (Strict JSON):**
                {
                    "change_log": "Summarize what you changed in Thai (Use Bullet points)",
                    "html_code": "<!DOCTYPE html>..."
                }

                Input Code: ${currentCode}`;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${key}`;
                
                const requestBody = {
                    contents: [{ parts: [{ text: sysPrompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                const res = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(requestBody) 
                });
                
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    console.error("AI API Error:", errData);
                    throw new Error(errData.error?.message || `AI Request Failed (${res.status})`);
                }
                
                pBar.style.width = "90%";
                statusText.innerText = "✨ กำลังประมวลผลคำตอบ...";

                const data = await res.json();
                let jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (jsonText) {
                    // Parse JSON response
                    const result = JSON.parse(jsonText);

                    // Display Change Log
                    if (result.change_log) {
                        const logBox = document.getElementById('aiReasoningBox');
                        document.getElementById('aiReasoningText').innerText = result.change_log;
                        logBox.classList.remove('hidden-el');
                    }

                    // Update Editor
                    if (result.html_code) {
                        editor.setValue(result.html_code); 
                        formatCode();
                    }

                    document.getElementById('aiPromptInput').value = "";
                    showMessage("✨ AI ทำงานเสร็จสิ้น!", false);
                } else throw new Error("No data from AI");

            } catch (e) { showMessage("❌ " + e.message, true); } 
            finally { 
                pBar.style.width = "100%"; 
                setTimeout(() => { overlay.classList.add('hidden-el'); pBar.style.width = "0%"; }, 800); 
            }
        }

        async function loadKeyFromDB() {
            const { data } = await window.sysDB.from('teachers').select('gemini_api_key').eq('teacher_id', currentUserId).single();
            if(data?.gemini_api_key) {
                document.getElementById("apiKeyInput").value = data.gemini_api_key;
                document.getElementById("apiKeyConfiguredView").classList.remove("hidden-el");
                toggleKeyEdit(false);
            } else { toggleKeyEdit(true); }
        }

        async function saveKeyToDB() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if(!key) return;
            await window.sysDB.from('teachers').update({ gemini_api_key: key }).eq('teacher_id', currentUserId);
            loadKeyFromDB(); showMessage("✅ บันทึก Key แล้ว");
        }

        async function loadExistingMission() {
            const { data } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
            if (data) {
                originalTeacherId = data.created_by;
                document.getElementById("missionTitleInput").value = data.title;
                if(editor) editor.setValue(data.content_data?.html || "");
            }
        }

        function loadLocalDraft() {
            const draft = localStorage.getItem('mission_code_draft');
            if(draft && editor) { editor.setValue(draft); showMessage("📂 โหลดโค้ดเดิมคืนมาแล้ว"); }
        }

        function showMessage(text, isError = false) { 
            const msgBox = document.getElementById("msgBox");
            document.getElementById("msgContent").innerHTML = `<p id="msgText" class="text-sm font-bold text-slate-700">${text}</p>`;
            document.getElementById("msgIcon").innerHTML = isError ? '⚠️' : '✅';
            msgBox.style.borderLeftColor = isError ? '#ef4444' : '#0d9488';
            msgBox.style.display = 'block';
            setTimeout(() => msgBox.style.display = 'none', 4000); 
        }

        function toggleKeyEdit(show) {
            if(show) { document.getElementById('apiKeyEditView').classList.remove('hidden-el'); document.getElementById('apiKeyConfiguredView').classList.add('hidden-el'); }
            else { document.getElementById('apiKeyEditView').classList.add('hidden-el'); document.getElementById('apiKeyConfiguredView').classList.remove('hidden-el'); }
        }

        function changeView(d) { 
            document.getElementById('previewWrapper').className = `preview-frame-wrapper shadow-2xl device-${d}`; 
            
            // Toggle active button style
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('bg-slate-200', 'text-teal-700'));
            event.currentTarget.classList.add('bg-slate-200', 'text-teal-700');
        }
    </script>
</body>
