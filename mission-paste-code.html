<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pro Code Editor | FlipSchool</title>

    <!-- Config & Database Scripts -->
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Monaco Editor Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        
        .preview-outer-container {
            width: 100%; display: flex; justify-content: center; align-items: flex-start;
            padding: 1.5rem; min-height: 700px; overflow: hidden; background-image: radial-gradient(#cbd5e1 1px, transparent 1px); background-size: 20px 20px;
        }

        .preview-frame-wrapper {
            background: #fff; border-radius: 2rem; overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 10px solid #1e293b; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 800px; border-radius: 1rem; border: 4px solid #334155; }
        
        /* Message Box */
        .custom-message-box {
            position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem;
            background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 9999; border-left: 5px solid #0d9488; display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hidden-el { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
        .progress-bar-animated { transition: width 0.5s ease-in-out; }
        
        #monaco-container {
            width: 100%; height: 500px; 
            border: 1px solid #334155; border-radius: 1rem; 
            overflow: hidden; box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
        }

        /* AI Reasoning Box */
        .ai-reasoning-box {
            background-color: #f8fafc; /* Slate-50 */
            border: 1px solid #e2e8f0;
            border-left: 4px solid #8b5cf6; /* Purple for AI */
            padding: 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #334155;
            display: none; /* Hidden initially */
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Empty State Animation */
        .empty-state-icon { animation: float 3s ease-in-out infinite; }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Toast Message -->
    <div id="msgBox" class="custom-message-box">
        <div class="flex items-center gap-3">
            <div id="msgIcon" class="text-xl"></div>
            <div id="msgContent">
                <p id="msgText" class="text-sm font-bold text-slate-700"></p>
            </div>
        </div>
    </div>

    <!-- Save Modal -->
    <div id="saveModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">

            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-teal-50 text-teal-900 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-teal-100 shadow-sm animate-bounce">
                    <span class="text-4xl">💾</span>
                </div>
                <h3 class="text-xl font-bold text-slate-800">ยืนยันการบันทึก</h3>
                
                <!-- Dynamic Context Info -->
                <div id="saveConfirmDetails" class="mt-4 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs text-left space-y-2">
                    <!-- JS will inject content here -->
                </div>
            </div>
            <div class="space-y-3">
                <button onclick="confirmSave('exit')" class="w-full bg-teal-900 hover:bg-black text-white font-bold py-3.5 rounded-xl transition-all shadow-lg active:scale-95 text-sm flex justify-center items-center gap-2">
                    <i class="fas fa-save"></i> บันทึกและกลับห้องเรียน
                </button>
                <button onclick="closeSaveModal()" class="w-full text-slate-400 font-semibold py-2 text-sm hover:text-slate-600">ตรวจสอบอีกครั้ง</button>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0">

                </div>
                <div class="flex flex-col">

    </nav>

        <div class="lg:col-span-5 flex flex-col gap-5 h-full">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200 flex flex-col gap-4 h-full">

    <script>
        const MODEL_ID = "gemini-1.5-flash"; // เปลี่ยนชื่อโมเดลเป็นเวอร์ชัน public (หรือใช้ gemini-2.0-flash ก็ได้)
        
        let editor = null;
        let targetCid = null, editingMid = null, currentUserId = null, originalTeacherId = null;
        let dbSubject = "อื่นๆ", dbGrade = ""; 
        let debounceTimer = null;

        // Config Monaco Loader
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' }});

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');
            editingMid = params.get('mid');

            // Set APP_SLOGAN
            if (typeof APP_SLOGAN !== 'undefined') {
                const sloganEl = document.getElementById('appSlogan');
                if (sloganEl) sloganEl.innerText = APP_SLOGAN;
            }

            // Show waiting state ASAP
            if (targetCid) {
                document.getElementById('classroomContextArea').classList.remove('hidden-el');
            }

            // Load Editor
            require(['vs/editor/editor.main'], function() { initEditor(); });

            // Database & Auth Init with Offline Fallback
            let dbCheckCount = 0;
            const dbClient = window.sysDB || (typeof _supabase !== 'undefined' ? _supabase : null);

            const checkDB = setInterval(async () => {
                dbCheckCount++;
                
                if(dbClient && typeof dbClient.auth !== 'undefined') {
                    clearInterval(checkDB);
                    window.sysDB = dbClient; // Map globally
                    
                    try {
                        const { data: { session } } = await window.sysDB.auth.getSession();
                        if (!session) { window.location.href = 'teacher-login.html'; return; }
                        currentUserId = session.user.id;

                        // Load data
                        await loadKeyFromDB();
                        if (targetCid) await fetchClassroomContext(); 
                        if (editingMid) await loadExistingMission();
                        if (!editingMid) loadLocalDraft();

                    } catch (err) {
                        console.error("Auth Init Error:", err);
                        showMessage("❌ การเชื่อมต่อฐานข้อมูลผิดพลาด ระบบอาจทำงานแบบออฟไลน์", true);
                        toggleKeyEdit(true); // Fallback Show API Key Box
                    }
                } 
                // Fallback to local mode if Supabase isn't connected after 2.5 seconds
                else if (dbCheckCount > 5) {
                    clearInterval(checkDB);
                    console.warn("Supabase not detected. Running in offline/local mode.");
                    toggleKeyEdit(true); // Always show API Key box if offline
                    if (!editingMid) loadLocalDraft();
                }
            }, 500);
        });

        // --- Context Fetcher ---
        async function fetchClassroomContext() {
            try {
                const { data, error } = await window.sysDB
                    .from('classrooms')
                    .select('subject_name, room_name')
                    .eq('classroom_id', targetCid)
                    .single();

                if (error) throw error;

                if (data) {
                    dbSubject = data.subject_name || "อื่นๆ";
                    dbGrade = data.room_name || "";

                    const subjInput = document.getElementById('missionSubjectInput');
                    const gradeInput = document.getElementById('missionGradeInput');
                    if (!subjInput.value || subjInput.value === 'อื่นๆ') subjInput.value = dbSubject;
                    if (!gradeInput.value) gradeInput.value = dbGrade;

                    document.getElementById('linkIcon').className = "fas fa-check-circle text-teal-500";
                    document.getElementById('linkIcon').classList.remove('animate-pulse');
                    document.getElementById('linkStatus').innerText = "เชื่อมโยงห้องเรียนแล้ว";
                    
                    const tagsContainer = document.getElementById('contextTags');
                    tagsContainer.innerHTML = `
                        <span class="bg-teal-100 text-teal-800 text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-sm">
                            <i class="fas fa-book"></i> ${dbSubject}
                        </span>
                        <span class="bg-blue-100 text-blue-800 text-xs px-2 py-0.5 rounded-full font-bold flex items-center gap-1 shadow-sm">
                            <i class="fas fa-layer-group"></i> ${dbGrade || "ไม่ระบุชั้น"}
                        </span>
                    `;
                    tagsContainer.classList.remove('opacity-50');
                }
            } catch (err) { 
                console.error("Context Error:", err);
                document.getElementById('linkStatus').innerText = "ไม่พบข้อมูลห้องเรียน";
                document.getElementById('linkStatus').className = "text-[10px] font-bold text-orange-500 uppercase tracking-wider";
                document.getElementById('linkIcon').className = "fas fa-exclamation-triangle text-orange-500";
                document.getElementById('contextTags').innerHTML = `<span class="text-xs text-slate-400">ระบุข้อมูลที่ฟอร์มด้านล่างได้เลยครับ</span>`;
            }
        }

        // --- Copy Code Logic ---
        function copyCode() {
            if (!editor) return;
            const code = editor.getValue();
            if (!code || code.trim() === "") {
                return showMessage("⚠️ ไม่มีโค้ดให้คัดลอก", true);
            }
            navigator.clipboard.writeText(code).then(() => {
                showMessage("📋 คัดลอกโค้ดสำเร็จ!");
            }).catch(err => {
                showMessage("❌ คัดลอกไม่สำเร็จ Browser ไม่รองรับ", true);
            });
        }

        // --- Smart Paste Logic ---
        async function smartPaste() {
            if (!editor) return;
            editor.focus();

            try {
                const text = await navigator.clipboard.readText();
                if (text) {
                    executePaste(text);
                    showMessage("📋 วางโค้ดสำเร็จ");
                }
            } catch (err) {
                showMessage("⚠️ Browser บล็อกการเข้าถึง Clipboard", true);
                
                const msgBox = document.getElementById("msgBox");
                const content = document.getElementById("msgContent");
                
                content.innerHTML = `
                    <div class="flex flex-col">
                        <p class="text-sm font-bold text-slate-700">กรุณากดปุ่ม <span class="bg-slate-200 px-1 rounded border border-slate-300 font-mono">Ctrl</span> + <span class="bg-slate-200 px-1 rounded border border-slate-300 font-mono">V</span></p>
                        <p class="text-[10px] text-slate-500">เคอร์เซอร์อยู่ที่ตำแหน่งพร้อมวางแล้วครับ</p>
                    </div>
                `;
                document.getElementById("msgIcon").innerHTML = '<i class="fas fa-keyboard text-orange-500"></i>';
                msgBox.style.borderLeftColor = '#f97316';
                msgBox.style.display = 'block';
                
                setTimeout(() => msgBox.style.display = 'none', 5000);
            }
        }

        function executePaste(text) {
            const selection = editor.getSelection();
            const range = new monaco.Range(selection.startLineNumber, selection.startColumn, selection.endLineNumber, selection.endColumn);
            editor.executeEdits("paste-source", [{ range: range, text: text, forceMoveMarkers: true }]);
            setTimeout(formatCode, 100);
        }

        function clearEditor() {
            if(confirm("ต้องการล้างโค้ดทั้งหมดใช่ไหมครับ?")) {
                editor.setValue("");
                refreshPreview();
            }
        }

        function initEditor() {
            const defaultCode = "";

            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: defaultCode,
                language: 'html',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14,
                fontFamily: "'JetBrains Mono', 'Courier New', monospace",
                lineNumbers: 'on',
                scrollBeyondLastLine: false,
                padding: { top: 16, bottom: 16 }
            });

            editor.onDidChangeModelContent(() => {
                clearTimeout(debounceTimer);
                document.getElementById('validationStatus').innerHTML = '<i class="fas fa-spinner fa-spin text-slate-400"></i> <span class="text-slate-400">กำลังประมวลผล...</span>';
                localStorage.setItem('mission_code_draft', editor.getValue());
                debounceTimer = setTimeout(() => { refreshPreview(); }, 1500);
            });
            
            refreshPreview();
        }

        window.onresize = function (){
            if (editor) editor.layout();
        };

        function formatCode() { if(editor) editor.getAction('editor.action.formatDocument').run(); }
        function forceRefresh() { refreshPreview(); showMessage("🔄 รีเฟรชพรีวิวแล้ว"); }

        function validateCodeStandard(code) {
            if (!code || code.trim().length < 10) return { valid: false, msg: "รอรับโค้ด..." };
            const cleanCode = code.replace(/<!--[\s\S]*?-->/g, "").replace(/\/\/.*|\/\*[\s\S]*?\*\//g, "");
            
            const hasBack = /window\.parent\.history\.back\(\)|history\.back\(\)/.test(cleanCode);
            const hasPostMessage = /window\.parent\.postMessage\s*\(\s*\{/.test(cleanCode);
            const hasSaveType = /['"]SAVE_RESULT['"]/.test(cleanCode);

            if (!hasBack) return { valid: false, msg: "❌ ขาดปุ่มย้อนกลับ (history.back)" };
            if (!hasPostMessage || !hasSaveType) return { valid: false, msg: "❌ ขาดระบบส่งคะแนน (SAVE_RESULT)" };
            return { valid: true, msg: "✅ โค้ดถูกต้องตามมาตรฐาน" };
        }

        // ==========================================
        // Live Preview
        // ==========================================
        function refreshPreview() {
            if(!editor) return;
            const code = editor.getValue();
            const iframe = document.getElementById('missionFrame');
            const placeholder = document.getElementById('previewPlaceholder');
            const statusEl = document.getElementById('validationStatus');
            const saveBtn = document.getElementById('saveToCloudBtn');

            if (!code || code.trim().length === 0) {
                placeholder.classList.remove('opacity-0', 'pointer-events-none');
                iframe.classList.add('opacity-0');
                statusEl.innerHTML = `<span class="text-[10px] font-bold text-slate-400 flex items-center gap-1"><i class="fas fa-circle text-[8px]"></i> ว่างเปล่า</span>`;
                saveBtn.disabled = true;
                saveBtn.className = "bg-slate-200 text-slate-400 cursor-not-allowed px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2";
                return;
            }

            placeholder.classList.add('opacity-0', 'pointer-events-none');
            iframe.classList.remove('opacity-0');
            
            const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(code);
            iframeDoc.close();
            
            const check = validateCodeStandard(code);
            if (check.valid) {
                statusEl.innerHTML = `<span class="text-emerald-600 font-bold text-[10px] bg-emerald-50 px-2 py-1 rounded-md border border-emerald-100 flex items-center gap-1"><i class="fas fa-check"></i> ${check.msg}</span>`;
                saveBtn.disabled = false;
                saveBtn.className = "bg-teal-600 hover:bg-teal-700 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-md transition-all flex items-center gap-2 active:scale-95";
            } else {
                statusEl.innerHTML = `<span class="text-rose-600 font-bold text-[10px] bg-rose-50 px-2 py-1 rounded-md border border-rose-100 flex items-center gap-1"><i class="fas fa-times-circle"></i> ${check.msg}</span>`;
                saveBtn.disabled = true;
                saveBtn.className = "bg-slate-200 text-slate-400 cursor-not-allowed px-5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2";
            }
        }

        // --- Save Logic ---
        function openSaveModal() {
            const title = document.getElementById("missionTitleInput").value.trim() || "(ยังไม่ตั้งชื่อ)";
            const subject = document.getElementById("missionSubjectInput").value.trim() || "อื่นๆ";
            const grade = document.getElementById("missionGradeInput").value.trim() || "-";

            const detailBox = document.getElementById('saveConfirmDetails');
            detailBox.innerHTML = `
                <div class="flex justify-between border-b border-slate-200 pb-2">
                    <span class="text-slate-500">ภารกิจ:</span> 
                    <span class="font-bold text-slate-800 truncate max-w-[150px]">${title}</span>
                </div>
                <div class="flex justify-between border-b border-slate-200 pb-2 pt-2">
                    <span class="text-slate-500">วิชา:</span> 
                    <span class="font-bold text-teal-600">${subject}</span>
                </div>
                <div class="flex justify-between pt-2">
                    <span class="text-slate-500">ระดับชั้น:</span> 
                    <span class="font-bold text-blue-600">${grade}</span>
                </div>
            `;
            document.getElementById('saveModal').classList.remove('hidden');
        }

        function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }

        async function confirmSave(mode) {
            const title = document.getElementById("missionTitleInput").value.trim();
            const desc = document.getElementById("missionDescInput").value.trim();
            const subject = document.getElementById("missionSubjectInput").value.trim() || "อื่นๆ";
            const grade = document.getElementById("missionGradeInput").value.trim() || "";
            const code = editor.getValue();
            
            if(!title) {
                closeSaveModal();
                document.getElementById("missionTitleInput").focus();
                return showMessage("⚠️ กรุณาตั้งชื่อภารกิจก่อนบันทึก", true);
            }

            try {
                const missionData = {
                    title: title,
                    description: desc,
                    subject_group: subject,
                    grade_level: grade,
                    mission_type: "html_custom",
                    content_data: { html: code },
                    reward_points: 10,   
                    can_replay: true,    
                    is_public: true,     
                    updated_at: new Date().toISOString()
                };

                let mid = editingMid;
                
                if (window.sysDB) {
                    if (editingMid && currentUserId === originalTeacherId) {
                        await window.sysDB.from('missions').update(missionData).eq('mission_id', editingMid);
                    } else {
                        missionData.created_by = currentUserId;
                        const { data, error } = await window.sysDB.from('missions').insert([missionData]).select();
                        if(error) throw error;
                        mid = data[0].mission_id;
                    }

                    if(targetCid) {
                        await window.sysDB.from('classroom_missions').upsert({
                            classroom_id: targetCid, mission_id: mid, assigned_at: new Date().toISOString()
                        }, { onConflict: 'classroom_id, mission_id' });
                    }
                }

                localStorage.removeItem('mission_code_draft');
                if (mode === 'exit') window.location.href = targetCid ? `classroom-detail.html?id=${targetCid}` : 'mission-library.html';

            } catch (err) {
                showMessage("❌ บันทึกไม่สำเร็จ: " + err.message, true);
            }
            closeSaveModal();
        }

        // --- AI API Key Visibility ---
        function toggleApiKeyVisibility() {
            const input = document.getElementById('apiKeyInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // --- AI Modifications ---
        async function handleAIModify() {
            const currentCode = editor.getValue();
            const prompt = document.getElementById('aiPromptInput').value.trim();
            const key = document.getElementById('apiKeyInput').value.trim();
            
            if (!key) { toggleKeyEdit(true); return showMessage("🔑 กรุณากรอก API Key ก่อนครับ", true); }
            if (!prompt) return showMessage("⚠️ กรุณาพิมพ์คำสั่งแก้ไข", true);

            const overlay = document.getElementById('editorOverlay');
            const pBar = document.getElementById('aiProgressBar');
            const statusText = document.getElementById('aiStatusText');
            
            document.getElementById('aiReasoningBox').classList.add('hidden-el');
            
            overlay.classList.remove('hidden-el');
            pBar.style.width = "10%";
            statusText.innerText = "🤖 AI กำลังคิด...";

            try {
                setTimeout(() => { pBar.style.width = "40%"; statusText.innerText = "🧠 กำลังวางแผนโครงสร้าง..."; }, 1000);
                setTimeout(() => { pBar.style.width = "60%"; statusText.innerText = "🎨 กำลังเขียนโค้ด..."; }, 2000);
                
                const currentSubject = document.getElementById("missionSubjectInput").value.trim() || dbSubject;
                const currentGrade = document.getElementById("missionGradeInput").value.trim() || dbGrade;
                const contextStr = targetCid ? `Context: For Subject "${currentSubject}", Grade Level "${currentGrade}".` : "";

                const sysPrompt = "You are an expert HTML5 Game Developer.\n" +
                                  "User Request: \"" + prompt + "\".\n" +
                                  contextStr + "\n" +
                                  "**TASK:**\n" +
                                  "1. Analyze the input code and the user's request.\n" +
                                  "2. Modify the code to fulfill the request while strictly preserving 'window.parent.postMessage' logic and 'history.back()' button.\n" +
                                  "3. Use Tailwind CSS for styling.\n" +
                                  "4. Return a JSON object containing a summary of changes, a short mission description, and the complete HTML code.\n\n" +
                                  "**OUTPUT FORMAT (Strict JSON):**\n" +
                                  "{\n" +
                                  "  \"change_log\": \"คำอธิบายสิ่งที่แก้ไขไป (ภาษาไทย, ใช้ Bullet points)\",\n" +
                                  "  \"mission_description\": \"คำอธิบายเป้าหมายของภารกิจสั้นๆ น่าสนใจ (ภาษาไทย 1-2 บรรทัด เหมาะสำหรับให้นักเรียนอ่าน)\",\n" +
                                  "  \"html_code\": \"<" + "!DOCTYPE html>...\"\n" +
                                  "}\n\n" +
                                  "Input Code: " + currentCode;

                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${key}`;
                
                const requestBody = {
                    contents: [{ parts: [{ text: sysPrompt }] }],
                    generationConfig: {
                        responseMimeType: "application/json"
                    }
                };

                const res = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(requestBody) 
                });
                
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error?.message || `AI Request Failed (${res.status})`);
                }
                
                pBar.style.width = "90%";
                statusText.innerText = "✨ กำลังประมวลผลคำตอบ...";

                const data = await res.json();
                let jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;

                if (jsonText) {
                    const result = JSON.parse(jsonText);

                    if (result.change_log) {
                        const logBox = document.getElementById('aiReasoningBox');
                        document.getElementById('aiReasoningText').innerText = result.change_log;
                        logBox.classList.remove('hidden-el');
                    }

                    if (result.mission_description) {
                        document.getElementById('missionDescInput').value = result.mission_description;
                    }

                    if (result.html_code) {
                        editor.setValue(result.html_code); 
                        formatCode();
                    }

                    document.getElementById('aiPromptInput').value = "";
                    showMessage("✨ AI ทำงานเสร็จสิ้น!", false);
                } else throw new Error("No data from AI");

            } catch (e) { showMessage("❌ " + e.message, true); } 
            finally { 
                pBar.style.width = "100%"; 
                setTimeout(() => { overlay.classList.add('hidden-el'); pBar.style.width = "0%"; }, 800); 
            }
        }

        async function loadKeyFromDB() {
            if (!window.sysDB || !currentUserId) return;
            const { data } = await window.sysDB.from('teachers').select('gemini_api_key').eq('teacher_id', currentUserId).single();
            if(data?.gemini_api_key) {
                document.getElementById("apiKeyInput").value = data.gemini_api_key;
                document.getElementById("apiKeyConfiguredView").classList.remove("hidden-el");
                toggleKeyEdit(false);
            } else { toggleKeyEdit(true); }
        }

        async function saveKeyToDB() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if(!key) return;
            
            if (window.sysDB && currentUserId) {
                await window.sysDB.from('teachers').update({ gemini_api_key: key }).eq('teacher_id', currentUserId);
                loadKeyFromDB(); 
            } else {
                // ออฟไลน์โหมด เก็บ key ไว้ใน input แต่ซ่อน UI เหมือนกดเซฟสำเร็จ
                toggleKeyEdit(false);
                document.getElementById("apiKeyConfiguredView").classList.remove("hidden-el");
            }
            showMessage("✅ บันทึก Key แล้ว");
        }

        async function loadExistingMission() {
            const { data } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
            if (data) {
                originalTeacherId = data.created_by;
                
                document.getElementById("missionTitleInput").value = data.title || "";
                document.getElementById("missionDescInput").value = data.description || "";
                document.getElementById("missionSubjectInput").value = data.subject_group || "อื่นๆ";
                document.getElementById("missionGradeInput").value = data.grade_level || "";

                if(editor) editor.setValue(data.content_data?.html || "");
            }
        }

        function loadLocalDraft() {
            const draft = localStorage.getItem('mission_code_draft');
            if(draft && editor) { editor.setValue(draft); showMessage("📂 โหลดโค้ดเดิมคืนมาแล้ว"); }
        }

        function showMessage(text, isError = false) { 
            const msgBox = document.getElementById("msgBox");
            document.getElementById("msgContent").innerHTML = `<p id="msgText" class="text-sm font-bold text-slate-700">${text}</p>`;
            document.getElementById("msgIcon").innerHTML = isError ? '⚠️' : '✅';
            msgBox.style.borderLeftColor = isError ? '#ef4444' : '#0d9488';
            msgBox.style.display = 'block';
            setTimeout(() => msgBox.style.display = 'none', 4000); 
        }

        function toggleKeyEdit(show) {
            if(show) { 
                document.getElementById('apiKeyEditView').classList.remove('hidden-el'); 
                document.getElementById('apiKeyConfiguredView').classList.add('hidden-el'); 
            } else { 
                document.getElementById('apiKeyEditView').classList.add('hidden-el'); 
                document.getElementById('apiKeyConfiguredView').classList.remove('hidden-el'); 
            }
        }

        function changeView(event, d) { 
            document.getElementById('previewWrapper').className = `preview-frame-wrapper shadow-2xl device-${d}`; 
            
            document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('bg-slate-200', 'text-teal-700'));
            if(event && event.currentTarget) {
                event.currentTarget.classList.add('bg-slate-200', 'text-teal-700');
            }
        }
    </script>
</body>
</html>
