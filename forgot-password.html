<!-- ไฟล์: forgot-password.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ลืมรหัสผ่าน - FlipSchool</title>
    
    <!-- 🌟 PWA Manifest & Icons 🌟 -->
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #00008B; --primary-light: #0000cd; --accent: #FF8C00; --bg-color: #f4f7fe; --text-main: #2d3436; --text-muted: #636e72; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%), radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%); }
        
        /* ================= NAVBAR (เป๊ะตาม index.html 100%) ================= */
        #mainNav { display: flex; justify-content: space-between; align-items: center; padding: 0 clamp(15px, 5%, 50px); height: 90px; background: white; position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; border-bottom: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); border-bottom-color: transparent; }
        
        .nav-left { display: flex; align-items: center; gap: clamp(10px, 2vw, 15px); text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-logo-icon { font-size: clamp(20px, 4vw, 28px); background: white; width: clamp(40px, 5vw, 50px); height: clamp(40px, 5vw, 50px); border-radius: clamp(10px, 2vw, 14px); border: 2.5px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,139,0.1); color: var(--text-main); transition: all 0.3s ease; }
        #mainNav.scrolled .nav-logo-icon { width: 40px; height: 40px; font-size: 20px; border-width: 2px; border-radius: 10px; }
        
        .nav-text-group { display: flex; flex-direction: column; justify-content: center; }
        .nav-brand { font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--primary); font-family: 'Kanit'; margin-bottom: -4px; transition: 0.3s;}
        .nav-brand span { color: var(--accent); }
        #mainNav.scrolled .nav-brand { font-size: 22px; }
        .nav-slogan { font-size: 13px; color: var(--text-muted); font-family: 'Sarabun'; transition: 0.3s; }
        #mainNav.scrolled .nav-slogan { font-size: 11px; opacity: 0; display: none; }
        
        .nav-center { display: flex; align-items: center; gap: clamp(15px, 2vw, 30px); }
        .nav-link { color: var(--text-muted); font-family: 'Kanit'; font-weight: 500; font-size: clamp(14px, 1.5vw, 16px); text-decoration: none; transition: 0.2s; display: flex; align-items: center; gap: 8px; position: relative; }
        .nav-link i { font-size: 14px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .nav-btn-primary { background: white; color: var(--primary); border: 2px solid var(--primary); padding: clamp(8px, 2vw, 10px) clamp(16px, 3vw, 24px); border-radius: 50px; font-family: 'Kanit'; font-weight: 500; font-size: clamp(13px, 1.5vw, 15px); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,139,0.05); }
        .nav-btn-primary:hover { background: var(--primary-light); color: white; border-color: var(--primary-light); transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0, 0, 139, 0.2); }
        
        .mobile-menu-btn { display: none; background: #f8faff; border: 1px solid #eef2f7; font-size: 20px; color: var(--primary); cursor: pointer; width: 42px; height: 42px; border-radius: 12px; transition: 0.3s; }
        .mobile-menu-btn:hover { background: #eef2f7; }
        
        .mobile-dropdown { display: none; flex-direction: column; background: white; position: absolute; top: 100%; left: 0; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-top: 1px solid #f1f5f9; z-index: 999; }
        .mobile-dropdown.active { display: flex; animation: slideDown 0.3s ease-out; }
        .mobile-dropdown a { padding: 16px 25px; text-decoration: none; color: var(--text-main); font-family: 'Kanit'; font-weight: 500; border-bottom: 1px solid #f8faff; display: flex; align-items: center; gap: 12px; font-size: 15px; transition: 0.2s; }
        .mobile-dropdown a:hover { background: #f0f4ff; color: var(--primary); padding-left: 30px; }

        /* ================= MAIN CONTAINER ================= */
        .main-container { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(20px, 4vw, 40px) 15px; width: 100%; box-sizing: border-box; }
        
        .login-card { background: white; width: 100%; max-width: 400px; border-radius: clamp(20px, 4vw, 25px); padding: clamp(20px, 5vw, 30px) clamp(20px, 5vw, 35px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); border-top: 6px solid var(--accent); position: relative; text-align: center; }
        
        .header-icon-box { width: clamp(60px, 15vw, 75px); height: clamp(60px, 15vw, 75px); background: #fff8e1; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: var(--accent); font-size: clamp(28px, 6vw, 35px); }
        
        .login-header { margin-bottom: 25px; }
        .login-header h1 { font-family: 'Kanit'; font-size: clamp(22px, 5vw, 26px); color: var(--primary); margin-bottom: 5px; font-weight: 700; }
        .login-header p { font-size: clamp(13px, 3vw, 14px); color: var(--text-muted); margin: 0; line-height: 1.5; }

        .form-group { text-align: left; margin-bottom: 20px; }
        .form-label { display: block; font-family: 'Kanit'; font-size: clamp(13px, 3vw, 14px); font-weight: 500; color: #2d3436; margin-bottom: 8px; }
        .input-wrapper { position: relative; width: 100%; }
        .form-input { 
            width: 100%; padding: clamp(12px, 3vw, 14px) 15px clamp(12px, 3vw, 14px) 45px; border: 2px solid #edf2f7; border-radius: 12px; 
            font-size: clamp(13px, 3vw, 15px); background: #f8faff; box-sizing: border-box; outline: none; font-family: 'Sarabun'; transition: 0.3s; 
        }
        .form-input:focus { border-color: var(--accent); background: white; box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1); }
        .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: #a4b0be; font-size: 16px; transition: 0.3s; }
        .form-input:focus + .input-icon, .form-input:focus ~ .input-icon { color: var(--accent); }

        .btn-submit { 
            width: 100%; padding: clamp(14px, 3vw, 16px); background: var(--primary); color: white; border: none; border-radius: 12px; 
            font-family: 'Kanit'; font-size: clamp(15px, 4vw, 16px); font-weight: 600; cursor: pointer; transition: 0.3s; 
            display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 10px;
        }
        .btn-submit:hover:not(:disabled) { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(0,0,139,0.2); background: var(--primary-light); }
        .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
        
        /* ================= FOOTER ================= */
        .footer { padding: clamp(20px, 4vw, 30px) 20px; font-size: clamp(12px, 1.5vw, 13px); color: #a4b0be; text-align: center; margin-top: auto; font-family: 'Sarabun', sans-serif; line-height: 1.6; border-top: 1px solid rgba(0,0,0,0.05); background: white; }

        /* ================= MODALS & ALERTS ================= */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 10000; display: none; justify-content: center; align-items: center; padding: 15px; }
        .custom-modal-box { background: white; padding: clamp(20px, 5vw, 30px) clamp(20px, 5vw, 25px); border-radius: 20px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.15); animation: bounceIn 0.3s ease-out;}
        .custom-modal-icon { font-size: 50px; margin-bottom: 15px; }
        .custom-modal-title { font-family: 'Kanit'; font-size: 20px; font-weight: 600; color: #2d3436; margin: 0 0 8px 0; }
        .custom-modal-message { font-size: 14px; color: #636e72; margin: 0 0 20px 0; line-height: 1.5; }
        .custom-modal-btn { background: var(--primary); color: white; border: none; padding: 10px 30px; border-radius: 50px; font-family: 'Kanit'; font-size: 15px; font-weight: 500; cursor: pointer; transition: 0.3s; min-width: 100px; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 10500; display: none; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.3s; }
        .spinner { border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes bounceIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

        @media (max-width: 768px) {
            #mainNav { padding: 0 15px; height: 75px; }
            .nav-center { display: none; }
            .nav-btn-primary { display: none; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
            .login-card { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-family: 'Kanit'; color: var(--primary); font-weight: 600; text-align: center; font-size: 14px;" id="loadingText">กำลังตรวจสอบระบบ...</div>
    </div>

    <!-- 🌟 Navbar 🌟 -->
    <nav id="mainNav">
        <a href="index.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div class="nav-text-group">
                <div class="nav-brand">Flip<span>School</span></div>
                <div class="nav-slogan slogan">...</div>
            </div>
        </a>
        
        <div class="nav-center">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="mission-library.html" class="nav-link"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
            <a href="#" class="nav-link" onclick="showCustomAlert('ระบบนวัตกรรมกำลังจัดทำครับ', 'info')"><i class="fas fa-star"></i> นวัตกรรม</a>
            <a href="#" class="nav-link" onclick="showCustomAlert('ระบบคู่มือการใช้งานกำลังจัดทำครับ', 'info')"><i class="fas fa-book"></i> คู่มือ</a>
        </div>

        <div class="nav-right">
            <a href="login.html" class="nav-btn-primary"><i class="fas fa-arrow-left"></i> กลับหน้าล็อกอิน</a>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        </div>

        <div id="mobileMenu" class="mobile-dropdown">
            <a href="index.html"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="mission-library.html"><i class="fas fa-th-list"></i> คลังภารกิจการเรียนรู้</a>
            <a href="login.html" style="color: var(--primary); background: #f0f4ff;"><i class="fas fa-arrow-left"></i> กลับหน้าล็อกอิน</a>
        </div>
    </nav>

    <main class="main-container">
        <div class="login-card">
            
            <div class="header-icon-box">
                <i class="fas fa-key"></i>
            </div>

            <div class="login-header">
                <h1>ลืมรหัสผ่าน?</h1>
                <p>กรุณาระบุอีเมลที่ใช้ลงทะเบียน เพื่อรับลิงก์สำหรับ<br>ตั้งค่ารหัสผ่านใหม่ทางกล่องจดหมายของคุณ</p>
            </div>

            <form onsubmit="handleResetPassword(event)">
                <div class="form-group">
                    <label class="form-label">อีเมล</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <button type="submit" id="btnSubmit" class="btn-submit">
                    ส่งลิงก์ตั้งรหัสผ่านใหม่ <i class="fas fa-paper-plane"></i>
                </button>
            </form>
        </div>
    </main>

    <!-- 🌟 Footer มาตรฐาน 🌟 -->
    <footer class="footer footer-display-text"></footer>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div style="font-size: clamp(35px, 8vw, 45px); margin-bottom: 15px;" id="customAlertIcon"><i class="fas fa-info-circle"></i></div>
            <h3 style="font-family:'Kanit'; font-size:clamp(18px, 5vw, 20px); margin-bottom:8px;" id="customAlertTitle">แจ้งเตือน</h3>
            <p id="customAlertMessage" class="custom-modal-message"></p>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button onclick="closeCustomAlert()" id="customAlertOkBtn" class="custom-modal-btn">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        // ระบบ Navbar อัตโนมัติ
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 20) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('active'); }

        let alertCallback = null;

        // ================= Custom Alert =================
        function showCustomAlert(message, type = 'error', callback = null) {
            const modal = document.getElementById('customAlertModal');
            const titleEl = document.getElementById('customAlertTitle');
            const msgEl = document.getElementById('customAlertMessage');
            const iconEl = document.getElementById('customAlertIcon');
            const okBtn = document.getElementById('customAlertOkBtn');

            msgEl.innerText = message;
            alertCallback = callback;

            if (type === 'success') {
                iconEl.className = 'fas fa-envelope-open-text text-emerald-500'; 
                titleEl.innerText = 'ส่งอีเมลสำเร็จ!'; okBtn.style.background = '#10b981';
            } else if (type === 'warning') {
                iconEl.className = 'fas fa-exclamation-triangle text-amber-500'; 
                titleEl.innerText = 'แจ้งเตือน'; okBtn.style.background = '#f59e0b';
            } else {
                iconEl.className = 'fas fa-times-circle text-rose-500'; 
                titleEl.innerText = 'เกิดข้อผิดพลาด'; okBtn.style.background = '#ff4757';
            }

            modal.style.display = 'flex';
            setTimeout(() => { modal.classList.add('show'); }, 10);
        }

        function closeCustomAlert() { 
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('show'); 
            setTimeout(() => {
                modal.style.display = 'none';
                if (alertCallback) { alertCallback(); alertCallback = null; }
            }, 300);
        }

        // ================= เริ่มต้นการทำงานหน้าเว็บ =================
        function getDB() {
            if (window.sysDB) return window.sysDB;
            window.sysDB = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
            return window.sysDB;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof initAppUI === 'function') initAppUI();

            if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.APP_NAME) {
                document.title = `ลืมรหัสผ่าน - ${APP_CONFIG.APP_NAME}`;
            }
        });

        // ================= ฟังก์ชันขอส่งลิงก์ลืมรหัสผ่าน =================
        async function handleResetPassword(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('btnSubmit');
            const origText = btn.innerHTML;

            if (!email) {
                showCustomAlert("กรุณาระบุอีเมลของคุณ", "warning");
                return;
            }

            try {
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบข้อมูล...';
                btn.disabled = true;

                const db = getDB();

                // 1. ตรวจสอบว่ามีอีเมลนี้ในฐานข้อมูล (Unified Schema -> users) หรือไม่ ก่อนส่งลิงก์
                const { data: userData, error: checkError } = await db
                    .from('users')
                    .select('email')
                    .eq('email', email)
                    .maybeSingle();

                if (!userData) {
                    showCustomAlert("ไม่พบบัญชีที่ใช้อีเมลนี้ในระบบครับ กรุณาตรวจสอบความถูกต้อง", "warning");
                    btn.innerHTML = origText;
                    btn.disabled = false;
                    return;
                }

                // 2. หากมีบัญชีอยู่จริง ให้ดำเนินการส่งลิงก์รีเซ็ตรหัสผ่าน
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังส่งลิงก์ไปยังอีเมล...';

                const { error } = await db.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/update-password.html',
                });

                if (error) {
                    throw error;
                }

                showCustomAlert("ระบบได้ส่งลิงก์สำหรับตั้งค่ารหัสผ่านใหม่ไปที่อีเมลของคุณเรียบร้อยแล้ว (โปรดตรวจสอบในกล่องจดหมายขยะ/Junk mail หากไม่พบ)", "success", () => {
                    window.location.href = 'login.html';
                });

            } catch (err) {
                let errorMsg = err.message;
                if (errorMsg.includes('User not found')) errorMsg = 'ไม่พบบัญชีที่ใช้อีเมลนี้ในระบบ';
                
                showCustomAlert(errorMsg, "error");
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
