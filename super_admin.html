<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบส่วนกลาง - FlipSchool</title>
    <script src="js/env-config.js"></script>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary-dark: #1e272e; --primary: #2f3542; --primary-light: #57606f; --accent: #ff4757; --bg-body: #f1f2f6; --white: #ffffff; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Navbar --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 50px; height: 90px; background: var(--primary-dark); box-shadow: 0 2px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; color: white; }
        .logo-container img { height: 55px; filter: brightness(0) invert(1); }
        .brand-name { font-size: 26px; font-weight: 700; color: white; font-family: 'Kanit'; }
        .brand-name span { color: #f1c40f; }
        
        .nav-profile { display: flex; align-items: center; gap: 15px; color: white; }
        .nav-profile-trigger { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #f1c40f; object-fit: cover; }
        .logout-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: 'Kanit'; transition: 0.3s; }
        .logout-btn:hover { background: #ff4757; }

        /* --- Main Content --- */
        .main-container { flex: 1; padding: 40px 50px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        
        .hero-banner { background: linear-gradient(135deg, #2f3542 0%, #57606f 100%); color: white; padding: 40px 50px; border-radius: 25px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; }
        .hero-title { font-family: 'Kanit'; font-size: 32px; font-weight: 700; margin: 0 0 10px 0; display: flex; align-items: center; gap: 15px; }
        .hero-sub { font-size: 16px; margin: 0; color: #dfe4ea; }

        .section-title { font-family: 'Kanit'; font-size: 24px; color: var(--primary-dark); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        
        .request-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .request-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1px solid #dfe4ea; display: flex; flex-direction: column; gap: 15px; }
        
        @media (min-width: 768px) {
            .request-card { flex-direction: row; justify-content: space-between; align-items: center; }
        }

        .req-info { display: flex; align-items: center; gap: 20px; }
        .req-avatar { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; background: #f1f2f6; }
        .req-details h3 { margin: 0 0 5px 0; font-family: 'Kanit'; font-size: 20px; color: var(--primary-dark); }
        .req-details p { margin: 0; color: #636e72; font-size: 14px; display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        
        .req-school-badge { display: inline-block; background: #fff3cd; color: #d35400; padding: 5px 12px; border-radius: 8px; font-size: 14px; font-weight: bold; margin-top: 8px; border: 1px solid #ffeaa7; }

        .req-actions { display: flex; gap: 10px; width: 100%; }
        @media (min-width: 768px) { .req-actions { width: auto; } }
        
        .btn-action { padding: 12px 20px; border-radius: 12px; font-family: 'Kanit'; font-weight: 500; font-size: 15px; cursor: pointer; border: none; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; flex: 1; }
        .btn-view { background: #f1f2f6; color: #2f3542; } .btn-view:hover { background: #dfe4ea; }
        .btn-approve { background: #2ed573; color: white; } .btn-approve:hover { background: #26de81; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(46, 213, 115, 0.3); }
        .btn-reject { background: #ff4757; color: white; } .btn-reject:hover { background: #ff6b81; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 71, 87, 0.3); }

        .empty-state { text-align: center; padding: 60px 20px; background: white; border-radius: 25px; border: 2px dashed #dfe4ea; color: #a4b0be; }
        .empty-state i { font-size: 50px; margin-bottom: 15px; color: #ced6e0; }
        .empty-state h3 { font-family: 'Kanit'; font-size: 22px; color: #747d8c; margin: 0; }

        /* Modal รูปภาพบัตร */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; border-radius: 20px; width: 100%; max-width: 600px; max-height: 90vh; display: flex; flex-direction: column; overflow: hidden; }
        .modal-header { padding: 15px 25px; background: #f1f2f6; border-bottom: 1px solid #dfe4ea; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-family: 'Kanit'; color: var(--primary-dark); font-size: 18px; }
        .modal-body { padding: 20px; overflow-y: auto; text-align: center; background: #000; }
        .modal-body img { max-width: 100%; max-height: 60vh; object-fit: contain; border-radius: 10px; }

        @media (max-width: 768px) { nav { padding: 0 20px; height: 70px; } .main-container { padding: 20px; } .hero-banner { padding: 30px 20px; } .hero-title { font-size: 24px; } }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <img src="img/favicon.png" alt="Logo" onerror="this.style.display='none'">
            <div class="brand-name">Flip<span>School</span> <span style="font-size: 14px; background: #ff4757; padding: 2px 8px; border-radius: 10px; color: white; vertical-align: middle; margin-left: 10px;">ระบบศูนย์กลาง</span></div>
        </div>
        <div class="nav-profile">
            <span id="adminName" style="font-family: 'Kanit'; font-weight: 500;">แอดมิน</span>
            <img src="" id="navProfileImg" class="nav-profile-trigger">
            <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i></button>
        </div>
    </nav>

    <main class="main-container">
        <div class="hero-banner">
            <div>
                <h1 class="hero-title"><i class="fas fa-shield-alt" style="color: #f1c40f;"></i> แผงควบคุมสิทธิ์ส่วนกลาง</h1>
                <p class="hero-sub">จัดการอนุมัติคำขอสร้างกลุ่มสถานศึกษาใหม่ในระบบ FlipSchool</p>
            </div>
        </div>

        <h2 class="section-title"><i class="fas fa-inbox"></i> คำขอเปิดโรงเรียนที่รอการอนุมัติ <span id="badgeCount" style="background: #ff4757; color: white; font-size: 14px; padding: 2px 10px; border-radius: 15px; margin-left: 10px;">0</span></h2>
        
        <div class="request-grid" id="requestContainer">
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <h3>กำลังโหลดข้อมูล...</h3>
            </div>
        </div>
    </main>

    <!-- Modal ดูรูปภาพบัตรยืนยันตัวตน -->
    <div id="imageModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3><i class="fas fa-id-badge"></i> เอกสารยืนยันตัวตน</h3>
                <i class="fas fa-times" style="cursor: pointer; font-size: 20px; color: #a4b0be;" onclick="closeImageModal()"></i>
            </div>
            <div class="modal-body">
                <img id="modalImage" src="" alt="บัตรยืนยันตัวตน">
            </div>
            <div style="padding: 15px; background: #f1f2f6; text-align: center; font-size: 13px; color: #636e72;">
                กรุณาตรวจสอบชื่อ-นามสกุล และรูปถ่ายให้ตรงกับผู้ร้องขอ
            </div>
        </div>
    </div>

    <!-- Modal ระบุเหตุผลที่ปฏิเสธ -->
    <div id="rejectModal" class="modal-overlay">
        <div class="modal-box" style="max-width: 500px;">
            <div class="modal-header">
                <h3 style="color: #ff4757;"><i class="fas fa-exclamation-circle"></i> ระบุเหตุผลที่ปฏิเสธ</h3>
                <i class="fas fa-times" style="cursor: pointer; font-size: 20px; color: #a4b0be;" onclick="closeRejectModal()"></i>
            </div>
            <div class="modal-body" style="background: white; text-align: left;">
                <label style="font-family: 'Kanit'; font-weight: 500; color: #2d3436; margin-bottom: 10px; display: block;">เลือกเหตุผลที่พบบ่อย:</label>
                <select id="commonRejectReasons" class="form-input" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #dfe4ea; margin-bottom: 15px; font-family: 'Sarabun';" onchange="document.getElementById('rejectReasonText').value = this.value">
                    <option value="">-- เลือกเหตุผล หรือพิมพ์ใหม่ด้านล่าง --</option>
                    <option value="รูปภาพบัตรยืนยันตัวตนไม่ชัดเจน">รูปภาพบัตรยืนยันตัวตนไม่ชัดเจน</option>
                    <option value="ชื่อบนบัตรไม่ตรงกับชื่อผู้สมัคร">ชื่อบนบัตรไม่ตรงกับชื่อผู้สมัคร</option>
                    <option value="ไม่ใช่บัตรข้าราชการ/บัตรพนักงานโรงเรียน">ไม่ใช่บัตรข้าราชการ/บัตรพนักงานโรงเรียน</option>
                </select>

                <label style="font-family: 'Kanit'; font-weight: 500; color: #2d3436; margin-bottom: 10px; display: block;">หรือ พิมพ์เหตุผลเพิ่มเติม:</label>
                <textarea id="rejectReasonText" rows="3" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #dfe4ea; font-family: 'Sarabun'; box-sizing: border-box;" placeholder="ระบุเหตุผลเพื่อแจ้งให้ผู้ใช้งานทราบ..."></textarea>
                
                <input type="hidden" id="rejectTsId">
                <input type="hidden" id="rejectCardUrl">
                
                <button id="btnConfirmReject" onclick="confirmReject()" style="width: 100%; padding: 12px; background: #ff4757; color: white; border: none; border-radius: 10px; font-family: 'Kanit'; font-size: 16px; margin-top: 20px; cursor: pointer; transition: 0.3s;">ยืนยันการปฏิเสธ</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof sysDB !== 'undefined') {
                const { data: { user } } = await sysDB.auth.getUser();
                if (!user) { window.location.href = 'teacher-login.html'; return; }
                currentUser = user;
                await verifySuperAdmin();
            }
        });

        // 1. ยืนยันสิทธิ์อีกครั้งเพื่อความปลอดภัย
        async function verifySuperAdmin() {
            const { data: teacher, error } = await sysDB.from('teachers').select('*').eq('teacher_id', currentUser.id).single();
            if (error || !teacher || teacher.role !== 'super_admin') {
                showCustomAlert("คุณไม่มีสิทธิ์เข้าถึงหน้านี้", "error", () => {
                    window.location.href = 'teacher-dashboard.html';
                });
                return;
            }

            // ดึงชื่อและรูปภาพจาก Google (อยู่ใน user_metadata) เป็นอันดับแรก
            const googleName = currentUser.user_metadata?.full_name || currentUser.user_metadata?.name;
            const googlePic = currentUser.user_metadata?.avatar_url || currentUser.user_metadata?.picture;

            // หากไม่มีข้อมูลจาก Google ให้ใช้ข้อมูลจากตาราง teachers แทน
            const displayName = googleName || teacher.first_name || 'แอดมิน';
            const displayPic = googlePic || teacher.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${teacher.first_name}`;

            document.getElementById('adminName').innerText = displayName;
            document.getElementById('navProfileImg').src = displayPic;
            
            fetchPendingRequests();
        }

        // 2. ดึงข้อมูลคำขอจากฐานข้อมูล (แสดงโชว์กลางจอ) - เปลี่ยนมาใช้การประกอบร่างข้อมูลด้วย JS แก้ปัญหาบั๊ก 100%
        async function fetchPendingRequests() {
            const container = document.getElementById('requestContainer');
            
            try {
                // ขั้นตอนที่ 1: ดึงเฉพาะข้อมูลในตารางคำขอ (teacher_schools)
                const { data: reqData, error: reqError } = await sysDB.from('teacher_schools')
                    .select('*')
                    .eq('verification_status', 'pending')
                    .eq('role', 'admin')
                    .order('created_at', { ascending: false });

                if (reqError) throw reqError;

                document.getElementById('badgeCount').innerText = reqData.length;

                if (!reqData || reqData.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state">
                            <i class="fas fa-check-circle" style="color: #2ed573;"></i>
                            <h3>ไม่มีคำขอค้างอยู่</h3>
                            <p style="margin-top: 10px; color: #a4b0be;">ระบบได้รับการจัดการเรียบร้อยแล้ว</p>
                        </div>`;
                    return;
                }

                // ขั้นตอนที่ 2: รวบรวม ID เพื่อไปดึงตารางที่เกี่ยวข้องแยกกัน
                const teacherIds = reqData.map(r => r.teacher_id);
                const schoolIds = reqData.map(r => r.school_id);

                // ดึงข้อมูลครูและโรงเรียน
                const { data: teachersData } = await sysDB.from('teachers').select('teacher_id, first_name, last_name, email, profile_pic').in('teacher_id', teacherIds);
                const { data: schoolsData } = await sysDB.from('schools').select('school_id, school_name, school_abbr').in('school_id', schoolIds);

                // ขั้นตอนที่ 3: ประกอบร่างข้อมูลเข้าด้วยกัน (ปลอดภัยและเสถียรที่สุด)
                const finalData = reqData.map(req => {
                    return {
                        ...req,
                        teachers: teachersData ? teachersData.find(t => t.teacher_id === req.teacher_id) : {},
                        schools: schoolsData ? schoolsData.find(s => s.school_id === req.school_id) : {}
                    };
                });

                // นำมาแสดงผล
                let html = '';
                finalData.forEach(req => {
                    const avatar = req.teachers?.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${req.teachers?.first_name || 'A'}`;
                    const supabaseUrl = APP_CONFIG.SUPABASE_URL;
                    const cardUrl = req.verification_card_url ? `${supabaseUrl}/storage/v1/object/public/teacher-verifications/${req.verification_card_url}` : null;
                    const date = new Date(req.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                    html += `
                        <div class="request-card">
                            <div class="req-info">
                                <img src="${avatar}" class="req-avatar">
                                <div class="req-details">
                                    <h3>ครู${req.teachers?.first_name || 'ไม่ทราบชื่อ'} ${req.teachers?.last_name || ''}</h3>
                                    <p><i class="fas fa-envelope"></i> ${req.teachers?.email || 'ไม่มีอีเมล'}</p>
                                    <p><i class="fas fa-clock"></i> ส่งเมื่อ: ${date}</p>
                                    <div class="req-school-badge"><i class="fas fa-school"></i> ขอเปิด: ${req.schools?.school_name || 'ไม่ทราบชื่อโรงเรียน'} (@${req.schools?.school_abbr || '-'})</div>
                                </div>
                            </div>
                            <div class="req-actions">
                                ${cardUrl 
                                    ? `<button class="btn-action btn-view" onclick="viewImage('${cardUrl}')"><i class="fas fa-id-card"></i> ดูบัตร</button>` 
                                    : `<button class="btn-action btn-view" disabled style="opacity: 0.5;"><i class="fas fa-id-card"></i> ไม่มีรูปบัตร</button>`
                                }
                                <button class="btn-action btn-approve" onclick="approveRequest('${req.id}', '${req.verification_card_url}')"><i class="fas fa-check"></i> อนุมัติ</button>
                                <button class="btn-action btn-reject" onclick="openRejectModal('${req.id}', '${req.verification_card_url}')"><i class="fas fa-times"></i> ปฏิเสธ</button>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
                
                // ดึงประวัติเหตุผลที่เคยปฏิเสธมาใส่ใน Dropdown อัตโนมัติ
                loadHistoricalRejectReasons();

            } catch (err) {
                console.error(err);
                container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle" style="color: #ff4757;"></i><h3>เกิดข้อผิดพลาดในการดึงข้อมูล</h3><p>${err.message}</p></div>`;
            }
        }

        // 3. ฟังก์ชันจัดการคำขอ
        function viewImage(url) {
            document.getElementById('modalImage').src = url;
            document.getElementById('imageModal').style.display = 'flex';
        }

        function closeImageModal() {
            document.getElementById('imageModal').style.display = 'none';
        }

        // --- ฟังก์ชันลบรูปภาพเพื่อประหยัดพื้นที่ Storage ---
        async function deleteCardFromStorage(fileName) {
            if (!fileName) return;
            try {
                await sysDB.storage.from('teacher-verifications').remove([fileName]);
                // เคลียร์ชื่อไฟล์ใน DB ด้วยเพื่อความสะอาด
                await sysDB.from('teacher_schools').update({ verification_card_url: null }).eq('verification_card_url', fileName);
            } catch (e) { console.error("ไม่สามารถลบไฟล์ได้:", e); }
        }

        async function approveRequest(tsId, cardUrl) {
            showCustomAlert('ยืนยันให้สิทธิ์ Admin กลุ่มสถานศึกษานี้?', 'confirm', async () => {
                try {
                    await sysDB.from('teacher_schools').update({ 
                        verification_status: 'approved', 
                        reject_reason: null,
                        approved_by: currentUser.id, 
                        approved_at: new Date().toISOString() 
                    }).eq('id', tsId);
                    
                    // ลบรูปภาพทิ้งหลังอนุมัติเสร็จ
                    if (cardUrl && cardUrl !== 'null') await deleteCardFromStorage(cardUrl);
                    
                    showCustomAlert('อนุมัติสิทธิ์สำเร็จ!', 'success', () => {
                        fetchPendingRequests();
                    });
                } catch (err) { showCustomAlert('เกิดข้อผิดพลาด: ' + err.message, 'error'); }
            });
        }

        // --- ระบบปฏิเสธแบบใหม่ ---
        function openRejectModal(tsId, cardUrl) {
            document.getElementById('rejectTsId').value = tsId;
            document.getElementById('rejectCardUrl').value = cardUrl;
            document.getElementById('rejectReasonText').value = '';
            document.getElementById('rejectModal').style.display = 'flex';
        }

        function closeRejectModal() {
            document.getElementById('rejectModal').style.display = 'none';
        }

        async function confirmReject() {
            const tsId = document.getElementById('rejectTsId').value;
            const cardUrl = document.getElementById('rejectCardUrl').value;
            const reason = document.getElementById('rejectReasonText').value.trim();
            const btn = document.getElementById('btnConfirmReject');

            if (!reason) {
                showCustomAlert("กรุณาระบุเหตุผลที่ปฏิเสธ เพื่อให้ผู้ใช้งานทำการแก้ไขครับ", "warning");
                return;
            }

            // 1. เปลี่ยนสถานะปุ่มเพื่อแจ้งเตือนให้ผู้ใช้รู้ว่าระบบกำลังทำงานเบื้องหลัง
            const originalBtnText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...';
            btn.style.opacity = '0.7';
            btn.style.cursor = 'not-allowed';

            try {
                await sysDB.from('teacher_schools').update({ 
                    verification_status: 'rejected',
                    reject_reason: reason
                }).eq('id', tsId);

                // ลบรูปภาพทิ้งหลังปฏิเสธเสร็จ (เพราะเดี๋ยวต้องให้ผู้ใช้ส่งมาใหม่)
                if (cardUrl && cardUrl !== 'null') await deleteCardFromStorage(cardUrl);

                // 2. ปิดป๊อปอัปเหตุผล "ทันที" เพื่อไม่ให้ขวางหน้าจอ
                closeRejectModal();

                // 3. แสดงแจ้งเตือนความสำเร็จและรีเฟรชรายการ
                showCustomAlert('ปฏิเสธคำขอและส่งกลับให้แก้ไขเรียบร้อย', 'success', () => {
                    fetchPendingRequests();
                });
            } catch (err) { 
                showCustomAlert('เกิดข้อผิดพลาด: ' + err.message, 'error'); 
            } finally {
                // คืนค่าปุ่มกลับมาเผื่อกรณีที่เกิด Error แล้วต้องกดใหม่
                btn.disabled = false;
                btn.innerHTML = originalBtnText;
                btn.style.opacity = '1';
                btn.style.cursor = 'pointer';
            }
        }

        // ดึงเหตุผลเก่าๆ มาเป็นตัวเลือก
        async function loadHistoricalRejectReasons() {
            try {
                const { data } = await sysDB.from('teacher_schools').select('reject_reason').not('reject_reason', 'is', null);
                if (data && data.length > 0) {
                    const uniqueReasons = [...new Set(data.map(item => item.reject_reason))];
                    const select = document.getElementById('commonRejectReasons');
                    // เก็บ option 3 อันแรกที่เป็น Default ไว้
                    const defaultOptions = Array.from(select.options).slice(0, 4).map(o => o.value);
                    
                    uniqueReasons.forEach(reason => {
                        if (!defaultOptions.includes(reason) && reason.length < 50) {
                            const opt = document.createElement('option');
                            opt.value = reason; opt.text = reason;
                            select.appendChild(opt);
                        }
                    });
                }
            } catch (e) { console.error(e); }
        }

        async function handleLogout() {
            showCustomAlert('ต้องการออกจากระบบใช่หรือไม่?', 'confirm', async () => {
                await sysDB.auth.signOut(); 
                location.href='teacher-login.html'; 
            });
        }
    </script>
</body>
</html>
