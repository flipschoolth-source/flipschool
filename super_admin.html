<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบส่วนกลาง - FlipSchool</title>
    <script src="js/env-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary-dark: #1e272e; --primary: #2f3542; --primary-light: #57606f; --accent: #ff4757; --bg-body: #f1f2f6; --white: #ffffff; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); display: flex; flex-direction: column; overflow-x: hidden; }

        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 50px; height: 90px; background: var(--primary-dark); box-shadow: 0 2px 20px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; color: white; }
        .brand-name { font-size: 26px; font-weight: 700; color: white; font-family: 'Kanit'; }
        .brand-name span { color: #f1c40f; }
        .nav-profile { display: flex; align-items: center; gap: 15px; color: white; }
        .logout-btn { background: rgba(255,255,255,0.1); color: white; border: none; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-family: 'Kanit'; transition: 0.3s; }
        .logout-btn:hover { background: #ff4757; }

        .main-container { flex: 1; padding: 40px 50px; max-width: 1200px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .hero-banner { background: linear-gradient(135deg, #2f3542 0%, #57606f 100%); color: white; padding: 40px 50px; border-radius: 25px; margin-bottom: 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .hero-title { font-family: 'Kanit'; font-size: 32px; font-weight: 700; margin: 0 0 10px 0; }
        
        .request-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); border: 1px solid #dfe4ea; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .req-info { display: flex; align-items: center; gap: 20px; }
        .req-avatar { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; background: #f1f2f6; }
        .req-details h3 { margin: 0; font-family: 'Kanit'; font-size: 18px; color: var(--primary-dark); }
        .req-details p { margin: 5px 0 0 0; color: #636e72; font-size: 14px; }
        
        .req-actions { display: flex; gap: 10px; }
        .btn-action { padding: 10px 20px; border-radius: 12px; font-family: 'Kanit'; font-weight: 500; cursor: pointer; border: none; display: flex; align-items: center; gap: 8px; }
        .btn-view { background: #f1f2f6; color: #2f3542; }
        .btn-approve { background: #2ed573; color: white; }
        .btn-reject { background: #ff4757; color: white; }

        .empty-state { text-align: center; padding: 60px 20px; color: #a4b0be; }
        .empty-state i { font-size: 50px; margin-bottom: 15px; color: #ced6e0; }

        /* Modal รูปภาพบัตร */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; border-radius: 20px; width: 100%; max-width: 600px; overflow: hidden; }
        .modal-header { padding: 15px 25px; background: #f1f2f6; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { padding: 20px; text-align: center; background: #000; }
        .modal-body img { max-width: 100%; max-height: 60vh; object-fit: contain; border-radius: 10px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo-container">
            <div style="font-size: 32px; background: white; width: 45px; height: 45px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--primary-dark);">🎓</div>
            <div class="brand-name">Flip<span>School</span> <span style="font-size: 14px; background: #ff4757; padding: 2px 8px; border-radius: 10px; color: white;">ระบบส่วนกลาง</span></div>
        </div>
        <div class="nav-profile">
            <span id="adminName" style="font-family: 'Kanit';">ผู้ดูแลระบบสูงสุด</span>
            <button class="logout-btn" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </nav>

    <main class="main-container">
        <div class="hero-banner">
            <h1 class="hero-title"><i class="fas fa-shield-alt" style="color: #f1c40f;"></i> แผงควบคุมสิทธิ์ส่วนกลาง</h1>
            <p>จัดการอนุมัติคำขอเปิดกลุ่มโรงเรียนใหม่ในระบบ</p>
        </div>

        <h2 style="font-family: 'Kanit'; color: var(--primary-dark);"><i class="fas fa-inbox"></i> คำขอที่รอการอนุมัติ</h2>
        
        <div id="requestContainer">
            <div class="empty-state"><i class="fas fa-spinner fa-spin"></i><h3>กำลังโหลดข้อมูล...</h3></div>
        </div>
    </main>

    <!-- Modal ดูรูปภาพบัตร -->
    <div id="imageModal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 style="margin: 0; font-family: 'Kanit';"><i class="fas fa-id-badge"></i> เอกสารยืนยันตัวตน</h3>
                <i class="fas fa-times" style="cursor: pointer; color: #a4b0be;" onclick="closeImageModal()"></i>
            </div>
            <div class="modal-body">
                <img id="modalImage" src="" alt="บัตรยืนยันตัวตน">
            </div>
        </div>
    </div>

    <script>
        let currentUser = null;

        function getDB() {
            if (window.sysDB) return window.sysDB;
            window.sysDB = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
            return window.sysDB;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const db = getDB();
            const { data: { user } } = await db.auth.getUser();
            if (!user) { window.location.href = 'login.html'; return; }
            currentUser = user;

            // ตรวจสอบสิทธิ์ว่าเป็นแอดมินสูงสุดหรือไม่
            const { data: userRecord } = await db.from('users').select('is_super_admin, role').eq('user_id', user.id).single();
            if (!userRecord || (!userRecord.is_super_admin && userRecord.role !== 'super_admin')) {
                alert("คุณไม่มีสิทธิ์เข้าถึงหน้านี้");
                window.location.href = 'dashboard.html';
                return;
            }

            fetchPendingRequests();
        });

        async function fetchPendingRequests() {
            const container = document.getElementById('requestContainer');
            try {
                const db = getDB();
                // 🌟 เปลี่ยนจาก teacher_schools เป็น user_school (ตาม Schema ใหม่)
                const { data: reqData, error } = await db.from('user_school')
                    .select('*, users(first_name, last_name, email, profile_pic), schools(school_name, school_abbr)')
                    .eq('verification_status', 'pending')
                    .not('verification_card_url', 'is', null)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                if (!reqData || reqData.length === 0) {
                    container.innerHTML = `<div class="empty-state"><i class="fas fa-check-circle" style="color: #2ed573;"></i><h3>ไม่มีคำขอค้างอยู่</h3></div>`;
                    return;
                }

                container.innerHTML = reqData.map(req => {
                    const avatar = req.users?.profile_pic || 'img/default_avatar.png';
                    const cardUrl = req.verification_card_url ? `${APP_CONFIG.SUPABASE_URL}/storage/v1/object/public/teacher-verifications/${req.verification_card_url}` : null;
                    const date = new Date(req.created_at).toLocaleDateString('th-TH');

                    return `
                        <div class="request-card" id="req-card-${req.id}">
                            <div class="req-info">
                                <img src="${avatar}" class="req-avatar">
                                <div class="req-details">
                                    <h3>${req.users?.first_name || ''} ${req.users?.last_name || ''}</h3>
                                    <p><i class="fas fa-school"></i> ขอเปิด: ${req.schools?.school_name || '-'}</p>
                                    <p><i class="fas fa-clock"></i> ส่งเมื่อ: ${date}</p>
                                </div>
                            </div>
                            <div class="req-actions">
                                <button class="btn-action btn-view" onclick="viewImage('${cardUrl}')"><i class="fas fa-id-card"></i> ดูบัตร</button>
                                <button class="btn-action btn-approve" onclick="approveRequest('${req.id}', '${req.verification_card_url}')"><i class="fas fa-check"></i> อนุมัติ</button>
                                <button class="btn-action btn-reject" onclick="rejectRequest('${req.id}', '${req.verification_card_url}')"><i class="fas fa-times"></i> ปฏิเสธ</button>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (err) {
                container.innerHTML = `<div class="empty-state"><h3>เกิดข้อผิดพลาด: ${err.message}</h3></div>`;
            }
        }

        function viewImage(url) {
            document.getElementById('modalImage').src = url;
            document.getElementById('imageModal').style.display = 'flex';
        }
        function closeImageModal() { document.getElementById('imageModal').style.display = 'none'; }

        async function approveRequest(id, cardUrl) {
            if (!confirm("ยืนยันให้สิทธิ์เข้ากลุ่มโรงเรียนนี้?")) return;
            const db = getDB();
            await db.from('user_school').update({ verification_status: 'approved', approved_by: currentUser.id }).eq('id', id);
            if (cardUrl) await db.storage.from('teacher-verifications').remove([cardUrl]);
            document.getElementById(`req-card-${id}`).remove();
        }

        async function rejectRequest(id, cardUrl) {
            const reason = prompt("กรุณาระบุเหตุผลที่ปฏิเสธ (เช่น รูปไม่ชัดเจน):");
            if (!reason) return;
            const db = getDB();
            await db.from('user_school').update({ verification_status: 'rejected', reject_reason: reason }).eq('id', id);
            if (cardUrl) await db.storage.from('teacher-verifications').remove([cardUrl]);
            document.getElementById(`req-card-${id}`).remove();
        }

        async function handleLogout() {
            if(confirm("ออกจากระบบ?")) {
                await getDB().auth.signOut();
                window.location.href = 'login.html';
            }
        }
    </script>
</body>
</html>
