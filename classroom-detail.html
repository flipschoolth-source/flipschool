<!DOCTYPE html>
<html lang="th">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จัดการห้องเรียน | FlipSchool</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
            --white: #ffffff;
        }

        body { 
            font-family: 'Sarabun', 'Kanit', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden; 
            background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%);
            min-height: 100vh; display: flex; flex-direction: column;
        }
        
        /* ================= NAVBAR ================= */
        #mainNav { display: flex; justify-content: space-between; align-items: center; padding: 0 clamp(15px, 5%, 50px); height: 90px; background: white; position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; border-bottom: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); border-bottom-color: transparent; }
        
        .nav-left { display: flex; align-items: center; gap: clamp(10px, 2vw, 15px); text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-logo-icon { font-size: clamp(20px, 4vw, 28px); background: white; width: clamp(40px, 5vw, 50px); height: clamp(40px, 5vw, 50px); border-radius: clamp(10px, 2vw, 14px); border: 2.5px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,139,0.1); color: var(--text-main); transition: all 0.3s ease; }
        #mainNav.scrolled .nav-logo-icon { width: 40px; height: 40px; font-size: 20px; border-width: 2px; border-radius: 10px; }
        
        .nav-text-group { display: flex; flex-direction: column; justify-content: center; }
        .nav-brand { font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--primary); font-family: 'Kanit'; margin-bottom: -4px; transition: 0.3s;}
        .nav-brand span { color: var(--accent); }
        #mainNav.scrolled .nav-brand { font-size: 22px; }
        .nav-slogan { font-size: 13px; color: var(--text-muted); font-family: 'Sarabun'; transition: 0.3s; }
        #mainNav.scrolled .nav-slogan { font-size: 11px; opacity: 0; display: none; }
        
        .nav-center { display: flex; align-items: center; gap: clamp(15px, 2vw, 30px); }
        .nav-link { color: var(--text-muted); font-family: 'Kanit'; font-weight: 500; font-size: clamp(14px, 1.5vw, 16px); text-decoration: none; transition: 0.2s; display: flex; align-items: center; gap: 8px; position: relative; }
        .nav-link i { font-size: 14px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }
        .mobile-menu-btn { display: none; background: #f8faff; border: 1px solid #eef2f7; font-size: 20px; color: var(--primary); cursor: pointer; width: 42px; height: 42px; border-radius: 12px; transition: 0.3s; }
        .mobile-dropdown { display: none; flex-direction: column; background: white; position: absolute; top: 100%; left: 0; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-top: 1px solid #f1f5f9; z-index: 999; }
        .mobile-dropdown.active { display: flex; animation: slideDown 0.3s ease-out; }
        .mobile-dropdown a { padding: 16px 25px; text-decoration: none; color: var(--text-main); font-family: 'Kanit'; font-weight: 500; border-bottom: 1px solid #f8faff; display: flex; align-items: center; gap: 12px; font-size: 15px; transition: 0.2s; }
        .mobile-dropdown a:hover { background: #f0f4ff; color: var(--primary); padding-left: 30px; }

        .header-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); box-shadow: 0 15px 30px rgba(0, 0, 139, 0.1); }
        
        .folder-card { background: white; border-radius: clamp(1rem, 3vw, 1.5rem); padding: clamp(1rem, 3vw, 1.5rem); box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.03); transition: all 0.3s ease; cursor: pointer; display: flex; align-items: center; gap: clamp(0.75rem, 2vw, 1rem); }
        .folder-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08); border-color: var(--primary-light); }
        .folder-icon-box { width: clamp(50px, 12vw, 60px); height: clamp(50px, 12vw, 60px); border-radius: clamp(0.75rem, 2vw, 1rem); display: flex; align-items: center; justify-content: center; font-size: clamp(1.5rem, 5vw, 1.8rem); background: #f0f4ff; color: var(--primary-light); flex-shrink: 0; }

        /* 🌟 Syllabus Timeline 🌟 */
        .mission-syllabus-container { padding: 10px 0 40px 0; width: 100%; max-width: 850px; margin: 0 auto; }
        .syllabus-item { position: relative; display: flex; align-items: stretch; margin-bottom: 20px; }
        .syllabus-connector { position: absolute; left: 24px; top: 48px; bottom: -20px; width: 3px; background: #e2e8f0; z-index: 0; transition: background 0.3s; }
        .syllabus-item:hover .syllabus-connector { background: var(--primary-light); }
        .syllabus-item:last-child .syllabus-connector { display: none; }
        
        .syllabus-number { position: relative; z-index: 10; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Kanit'; font-weight: 800; font-size: 18px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.08); flex-shrink: 0; transition: 0.3s; }
        .syllabus-item:hover .syllabus-number:not(.done):not(.locked) { background: var(--primary-light); color: white; transform: scale(1.1); }
        
        .syllabus-card { flex: 1; margin-left: 20px; background: white; border-radius: 20px; padding: 20px; border: 1px solid #edf2f7; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; gap: 15px; }
        .syllabus-item.playable:hover .syllabus-card { transform: translateX(5px) translateY(-2px); box-shadow: 0 15px 35px rgba(0,0,139,0.08); border-color: #dbeafe; }
        
        .syllabus-icon { width: 55px; height: 55px; border-radius: 14px; display: flex; justify-content: center; align-items: center; font-size: 24px; flex-shrink: 0; transition: 0.3s; }
        .syllabus-item.playable:hover .syllabus-icon { transform: scale(1.1) rotate(5deg); }

        .admin-folder-box { background: white; border-radius: clamp(1rem, 3vw, 1.5rem); padding: clamp(1rem, 3vw, 1.5rem); margin-bottom: 2rem; border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
        .admin-mission-list { min-height: 100px; padding: clamp(0.5rem, 2vw, 1rem); border-radius: 1rem; background: #f8fafc; border: 2px dashed #cbd5e1; display: flex; flex-direction: column; gap: 0.5rem; transition: background 0.2s; }
        .admin-mission-list.sortable-drag { background: #e0e8ff; border-color: var(--primary-light); }
        .admin-mission-item { background: white; border-radius: 0.75rem; padding: clamp(0.75rem, 2vw, 1rem); border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; align-items: center; gap: clamp(0.5rem, 2vw, 1rem); cursor: grab; }
        .admin-mission-item:active { cursor: grabbing; }
        .drag-handle-icon { color: #94a3b8; font-size: 1.2rem; cursor: grab; }

        .hidden-el { display: none !important; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        .fab-add { position: fixed; bottom: 50px; right: 50px; width: clamp(60px, 15vw, 70px); height: clamp(60px, 15vw, 70px); background: var(--accent); color: white; border-radius: 50%; border:none; font-size: clamp(24px, 6vw, 32px); cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4); text-decoration: none; transition: 0.3s; }
        .fab-add:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px rgba(255, 140, 0, 0.5); }
        .toggle-checkbox:checked { right: 0; border-color: #10b981; }
        .toggle-checkbox:checked + .toggle-label { background-color: #10b981; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { background-color: #e2e8f0; transition: all 0.3s; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .footer { padding: clamp(20px, 4vw, 30px) 20px; font-size: clamp(12px, 1.5vw, 13px); color: #a4b0be; text-align: center; margin-top: auto; font-family: 'Sarabun', sans-serif; line-height: 1.6; border-top: 1px solid rgba(0,0,0,0.05); background: white; }

        @media (max-width: 992px) { .nav-center { display: none; } .mobile-menu-btn { display: flex; align-items: center; justify-content: center; } }
        @media (max-width: 768px) {
            #mainNav { padding: 0 15px; height: 75px; }
            .fab-add { bottom: 30px; right: 30px; }
            .syllabus-number { width: 40px; height: 40px; font-size: 15px; border-width: 3px; }
            .syllabus-connector { left: 19px; top: 40px; }
            .syllabus-card { margin-left: 12px; padding: 15px; flex-direction: column; align-items: flex-start; }
            .syllabus-icon { width: 45px; height: 45px; font-size: 20px; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="loadingOverlay" style="display: flex; opacity: 1; transition: opacity 0.5s;" class="fixed inset-0 z-[9999] bg-white/95 backdrop-blur-sm flex-col items-center justify-center">
        <div class="spinner"></div>
        <p class="mt-4 text-[var(--primary)] font-bold animate-pulse text-sm font-sans" id="loadingText">กำลังโหลดข้อมูล...</p>
    </div>

    <!-- Modals -->
    <div id="customPromptModal" style="display: none; opacity: 0; transition: opacity 0.3s;" class="fixed inset-0 z-[5050] items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] w-full max-w-[90vw] md:max-w-sm p-6 md:p-8 shadow-2xl transform transition-all scale-95 opacity-0 text-center" id="customPromptCard">
            <div id="promptIconBox" class="w-16 h-16 bg-[#f0f4ff] text-[var(--primary-light)] rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i id="promptIcon" class="fas fa-folder-plus"></i>
            </div>
            <h3 id="promptTitle" class="text-xl font-bold text-slate-800 mb-2 font-sans">สร้างหมวดหมู่</h3>
            <p id="promptSubtitle" class="text-xs text-slate-500 mb-4 hidden-el"></p>
            <input type="text" id="promptInputVal" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--primary-light)] text-center mb-6 font-bold text-slate-700 font-sans" placeholder="...">
            <div class="flex gap-3">
                <button type="button" onclick="closeCustomPrompt()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all font-sans border-none cursor-pointer">ยกเลิก</button>
                <button type="button" onclick="executeCustomPrompt()" class="flex-1 bg-[var(--primary)] text-white font-bold py-3 rounded-xl transition-all active:scale-95 font-sans border-none cursor-pointer">ตกลง</button>
            </div>
        </div>
    </div>

    <div id="customConfirmModal" style="display: none; opacity: 0; transition: opacity 0.3s;" class="fixed inset-0 z-[5050] items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div class="bg-white rounded-[2rem] w-full max-w-[90vw] md:max-w-sm p-6 md:p-8 shadow-2xl transform transition-all scale-95 opacity-0 text-center" id="customConfirmCard">
            <div id="confirmIconBox" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i id="confirmIcon" class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 id="confirmTitle" class="text-xl font-bold text-slate-800 mb-2 font-sans">ยืนยัน</h3>
            <p id="confirmMessage" class="text-sm text-slate-500 mb-6 font-sans leading-relaxed"></p>
            <div class="flex gap-3">
                <button type="button" onclick="closeCustomConfirm()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all font-sans border-none cursor-pointer">ยกเลิก</button>
                <button type="button" id="confirmActionBtn" onclick="executeCustomConfirm()" class="flex-1 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95 font-sans border-none cursor-pointer">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- Sidebar & Navbar -->
    <div id="drawerOverlay" onclick="toggleDrawer()" style="display: none; transition: opacity 0.3s;" class="fixed inset-0 bg-black/50 z-[1999] backdrop-blur-sm opacity-0"></div>
    <div id="sideDrawer" class="fixed top-0 right-0 h-full w-[300px] bg-white z-[2000] translate-x-full transition-transform shadow-2xl p-6 flex flex-col rounded-l-3xl">
        <div class="text-center mb-6 relative">
            <button type="button" onclick="toggleDrawer()" class="absolute top-0 left-0 text-slate-300 hover:text-rose-500 border-none bg-transparent cursor-pointer transition-colors"><i class="fas fa-times text-xl"></i></button>
            <img id="sidebarProfileImg" src="" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-slate-50 shadow-md object-cover">
            <h3 id="sidebarName" class="font-bold text-lg font-['Kanit'] text-[var(--primary)] m-0">...</h3>
            <p id="sidebarEmail" class="text-xs text-slate-400 font-['Sarabun'] mt-1 mb-0">...</p>
        </div>
        <nav class="flex-1 space-y-2 pt-2">
            <a href="dashboard.html" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#f0f4ff] text-slate-600 hover:text-[var(--primary)] font-bold transition-all text-sm"><i class="fas fa-th-large w-5 text-center"></i> แดชบอร์ด</a>
            <a href="#" onclick="goToStudents()" class="flex items-center gap-3 p-3 rounded-xl hover:bg-[#f0f4ff] text-slate-600 hover:text-[var(--primary)] font-bold transition-all text-sm"><i class="fas fa-users w-5 text-center"></i> รายชื่อนักเรียน</a>
        </nav>
        <div class="pt-4 border-t border-slate-100 mt-auto">
            <button type="button" onclick="handleLogout()" class="w-full flex items-center justify-center gap-2 p-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold transition-all border-none cursor-pointer"><i class="fas fa-sign-out-alt"></i> ออกจากระบบ</button>
        </div>
    </div>

    <nav id="mainNav">
        <a href="dashboard.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div class="nav-text-group"><div class="nav-brand">Flip<span>School</span></div></div>
        </a>
        <div class="nav-center">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="mission-library.html" class="nav-link"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
        </div>
        <div class="nav-right">
            <img id="navProfileImg" src="" onclick="toggleDrawer()" class="w-10 h-10 md:w-11 md:h-11 rounded-full border-2 border-slate-200 cursor-pointer object-cover hover:border-[var(--primary)] transition-colors shadow-sm ml-2">
            <button type="button" class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        </div>
        <div id="mobileMenu" class="mobile-dropdown">
            <a href="dashboard.html"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="#" onclick="goToStudents()"><i class="fas fa-users"></i> รายชื่อนักเรียน</a>
            <a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt text-rose-500"></i> ออกจากระบบ</a>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="header-gradient text-white py-6 md:py-10 px-5 md:px-12 relative overflow-hidden rounded-b-[1.5rem] md:rounded-b-[2rem] shadow-sm mb-6">
        <div class="container mx-auto relative z-10 flex flex-col md:flex-row md:items-start justify-between gap-5">
            <div class="flex-1">
                <button type="button" onclick="location.href='dashboard.html'" class="mb-4 bg-white/20 hover:bg-white/30 text-white border border-white/30 px-4 py-2 rounded-xl text-sm font-['Kanit'] font-medium transition-all flex items-center gap-2 cursor-pointer w-fit shadow-sm">
                    <i class="fas fa-arrow-left"></i> กลับหน้าแดชบอร์ด
                </button>
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight font-['Kanit'] leading-snug"><span id="subjectName">กำลังโหลด...</span></h1>
                <div class="flex flex-wrap items-center gap-2 mt-2 md:mt-4 opacity-90 font-medium">
                    <span class="bg-white/20 px-3 py-1 md:px-4 md:py-1.5 rounded-lg md:rounded-xl text-[11px] md:text-sm flex items-center gap-1.5 font-sans border border-white/10">
                        <i class="fas fa-door-open"></i> ห้อง <span id="roomName">...</span>
                    </span>
                    <span class="bg-white/20 px-3 py-1 md:px-4 md:py-1.5 rounded-lg md:rounded-xl text-[11px] md:text-sm flex items-center gap-1.5 font-sans border border-white/10" id="semesterBadge">
                        <i class="fas fa-calendar-alt"></i> เทอม <span id="termYear">.../...</span>
                    </span>
                </div>
                <div id="studentProgressContainer" class="hidden w-full max-w-md mt-5">
                    <div class="flex justify-between text-xs text-white/90 font-bold mb-1.5 font-sans"><span>ความคืบหน้า</span><span id="studentProgressText">0/0 (0%)</span></div>
                    <div class="w-full bg-white/20 rounded-full h-2.5 overflow-hidden border border-white/10"><div id="studentProgressBar" class="bg-yellow-400 h-2.5 rounded-full transition-all duration-700" style="width: 0%;"></div></div>
                </div>
            </div>
            <div class="flex gap-3 w-full md:w-auto shrink-0 mt-1 md:mt-0">
                <div onclick="goToStudents()" class="bg-white/10 hover:bg-white/20 transition-colors backdrop-blur-md rounded-2xl p-4 md:p-5 border border-white/20 text-center flex-1 md:min-w-[120px] shadow-lg cursor-pointer">

                    <p id="studentCount" class="text-xl md:text-3xl font-black m-0 leading-none">0</p>
                </div>
                <div class="bg-white/10 backdrop-blur-md rounded-2xl p-4 md:p-5 border border-white/20 text-center flex-1 md:min-w-[120px] shadow-lg">
                    <p class="text-[10px] md:text-[11px] font-bold uppercase tracking-widest opacity-80 mb-1">ภารกิจ</p>
                    <p id="missionCount" class="text-xl md:text-3xl font-black m-0 leading-none">0</p>
                </div>
            </div>
        </div>
        <div class="absolute -right-10 -bottom-10 md:-right-20 md:-bottom-20 w-40 h-40 md:w-80 md:h-80 bg-white/10 rounded-full blur-2xl md:blur-3xl pointer-events-none"></div>
    </header>

    <main class="flex-grow container mx-auto px-4 md:px-6 pb-12 max-w-5xl relative">
        <div id="viewFolderGrid">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-lg md:text-xl font-bold text-[var(--primary)] font-['Kanit'] m-0"><i class="fas fa-folder-open text-[var(--accent)] mr-2"></i> หมวดหมู่บทเรียน</h2>
                <button type="button" onclick="toggleManageMode()" id="startManageBtn" class="hidden items-center justify-center gap-2 bg-white border-2 border-[var(--primary)] text-[var(--primary)] hover:bg-[var(--primary)] hover:text-white px-4 py-1.5 md:px-5 md:py-2 rounded-xl font-bold font-['Kanit'] transition-all shadow-sm cursor-pointer text-sm">
                    <i class="fas fa-cog text-lg md:text-base"></i> <span class="hidden sm:inline">จัดการเนื้อหา</span>
                </button>
            </div>
            <div id="folderGridContent" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6"></div>
        </div>

        <div id="viewMissionPath" class="hidden-el">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 border-b border-slate-200 pb-4 gap-4">
                <button type="button" onclick="backToFolders()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl font-bold font-['Kanit'] transition-colors border-none cursor-pointer shadow-sm flex items-center gap-2 text-sm">
                    <i class="fas fa-arrow-left"></i> กลับไปหมวดหมู่
                </button>
                <div class="flex items-center gap-3">
                    <h2 id="currentFolderNameDisplay" class="text-lg md:text-xl font-bold text-[var(--primary)] font-['Kanit'] m-0">...</h2>
                </div>
            </div>
            <div id="missionListContent" class="mission-syllabus-container"></div>
        </div>

        <div id="viewManageMode" class="hidden-el">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 bg-[#f0f4ff] p-4 md:p-5 rounded-2xl border border-blue-100 gap-4">
                <div><h2 class="text-lg md:text-xl font-bold text-[var(--primary)] font-['Kanit']"><i class="fas fa-cogs text-[var(--primary-light)] mr-2"></i> จัดการโครงสร้างเนื้อหา</h2></div>
                <div class="flex gap-2 w-full md:w-auto">
                    <button type="button" onclick="exitManageMode()" class="flex-1 md:flex-none justify-center bg-white border border-slate-200 text-slate-500 hover:bg-slate-100 px-4 py-2 rounded-xl text-sm font-bold shadow-sm cursor-pointer border-none flex items-center gap-2"><i class="fas fa-arrow-left"></i> ย้อนกลับ</button>
                    <button type="button" onclick="handleAddFolderPrompt()" class="flex-1 md:flex-none justify-center bg-white border border-blue-200 text-[var(--primary-light)] hover:bg-[var(--primary-light)] hover:text-white px-4 py-2 rounded-xl text-sm font-bold shadow-sm cursor-pointer border-none flex items-center gap-2"><i class="fas fa-folder-plus"></i> เพิ่มหมวดหมู่</button>
                    <button type="button" onclick="saveNewOrderAndFolders()" class="flex-1 md:flex-none justify-center bg-emerald-500 border border-emerald-500 text-white hover:bg-emerald-600 px-4 py-2 rounded-xl text-sm font-bold shadow-sm cursor-pointer border-none flex items-center gap-2">บันทึก</button>
                </div>
            </div>
            <div id="manageContent" class="space-y-6"></div>
        </div>
    </main>

    <button type="button" id="fabAddBtn" onclick="handleFabAddMission()" class="fab-add hidden-el" title="เพิ่มภารกิจใหม่"><i class="fas fa-plus"></i></button>

    <footer class="footer footer-display-text"></footer>

    <script>
        let currentUserId = null, currentClassId = new URLSearchParams(window.location.search).get('id'), isClassOwner = false, missions = [], folders = [], isManageMode = false, currentOpenedFolder = null;
        window.studentCompletedMissions = [];

        document.addEventListener('DOMContentLoaded', async () => {
            const checkDB = setInterval(() => { if (window.sysDB && window.sysDB.auth) { clearInterval(checkDB); initApp(); } }, 300);
        });

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 80) nav.classList.add('scrolled'); else if (window.scrollY < 15) nav.classList.remove('scrolled');
        });

        async function initApp() {
            try {
                const { data: { session } } = await sysDB.auth.getSession();
                currentUserId = session?.user?.id || localStorage.getItem('flip_student_session_id');
                if (!currentUserId) return window.location.replace('login.html');
                if (typeof initAppUI === 'function') initAppUI();
                await fetchFreshData();
            } catch (err) { console.error(err); document.getElementById('loadingOverlay').style.display = 'none'; }
        }

        async function fetchFreshData() {
            try {
                // 1. Profile
                const { data: u } = await sysDB.from('users').select('*').eq('user_id', currentUserId).maybeSingle();
                if (u) {
                    const pic = u.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${u.first_name}`;
                    document.getElementById('navProfileImg').src = pic; document.getElementById('sidebarProfileImg').src = pic;
                    document.getElementById('sidebarName').innerText = `${u.first_name} ${u.last_name || ''}`;
                    document.getElementById('sidebarEmail').innerText = u.email || '';
                }

                // 2. Classroom
                const { data: cls, error: clsErr } = await sysDB.from('classrooms').select('*').eq('classroom_id', currentClassId).single();
                if (clsErr || !cls) throw new Error("ไม่พบห้องเรียน");
                
                document.getElementById('subjectName').innerText = cls.subject_name;
                document.getElementById('roomName').innerText = cls.room_name;
                document.getElementById('termYear').innerText = `${cls.semester || '-'}/${cls.academic_year || '-'}`;
                
                let ownerCol = cls.hasOwnProperty('owner_id') ? 'owner_id' : 'teacher_id';
                isClassOwner = (cls[ownerCol] === currentUserId);
                if (isClassOwner) document.getElementById('startManageBtn').classList.remove('hidden');

                // 3. Missions (Robust Query)
                let query = sysDB.from('classroom_missions').select('*, missions(*)').eq('classroom_id', currentClassId);
                const { data: misData, error: misErr } = await query;
                
                if (!misErr && misData) {
                    missions = misData.filter(m => m.missions).sort((a,b) => (a.order_index || 0) - (b.order_index || 0));
                    folders = (cls.folders && Array.isArray(cls.folders)) ? cls.folders : [...new Set(missions.map(m => m.folder_name).filter(Boolean))];
                    if (folders.length === 0) folders = ['ทั่วไป'];
                    document.getElementById('missionCount').innerText = missions.length;
                    
                    if (!isClassOwner) {
                        const { data: prog } = await sysDB.from('mission_progress').select('mission_id').eq('student_id', currentUserId).eq('status', 'completed');
                        window.studentCompletedMissions = prog ? prog.map(p => p.mission_id) : [];
                        
                        // Progress Bar
                        const validMissions = missions.filter(m => m.is_published !== false);
                        if (validMissions.length > 0) {
                            const completed = validMissions.filter(m => window.studentCompletedMissions.includes(m.mission_id)).length;
                            const pct = Math.round((completed / validMissions.length) * 100);
                            document.getElementById('studentProgressBar').style.width = pct + '%';
                            document.getElementById('studentProgressText').innerText = `${completed}/${validMissions.length} (${pct}%)`;
                            document.getElementById('studentProgressContainer').classList.remove('hidden');
                        }
                    }
                }

                // 4. Student Count
                let userColName = 'user_id';
                const { error: testColErr } = await sysDB.from('classroom_users').select('user_id').limit(1);
                if (testColErr) userColName = 'student_id';
                const { count } = await sysDB.from('classroom_users').select('*', { count: 'exact', head: true }).eq('classroom_id', currentClassId);
                document.getElementById('studentCount').innerText = count || 0;

                if (isManageMode) renderAdminManageView(); else if (currentOpenedFolder) openFolder(currentOpenedFolder); else showFolderGrid();

            } catch (err) { console.error(err); } finally { document.getElementById('loadingOverlay').style.display = 'none'; }
        }

        function showFolderGrid() {
            currentOpenedFolder = null;
            document.getElementById('viewFolderGrid').classList.remove('hidden-el');
            document.getElementById('viewMissionPath').classList.add('hidden-el');
            document.getElementById('viewManageMode').classList.add('hidden-el');
            document.getElementById('fabAddBtn').classList.toggle('hidden-el', !isClassOwner);

            const grid = document.getElementById('folderGridContent');
            grid.innerHTML = folders.map(f => {
                const folderMissions = missions.filter(m => (m.folder_name || 'ทั่วไป') === f && (isClassOwner || m.is_published !== false));
                return `<div class="folder-card group" onclick="openFolder('${f}')">
                    <div class="folder-icon-box group-hover:scale-110 transition-transform"><i class="fas fa-folder"></i></div>
                    <div><h3 class="text-lg md:text-xl font-bold text-slate-800 font-['Kanit']">${f}</h3><p class="text-xs md:text-sm text-slate-500">${folderMissions.length} ภารกิจ</p></div>
                </div>`;
            }).join('');
        }

        function openFolder(f) {
            currentOpenedFolder = f;
            document.getElementById('viewFolderGrid').classList.add('hidden-el');
            document.getElementById('viewMissionPath').classList.remove('hidden-el');
            document.getElementById('currentFolderNameDisplay').innerText = f;
            
            const container = document.getElementById('missionListContent');
            let folderMissions = missions.filter(m => (m.folder_name || 'ทั่วไป') === f);
            if (!isClassOwner) folderMissions = folderMissions.filter(m => m.is_published !== false);

            if (folderMissions.length === 0) {
                container.innerHTML = `<div class="py-20 opacity-30 text-center"><i class="fas fa-box-open text-5xl mb-4"></i><h3 class="font-bold text-slate-500">หมวดหมู่นี้ยังว่างเปล่า</h3></div>`;
                return;
            }

            container.innerHTML = folderMissions.map((m, idx) => {
                const title = m.custom_title || m.missions?.title || 'ไม่มีชื่อ';
                const type = m.missions?.mission_type || 'quiz';
                const isDone = !isClassOwner && window.studentCompletedMissions.includes(m.mission_id);
                const color = { quiz:'#f43f5e', match:'#10b981', ai_generated:'#8b5cf6', html_custom:'#3b82f6', default: 'var(--primary)' }[type] || 'var(--primary)';

                return `<div class="syllabus-item group playable" onclick="location.href='mission-play.html?mid=${m.mission_id}'">
                    <div class="syllabus-connector"></div>
                    <div class="syllabus-number ${isDone ? 'done bg-emerald-500 text-white' : 'bg-slate-50 text-slate-400'}">${isDone ? '<i class="fas fa-check"></i>' : idx + 1}</div>
                    <div class="syllabus-card">
                        <div class="syllabus-icon" style="background: ${color}15; color: ${color};"><i class="${{ quiz:'fas fa-tasks', match:'fas fa-clone', ai_generated:'fas fa-robot', html_custom:'fas fa-code' }[type] || 'fas fa-star'}"></i></div>
                        <div class="flex-1 truncate"><h3 class="font-bold text-slate-800 text-base md:text-lg truncate m-0">${title}</h3></div>
                        <div class="bg-amber-50 text-amber-600 px-3 py-1 rounded-lg font-bold text-xs"><i class="fas fa-star mr-1"></i>${m.missions?.reward_points || 10}</div>
                    </div>
                </div>`;
            }).join('');
        }

        function toggleManageMode() { isManageMode = true; renderAdminManageView(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function exitManageMode() { isManageMode = false; document.getElementById('viewManageMode').classList.add('hidden-el'); fetchFreshData(); }
        function backToFolders() { showFolderGrid(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

        function renderAdminManageView() {
            document.getElementById('viewFolderGrid').classList.add('hidden-el');
            document.getElementById('viewMissionPath').classList.add('hidden-el');
            document.getElementById('viewManageMode').classList.remove('hidden-el');
            
            const container = document.getElementById('manageContent');
            container.innerHTML = folders.map(f => {
                const folderMissions = missions.filter(m => (m.folder_name || 'ทั่วไป') === f);
                return `<div class="admin-folder-box" data-folder="${f}">
                    <div class="flex justify-between items-center mb-4 border-b pb-2">
                        <h3 class="font-bold font-['Kanit'] text-slate-800">${f}</h3>
                        <div class="flex gap-2">
                            <button type="button" onclick="handleRenameFolder('${f}')" class="text-amber-500 border-none bg-transparent cursor-pointer"><i class="fas fa-edit"></i></button>
                            ${f !== 'ทั่วไป' ? `<button type="button" onclick="handleDeleteFolder('${f}')" class="text-rose-500 border-none bg-transparent cursor-pointer"><i class="fas fa-trash-alt"></i></button>` : ''}
                        </div>
                    </div>
                    <div class="admin-mission-list sortable-list" data-folder="${f}">
                        ${folderMissions.map(m => `<div class="admin-mission-item" data-id="${m.assignment_id}"><i class="fas fa-grip-vertical drag-handle-icon"></i><div class="flex-1 truncate font-bold text-slate-700">${m.custom_title || m.missions?.title}</div><button type="button" onclick="handleRemoveMission('${m.assignment_id}', '${m.custom_title || m.missions?.title}')" class="text-rose-500 border-none bg-transparent cursor-pointer"><i class="fas fa-minus-circle"></i></button></div>`).join('')}
                    </div>
                </div>`;
            }).join('');
            document.querySelectorAll('.sortable-list').forEach(el => new Sortable(el, { group: 'shared', animation: 150, handle: '.drag-handle-icon' }));
        }

        async function saveNewOrderAndFolders() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                if (deletedAssignments.length > 0) { await sysDB.from('classroom_missions').delete().in('assignment_id', deletedAssignments); deletedAssignments = []; }
                const updates = [];
                document.querySelectorAll('.admin-folder-box').forEach(box => {
                    const fName = box.getAttribute('data-folder');
                    box.querySelectorAll('.admin-mission-item').forEach((item, idx) => {
                        updates.push(sysDB.from('classroom_missions').update({ order_index: idx, folder_name: fName }).eq('assignment_id', item.getAttribute('data-id')));
                    });
                });
                await Promise.all(updates);
                await sysDB.from('classrooms').update({ folders: folders }).eq('classroom_id', currentClassId);
                showCustomAlert("บันทึกสำเร็จ", "success", () => exitManageMode());
            } catch (err) { showCustomAlert("บันทึกไม่สำเร็จ", "error"); }
        }

        function toggleDrawer() { document.getElementById('sideDrawer').classList.toggle('translate-x-full'); document.getElementById('drawerOverlay').classList.toggle('hidden'); document.getElementById('drawerOverlay').classList.toggle('opacity-0'); }
        function handleLogout() { showCustomAlert("ต้องการออกจากระบบใช่หรือไม่?", "confirm", async () => { await sysDB.auth.signOut(); localStorage.clear(); location.href = 'login.html'; }); }
        function goToStudents() { location.href = `student-list.html?id=${currentClassId}`; }
        function handleFabAddMission() { location.href = `mission-create.html?cid=${currentClassId}&folder=${encodeURIComponent(currentOpenedFolder || 'ทั่วไป')}`; }
        function handleRemoveMission(id, title) { showCustomAlert(`ลบภารกิจ <b>"${title}"</b> จากห้อง?`, 'confirm', () => { deletedAssignments.push(id); document.querySelector(`[data-id="${id}"]`).remove(); }); }
        
        let promptCallback = null;
        function openCustomPrompt(title, placeholder, cb, val='', icon='fas fa-folder-plus') { document.getElementById('promptTitle').innerText = title; document.getElementById('promptInputVal').placeholder = placeholder; document.getElementById('promptInputVal').value = val; promptCallback = cb; document.getElementById('promptIcon').className = icon; document.getElementById('customPromptModal').style.display = 'flex'; setTimeout(() => { document.getElementById('customPromptModal').style.opacity = '1'; document.getElementById('customPromptCard').classList.remove('scale-95', 'opacity-0'); document.getElementById('promptInputVal').focus(); }, 10); }
        function closeCustomPrompt() { document.getElementById('customPromptModal').style.opacity = '0'; document.getElementById('customPromptCard').classList.add('scale-95', 'opacity-0'); setTimeout(() => document.getElementById('customPromptModal').style.display = 'none', 300); }
        function executeCustomPrompt() { if(promptCallback) promptCallback(document.getElementById('promptInputVal').value); closeCustomPrompt(); }
        function handleAddFolderPrompt() { openCustomPrompt('สร้างหมวดหมู่ใหม่', 'ระบุชื่อ...', (n) => { if(n.trim()) { folders.push(n.trim()); renderAdminManageView(); } }); }
        function handleRenameFolder(old) { openCustomPrompt('แก้ไขชื่อหมวดหมู่', 'ระบุชื่อใหม่...', (n) => { if(n.trim() && n !== old) { const i = folders.indexOf(old); if(i!==-1) folders[i] = n; missions.forEach(m => { if((m.folder_name||'ทั่วไป')===old) m.folder_name = n; }); renderAdminManageView(); } }, old, 'fas fa-edit'); }
        function handleDeleteFolder(f) { showCustomAlert(`ลบหมวดหมู่ <b>"${f}"</b>? ภารกิจข้างในจะย้ายไปที่ "ทั่วไป"`, 'confirm', () => { missions.forEach(m => { if((m.folder_name||'ทั่วไป')===f) m.folder_name = 'ทั่วไป'; }); folders = folders.filter(x => x !== f); if(!folders.includes('ทั่วไป')) folders.push('ทั่วไป'); renderAdminManageView(); }); }
    </script>
</body>
</html>
