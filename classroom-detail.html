<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>จัดการภารกิจห้องเรียน | FlipSchool</title>
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- Tailwind & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <!-- SortableJS สำหรับระบบ Drag & Drop -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <style>
        /* --- ธีมหลักและการตั้งค่าพื้นฐาน --- */
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
            --white: #ffffff;
        }

        body { 
            font-family: 'Sarabun', 'Kanit', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden; 
            background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%);
        }
        
        .nav-gradient { 
            background: var(--primary); 
            box-shadow: 0 4px 20px rgba(0,0,80,0.15); 
        }

        .header-gradient {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            box-shadow: 0 15px 30px rgba(0, 0, 139, 0.1);
        }
        
        /* --- รูปแบบการ์ดโฟลเดอร์ (หน้าแรก) ปรับให้ยืดหยุ่น --- */
        .folder-card {
            background: white; border-radius: clamp(1rem, 3vw, 1.5rem); 
            padding: clamp(1rem, 3vw, 1.5rem);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.03); 
            transition: all 0.3s ease; cursor: pointer; display: flex; align-items: center; gap: clamp(0.75rem, 2vw, 1rem);
        }
        .folder-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08); border-color: var(--primary-light); }
        .folder-icon-box {
            width: clamp(50px, 12vw, 60px); height: clamp(50px, 12vw, 60px); border-radius: clamp(0.75rem, 2vw, 1rem);
            display: flex; align-items: center; justify-content: center; font-size: clamp(1.5rem, 5vw, 1.8rem);
            background: #f0f4ff; color: var(--primary-light); flex-shrink: 0;
        }

        /* --- รูปแบบเส้นทางภารกิจ (เมื่อเข้าโฟลเดอร์) --- */
        .mission-path { position: relative; padding: 20px 0 60px 0; display: flex; flex-direction: column; align-items: center; min-height: 300px; }
        .mission-path::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 8px; background: #e2e8f0; transform: translateX(-50%); border-radius: 4px; z-index: 0; }
        
        .mission-node { position: relative; z-index: 10; margin-bottom: clamp(30px, 6vw, 50px); display: flex; flex-direction: column; align-items: center; width: 100%; transition: all 0.3s ease; }
        .node-circle { 
            width: clamp(65px, 15vw, 85px); height: clamp(65px, 15vw, 85px); background: white; border-radius: clamp(20px, 5vw, 28px); 
            display: flex; align-items: center; justify-content: center; font-size: clamp(24px, 6vw, 32px); 
            color: var(--primary); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); 
            border: 4px solid white; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            cursor: pointer; position: relative;
        }
        .mission-node:hover .node-circle { transform: scale(1.1) rotate(5deg); border-color: var(--accent); color: var(--accent); }
        
        .node-content { 
            background: white; padding: clamp(12px, 3vw, 18px) clamp(16px, 4vw, 25px); border-radius: clamp(16px, 4vw, 24px); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); margin-top: 15px; 
            text-align: center; min-width: clamp(220px, 60vw, 260px); max-width: 320px; border: 1px solid rgba(0,0,0,0.02); 
        }

        /* --- โหมดจัดการ (โชว์กล่องลากวาง) --- */
        .admin-folder-box {
            background: white; border-radius: clamp(1rem, 3vw, 1.5rem); padding: clamp(1rem, 3vw, 1.5rem); margin-bottom: 2rem;
            border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 30px rgba(0,0,0,0.03);
        }
        .admin-mission-list {
            min-height: 100px; padding: clamp(0.5rem, 2vw, 1rem); border-radius: 1rem;
            background: #f8fafc; border: 2px dashed #cbd5e1;
            display: flex; flex-direction: column; gap: 0.5rem; transition: background 0.2s;
        }
        .admin-mission-list.sortable-drag { background: #e0e8ff; border-color: var(--primary-light); }
        
        .admin-mission-item {
            background: white; border-radius: 0.75rem; padding: clamp(0.75rem, 2vw, 1rem);
            border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            display: flex; align-items: center; gap: clamp(0.5rem, 2vw, 1rem); cursor: grab;
        }
        .admin-mission-item:active { cursor: grabbing; }
        .drag-handle-icon { color: #94a3b8; font-size: 1.2rem; cursor: grab; }

        .hidden-el { display: none !important; }
        .drawer-overlay { background: rgba(0,0,0, 0.5); backdrop-filter: blur(4px); }
        .modal-overlay { background: rgba(0,0,0, 0.6); backdrop-filter: blur(4px); }
        .spinner { width: 40px; height: 40px; border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        
        /* ปุ่มเพิ่มภารกิจแบบลอย (FAB) */
        .fab-add { position: fixed; bottom: 50px; right: 50px; width: clamp(60px, 15vw, 70px); height: clamp(60px, 15vw, 70px); background: var(--accent); color: white; border-radius: 50%; border:none; font-size: clamp(24px, 6vw, 32px); cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4); text-decoration: none; transition: 0.3s; }
        .fab-add:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px rgba(255, 140, 0, 0.5); }
        
        /* ปุ่มจัดการ Theme */
        .btn-theme { background-color: var(--primary); color: white; transition: 0.3s; box-shadow: 0 4px 10px rgba(0, 0, 139, 0.2); }
        .btn-theme:hover { background-color: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 139, 0.3); }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes bounceIn { 0% { transform: translateY(-20px); opacity: 0; } 50% { transform: translateY(5px); opacity: 1; } 100% { transform: translateY(0); opacity: 1; } }
        .animate-bounce-in { animation: bounceIn 0.4s ease-out forwards; }

        @media (max-width: 768px) {
            .fab-add { bottom: 30px; right: 30px; }
            .mission-path::before { left: 50px; } /* ปรับเส้นให้อยู่ชิดซ้ายเวลาจอมือถือเพื่อไม่ให้เบียด */
            .mission-node { flex-direction: row; gap: 20px; align-items: center; }
            .mission-node:nth-child(even) { flex-direction: row; }
            .node-content { margin-top: 0; text-align: left; padding: 15px; flex: 1; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center">
        <div class="spinner"></div>
        <p class="mt-4 text-[var(--primary)] font-bold animate-pulse text-sm font-sans" id="loadingText">กำลังโหลดข้อมูล...</p>
    </div>

    <!-- กล่องข้อความแจ้งเตือน Toast -->
    <div id="msgBox" class="fixed top-20 right-5 z-[210] hidden bg-white border-l-4 shadow-lg rounded-xl p-4 transition-all animate-bounce-in">
        <p id="msgText" class="text-sm font-bold text-slate-700"></p>
    </div>

    <!-- 🌟 Modal แบบฟอร์มรับค่า (Custom Prompt) 🌟 -->
    <div id="customPromptModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-[90vw] md:max-w-sm p-6 md:p-8 shadow-2xl transform transition-all scale-95 opacity-0 text-center" id="customPromptCard">
            <div id="promptIconBox" class="w-16 h-16 bg-[#f0f4ff] text-[var(--primary-light)] rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i id="promptIcon" class="fas fa-folder-plus"></i>
            </div>
            <h3 id="promptTitle" class="text-xl font-bold text-slate-800 mb-2 font-sans">สร้างหมวดหมู่</h3>
            <p id="promptSubtitle" class="text-xs text-slate-500 mb-4 hidden-el"></p>
            <input type="text" id="promptInputVal" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-[var(--primary-light)] text-center mb-6 font-bold text-slate-700 font-sans" placeholder="...">
            <div class="flex gap-3">
                <button onclick="closeCustomPrompt()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all font-sans">ยกเลิก</button>
                <button onclick="executeCustomPrompt()" class="flex-1 btn-theme font-bold py-3 rounded-xl transition-all active:scale-95 font-sans">ตกลง</button>
            </div>
        </div>
    </div>

    <!-- 🌟 Modal ยืนยันการกระทำ (Custom Confirm) 🌟 -->
    <div id="customConfirmModal" class="fixed inset-0 z-[150] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-[90vw] md:max-w-sm p-6 md:p-8 shadow-2xl transform transition-all scale-95 opacity-0 text-center" id="customConfirmCard">
            <div id="confirmIconBox" class="w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl">
                <i id="confirmIcon" class="fas fa-exclamation-triangle"></i>
            </div>
            <h3 id="confirmTitle" class="text-xl font-bold text-slate-800 mb-2 font-sans">ยืนยัน</h3>
            <p id="confirmMessage" class="text-sm text-slate-500 mb-6 font-sans leading-relaxed"></p>
            <div class="flex gap-3">
                <button onclick="closeCustomConfirm()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold py-3 rounded-xl transition-all font-sans">ยกเลิก</button>
                <button id="confirmActionBtn" onclick="executeCustomConfirm()" class="flex-1 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95 font-sans">ยืนยัน</button>
            </div>
        </div>
    </div>

    <!-- Drawer Menu -->
    <div id="drawerOverlay" onclick="toggleDrawer()" class="fixed inset-0 z-[1000] hidden drawer-overlay transition-opacity duration-300"></div>
    <div id="sideDrawer" class="fixed top-0 left-0 h-full w-[85vw] max-w-[320px] bg-white z-[1001] shadow-2xl transform -translate-x-full transition-transform duration-300 ease-in-out rounded-r-3xl">
        <div class="p-6 border-b border-slate-100 flex items-center gap-4">
            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center shadow-lg border border-slate-100 shrink-0">
                <span class="text-2xl text-[var(--primary)]">🎓</span>
            </div>
            <div>
                <h2 class="font-bold text-slate-800 text-lg font-['Kanit']">Flip<span class="text-[var(--accent)]">School</span></h2>
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-wider">Teacher Panel</p>
            </div>
        </div>
        <nav class="mt-4 px-4 space-y-2">
            <a href="teacher-dashboard.html" class="flex items-center gap-3 p-4 rounded-2xl hover:bg-[#f0f4ff] text-slate-600 hover:text-[var(--primary)] font-bold transition-all"><i class="fas fa-th-large w-5"></i> แดชบอร์ด</a>
            <a href="#" onclick="goToStudents()" class="flex items-center gap-3 p-4 rounded-2xl hover:bg-[#f0f4ff] text-slate-600 hover:text-[var(--primary)] font-bold transition-all"><i class="fas fa-users w-5"></i> รายชื่อนักเรียน</a>
            <hr class="my-4 border-slate-100">
            <button onclick="handleLogout()" class="w-full flex items-center gap-3 p-4 rounded-2xl hover:bg-rose-50 text-rose-500 font-bold transition-all"><i class="fas fa-sign-out-alt w-5"></i> ออกจากระบบ</button>
        </nav>
    </div>

    <!-- Navbar -->
    <nav class="nav-gradient h-[75px] md:h-[90px] sticky top-0 z-50 px-4 md:px-8 flex items-center justify-between">
        <div class="flex items-center gap-3 md:gap-4">
            <button onclick="toggleDrawer()" class="w-10 h-10 flex items-center justify-center hover:bg-white/10 rounded-full transition-all text-white">
                <i class="fas fa-bars text-xl"></i>
            </button>
            <div class="flex items-center gap-3 cursor-pointer" onclick="location.href='teacher-dashboard.html'">
                <div class="w-[40px] h-[40px] md:w-[52px] md:h-[52px] bg-white rounded-xl flex items-center justify-center shadow-[0_4px_12px_rgba(0,0,0,0.2)] shrink-0">
                    <span class="text-xl md:text-3xl text-[var(--text-main)]">🎓</span>
                </div>
                <div class="flex flex-col">
                    <div id="app-name-display" class="text-xl md:text-[26px] font-bold tracking-tight leading-none text-white font-['Kanit']">
                        <span>Flip</span><span class="text-[var(--accent)]">School</span>
                    </div>
                    <span class="app-slogan-label text-[10px] md:text-[13px] text-[#e0e8ff] font-medium mt-0.5 tracking-wide opacity-90 italic font-['Sarabun'] hidden md:block"></span>
                </div>
            </div>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="toggleManageMode()" id="manageModeBtn" class="hidden md:flex items-center gap-2 bg-white/10 hover:bg-white/20 px-5 py-2 rounded-xl text-xs font-bold text-white transition-all border border-white/20">
                <i class="fas fa-cog"></i> จัดการเนื้อหา
            </button>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="header-gradient text-white py-8 md:py-12 px-6 md:px-12 relative overflow-hidden rounded-b-[1.5rem] md:rounded-b-[2rem] shadow-sm mb-6">
        <div class="container mx-auto relative z-10">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-6 md:gap-8">
                <div>
                    <h1 id="subjectName" class="text-2xl md:text-4xl font-extrabold tracking-tight font-['Kanit']">กำลังโหลด...</h1>
                    <div class="flex flex-wrap items-center gap-4 mt-3 md:mt-4 opacity-90 font-medium">
                        <span class="bg-white/20 px-3 py-1.5 md:px-4 md:py-1.5 rounded-xl text-xs md:text-sm flex items-center gap-2 font-sans">
                            <i class="fas fa-door-open"></i> ห้อง <span id="roomName">...</span>
                        </span>
                    </div>
                </div>
                <div class="flex gap-3 md:gap-4 self-start md:self-auto">
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl md:rounded-3xl p-4 md:p-6 border border-white/20 text-center min-w-[100px] md:min-w-[120px] shadow-xl">
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-70 mb-1">นักเรียน</p>
                        <p id="studentCount" class="text-2xl md:text-3xl font-black">0</p>
                    </div>
                    <div class="bg-white/10 backdrop-blur-md rounded-2xl md:rounded-3xl p-4 md:p-6 border border-white/20 text-center min-w-[100px] md:min-w-[120px] shadow-xl">
                        <p class="text-[10px] font-bold uppercase tracking-widest opacity-70 mb-1">ภารกิจ</p>
                        <p id="missionCount" class="text-2xl md:text-3xl font-black">0</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute -right-20 -bottom-20 w-80 h-80 bg-white/5 rounded-full blur-3xl"></div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 md:px-6 pb-12 max-w-5xl relative">
        
        <!-- โหมด 1: หน้าจอแสดงโฟลเดอร์ทั้งหมด (Folder Grid View) -->
        <div id="viewFolderGrid">
            <h2 class="text-lg md:text-xl font-bold text-[var(--primary)] mb-6 font-['Kanit']"><i class="fas fa-folder-open text-[var(--accent)] mr-2"></i> หมวดหมู่บทเรียน</h2>
            <div id="folderGridContent" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 md:gap-6">
                <!-- Data goes here -->
            </div>
            <!-- ปุ่มจัดการเนื้อหาบนมือถือ -->
            <div class="mt-8 text-center md:hidden">
                <button onclick="toggleManageMode()" class="w-full max-w-xs mx-auto flex justify-center items-center gap-2 bg-[#f0f4ff] text-[var(--primary)] hover:bg-[#e0e8ff] px-5 py-3 rounded-xl text-sm font-bold transition-all border border-blue-100">
                    <i class="fas fa-cog"></i> จัดการโครงสร้างเนื้อหา
                </button>
            </div>
        </div>

        <!-- โหมด 2: หน้าจอแสดงภารกิจในโฟลเดอร์ที่เลือก (Mission Path View) -->
        <div id="viewMissionPath" class="hidden-el">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between mb-4 border-b border-slate-200 pb-4 gap-4">
                <button onclick="backToFolders()" class="text-slate-500 hover:text-[var(--primary)] font-bold transition flex items-center gap-2 self-start">
                    <i class="fas fa-arrow-left"></i> กลับไปหมวดหมู่
                </button>
                <div class="flex items-center gap-3">
                    <h2 id="currentFolderNameDisplay" class="text-lg md:text-xl font-bold text-[var(--primary)] font-['Kanit']">ชื่อโฟลเดอร์</h2>
                </div>
            </div>
            <div id="missionPath" class="mission-path">
                <div id="missionListContent" class="w-full flex flex-col md:items-center">
                    <!-- Data goes here -->
                </div>
            </div>
        </div>

        <!-- โหมด 3: โหมดจัดการเนื้อหา (Admin Manage View - Drag & Drop) -->
        <div id="viewManageMode" class="hidden-el">
            <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 bg-[#f0f4ff] p-4 md:p-5 rounded-2xl border border-blue-100 gap-4">
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-[var(--primary)] font-['Kanit']"><i class="fas fa-cogs text-[var(--primary-light)] mr-2"></i> จัดการโครงสร้างห้องเรียน</h2>
                    <p class="text-xs md:text-sm text-slate-500 mt-1">ลากย้ายสลับที่ได้อิสระ หรือกดถังขยะเพื่อนำภารกิจออกจากห้องเรียน</p>
                </div>
                <div class="flex flex-wrap gap-2 self-start md:self-center w-full md:w-auto">
                    <!-- 🌟 ปุ่มยกเลิกการแก้ไข (ใหม่) -->
                    <button onclick="cancelManageMode()" class="flex-1 md:flex-none justify-center bg-white border border-slate-200 text-slate-500 hover:bg-slate-100 hover:text-slate-700 px-4 py-2.5 md:py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-undo"></i> ยกเลิก
                    </button>
                    <!-- ปุ่มเพิ่มหมวดหมู่ -->
                    <button onclick="handleAddFolderPrompt()" class="flex-1 md:flex-none justify-center bg-white border border-blue-200 text-[var(--primary-light)] hover:bg-[var(--primary-light)] hover:text-white px-4 py-2.5 md:py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-folder-plus"></i> เพิ่มหมวดหมู่
                    </button>
                    <!-- ปุ่มลบห้องเรียน -->
                    <button onclick="handleDeleteClassroom()" class="w-full md:w-auto justify-center mt-2 md:mt-0 bg-white border border-rose-200 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-2.5 md:py-2 rounded-xl text-sm font-bold transition-all shadow-sm flex items-center gap-2 whitespace-nowrap">
                        <i class="fas fa-trash-alt"></i> ลบห้องเรียน
                    </button>
                </div>
            </div>
            
            <div id="manageContent" class="space-y-6">
                <!-- Manage Data goes here -->
            </div>
            
            <!-- ปุ่มบันทึกข้อมูลโหมดมือถือ -->
            <div class="mt-8 text-center md:hidden sticky bottom-4 z-[100]">
                <button onclick="toggleManageMode()" class="w-full bg-emerald-500 text-white hover:bg-emerald-600 shadow-[0_10px_25px_rgba(16,185,129,0.3)] px-5 py-3.5 rounded-2xl text-base font-bold transition-all border border-emerald-400 flex justify-center items-center gap-2">
                    <i class="fas fa-save"></i> บันทึกข้อมูลโครงสร้าง
                </button>
            </div>
        </div>

    </main>

    <!-- ปุ่มเพิ่มภารกิจแบบลอย (FAB) มุมขวาล่าง -->
    <button id="fabAddBtn" onclick="handleFabAddMission()" class="fab-add hidden-el" title="เพิ่ม/สร้างภารกิจใหม่">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-8 md:py-10 text-center mt-auto">
        <p class="text-[var(--primary)] font-bold mb-1 italic font-sans text-xs md:text-sm">© <span id="currentYear"></span> FlipSchool. <span class="app-slogan-label"></span></p>
        <p id="footerOwnerText" class="text-slate-400 text-[10px] font-bold uppercase tracking-widest"></p>
    </footer>

    <script>
        let currentUserId = null;
        let currentClassId = null;
        let missions = [];
        let folders = []; 
        let isManageMode = false;
        let sortableInstances = [];
        let deletedAssignments = []; 
        
        let currentOpenedFolder = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            currentClassId = params.get('id');
            if (!currentClassId) return location.href = 'teacher-dashboard.html';

            // 🌟 แก้ไข: เรียกใช้ APP_CONFIG และ initAppUI() ให้ถูกต้อง
            if (typeof APP_CONFIG !== 'undefined') {
                document.getElementById('currentYear').innerText = APP_CONFIG.YEAR || new Date().getFullYear();
                document.querySelectorAll('.app-slogan-label').forEach(el => el.innerText = APP_CONFIG.APP_SLOGAN);
                document.getElementById('footerOwnerText').innerText = `${APP_CONFIG.OWNER.NAME} | ${APP_CONFIG.OWNER.SCHOOL}`;
                
                // เรียกใช้ฟังก์ชันอัปเดต UI พื้นฐานจาก config.js
                if (typeof initAppUI === 'function') initAppUI();
            }

            document.getElementById('promptInputVal').addEventListener('keypress', (e) => {
                if(e.key === 'Enter') executeCustomPrompt();
            });

            const checkDB = setInterval(() => { if (window.sysDB) { clearInterval(checkDB); initApp(); } }, 500);
        });

        async function initApp() {
            try {
                const { data: { user } } = await window.sysDB.auth.getUser();
                if (!user) return location.href = 'teacher-login.html';
                currentUserId = user.id;
                await Promise.all([fetchProfile(), fetchClassroomData(), fetchMissions()]);
                document.getElementById('loadingOverlay').style.display = 'none';
            } catch (err) { console.error("Init Error:", err); }
        }

        async function fetchProfile() {
            const { data } = await window.sysDB.from('teachers').select('*').eq('teacher_id', currentUserId).single();
            // นำการแสดงรูปโปรไฟล์ออกแล้ว
        }

        async function fetchClassroomData() {
            const { data } = await window.sysDB.from('classrooms').select('*').eq('classroom_id', currentClassId).single();
            if (data) {
                document.getElementById('subjectName').innerText = data.subject_name;
                document.getElementById('roomName').innerText = data.room_name;
                
                // 🌟 อัปเดต Title Bar ให้แสดง "ชื่อวิชา | ชื่อแอปพลิเคชัน" อัตโนมัติ
                const appName = typeof APP_CONFIG !== 'undefined' ? APP_CONFIG.APP_NAME : 'FlipSchool';
                document.title = `${data.subject_name} | ${appName}`;
                
                if (data.folders && Array.isArray(data.folders)) {
                    folders = data.folders;
                }

                const { count } = await window.sysDB.from('classroom_students').select('*', { count: 'exact', head: true }).eq('classroom_id', currentClassId);
                document.getElementById('studentCount').innerText = count || 0;
            }
        }

        async function fetchMissions() {
            try {
                const { data, error } = await window.sysDB
                    .from('classroom_missions')
                    .select('assignment_id, mission_id, order_index, folder_name, custom_title, missions(*)') 
                    .eq('classroom_id', currentClassId);

                if (error) { console.error("Fetch Error:", error); return; }

                if (data) {
                    missions = data.filter(m => m.missions !== null);
                    missions.sort((a, b) => (a.order_index || 0) - (b.order_index || 0));

                    if (folders.length === 0) {
                        const uniqueFolders = [...new Set(missions.map(m => m.folder_name).filter(Boolean))];
                        folders = uniqueFolders.length > 0 ? uniqueFolders : ['ทั่วไป'];
                    }

                    document.getElementById('missionCount').innerText = missions.length;
                    document.getElementById('manageModeBtn').classList.remove('hidden');
                    
                    if (!isManageMode) showFolderGrid(); 
                }
            } catch (err) { console.error("Query Exception:", err); }
        }

        function getIcon(t) { return { quiz:'fas fa-tasks', ai_generated:'fas fa-robot', html_custom:'fas fa-code', match:'fas fa-clone', competition:'fas fa-trophy' }[t] || 'fas fa-star'; }

        // ==========================================
        // 🎯 เครื่องมือ UI (Toast & Modals)
        // ==========================================
        function showMessage(text, isError = false) {
            const box = document.getElementById('msgBox');
            document.getElementById('msgText').innerText = text;
            box.className = `fixed top-20 right-5 z-[210] bg-white border-l-4 ${isError ? 'border-rose-500' : 'border-emerald-500'} shadow-lg rounded-xl p-4 transition-all animate-bounce-in`;
            box.classList.remove('hidden');
            setTimeout(() => box.classList.add('hidden'), 3500);
        }

        let promptCallback = null;
        function openCustomPrompt(title, placeholder, callback, defaultValue = '', iconClass = 'fas fa-folder-plus', subtitle = '') {
            document.getElementById('promptTitle').innerText = title;
            const subtitleEl = document.getElementById('promptSubtitle');
            if (subtitle) {
                subtitleEl.innerText = subtitle;
                subtitleEl.classList.remove('hidden-el');
            } else {
                subtitleEl.classList.add('hidden-el');
            }

            const input = document.getElementById('promptInputVal');
            input.placeholder = placeholder; 
            input.value = defaultValue;
            promptCallback = callback;
            
            document.getElementById('promptIcon').className = iconClass;
            
            const modal = document.getElementById('customPromptModal');
            const card = document.getElementById('customPromptCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
                input.focus();
                input.select(); 
            }, 10);
        }
        
        function closeCustomPrompt() {
            const modal = document.getElementById('customPromptModal');
            const card = document.getElementById('customPromptCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }
        
        function executeCustomPrompt() {
            if(promptCallback) promptCallback(document.getElementById('promptInputVal').value);
            closeCustomPrompt();
        }

        let confirmCallback = null;
        function openCustomConfirm(title, message, isDanger, callback) {
            document.getElementById('confirmTitle').innerText = title;
            document.getElementById('confirmMessage').innerHTML = message;
            
            const iconBox = document.getElementById('confirmIconBox');
            const icon = document.getElementById('confirmIcon');
            const btn = document.getElementById('confirmActionBtn');
            
            if(isDanger) {
                iconBox.className = "w-16 h-16 bg-rose-50 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl";
                icon.className = "fas fa-exclamation-triangle";
                btn.className = "flex-1 bg-rose-600 hover:bg-rose-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95 font-sans";
            } else {
                iconBox.className = "w-16 h-16 bg-[#f0f4ff] text-[var(--primary)] rounded-full flex items-center justify-center mx-auto mb-4 text-3xl";
                icon.className = "fas fa-question-circle";
                btn.className = "flex-1 btn-theme font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95 font-sans";
            }
            confirmCallback = callback;
            
            const modal = document.getElementById('customConfirmModal');
            const card = document.getElementById('customConfirmCard');
            modal.classList.remove('hidden');
            setTimeout(() => {
                card.classList.remove('scale-95', 'opacity-0');
                card.classList.add('scale-100', 'opacity-100');
            }, 10);
        }
        
        function closeCustomConfirm() {
            const modal = document.getElementById('customConfirmModal');
            const card = document.getElementById('customConfirmCard');
            card.classList.remove('scale-100', 'opacity-100');
            card.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }
        
        function executeCustomConfirm() {
            if(confirmCallback) confirmCallback();
            closeCustomConfirm();
        }

        // ==========================================
        // สร้าง/นำเข้า ภารกิจใหม่ (FAB Action)
        // ==========================================
        function handleFabAddMission() {
            navigateToAddMission(currentOpenedFolder);
        }

        function navigateToAddMission(folderName) {
            const targetFolder = folderName || 'ทั่วไป';
            localStorage.setItem('flip_target_folder', targetFolder);
            // ส่ง details ที่จำเป็น (รหัสห้องเรียน และโฟลเดอร์) ไปยังหน้า mission-create.html
            window.location.href = `mission-create.html?cid=${currentClassId}&folder=${encodeURIComponent(targetFolder)}`;
        }

        // ==========================================
        // ส่วนที่ 1: โหมดแสดงผลปกติ (Folder Grid & Mission Path)
        // ==========================================
        function showFolderGrid() {
            currentOpenedFolder = null; 
            document.getElementById('viewFolderGrid').classList.remove('hidden-el');
            document.getElementById('viewMissionPath').classList.add('hidden-el');
            document.getElementById('viewManageMode').classList.add('hidden-el');
            
            // แสดงปุ่ม FAB เพิ่มภารกิจ
            document.getElementById('fabAddBtn').classList.remove('hidden-el');
            
            const grid = document.getElementById('folderGridContent');
            
            const hasOrphans = missions.some(m => !folders.includes(m.folder_name || 'ทั่วไป'));
            if (hasOrphans && !folders.includes('ทั่วไป')) folders.push('ทั่วไป');

            if (folders.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">ยังไม่มีหมวดหมู่</div>`;
                return;
            }

            grid.innerHTML = folders.map(folderName => {
                const count = missions.filter(m => (m.folder_name || 'ทั่วไป') === folderName).length;
                return `
                    <div class="folder-card group" onclick="openFolder('${folderName}')">
                        <div class="folder-icon-box group-hover:scale-110 transition-transform">
                            <i class="fas fa-folder"></i>
                        </div>
                        <div>
                            <h3 class="text-lg md:text-xl font-bold text-slate-800 font-['Kanit']">${folderName}</h3>
                            <p class="text-xs md:text-sm text-slate-500">${count} ภารกิจ</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openFolder(folderName) {
            currentOpenedFolder = folderName; 
            document.getElementById('viewFolderGrid').classList.add('hidden-el');
            document.getElementById('viewMissionPath').classList.remove('hidden-el');
            document.getElementById('currentFolderNameDisplay').innerText = folderName;
            
            // แสดงปุ่ม FAB เพิ่มภารกิจ
            document.getElementById('fabAddBtn').classList.remove('hidden-el');

            const container = document.getElementById('missionListContent');
            const folderMissions = missions.filter(m => (m.folder_name || 'ทั่วไป') === folderName);

            if (folderMissions.length === 0) {
                container.innerHTML = `
                    <div class="py-20 opacity-30 text-center">
                        <i class="fas fa-box-open text-5xl md:text-6xl mb-4 text-slate-300"></i>
                        <h3 class="text-lg md:text-xl font-bold font-sans text-slate-500">หมวดหมู่นี้ยังว่างเปล่า</h3>
                        <p class="text-xs md:text-sm font-sans text-slate-400 mt-2">กดปุ่ม + (เพิ่มภารกิจ) มุมขวาล่างเพื่อสร้างภารกิจได้เลยครับ</p>
                    </div>`;
                return;
            }

            container.innerHTML = folderMissions.map((m, idx) => {
                const displayTitle = m.custom_title || m.missions.title;
                return `
                <div class="mission-node group">
                    <div class="node-circle shadow-lg" onclick="location.href='play-mission.html?mid=${m.mission_id}'">
                        <i class="${getIcon(m.missions.mission_type)}"></i>
                    </div>
                    <div class="node-content">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-[10px] font-black text-[var(--accent)] uppercase tracking-widest">ลำดับที่ ${idx + 1}</span>
                            <span class="text-[10px] bg-[#f0f4ff] text-[var(--primary-light)] px-2.5 py-0.5 rounded-lg font-bold">
                                <i class="fas fa-star mr-1"></i>${m.missions.reward_points || 10}
                            </span>
                        </div>
                        <h3 class="font-bold text-slate-800 text-sm md:text-base leading-tight truncate font-sans">${displayTitle}</h3>
                        <p class="text-[10px] text-slate-400 mt-1 italic font-sans">${m.missions.subject_group || 'ทั่วไป'}</p>
                    </div>
                </div>
            `}).join('');
        }

        function backToFolders() {
            showFolderGrid();
        }

        // ==========================================
        // ส่วนที่ 2: โหมดจัดการเนื้อหา (Admin Manage Mode)
        // ==========================================
        function toggleManageMode() {
            const btn = document.getElementById('manageModeBtn');

            if (!isManageMode) {
                // เปิดโหมดจัดการ
                isManageMode = true;
                if(btn) {
                    btn.innerHTML = '<i class="fas fa-save"></i> บันทึกข้อมูล';
                    btn.classList.replace('bg-white/10', 'bg-emerald-500');
                    btn.classList.replace('hover:bg-white/20', 'hover:bg-emerald-600');
                }
                renderAdminManageView();
            } else {
                // หากกดปุ่มที่ Navbar หรือปุ่มมือถือ ขณะอยู่ในโหมดจัดการ ให้ทำการบันทึก
                saveNewOrderAndFolders(); 
            }
        }

        // 🌟 ฟังก์ชันยกเลิกการเปลี่ยนแปลง
        function cancelManageMode() {
            openCustomConfirm('ยกเลิกการแก้ไข', 'คุณต้องการยกเลิกการเปลี่ยนแปลงทั้งหมด และคืนค่าเดิมใช่หรือไม่?', false, async () => {
                isManageMode = false;
                deletedAssignments = []; // ล้างคิวการลบ
                
                // รีเซ็ตปุ่มที่ Navbar
                const btn = document.getElementById('manageModeBtn');
                if(btn) {
                    btn.innerHTML = '<i class="fas fa-cog"></i> จัดการเนื้อหา';
                    btn.classList.replace('bg-emerald-500', 'bg-white/10');
                    btn.classList.replace('hover:bg-emerald-600', 'hover:bg-white/20');
                }

                document.getElementById('loadingText').innerText = "กำลังคืนค่าเดิม...";
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                // รีโหลดข้อมูลจากฐานข้อมูลใหม่ทับข้อมูลที่แก้ไขในหน้าจอ
                folders = [];
                await fetchClassroomData();
                await fetchMissions(); 
                
                document.getElementById('loadingOverlay').style.display = 'none';
            });
        }

        function renderAdminManageView() {
            document.getElementById('viewFolderGrid').classList.add('hidden-el');
            document.getElementById('viewMissionPath').classList.add('hidden-el');
            document.getElementById('viewManageMode').classList.remove('hidden-el');
            
            // ซ่อนปุ่ม FAB ในโหมดจัดการเนื้อหา
            document.getElementById('fabAddBtn').classList.add('hidden-el');

            const container = document.getElementById('manageContent');
            let html = '';

            folders.forEach(folderName => {
                const folderMissions = missions.filter(m => (m.folder_name || 'ทั่วไป') === folderName);
                
                const isGeneral = folderName === 'ทั่วไป';
                
                const editBtnHtml = `<button onclick="handleRenameFolder('${folderName}')" class="text-amber-500 hover:text-white hover:bg-amber-500 bg-amber-50 w-8 h-8 rounded-lg flex items-center justify-center transition shrink-0" title="แก้ไขชื่อหมวดหมู่"><i class="fas fa-edit"></i></button>`;
                
                const deleteBtnHtml = !isGeneral 
                    ? `<button onclick="handleDeleteFolder('${folderName}')" class="text-rose-500 hover:text-white hover:bg-rose-500 bg-rose-50 w-8 h-8 rounded-lg flex items-center justify-center transition shrink-0" title="ลบหมวดหมู่"><i class="fas fa-trash-alt"></i></button>`
                    : '';

                html += `
                    <div class="admin-folder-box" data-folder="${folderName}">
                        <div class="flex flex-wrap gap-2 justify-between items-center mb-4 border-b border-slate-100 pb-3">
                            <h3 class="font-bold text-lg md:text-xl text-slate-800 font-['Kanit']"><i class="fas fa-folder-open text-[var(--accent)] mr-2"></i> ${folderName}</h3>
                            <div class="flex items-center gap-2">
                                <button onclick="navigateToAddMission('${folderName}')" class="text-[var(--primary-light)] hover:text-[var(--primary)] bg-[#f0f4ff] hover:bg-[#e0e8ff] px-3 py-1.5 rounded-lg transition text-xs font-bold flex items-center gap-1 shadow-sm" title="สร้างภารกิจลงหมวดหมู่นี้">
                                    <i class="fas fa-plus"></i> เพิ่ม
                                </button>
                                ${editBtnHtml}
                                ${deleteBtnHtml}
                            </div>
                        </div>
                        
                        <div class="admin-mission-list sortable-list" data-folder="${folderName}">
                `;

                folderMissions.forEach(m => {
                    const displayTitle = m.custom_title || m.missions.title;
                    const originalTitle = m.missions.title;
                    const safeDisplayTitle = displayTitle.replace(/'/g, "\\'");
                    const safeOriginalTitle = originalTitle.replace(/'/g, "\\'");

                    html += `
                        <div class="admin-mission-item" data-assignment-id="${m.assignment_id}">
                            <i class="fas fa-grip-vertical drag-handle-icon"></i>
                            <div class="w-8 h-8 md:w-10 md:h-10 rounded-lg bg-[#f0f4ff] text-[var(--primary-light)] flex items-center justify-center shrink-0">
                                <i class="${getIcon(m.missions.mission_type)} text-sm md:text-base"></i>
                            </div>
                            <div class="flex-grow min-w-0">
                                <p class="font-bold text-sm md:text-base text-slate-700 truncate">${displayTitle}</p>
                                <p class="text-[10px] text-slate-400">ID: ${m.assignment_id.substring(0,6)}...</p>
                            </div>
                            <button onclick="handleRenameMission('${m.assignment_id}', '${safeDisplayTitle}', '${safeOriginalTitle}')" class="text-amber-500 hover:text-amber-600 hover:bg-amber-50 w-8 h-8 rounded-lg flex items-center justify-center transition shrink-0 mr-1" title="เปลี่ยนชื่อภารกิจนี้">
                                <i class="fas fa-pen text-xs"></i>
                            </button>
                            <button onclick="handleRemoveMission('${m.assignment_id}', '${safeDisplayTitle}')" class="text-rose-400 hover:text-rose-600 hover:bg-rose-50 w-8 h-8 rounded-lg flex items-center justify-center transition shrink-0" title="นำออกจากห้องเรียน">
                                <i class="fas fa-minus-circle"></i>
                            </button>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            initSortable();
        }

        function initSortable() {
            sortableInstances.forEach(instance => instance.destroy());
            sortableInstances = [];

            const containers = document.querySelectorAll('.sortable-list');
            containers.forEach(container => {
                sortableInstances.push(new Sortable(container, {
                    group: 'shared-folders', 
                    animation: 150,
                    handle: '.drag-handle-icon',
                    ghostClass: 'sortable-ghost',
                }));
            });
        }

        function handleAddFolderPrompt() {
            openCustomPrompt('สร้างหมวดหมู่ใหม่', 'ชื่อหมวดหมู่ (เช่น บทที่ 1)', (folderName) => {
                const cleanName = (folderName || '').trim();
                if (cleanName === "") return;
                
                if (folders.includes(cleanName)) {
                    showMessage("⚠️ ชื่อหมวดหมู่นี้มีอยู่แล้วครับ", true);
                    return;
                }
                folders.push(cleanName);
                renderAdminManageView(); 
            }, 'โฟลเดอร์ใหม่');
        }

        function handleRenameFolder(oldName) {
            openCustomPrompt('แก้ไขชื่อหมวดหมู่', 'ชื่อหมวดหมู่ใหม่', (newName) => {
                const cleanName = (newName || '').trim();
                if (cleanName === "" || cleanName === oldName) return; 
                
                if (folders.includes(cleanName)) {
                    showMessage("⚠️ ชื่อหมวดหมู่นี้มีอยู่แล้วครับ", true);
                    return;
                }
                
                const folderIndex = folders.indexOf(oldName);
                if(folderIndex !== -1) folders[folderIndex] = cleanName;
                
                missions.forEach(m => {
                    if ((m.folder_name || 'ทั่วไป') === oldName) {
                        m.folder_name = cleanName;
                    }
                });
                
                renderAdminManageView();
            }, oldName, 'fas fa-edit'); 
        }

        function handleDeleteFolder(folderName) {
            const message = `ต้องการลบหมวดหมู่ <b>"${folderName}"</b> ใช่หรือไม่?<br><span class="text-xs text-rose-500 mt-2 block">*ภารกิจข้างในจะไม่หาย แต่จะถูกย้ายไปที่หมวด "ทั่วไป" อัตโนมัติ</span>`;
            openCustomConfirm('ลบหมวดหมู่', message, true, () => {
                missions.forEach(m => {
                    if ((m.folder_name || 'ทั่วไป') === folderName) m.folder_name = 'ทั่วไป';
                });
                folders = folders.filter(f => f !== folderName);
                if(!folders.includes('ทั่วไป')) folders.push('ทั่วไป');
                renderAdminManageView();
            });
        }

        function handleRenameMission(assignmentId, currentTitle, originalTitle) {
            const defaultText = currentTitle !== originalTitle ? currentTitle : '';
            openCustomPrompt('เปลี่ยนชื่อภารกิจ (เฉพาะห้องนี้)', 'ชื่อภารกิจใหม่ (ปล่อยว่างเพื่อใช้ชื่อเดิม)', async (newName) => {
                const cleanName = (newName || '').trim();
                const newCustomTitle = cleanName === "" ? null : cleanName;

                document.getElementById('loadingText').innerText = "กำลังอัปเดตชื่อ...";
                document.getElementById('loadingOverlay').style.display = 'flex';

                try {
                    await window.sysDB.from('classroom_missions')
                        .update({ custom_title: newCustomTitle })
                        .eq('assignment_id', assignmentId);
                    
                    await fetchMissions();
                    showMessage("✅ อัปเดตชื่อภารกิจเรียบร้อย!");
                    renderAdminManageView(); 
                } catch (e) {
                    console.error(e);
                    showMessage("❌ เกิดข้อผิดพลาด", true);
                } finally {
                    document.getElementById('loadingOverlay').style.display = 'none';
                }
            }, defaultText, 'fas fa-pen', `ชื่อต้นฉบับ: ${originalTitle}`);
        }

        function handleDeleteClassroom() {
            const message = `คุณแน่ใจหรือไม่ว่าต้องการ <b>"ลบห้องเรียนนี้"</b>?<br><span class="text-xs text-rose-500 mt-2 block">*ข้อมูลนักเรียน ภารกิจ และคะแนนในห้องเรียนนี้จะถูกลบทิ้งถาวรและไม่สามารถกู้คืนได้!</span>`;
            
            openCustomConfirm('ลบห้องเรียนถาวร', message, true, async () => {
                document.getElementById('loadingText').innerText = "กำลังลบข้อมูลห้องเรียน...";
                document.getElementById('loadingOverlay').style.display = 'flex';
                
                try {
                    await window.sysDB.from('classroom_students').delete().eq('classroom_id', currentClassId);
                    await window.sysDB.from('classroom_missions').delete().eq('classroom_id', currentClassId);
                    const { error } = await window.sysDB.from('classrooms').delete().eq('classroom_id', currentClassId);
                    
                    if (error) throw error;
                    
                    showMessage("✅ ลบห้องเรียนสำเร็จ!");
                    setTimeout(() => {
                        window.location.href = 'teacher-dashboard.html';
                    }, 1500);

                } catch (err) {
                    console.error(err);
                    document.getElementById('loadingOverlay').style.display = 'none';
                    showMessage("❌ เกิดข้อผิดพลาด ไม่สามารถลบได้", true);
                }
            });
        }

        function handleRemoveMission(assignmentId, title) {
            const message = `ต้องการนำภารกิจ <b>"${title}"</b><br>ออกจากห้องเรียนนี้ใช่หรือไม่?<br><span class="text-xs text-slate-400 mt-2 block">(ตัวภารกิจยังคงอยู่ในคลังสื่อของคุณ)</span>`;
            openCustomConfirm('ลบภารกิจ', message, true, () => {
                deletedAssignments.push(assignmentId);
                const el = document.querySelector(`[data-assignment-id="${assignmentId}"]`);
                if(el) el.remove();
                
                missions = missions.filter(m => String(m.assignment_id) !== String(assignmentId));
                document.getElementById('missionCount').innerText = missions.length;
            });
        }

        async function saveNewOrderAndFolders() {
            document.getElementById('loadingText').innerText = "กำลังบันทึกข้อมูล...";
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            try {
                if (deletedAssignments.length > 0) {
                    const deletePromises = deletedAssignments.map(id => 
                        window.sysDB.from('classroom_missions').delete().eq('assignment_id', id)
                    );
                    await Promise.all(deletePromises);
                    deletedAssignments = []; 
                }

                const updates = [];
                const folderSections = document.querySelectorAll('.admin-folder-box');
                
                folderSections.forEach(section => {
                    const folderName = section.getAttribute('data-folder');
                    const missionItems = section.querySelectorAll('.admin-mission-item');
                    
                    missionItems.forEach((node, index) => {
                        const assignmentId = node.getAttribute('data-assignment-id');
                        updates.push(
                            window.sysDB.from('classroom_missions').update({ 
                                order_index: index, 
                                folder_name: folderName 
                            }).eq('assignment_id', assignmentId)
                        );
                    });
                });

                await Promise.all(updates);

                try {
                    await window.sysDB.from('classrooms').update({ folders: folders }).eq('classroom_id', currentClassId);
                } catch(e) {}

                // รีเซ็ตการแสดงปุ่ม Navbar ให้กลับมาเป็นโหมดปกติเมื่อเซฟสำเร็จ
                isManageMode = false;
                const btn = document.getElementById('manageModeBtn');
                if(btn) {
                    btn.innerHTML = '<i class="fas fa-cog"></i> จัดการเนื้อหา';
                    btn.classList.replace('bg-emerald-500', 'bg-white/10');
                    btn.classList.replace('hover:bg-emerald-600', 'hover:bg-white/20');
                }

                await fetchMissions();
                showFolderGrid();
                showMessage("✅ บันทึกโครงสร้างห้องเรียนสำเร็จ!");
                
            } catch (err) { 
                console.error(err);
                showMessage('❌ เกิดข้อผิดพลาดในการบันทึกข้อมูล', true); 
                // หากผิดพลาด ไม่ต้องเด้งออกจากโหมด เพื่อให้ครูลองกดเซฟใหม่ได้
            }
            
            document.getElementById('loadingOverlay').style.display = 'none';
        }

        // --- Utils ---
        function toggleDrawer() {
            const dr = document.getElementById('sideDrawer');
            const ov = document.getElementById('drawerOverlay');
            dr.classList.toggle('-translate-x-full');
            ov.classList.toggle('hidden');
        }

        function goToStudents() { location.href = `student-list.html?id=${currentClassId}`; }
        async function handleLogout() { 
            openCustomConfirm('ออกจากระบบ', 'คุณต้องการออกจากระบบใช่หรือไม่?', false, async () => {
                await window.sysDB.auth.signOut(); 
                location.href = 'teacher-login.html'; 
            });
        }
    </script>
</body>
</html>
