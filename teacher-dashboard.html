<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - FlipSchool</title>
    <script src="js/env-config.js"></script>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary-dark: #000046; --primary: #00008B; --primary-light: #0052D4; --accent: #FF8C00; --bg-body: #f4f7fe; --white: #ffffff; --sidebar-width: 380px; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Navbar --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 50px; height: 90px; background: var(--white); box-shadow: 0 2px 20px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; color: inherit; }
        .logo-container img { height: 55px; }
        .brand-name { font-size: 26px; font-weight: 700; color: #2d3436; font-family: 'Kanit'; }
        .nav-profile-trigger { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #eef2f7; cursor: pointer; object-fit: cover; transition: 0.3s ease; }

        /* --- Sidebar (ลบ Blur ออกเพื่อให้ดูคมชัด) --- */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: none; z-index: 1999; }
        .sidebar { position: fixed; top: 0; right: calc(var(--sidebar-width) * -1.1); width: var(--sidebar-width); height: 100%; background: #ffffff; box-shadow: -10px 0 40px rgba(0,0,0,0.15); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; padding: 40px 30px; display: flex; flex-direction: column; box-sizing: border-box; border-radius: 40px 0 0 40px; overflow-y: auto; }
        .sidebar.active { right: 0; }
        
        /* --- Main Dashboard --- */
        .main-container { flex: 1; padding: 40px 50px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; transition: transform 0.2s ease-out; }
        .welcome-hero { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%); border-radius: 40px; padding: 60px; color: white; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 15px 35px rgba(0, 74, 173, 0.2); position: relative; overflow: hidden; }
        .hero-text-content { position: relative; z-index: 5; }
        .welcome-header { font-family: 'Kanit'; font-size: 42px; font-weight: 700; margin: 0 0 10px 0; }

        /* --- View Filters (คมชัดแบบเดิม) --- */
        .view-filter-container { margin-bottom: 30px; }
        .view-filter-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .view-filter-scroll::-webkit-scrollbar { display: none; }
        .filter-tab { padding: 12px 24px; background: white; border-radius: 50px; font-family: 'Kanit'; font-size: 15px; font-weight: 500; color: #636e72; cursor: pointer; white-space: nowrap; transition: 0.3s; border: 1px solid #edf2f7; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 6px 20px rgba(0, 82, 212, 0.2); }

        /* --- Class Grid --- */
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .class-card { background: var(--white); border-radius: 35px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.04); transition: 0.3s; cursor: pointer; border: 1px solid #edf2f7; display: flex; flex-direction: column; height: 100%; }
        .class-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-color: var(--primary-light); }
        .card-banner { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 45px; color: rgba(255,255,255,0.4); }

        /* --- Modals (ลบ Blur) --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; border-radius: 24px; width: 100%; max-width: 550px; box-shadow: 0 25px 60px rgba(0,0,0,0.3); border: none; }
        
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 5000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.2s; }
        .custom-modal-overlay.show { opacity: 1; visibility: visible; }

        .fab-add { position: fixed; bottom: 50px; right: 50px; width: 70px; height: 70px; background: var(--accent); color: white; border-radius: 50%; border:none; font-size: 32px; cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(255, 140, 0, 0.4); transition: 0.3s; }
        .fab-add:hover { transform: scale(1.1) rotate(90deg); }

        @media (max-width: 768px) { nav { padding: 0 20px; height: 75px; } .main-container { padding: 20px; } .welcome-hero { padding: 30px 20px; } .fab-add { bottom: 30px; right: 30px; width: 60px; height: 60px; } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- SIDEBAR -->
    <div class="sidebar" id="profileSidebar">
        <div class="profile-wrapper" style="text-align:center; margin-bottom: 20px;">
            <img src="" id="sidebarImg" class="sidebar-profile-img" style="width:120px; height:120px; border-radius:50%; border:4px solid var(--bg-body); object-fit:cover;">
        </div>
        <h3 id="sideDisplayName" style="text-align:center; font-family:'Kanit'; color:var(--primary-dark); margin:0; font-size: 24px;">...</h3>
        <div style="background: #f8faff; padding: 25px; border-radius: 30px; margin: 15px 0; border: 1px solid #edf2f7;">
            <div style="margin-bottom: 15px;"><label style="font-size:11px; color:#b2bec3; font-weight:700;">ชื่อ-นามสกุล</label><span id="dispFullName" style="display:block; font-weight:600; font-size:16px;">...</span></div>
            <div id="schoolSwitcherList" style="display: flex; flex-direction: column; gap: 8px;"></div>
            <button onclick="openJoinSchoolModal()" style="background: #e0e8ff; border: none; color: var(--primary-light); padding: 14px; border-radius: 15px; margin-top: 15px; width: 100%; cursor: pointer; font-family: 'Kanit'; font-weight: 600;">+ เข้าร่วมกลุ่มโรงเรียน</button>
        </div>
        <button class="logout-btn" style="margin-top:auto; padding: 18px; border-radius: 20px; background: #fff5f5; color: #ff4757; border: none; cursor: pointer; font-family: 'Kanit'; font-weight: 600;" onclick="handleLogout()">ออกจากระบบ</button>
    </div>

    <nav>
        <div class="logo-container" onclick="window.location.href='index.html'"><img src="img/favicon.png" alt="Logo"><div class="brand-name">FlipSchool</div></div>
        <img src="" id="navProfileImg" class="nav-profile-trigger" onclick="toggleSidebar()">
    </nav>

    <main class="main-container" id="mainDashboardContent">
        <div class="welcome-hero">
            <div class="hero-text-content">
                <h1 class="welcome-header"><span id="welcomeHeader">กำลังโหลด...</span></h1>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;"><div id="welcomeSchool" style="color: #ffeaa7; font-family: 'Kanit'; font-size: 19px; font-weight: 500;"></div><div id="verificationStatusBadgeContainer"></div></div>
                <p class="welcome-sub" style="font-size: 18px; opacity: 0.9;">ยินดีต้อนรับกลับสู่พื้นที่สร้างสรรค์นวัตกรรมการจัดการเรียนรู้</p>
            </div>
            <i class="fas fa-gem" style="font-size: 110px; color: rgba(255,255,255,0.12); position: absolute; right: 60px;"></i>
        </div>
        
        <div class="view-filter-container"><div class="view-filter-scroll" id="viewFilterTabs"></div></div>

        <div id="pendingAlertSection" style="display: none; background: #fff8e1; border: 1px solid #ffecb3; border-radius: 20px; padding: 25px; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.03);">
            <p id="pendingAlertDesc" style="margin: 0; color: #856404; font-size: 15px; line-height: 1.5;"></p>
        </div>

        <div id="classroomSection"><div class="class-grid" id="classGrid"></div></div>
    </main>

    <button onclick="handleFabClick(event)" class="fab-add"><i class="fas fa-plus"></i></button>

    <!-- Alert Modal -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div class="custom-modal-box" style="background:white; padding: 35px; border-radius: 25px; text-align: center; max-width: 420px; width: 90%;">
            <div id="customAlertIcon" style="font-size: 60px; margin-bottom: 20px;"></div>
            <h3 id="customAlertTitle" style="font-family: 'Kanit'; font-size: 22px; color: #2d3436; margin-bottom: 10px;"></h3>
            <p id="customAlertMessage" style="color:#636e72; line-height:1.6;"></p>
            <button class="filter-tab active" style="margin-top: 25px; width: 100%; border: none;" onclick="closeCustomAlert()">ตกลง</button>
        </div>
    </div>

    <script>
        let currentUser = null, currentUserData = null, userSchools = [], activeViewMode = 'all', activeSchool = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof sysDB !== 'undefined') {
                const { data: { user } } = await sysDB.auth.getUser();
                if (!user) { location.href = 'teacher-login.html'; return; }
                currentUser = user;
                await initialFetch();
            }
        });

        async function initialFetch() {
            const { data: teacher } = await sysDB.from('teachers').select('*').eq('teacher_id', currentUser.id).single();
            if (!teacher) return;
            currentUserData = teacher;
            document.getElementById('welcomeHeader').innerText = `สวัสดีครับ ครู${teacher.first_name}`;
            document.getElementById('dispFullName').innerText = `${teacher.first_name} ${teacher.last_name}`;
            document.getElementById('navProfileImg').src = teacher.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${teacher.first_name}`;
            document.getElementById('sidebarImg').src = document.getElementById('navProfileImg').src;
            await fetchSchoolsAndRefresh();
        }

        async function fetchSchoolsAndRefresh() {
            const { data: schools } = await sysDB.from('teacher_schools').select('*, schools(school_name, school_abbr)').eq('teacher_id', currentUser.id);
            userSchools = schools || [];
            activeViewMode = localStorage.getItem('active_school_id') || 'all';
            
            if (activeViewMode !== 'all' && activeViewMode !== 'independent') {
                activeSchool = userSchools.find(s => s.school_id === activeViewMode);
                if (!activeSchool) activeViewMode = 'all';
            }
            renderDashboardState();
        }

        function renderDashboardState() {
            const ws = document.getElementById('welcomeSchool');
            if (activeViewMode === 'all') ws.innerHTML = '<i class="fas fa-layer-group"></i> พื้นที่ภาพรวมทั้งหมด';
            else if (activeViewMode === 'independent') ws.innerHTML = '<i class="fas fa-user"></i> พื้นที่ส่วนตัว (อิสระ)';
            else ws.innerHTML = `<i class="fas fa-school"></i> สังกัด: ${activeSchool.schools?.school_name}`;

            renderFilterTabs();
            renderSchoolSwitcher();
            fetchClassrooms();
        }

        function renderFilterTabs() {
            const container = document.getElementById('viewFilterTabs');
            let html = `<button class="filter-tab ${activeViewMode === 'all' ? 'active' : ''}" onclick="switchSchool('all')"><i class="fas fa-layer-group"></i> พื้นที่ทั้งหมด</button>`;
            html += `<button class="filter-tab ${activeViewMode === 'independent' ? 'active' : ''}" onclick="switchSchool('independent')"><i class="fas fa-user"></i> ส่วนตัว</button>`;
            userSchools.forEach(s => {
                html += `<button class="filter-tab ${activeViewMode === s.school_id ? 'active' : ''}" onclick="switchSchool('${s.school_id}')"><i class="fas fa-school"></i> ${s.schools?.school_name}</button>`;
            });
            container.innerHTML = html;
        }

        function renderSchoolSwitcher() {
            const container = document.getElementById('schoolSwitcherList');
            let html = `<div onclick="switchSchool('all')" style="padding:12px; border-radius:12px; cursor:pointer; background:${activeViewMode==='all'?'#e0e8ff':'white'}; border:1px solid ${activeViewMode==='all'?'#a4bcfc':'#edf2f7'}; font-size:14px;">ภาพรวมทั้งหมด</div>`;
            userSchools.forEach(s => {
                const active = activeViewMode === s.school_id;
                html += `<div onclick="switchSchool('${s.school_id}')" style="padding:12px; border-radius:12px; cursor:pointer; background:${active?'#e0e8ff':'white'}; border:1px solid ${active?'#a4bcfc':'#edf2f7'}; font-size:14px; margin-top:5px;">${s.schools?.school_name}</div>`;
            });
            container.innerHTML = html;
        }

        window.switchSchool = (id) => {
            activeViewMode = id;
            localStorage.setItem('active_school_id', id);
            activeSchool = userSchools.find(s => s.school_id === id);
            renderDashboardState();
            if(document.getElementById('profileSidebar').classList.contains('active')) toggleSidebar();
        };

        async function fetchClassrooms() {
            const grid = document.getElementById('classGrid');
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px;"><i class="fas fa-spinner fa-spin" style="font-size:30px; color:var(--primary);"></i><p style="margin-top:10px; color:#636e72;">กำลังโหลดข้อมูล...</p></div>';
            
            const { data } = await sysDB.from('classrooms').select('*').eq('teacher_id', currentUser.id).order('created_at', { ascending: false });
            let filtered = data || [];
            
            if (activeViewMode === 'independent') {
                const schoolIds = userSchools.map(s => s.school_id);
                filtered = filtered.filter(c => !schoolIds.includes(c.school_id));
            } else if (activeViewMode !== 'all') {
                filtered = filtered.filter(c => c.school_id === activeViewMode);
            }

            if (filtered.length === 0) { 
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:80px; background:white; border-radius:35px; border:1px dashed #dcdde1;"><h3 style="font-family:Kanit; color:#b2bec3;">ไม่พบห้องเรียนในพื้นที่นี้</h3><p style="color:#b2bec3;">กดปุ่ม + เพื่อสร้างห้องเรียนใหม่ได้เลย</p></div>'; 
                return; 
            }
            
            grid.innerHTML = filtered.map(c => `
                <div class="class-card" onclick="location.href='classroom-detail.html?id=${c.classroom_id}'">
                    <div class="card-banner" style="background:${c.color_code || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)'};">
                        <i class="fas fa-chalkboard-teacher"></i>
                    </div>
                    <div style="padding:25px; flex:1; display:flex; flex-direction:column;">
                        <div class="room-badge">${c.room_name}</div>
                        <h3 class="subject-title" style="margin-bottom:15px;">${c.subject_name}</h3>
                        <div style="margin-top:auto; font-size:13px; color:#a4b0be; display:flex; align-items:center; gap:8px;">
                            <i class="fas fa-calendar-alt"></i> ภาคเรียนที่ ${c.semester}/${c.academic_year}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.toggleSidebar = () => {
            const s = document.getElementById('profileSidebar');
            const o = document.getElementById('sidebarOverlay');
            const active = s.classList.toggle('active');
            o.style.display = active ? 'block' : 'none';
        };

        window.handleFabClick = (e) => {
            if(activeViewMode === 'all') {
                showCustomAlert("กรุณาเลือกกลุ่มโรงเรียนหรือพื้นที่ส่วนตัวก่อนสร้างห้องเรียน", "warning");
                return;
            }
            location.href = 'classroom-add.html';
        };

        function showCustomAlert(msg, type='info') {
            const m = document.getElementById('customAlertModal');
            const i = document.getElementById('customAlertIcon');
            const t = document.getElementById('customAlertTitle');
            const d = document.getElementById('customAlertMessage');
            
            d.innerText = msg;
            if(type === 'warning') {
                i.innerHTML = '<i class="fas fa-exclamation-triangle" style="color:#ffa502;"></i>';
                t.innerText = "แจ้งเตือน";
            } else {
                i.innerHTML = '<i class="fas fa-info-circle" style="color:var(--primary);"></i>';
                t.innerText = "ข้อมูล";
            }
            m.classList.add('show');
        }

        function closeCustomAlert() { document.getElementById('customAlertModal').classList.remove('show'); }
        function handleLogout() { sysDB.auth.signOut().then(() => { localStorage.removeItem('active_school_id'); location.href='teacher-login.html'; }); }
    </script>
</body>
</html>
