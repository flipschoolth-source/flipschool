<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - FlipSchool</title>
    <script src="js/env-config.js"></script>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary-dark: #000046; --primary: #00008B; --primary-light: #0052D4; --accent: #FF8C00; --bg-body: #f4f7fe; --white: #ffffff; --sidebar-width: 380px; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Navbar --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 50px; height: 90px; background: var(--white); box-shadow: 0 2px 20px rgba(0,0,0,0.06); position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; color: inherit; }
        .logo-container img { height: 55px; }
        .brand-name { font-size: 26px; font-weight: 700; color: #2d3436; font-family: 'Kanit'; }
        .nav-profile-trigger { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #eef2f7; cursor: pointer; object-fit: cover; transition: 0.3s ease; }

        /* --- Sidebar (No Blur - Crisp) --- */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); display: none; z-index: 1999; }
        .sidebar { position: fixed; top: 0; right: calc(var(--sidebar-width) * -1.1); width: var(--sidebar-width); height: 100%; background: #ffffff; box-shadow: -10px 0 40px rgba(0,0,0,0.15); transition: 0.5s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; padding: 40px 25px; display: flex; flex-direction: column; box-sizing: border-box; border-radius: 40px 0 0 40px; overflow-y: auto; }
        .sidebar.active { right: 0; }
        
        /* --- Main Dashboard --- */
        .main-container { flex: 1; padding: 40px 50px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; }
        .welcome-hero { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%); border-radius: 40px; padding: 60px; color: white; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 15px 35px rgba(0, 74, 173, 0.2); position: relative; overflow: hidden; }
        .hero-text-content { position: relative; z-index: 5; }
        .welcome-header { font-family: 'Kanit'; font-size: 42px; font-weight: 700; margin: 0 0 10px 0; }

        /* --- View Filters --- */
        .view-filter-container { margin-bottom: 30px; }
        .view-filter-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
        .view-filter-scroll::-webkit-scrollbar { display: none; }
        .filter-tab { padding: 12px 24px; background: white; border-radius: 50px; font-family: 'Kanit'; font-size: 15px; font-weight: 500; color: #636e72; cursor: pointer; white-space: nowrap; transition: 0.3s; border: 1px solid #edf2f7; box-shadow: 0 4px 10px rgba(0,0,0,0.03); display: flex; align-items: center; gap: 8px;}
        .filter-tab.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 6px 20px rgba(0, 82, 212, 0.2); }

        /* --- Class Grid --- */
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .class-card { background: var(--white); border-radius: 35px; overflow: hidden; box-shadow: 0 8px 25px rgba(0,0,0,0.04); transition: 0.3s; cursor: pointer; border: 1px solid #edf2f7; display: flex; flex-direction: column; height: 100%; }
        .class-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.1); border-color: var(--primary-light); }
        .card-banner { height: 120px; display: flex; align-items: center; justify-content: center; font-size: 45px; color: rgba(255,255,255,0.4); }

        /* --- Sidebar UI Elements --- */
        .sidebar-section-title { font-family: 'Kanit'; font-size: 13px; color: #b2bec3; text-transform: uppercase; letter-spacing: 1px; margin: 20px 0 10px 5px; display: block; }
        .school-item { padding: 14px 18px; border-radius: 18px; cursor: pointer; background: white; border: 1px solid #edf2f7; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; position: relative; }
        .school-item:hover { border-color: var(--primary-light); }
        .school-item.active { background: #e0e8ff; border-color: #a4bcfc; color: var(--primary-dark); font-weight: 600; }
        .school-info-name { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; padding-right: 10px; }
        
        .cancel-req-btn { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fff0f0; color: #ff4757; transition: 0.2s; border: none; cursor: pointer; }
        .cancel-req-btn:hover { background: #ff4757; color: white; transform: scale(1.1); }

        .fab-add { position: fixed; bottom: 50px; right: 50px; width: 70px; height: 70px; background: var(--accent); color: white; border-radius: 50%; border:none; font-size: 32px; cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(255, 140, 0, 0.4); transition: 0.3s; }
        
        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; border-radius: 24px; width: 100%; max-width: 550px; box-shadow: 0 25px 60px rgba(0,0,0,0.3); overflow: hidden; border: none; }

        @media (max-width: 768px) { nav { padding: 0 20px; height: 75px; } .main-container { padding: 20px; } .welcome-hero { padding: 30px 20px; } .fab-add { bottom: 30px; right: 30px; width: 60px; height: 60px; } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- SIDEBAR -->
    <div class="sidebar" id="profileSidebar">
        <div style="text-align:center; margin-bottom: 25px;">
            <img src="" id="sidebarImg" style="width:100px; height:100px; border-radius:50%; border:4px solid #f4f7fe; object-fit:cover;">
            <h3 id="sideDisplayName" style="font-family:'Kanit'; color:var(--primary-dark); margin:10px 0 5px 0; font-size: 22px;">...</h3>
            <span id="dispFullName" style="color:#636e72; font-size:14px;">...</span>
        </div>

        <div style="flex:1;">
            <label class="sidebar-section-title">พื้นที่ทำงานที่ได้รับการอนุมัติ</label>
            <div id="schoolListApproved"></div>

            <label class="sidebar-section-title">คำขอที่รอการตรวจสอบ</label>
            <div id="schoolListPending"></div>

            <button onclick="openJoinSchoolModal()" style="background: #e0e8ff; border: none; color: var(--primary-light); padding: 15px; border-radius: 18px; margin-top: 15px; width: 100%; cursor: pointer; font-family: 'Kanit'; font-weight: 600; transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 10px;">
                <i class="fas fa-search-plus"></i> ค้นหาและเข้าร่วมกลุ่มเพิ่ม
            </button>
        </div>

        <button class="logout-btn" style="padding: 18px; border-radius: 20px; background: #fff5f5; color: #ff4757; border: none; cursor: pointer; font-family: 'Kanit'; font-weight: 600; margin-top: 20px;" onclick="handleLogout()">
            <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
        </button>
    </div>

    <nav>
        <div class="logo-container" onclick="window.location.href='index.html'"><img src="img/favicon.png" alt="Logo"><div class="brand-name">FlipSchool</div></div>
        <div style="display:flex; align-items:center; gap:20px;">
            <div id="notificationBtn" style="position: relative; cursor: pointer; display: none;" onclick="openApprovalModal()">
                <i class="fas fa-bell" style="font-size: 24px; color: var(--primary-dark);"></i>
                <span id="notifBadge" style="position: absolute; top: -5px; right: -8px; background: #ff4757; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold;">0</span>
            </div>
            <img src="" id="navProfileImg" class="nav-profile-trigger" onclick="toggleSidebar()">
        </div>
    </nav>

    <main class="main-container" id="mainDashboardContent">
        <div class="welcome-hero">
            <div class="hero-text-content">
                <h1 class="welcome-header"><span id="welcomeHeader">กำลังโหลด...</span></h1>
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 15px;">
                    <div id="welcomeSchool" style="color: #ffeaa7; font-family: 'Kanit'; font-size: 19px; font-weight: 500;"></div>
                    <div id="verificationStatusBadgeContainer"></div>
                </div>
                <p class="welcome-sub" style="font-size: 18px; opacity: 0.9;">บริหารจัดการห้องเรียนแบบ GLORY Model ได้ทุกที่ ทุกเวลา</p>
            </div>
            <i class="fas fa-chalkboard-teacher" style="font-size: 110px; color: rgba(255,255,255,0.12); position: absolute; right: 60px;"></i>
        </div>
        
        <div class="view-filter-container"><div class="view-filter-scroll" id="viewFilterTabs"></div></div>

        <div id="pendingAlertSection" style="display: none; background: #fff8e1; border: 1px solid #ffecb3; border-radius: 20px; padding: 25px; margin-bottom: 30px;">
            <p id="pendingAlertDesc" style="margin: 0; color: #856404; font-size: 15px; line-height: 1.5;"></p>
        </div>

        <div id="classroomSection"><div class="class-grid" id="classGrid"></div></div>
    </main>

    <button onclick="handleFabClick(event)" class="fab-add"><i class="fas fa-plus"></i></button>

    <!-- Modal: Search & Join School -->
    <div id="joinSchoolModal" class="modal-overlay">
        <div class="modal-box">
            <div style="padding: 20px 25px; background: #f8faff; border-bottom: 1px solid #edf2f7; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin:0; font-family:'Kanit'; color:var(--primary);">ค้นหาและเข้าร่วมกลุ่มโรงเรียน</h3>
                <i class="fas fa-times" style="cursor: pointer; font-size: 20px; color: #b2bec3;" onclick="closeJoinSchoolModal()"></i>
            </div>
            <div style="padding: 25px;">
                <div style="margin-bottom: 20px; position: relative;">
                    <input type="text" id="reqSchoolSearch" style="width:100%; padding:15px 15px 15px 45px; border-radius:15px; border:1px solid #edf2f7; box-sizing: border-box; font-family: 'Sarabun';" placeholder="พิมพ์ชื่อโรงเรียนเพื่อค้นหา..." oninput="searchSchools(this.value)">
                    <i class="fas fa-search" style="position: absolute; left: 18px; top: 18px; color: #b2bec3;"></i>
                    <div id="reqSchoolResults" style="max-height: 250px; overflow-y: auto; border: 1px solid #f4f7fe; border-radius: 15px; margin-top: 10px; display: none; background: white; box-shadow: 0 10px 20px rgba(0,0,0,0.05);"></div>
                </div>
                
                <div id="selectedSchoolDetail" style="display:none; padding:25px; background:#f0f4ff; border-radius:20px; text-align: center;">
                    <i class="fas fa-school" style="font-size: 40px; color: var(--primary); margin-bottom: 15px;"></i>
                    <h4 id="selName" style="margin:0; font-family:'Kanit'; font-size: 18px;"></h4>
                    <p id="selAbbr" style="color:var(--primary-light); font-weight:600; margin:5px 0 20px 0;"></p>
                    <button id="btnSubmitJoin" onclick="submitSchoolJoinAction()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:15px; cursor:pointer; font-family:'Kanit'; font-weight:600; transition: 0.3s;">ส่งคำขอเข้าร่วมกลุ่มนี้</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Alert Modal (Crisp Design) -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div style="background:white; padding: 35px; border-radius: 30px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.2);">
            <div id="customAlertIcon" style="font-size: 60px; margin-bottom: 20px;"></div>
            <h3 id="customAlertTitle" style="font-family: 'Kanit'; font-size: 24px; margin-bottom: 10px; color: #2d3436;"></h3>
            <p id="customAlertMessage" style="color:#636e72; line-height:1.6; font-size: 16px;"></p>
            <div style="display:flex; gap:10px; margin-top: 30px;">
                <button id="customAlertCancelBtn" style="display:none; flex:1; padding: 15px; background:#f1f2f6; color:#2d3436; border:none; border-radius:15px; font-family:'Kanit'; cursor: pointer;" onclick="closeCustomAlert()">ยกเลิก</button>
                <button id="customAlertOkBtn" style="flex:1; padding: 15px; background:var(--primary); color:white; border:none; border-radius:15px; font-family:'Kanit'; cursor: pointer;" onclick="closeCustomAlert()">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = null, currentUserData = null, userSchools = [], activeViewMode = 'all', activeSchool = null;
        let selectedTargetSchool = null;
        let alertCallback = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof sysDB !== 'undefined') {
                const { data: { user } } = await sysDB.auth.getUser();
                if (!user) { location.href = 'teacher-login.html'; return; }
                currentUser = user;
                await initialFetch();
            }
        });

        async function initialFetch() {
            const { data: teacher } = await sysDB.from('teachers').select('*').eq('teacher_id', currentUser.id).single();
            if (!teacher) return;
            currentUserData = teacher;
            document.getElementById('welcomeHeader').innerText = `สวัสดีครับ ครู${teacher.first_name}`;
            document.getElementById('dispFullName').innerText = `${teacher.first_name} ${teacher.last_name}`;
            document.getElementById('navProfileImg').src = teacher.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${teacher.first_name}`;
            document.getElementById('sidebarImg').src = document.getElementById('navProfileImg').src;
            await fetchSchoolsAndRefresh();
        }

        async function fetchSchoolsAndRefresh() {
            const { data: schools } = await sysDB.from('teacher_schools').select('*, schools(school_name, school_abbr)').eq('teacher_id', currentUser.id);
            userSchools = schools || [];
            activeViewMode = localStorage.getItem('active_school_id') || 'all';
            
            // Validate activeViewMode
            if (activeViewMode !== 'all' && activeViewMode !== 'independent') {
                activeSchool = userSchools.find(s => s.school_id === activeViewMode);
                if (!activeSchool) activeViewMode = 'all';
            }
            renderDashboardState();
        }

        function renderDashboardState() {
            const ws = document.getElementById('welcomeSchool');
            if (activeViewMode === 'all') ws.innerHTML = '<i class="fas fa-layer-group"></i> พื้นที่รวมทุกสังกัด';
            else if (activeViewMode === 'independent') ws.innerHTML = '<i class="fas fa-user-tag"></i> พื้นที่ทำงานส่วนตัว';
            else ws.innerHTML = `<i class="fas fa-school"></i> สังกัด: ${activeSchool.schools?.school_name}`;

            renderFilterTabs();
            renderSidebarLists();
            fetchClassrooms();
        }

        function renderFilterTabs() {
            const container = document.getElementById('viewFilterTabs');
            let html = `<button class="filter-tab ${activeViewMode === 'all' ? 'active' : ''}" onclick="switchSchool('all')"><i class="fas fa-globe"></i> ภาพรวม</button>`;
            html += `<button class="filter-tab ${activeViewMode === 'independent' ? 'active' : ''}" onclick="switchSchool('independent')"><i class="fas fa-user-lock"></i> ส่วนตัว</button>`;
            
            userSchools.filter(s => s.verification_status === 'approved').forEach(s => {
                html += `<button class="filter-tab ${activeViewMode === s.school_id ? 'active' : ''}" onclick="switchSchool('${s.school_id}')"><i class="fas fa-school"></i> ${s.schools?.school_name}</button>`;
            });
            container.innerHTML = html;
        }

        function renderSidebarLists() {
            const approvedList = document.getElementById('schoolListApproved');
            const pendingList = document.getElementById('schoolListPending');
            
            let approvedHtml = `<div class="school-item ${activeViewMode==='all'?'active':''}" onclick="switchSchool('all')"><div class="school-info-name"><i class="fas fa-th-large" style="margin-right:8px; opacity:0.5;"></i> ภาพรวมทั้งหมด</div></div>`;
            approvedHtml += `<div class="school-item ${activeViewMode==='independent'?'active':''}" onclick="switchSchool('independent')"><div class="school-info-name"><i class="fas fa-user" style="margin-right:8px; opacity:0.5;"></i> พื้นที่ส่วนตัว (อิสระ)</div></div>`;
            
            let pendingHtml = '';

            userSchools.forEach(s => {
                const isActive = activeViewMode === s.school_id;
                const statusIcon = s.verification_status === 'approved' ? '<i class="fas fa-check-circle" style="color:#2ed573; margin-right:8px;"></i>' : 
                                   (s.verification_status === 'pending' ? '<i class="fas fa-clock" style="color:#ffa502; margin-right:8px;"></i>' : '<i class="fas fa-exclamation-circle" style="color:#ff4757; margin-right:8px;"></i>');
                
                const itemContent = `
                    <div class="school-info-name" onclick="switchSchool('${s.school_id}')">${statusIcon}${s.schools?.school_name}</div>
                    ${s.verification_status !== 'approved' ? `<button class="cancel-req-btn" title="ยกเลิกคำขอ" onclick="confirmCancelRequest(event, '${s.school_id}', '${s.schools?.school_name}')"><i class="fas fa-times"></i></button>` : `<i class="fas fa-chevron-right" style="font-size:10px; opacity:0.2;"></i>`}
                `;

                const itemHtml = `<div class="school-item ${isActive?'active':''}">${itemContent}</div>`;

                if (s.verification_status === 'approved') approvedHtml += itemHtml;
                else pendingHtml += itemHtml;
            });

            approvedList.innerHTML = approvedHtml;
            pendingList.innerHTML = pendingHtml || '<p style="text-align:center; color:#ccc; font-size:12px; margin:15px 0;">ยังไม่มีคำขอใหม่</p>';
        }

        window.switchSchool = (id) => {
            activeViewMode = id;
            localStorage.setItem('active_school_id', id);
            activeSchool = userSchools.find(s => s.school_id === id);
            renderDashboardState();
            if(document.getElementById('profileSidebar').classList.contains('active')) toggleSidebar();
        };

        async function fetchClassrooms() {
            const grid = document.getElementById('classGrid');
            grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px;"><i class="fas fa-spinner fa-spin" style="font-size:30px; color:var(--primary);"></i></div>';
            
            const { data } = await sysDB.from('classrooms').select('*').eq('teacher_id', currentUser.id).order('created_at', { ascending: false });
            let filtered = data || [];
            
            if (activeViewMode === 'independent') {
                const schoolIds = userSchools.map(s => s.school_id);
                filtered = filtered.filter(c => !schoolIds.includes(c.school_id));
            } else if (activeViewMode !== 'all') {
                filtered = filtered.filter(c => c.school_id === activeViewMode);
            }

            if (filtered.length === 0) { 
                grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:60px; background:white; border-radius:35px; border:1px dashed #edf2f7;"><p style="color:#b2bec3;">ยังไม่มีห้องเรียนในกลุ่มนี้</p></div>'; 
                return; 
            }
            
            grid.innerHTML = filtered.map(c => `
                <div class="class-card" onclick="location.href='classroom-detail.html?id=${c.classroom_id}'">
                    <div class="card-banner" style="background:${c.color_code || 'var(--primary-light)'};"><i class="fas fa-chalkboard"></i></div>
                    <div style="padding:25px;">
                        <div style="display:inline-block; padding:4px 12px; background:#f0f4ff; color:var(--primary-light); border-radius:50px; font-size:12px; font-weight:700; margin-bottom:10px;">${c.room_name}</div>
                        <h3 style="font-family:Kanit; font-size:20px; margin:0 0 10px 0; line-height:1.4;">${c.subject_name}</h3>
                        <div style="font-size:13px; color:#a4b0be;"><i class="fas fa-calendar-alt"></i> ภาคเรียนที่ ${c.semester}/${c.academic_year}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- Search Schools ---
        async function searchSchools(query) {
            const box = document.getElementById('reqSchoolResults');
            if (query.trim().length < 2) { box.style.display='none'; return; }
            const { data } = await sysDB.from('schools').select('*').ilike('school_name', `%${query}%`).limit(8);
            if (data && data.length > 0) {
                box.innerHTML = data.map(s => `<div onclick="selectSchoolForJoin('${s.school_id}','${s.school_name}','${s.school_abbr}')" style="padding:15px; cursor:pointer; border-bottom:1px solid #f8f9fa; font-family:'Sarabun';">${s.school_name}</div>`).join('');
                box.style.display = 'block';
            } else { 
                box.innerHTML = '<div style="padding:15px; color:#888; text-align:center;">ไม่พบรายชื่อโรงเรียน</div>';
                box.style.display = 'block';
            }
        }

        function selectSchoolForJoin(id, name, abbr) {
            selectedTargetSchool = { id, name, abbr };
            document.getElementById('reqSchoolResults').style.display = 'none';
            document.getElementById('reqSchoolSearch').value = name;
            document.getElementById('selName').innerText = name;
            document.getElementById('selAbbr').innerText = `@${abbr}`;
            document.getElementById('selectedSchoolDetail').style.display = 'block';
        }

        async function submitSchoolJoinAction() {
            if (!selectedTargetSchool) return;
            const btn = document.getElementById('btnSubmitJoin');
            btn.disabled = true; btn.innerText = 'กำลังส่ง...';

            try {
                // Check if already requested or approved
                const { data: exist } = await sysDB.from('teacher_schools').select('*').eq('teacher_id', currentUser.id).eq('school_id', selectedTargetSchool.id).maybeSingle();
                if (exist) {
                    if (exist.verification_status === 'approved') throw new Error('คุณเป็นสมาชิกของโรงเรียนนี้อยู่แล้วครับ');
                    if (exist.verification_status === 'pending') throw new Error('คุณได้ส่งคำขอไปยังโรงเรียนนี้แล้ว โปรดรอการอนุมัติ');
                }

                await sysDB.from('teacher_schools').insert([{ teacher_id: currentUser.id, school_id: selectedTargetSchool.id, role: 'teacher', verification_status: 'pending' }]);

                showCustomAlert("ส่งคำขอเรียบร้อยแล้ว!", "success");
                closeJoinSchoolModal();
                await fetchSchoolsAndRefresh();
            } catch (e) {
                showCustomAlert(e.message, "warning");
            } finally {
                btn.disabled = false; btn.innerText = 'ส่งคำขอเข้าร่วมกลุ่มนี้';
            }
        }

        // --- Cancel Request Logic ---
        function confirmCancelRequest(event, schoolId, schoolName) {
            event.stopPropagation();
            showCustomAlert(`คุณต้องการยกเลิกคำขอเข้าร่วมกลุ่ม "${schoolName}" ใช่หรือไม่?`, "confirm", async () => {
                const { error } = await sysDB.from('teacher_schools').delete().eq('teacher_id', currentUser.id).eq('school_id', schoolId);
                if (error) {
                    showCustomAlert("ไม่สามารถยกเลิกคำขอได้: " + error.message, "warning");
                } else {
                    if (activeViewMode === schoolId) {
                        activeViewMode = 'all';
                        localStorage.setItem('active_school_id', 'all');
                    }
                    showCustomAlert("ยกเลิกคำขอสำเร็จ", "success");
                    await fetchSchoolsAndRefresh();
                }
            });
        }

        window.toggleSidebar = () => {
            const active = document.getElementById('profileSidebar').classList.toggle('active');
            document.getElementById('sidebarOverlay').style.display = active ? 'block' : 'none';
        };

        window.handleFabClick = (e) => {
            if(activeViewMode === 'all') { showCustomAlert("กรุณาเลือกโรงเรียนที่ต้องการจากแถบเมนูข้าง ก่อนสร้างห้องเรียนครับ", "warning"); return; }
            location.href = 'classroom-add.html';
        };

        function openJoinSchoolModal() { document.getElementById('joinSchoolModal').style.display='flex'; }
        function closeJoinSchoolModal() { 
            document.getElementById('joinSchoolModal').style.display='none'; 
            document.getElementById('selectedSchoolDetail').style.display='none';
            document.getElementById('reqSchoolSearch').value = '';
        }

        function showCustomAlert(msg, type='info', callback=null) {
            const m = document.getElementById('customAlertModal');
            const i = document.getElementById('customAlertIcon');
            const t = document.getElementById('customAlertTitle');
            const d = document.getElementById('customAlertMessage');
            const cBtn = document.getElementById('customAlertCancelBtn');
            const oBtn = document.getElementById('customAlertOkBtn');
            
            d.innerText = msg;
            alertCallback = callback;
            cBtn.style.display = 'none';

            if(type==='success') { i.innerHTML='<i class="fas fa-check-circle" style="color:#2ed573;"></i>'; t.innerText="สำเร็จ"; oBtn.style.background="var(--primary)"; }
            else if(type==='warning') { i.innerHTML='<i class="fas fa-exclamation-triangle" style="color:#ffa502;"></i>'; t.innerText="แจ้งเตือน"; oBtn.style.background="#ffa502"; }
            else if(type==='confirm') { 
                i.innerHTML='<i class="fas fa-question-circle" style="color:#ff4757;"></i>'; 
                t.innerText="ยืนยัน"; 
                cBtn.style.display = 'block';
                oBtn.style.background="#ff4757";
            }
            else { i.innerHTML='<i class="fas fa-info-circle" style="color:var(--primary);"></i>'; t.innerText="ข้อมูล"; oBtn.style.background="var(--primary)"; }
            
            m.classList.add('show');
        }

        function closeCustomAlert() { 
            document.getElementById('customAlertModal').classList.remove('show');
        }

        document.getElementById('customAlertOkBtn').onclick = () => {
            closeCustomAlert();
            if (alertCallback) { alertCallback(); alertCallback = null; }
        };

        function handleLogout() { showCustomAlert("คุณต้องการออกจากระบบใช่หรือไม่?", "confirm", async () => { await sysDB.auth.signOut(); localStorage.removeItem('active_school_id'); location.href='teacher-login.html'; }); }
    </script>
</body>
</html>
