<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dashboard - FlipSchool</title>
    <script src="js/env-config.js"></script>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { --primary-dark: #000046; --primary: #00008B; --primary-light: #0052D4; --accent: #FF8C00; --bg-body: #f4f7fe; --white: #ffffff; --sidebar-width: 380px; }
        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); display: flex; flex-direction: column; overflow-x: hidden; }

        /* --- Navbar --- */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 0 50px; height: 90px; background: var(--white); box-shadow: 0 2px 20px rgba(0,0,0,0.04); position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; cursor: pointer; color: inherit; }
        .logo-container img { height: 55px; }
        .brand-name { font-size: 26px; font-weight: 700; color: #2d3436; font-family: 'Kanit'; }
        .nav-profile-trigger { width: 52px; height: 52px; border-radius: 50%; border: 3px solid #eef2f7; cursor: pointer; object-fit: cover; transition: 0.3s ease; }

        /* --- Sidebar (ปรับลดความเบลอของกระจกฝ้า) --- */
        .sidebar-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); backdrop-filter: blur(4px); display: none; z-index: 1999; }
        .sidebar { position: fixed; top: 0; right: calc(var(--sidebar-width) * -1.1); width: var(--sidebar-width); height: 100%; background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(8px); box-shadow: -15px 0 45px rgba(0,0,0,0.1); transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1); z-index: 2000; padding: 40px 30px; display: flex; flex-direction: column; box-sizing: border-box; border-radius: 40px 0 0 40px; overflow-y: auto; }
        .sidebar.active { right: 0; }
        
        /* --- Main Dashboard --- */
        .main-container { flex: 1; padding: 40px 50px; max-width: 1400px; margin: 0 auto; width: 100%; box-sizing: border-box; transition: opacity 0.2s ease; }
        .welcome-hero { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%); border-radius: 40px; padding: 60px; color: white; margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 20px 45px rgba(0, 74, 173, 0.2); position: relative; overflow: hidden; }
        .hero-text-content { position: relative; z-index: 5; }
        .welcome-header { font-family: 'Kanit'; font-size: 42px; font-weight: 700; margin: 0 0 10px 0; }

        /* --- View Filters --- */
        .filter-tab { padding: 12px 24px; background: white; border: 2px solid transparent; border-radius: 50px; font-family: 'Kanit'; font-size: 15px; font-weight: 500; color: #636e72; cursor: pointer; white-space: nowrap; transition: 0.3s; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .filter-tab.active { background: var(--primary); color: white; box-shadow: 0 6px 20px rgba(0, 82, 212, 0.2); }

        /* --- Class Grid --- */
        .class-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 30px; }
        .class-card { background: var(--white); border-radius: 35px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.03); transition: 0.4s; cursor: pointer; border: 1px solid rgba(0,0,0,0.01); display: flex; flex-direction: column; height: 100%; }
        .class-card:hover { transform: translateY(-8px); box-shadow: 0 15px 35px rgba(0,0,0,0.08); }

        /* --- Modals (ปรับความใสให้น้อยลงเพื่อให้ดูคมชัดขึ้น) --- */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 3000; padding: 20px; box-sizing: border-box; }
        .modal-box { background: white; border-radius: 24px; width: 100%; max-width: 550px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Custom Alert */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(3px); z-index: 5000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: 0.3s; }
        .custom-modal-overlay.show { opacity: 1; visibility: visible; }

        @media (max-width: 768px) { nav { padding: 0 20px; height: 75px; } .main-container { padding: 20px; } .welcome-hero { padding: 30px 25px; } }
    </style>
</head>
<body>

    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
    
    <!-- SIDEBAR -->
    <div class="sidebar" id="profileSidebar">
        <div class="profile-wrapper"><img src="" id="sidebarImg" class="sidebar-profile-img"></div>
        <h3 id="sideDisplayName" style="text-align:center; font-family:'Kanit'; color:var(--primary-dark); margin:0; font-size: 24px;">...</h3>
        <div class="info-card">
            <div class="info-item"><label>ชื่อ-นามสกุล</label><span id="dispFullName">...</span></div>
            <div id="schoolSwitcherList"></div>
            <button onclick="openJoinSchoolModal()" style="background: #e0e8ff; border: none; color: var(--primary-light); padding: 12px; border-radius: 12px; margin-top: 15px; width: 100%; cursor: pointer; font-family: 'Sarabun'; font-weight: 600;">+ เข้าร่วมกลุ่มโรงเรียน</button>
        </div>
        <button class="logout-btn" onclick="handleLogout()">ออกจากระบบ</button>
    </div>

    <nav>
        <div class="logo-container" onclick="window.location.href='index.html'"><img src="img/favicon.png" alt="Logo"><div class="brand-name">FlipSchool</div></div>
        <img src="" id="navProfileImg" class="nav-profile-trigger" onclick="toggleSidebar()">
    </nav>

    <main class="main-container" id="mainDashboardContent">
        <div class="welcome-hero">
            <div class="hero-text-content">
                <h1 class="welcome-header"><span id="welcomeHeader">กำลังโหลด...</span></h1>
                <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 15px;"><div id="welcomeSchool" style="color: #ffeaa7; font-family: 'Kanit';"></div><div id="verificationStatusBadgeContainer"></div></div>
                <p class="welcome-sub">ยินดีต้อนรับกลับสู่พื้นที่สร้างสรรค์นวัตกรรมการจัดการเรียนรู้</p>
            </div>
            <i class="fas fa-gem" style="font-size: 110px; color: rgba(255,255,255,0.1); position: absolute; right: 60px;"></i>
        </div>
        
        <div class="view-filter-container"><div class="view-filter-scroll" id="viewFilterTabs"></div></div>

        <div id="pendingAlertSection" style="display: none; background: #fff8e1; border: 1px solid #ffecb3; border-radius: 20px; padding: 20px; margin-bottom: 30px;">
            <p id="pendingAlertDesc" style="margin: 0; color: #856404;"></p>
        </div>

        <div id="classroomSection"><div class="class-grid" id="classGrid"></div></div>
    </main>

    <button onclick="handleFabClick(event)" class="fab-add"><i class="fas fa-plus"></i></button>

    <!-- Alert Modal -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div class="custom-modal-box" style="background:white; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; width: 90%;">
            <div id="customAlertIcon" style="font-size: 50px; margin-bottom: 15px;"></div>
            <h3 id="customAlertTitle" style="font-family: 'Kanit';"></h3>
            <p id="customAlertMessage"></p>
            <button class="btn-save" style="margin-top: 20px;" onclick="closeCustomAlert()">ตกลง</button>
        </div>
    </div>

    <script>
        let currentUser = null, currentUserData = null, userSchools = [], activeViewMode = 'all', activeSchool = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof sysDB !== 'undefined') {
                const { data: { user } } = await sysDB.auth.getUser();
                if (!user) { location.href = 'teacher-login.html'; return; }
                currentUser = user;
                await initialFetch();
            }
        });

        async function initialFetch() {
            const { data: teacher } = await sysDB.from('teachers').select('*').eq('teacher_id', currentUser.id).single();
            if (!teacher) return;
            currentUserData = teacher;
            document.getElementById('welcomeHeader').innerText = `สวัสดีครับ ครู${teacher.first_name}`;
            document.getElementById('dispFullName').innerText = `${teacher.first_name} ${teacher.last_name}`;
            document.getElementById('navProfileImg').src = teacher.profile_pic || `https://api.dicebear.com/7.x/avataaars/svg?seed=${teacher.first_name}`;
            document.getElementById('sidebarImg').src = document.getElementById('navProfileImg').src;
            await fetchSchoolsAndRefresh();
        }

        async function fetchSchoolsAndRefresh() {
            const { data: schools } = await sysDB.from('teacher_schools').select('*, schools(school_name, school_abbr)').eq('teacher_id', currentUser.id);
            userSchools = schools || [];
            activeViewMode = localStorage.getItem('active_school_id') || 'all';
            
            if (activeViewMode !== 'all' && activeViewMode !== 'independent') {
                activeSchool = userSchools.find(s => s.school_id === activeViewMode);
                if (!activeSchool) activeViewMode = 'all';
            }
            renderDashboardState();
        }

        function renderDashboardState() {
            const main = document.getElementById('mainDashboardContent');
            // ปรับจาก 0.5 เป็น 0.85 เพื่อลดอาการหมอกฝ้าตอนเปลี่ยนโหมด
            main.style.opacity = '0.85'; 

            const ws = document.getElementById('welcomeSchool');
            if (activeViewMode === 'all') ws.innerText = 'พื้นที่รวมทุกห้องเรียน';
            else if (activeViewMode === 'independent') ws.innerText = 'พื้นที่ส่วนตัว (อิสระ)';
            else ws.innerText = `สังกัด: ${activeSchool.schools?.school_name}`;

            renderFilterTabs();
            fetchClassrooms();
            setTimeout(() => main.style.opacity = '1', 150);
        }

        function renderFilterTabs() {
            const container = document.getElementById('viewFilterTabs');
            let html = `<button class="filter-tab ${activeViewMode === 'all' ? 'active' : ''}" onclick="switchSchool('all')">ทั้งหมด</button>`;
            html += `<button class="filter-tab ${activeViewMode === 'independent' ? 'active' : ''}" onclick="switchSchool('independent')">ส่วนตัว</button>`;
            userSchools.forEach(s => {
                html += `<button class="filter-tab ${activeViewMode === s.school_id ? 'active' : ''}" onclick="switchSchool('${s.school_id}')">${s.schools?.school_name}</button>`;
            });
            container.innerHTML = html;
        }

        window.switchSchool = (id) => {
            activeViewMode = id;
            localStorage.setItem('active_school_id', id);
            activeSchool = userSchools.find(s => s.school_id === id);
            renderDashboardState();
        };

        async function fetchClassrooms() {
            const grid = document.getElementById('classGrid');
            grid.innerHTML = '<p>กำลังโหลด...</p>';
            const { data } = await sysDB.from('classrooms').select('*').eq('teacher_id', currentUser.id).order('created_at', { ascending: false });
            let filtered = data || [];
            if (activeViewMode === 'independent') {
                const schoolIds = userSchools.map(s => s.school_id);
                filtered = filtered.filter(c => !schoolIds.includes(c.school_id));
            } else if (activeViewMode !== 'all') {
                filtered = filtered.filter(c => c.school_id === activeViewMode);
            }

            if (filtered.length === 0) { grid.innerHTML = '<p>ไม่พบห้องเรียน</p>'; return; }
            grid.innerHTML = filtered.map(c => `
                <div class="class-card" onclick="location.href='classroom-detail.html?id=${c.classroom_id}'">
                    <div style="height:100px; background:${c.color_code || '#00008B'};"></div>
                    <div style="padding:20px;">
                        <div class="room-badge">${c.room_name}</div>
                        <h3 class="subject-title">${c.subject_name}</h3>
                    </div>
                </div>
            `).join('');
        }

        window.toggleSidebar = () => {
            const s = document.getElementById('profileSidebar');
            const o = document.getElementById('sidebarOverlay');
            const active = s.classList.toggle('active');
            o.style.display = active ? 'block' : 'none';
        };

        function closeCustomAlert() { document.getElementById('customAlertModal').classList.remove('show'); }
        function handleLogout() { sysDB.auth.signOut().then(() => location.href='teacher-login.html'); }
    </script>
</body>
</html>
