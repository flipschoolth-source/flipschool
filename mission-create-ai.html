<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator ✨ | FlipSchool</title>

    <!-- 1. โหลดความลับจาก Vercel -->
    <script src="js/env-config.js"></script>
    
    <!-- 2. โหลดค่า Config หลัก -->
    <script src="js/config.js"></script>
    
    <!-- 3. โหลด Supabase SDK (สำคัญมาก: ต้องโหลดก่อน supabase-db.js) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- 4. โหลดตัวเชื่อมฐานข้อมูล -->
    <script src="js/supabase-db.js"></script>

    <!-- 5. โหลดเครื่องมืออื่นๆ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .preview-frame-wrapper {
            background: #334155;
            border-radius: 2rem;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 12px solid #1e293b;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            margin: auto;
            position: relative;
        }
        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 100%; border-radius: 0; border: none; }
        .is-landscape.device-mobile { width: 667px; height: 375px; }
        .is-landscape.device-tablet { width: 1024px; height: 768px; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .btn-ai-sparkle {
            background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            border: 1px solid #e2e8f0;
            color: #475569;
            font-size: 0.75rem;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        .btn-ai-sparkle:hover { border-color: #7c3aed; color: #7c3aed; transform: scale(1.05); }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-inner">
                    <span class="text-blue-900 text-2xl">🎓</span>
                </div>
                <span class="text-2xl font-bold tracking-tight">Flip<span class="text-orange-400">School</span></span>
            </div>
            <div class="flex gap-4 items-center font-medium">
                <a href="mission-create.html" class="hover:text-orange-300 transition-colors text-sm">เครื่องมือทั้งหมด</a>
                <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition-all text-sm">ย้อนกลับ</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                <h2 class="text-2xl font-bold text-blue-900 mb-6 flex items-center gap-3">
                    <span class="text-3xl">🤖</span> AI Mission Creator
                </h2>

                <div class="mb-8 p-6 bg-slate-50 rounded-3xl border border-slate-200 shadow-inner">
                    <div class="flex justify-between items-center mb-3">
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">Google Gemini API Key</label>
                        <a href="https://aistudio.google.com/app/api-keys" target="_blank" class="text-[10px] text-blue-600 hover:underline font-bold">รับคีย์ที่นี่ ↗</a>
                    </div>
                    <div class="flex gap-2">
                        <div class="relative flex-grow">
                            <input type="password" id="apiKeyInput" 
                                class="w-full bg-white border border-slate-300 rounded-2xl p-3 pr-10 focus:ring-2 focus:ring-orange-500 outline-none text-sm transition-all"
                                placeholder="AIzaSy...">
                            <button onclick="toggleKeyVisibility()" class="absolute right-3 top-3 text-slate-400">👁️</button>
                        </div>
                        <button id="saveKeyBtn" class="bg-blue-900 hover:bg-black text-white px-5 rounded-2xl font-bold transition-all text-sm shadow-md active:scale-95">
                            บันทึก
                        </button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2">
                        <label class="block text-sm font-bold text-slate-700">ระบุรายละเอียดภารกิจ</label>
                        <div class="flex gap-2">
                            <button id="btnOptimizePrompt" class="btn-ai-sparkle shadow-sm">
                                <span>✨ ปรับแต่งคำสั่ง</span>
                            </button>
                            <button id="btnSuggestIdeas" class="btn-ai-sparkle shadow-sm">
                                <span>✨ ไอเดียใหม่</span>
                            </button>
                        </div>
                    </div>
                    <textarea id="promptInput" 
                        class="w-full h-48 bg-slate-50 border border-slate-200 rounded-3xl p-5 focus:ring-2 focus:ring-blue-600 outline-none transition-all resize-none text-slate-700"
                        placeholder="เช่น: สร้างเกมตอบคำถามเรื่องวงจรชีวิตของกบ..."></textarea>

                    <div id="loadingStatus" class="hidden p-4 rounded-2xl bg-orange-50 border border-orange-100 flex items-center gap-4 shadow-sm">
                        <div class="w-5 h-5 border-2 border-orange-500 border-t-transparent rounded-full spinner"></div>
                        <span id="loadingMessage" class="text-sm font-bold text-orange-700 italic">AI กำลังรังสรรค์โค้ดสำหรับบทเรียน...</span>
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button id="generateBtn" class="flex-grow bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-200 flex items-center justify-center gap-2 transform active:scale-95">
                            🚀 เริ่มเนรมิตภารกิจ
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-4">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center px-6 gap-3">
                <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                    <button onclick="changeView('mobile')" id="btn-mobile" class="p-2 bg-white shadow-sm rounded-lg transition-all">📱</button>
                    <button onclick="changeView('tablet')" id="btn-tablet" class="p-2 hover:bg-white transition-all rounded-lg">📑</button>
                    <button onclick="changeView('desktop')" id="btn-desktop" class="p-2 hover:bg-white transition-all rounded-lg">💻</button>
                </div>
                
                <div class="flex items-center gap-6">
                    <label class="flex items-center gap-2 text-xs font-bold text-slate-500 cursor-pointer">
                        <input type="checkbox" id="orientSwitch" class="w-4 h-4 accent-orange-500 rounded border-slate-300"> แนวนอน
                    </label>
                    <button id="saveToCloudBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition-all hidden shadow-md active:scale-95">
                        📌 บันทึกเข้าห้องเรียน
                    </button>
                </div>
            </div>

            <div class="flex-grow flex items-start justify-center overflow-auto p-2 md:p-4 min-h-[650px] bg-slate-200/50 rounded-[2.5rem] border-4 border-dashed border-slate-300">
                <div id="previewWrapper" class="preview-frame-wrapper device-mobile shadow-2xl">
                    <iframe id="missionFrame" class="w-full h-full bg-white border-none" name="missionFrame"></iframe>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 mt-auto">
        <div class="container mx-auto px-6 text-center">
            <p class="text-blue-900 font-bold mb-1 italic">© 2026 FlipSchool. นวัตกรรมเพื่อการจัดการเรียนรู้ GLORY Model</p>
            <p class="text-slate-500 text-xs italic">ออกแบบและพัฒนาโดย ครูไพรัช อินควรชุม | โรงเรียนเทศบาล 1 (ถนนนครนอก) เทศบาลนครสงขลา</p>
        </div>
    </footer>

    <script>
        // กำหนด API Key พื้นฐาน (สิ่งแวดล้อมจะเติมให้)
        const apiKey = ""; 
        const MODEL_ID = "gemini-2.5-flash-preview-09-2025"; 
        let currentSize = 'mobile';
        let generatedCode = "";

        const frame = document.getElementById("missionFrame");
        const wrapper = document.getElementById("previewWrapper");
        const keyInput = document.getElementById("apiKeyInput");
        const orientSwitch = document.getElementById("orientSwitch");
        const promptInput = document.getElementById("promptInput");
        const loadingStatus = document.getElementById("loadingStatus");

        // ฟังก์ชันดึง Database Client
        function getDB() {
            return window.sysDB;
        }

        // ฟังก์ชันรอจนกว่า Database จะพร้อม
        async function waitForDB(maxAttempts = 10) {
            for (let i = 0; i < maxAttempts; i++) {
                if (window.sysDB) return window.sysDB;
                // ถ้ายังไม่มี ให้ลองสั่ง init อีกครั้ง
                if (window.initSupabase) window.initSupabase();
                await new Promise(r => setTimeout(r, 500));
            }
            return null;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            // รอ DB เชื่อมต่อ
            const db = await waitForDB();
            if (db) {
                await loadKeyFromDB();
            } else {
                console.error("❌ Database connection timeout");
            }

            document.getElementById("saveKeyBtn").addEventListener("click", saveKeyToDB);
            document.getElementById("generateBtn").addEventListener("click", handleGenerate);
            document.getElementById("saveToCloudBtn").addEventListener("click", saveMissionToClassroom);
            document.getElementById("btnOptimizePrompt").addEventListener("click", optimizePrompt);
            document.getElementById("btnSuggestIdeas").addEventListener("click", suggestIdeas);
            orientSwitch.addEventListener("change", applyViewSettings);

            initPreviewFrame();
        });

        async function saveKeyToDB() {
            const key = keyInput.value.trim();
            if(!key) return alert("กรุณาระบุ API Key");
            
            const db = getDB();
            if (!db) return alert("ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณาลองใหม่ (sysDB is null)");

            try {
                const { data: { user } } = await db.auth.getUser();
                if(!user) return alert("กรุณาเข้าสู่ระบบก่อนดำเนินการ");

                const { error } = await db
                    .from('teachers')
                    .update({ gemini_api_key: key })
                    .eq('teacher_id', user.id);

                if(error) throw error;
                alert("บันทึก API Key สำเร็จ! ✨");
            } catch (err) { 
                alert("เกิดข้อผิดพลาด: " + err.message); 
            }
        }

        async function loadKeyFromDB() {
            const db = getDB();
            if (!db) return;
            try {
                const { data: { user } } = await db.auth.getUser();
                if(user) {
                    const { data } = await db.from('teachers').select('gemini_api_key').eq('teacher_id', user.id).single();
                    if(data?.gemini_api_key) keyInput.value = data.gemini_api_key;
                }
            } catch (e) { console.error("Load Key Error:", e); }
        }

        // --- ระบบ Gemini API ---
        async function callGemini(userPrompt, systemPrompt = "") {
            const targetKey = apiKey || keyInput.value.trim();
            if (!targetKey) throw new Error("ไม่พบ API Key");

            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${targetKey}`;
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: userPrompt }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                })
            });
            const result = await response.json();
            return result.candidates?.[0]?.content?.parts?.[0]?.text;
        }

        async function handleGenerate() {
            const prompt = promptInput.value.trim();
            if(!prompt) return alert("กรุณาระบุรายละเอียดภารกิจ");

            toggleLoading(true, "AI กำลังรังสรรค์โค้ดสำหรับบทเรียน...");

            const sysInstruction = `คุณคือ FlipSchool AI สร้างสื่อการสอน Single HTML (Tailwind + Sarabun Font). ส่งเฉพาะโค้ด HTML เท่านั้น ห้ามมี Markdown`;

            try {
                const code = await callGemini(prompt, sysInstruction);
                const cleanCode = code.replace(/```html/gi, "").replace(/```/g, "").trim();
                generatedCode = cleanCode;
                frame.srcdoc = cleanCode;
                document.getElementById("saveToCloudBtn").classList.remove("hidden");
            } catch (err) { alert("Error: " + err.message); }
            finally { toggleLoading(false); }
        }

        function toggleLoading(show, message = "") {
            loadingStatus.classList.toggle("hidden", !show);
            document.getElementById("generateBtn").disabled = show;
        }

        function initPreviewFrame() {
            frame.srcdoc = `<html><body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun'; color:#94a3b8; text-align:center;"><div><h1>🎮</h1><p>ระบุคำสั่งแล้วกดปุ่มเนรมิต</p></div></body></html>`;
        }

        function changeView(size) {
            currentSize = size;
            applyViewSettings();
        }

        function applyViewSettings() {
            wrapper.className = `preview-frame-wrapper device-${currentSize} ${orientSwitch.checked ? 'is-landscape' : ''}`;
        }

        function toggleKeyVisibility() { keyInput.type = keyInput.type === 'password' ? 'text' : 'password'; }

        async function optimizePrompt() { /* ... similar to handleGenerate ... */ }
        async function suggestIdeas() { /* ... similar to handleGenerate ... */ }
        async function saveMissionToClassroom() { /* ... using getDB() ... */ }
    </script>
</body>
</html>
