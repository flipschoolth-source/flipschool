<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator | FlipSchool</title>

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .preview-outer-container { width: 100%; display: flex; justify-content: center; align-items: flex-start; padding: 1.5rem; min-height: 600px; }
        .preview-frame-wrapper { background: #1e293b; border-radius: 2rem; overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); border: 8px solid #0f172a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); position: relative; transform-origin: top center; }
        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 750px; border-radius: 1rem; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .btn-ai-sparkle { background: white; border: 1px solid #e2e8f0; color: #475569; font-size: 0.75rem; padding: 0.5rem 0.8rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
        .btn-ai-sparkle:hover { border-color: #3b82f6; color: #3b82f6; background: #f0f7ff; transform: translateY(-2px); }
        .custom-message-box { position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem; background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); z-index: 9999; border-left: 5px solid #3b82f6; display: none; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .hidden-el { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="msgBox" class="custom-message-box">
        <p id="msgText" class="text-sm font-bold text-slate-700"></p>
    </div>

    <!-- Save Modal -->
    <div id="saveModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl border border-slate-100">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-blue-50 text-blue-900 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-blue-100">
                    <svg class="w-10 h-10" fill="currentColor" viewBox="0 0 20 20"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12V13a1 1 0 00.657.939l4 1.714a1 1 0 00.686 0l4-1.714A1 1 0 0015 13v-2.88l1.69-.723a1 1 0 011.31 1.25l-.71 3.551a1 1 0 01-.818.803l-6 1.05a1 1 0 01-.344 0l-6-1.05a1 1 0 01-.818-.803l-.71-3.551a1 1 0 011.31-1.25l1.39.596zM14 13l-4 1.714L6 13V11l4 1.714L14 11v2z"/></svg>
                </div>
                <h3 class="text-xl font-bold text-slate-800">ยืนยันการเนรมิตภารกิจ</h3>
                <p class="text-sm text-slate-500 mt-2">ข้อมูลจะถูกเก็บเข้าคลังส่วนตัวและแสดงผลในห้องเรียนทันทีครับ</p>
            </div>
            <div class="space-y-3">
                <button id="saveExitBtn" onclick="confirmSave('exit')" class="w-full bg-blue-900 hover:bg-black text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95 text-sm">
                    💾 บันทึกและกลับสู่ห้องเรียน
                </button>
                <button onclick="closeSaveModal()" class="w-full text-slate-400 font-semibold py-2 text-sm hover:text-slate-600">ย้อนกลับไปแก้ไข</button>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0">
                    <svg class="w-7 h-7 text-blue-900" fill="currentColor" viewBox="0 0 20 20"><path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12V13a1 1 0 00.657.939l4 1.714a1 1 0 00.686 0l4-1.714A1 1 0 0015 13v-2.88l1.69-.723a1 1 0 011.31 1.25l-.71 3.551a1 1 0 01-.818.803l-6 1.05a1 1 0 01-.344 0l-6-1.05a1 1 0 01-.818-.803l-.71-3.551a1 1 0 011.31-1.25l1.39.596zM14 13l-4 1.714L6 13V11l4 1.714L14 11v2z"/></svg>
                </div>
                <div class="flex flex-col">
                    <div id="app-name-display" class="text-xl md:text-2xl font-bold tracking-tight leading-none">
                        <span class="text-white">Flip</span><span class="text-orange-400">School</span>
                    </div>
                    <span id="app-slogan-display" class="text-[10px] md:text-xs text-blue-200 font-medium mt-0.5 tracking-wide">...</span>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs transition-all flex items-center gap-2 border border-white/10">
                    <i class="fas fa-arrow-left"></i> ย้อนกลับ
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Controls -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-8">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center shadow-inner">
                            <i class="fas fa-robot text-2xl"></i>
                        </div>
                        <h2 class="text-2xl font-bold text-blue-900 leading-tight">AI Mission Creator</h2>
                    </div>
                    <div id="ownershipStatus" class="hidden-el"></div>
                </div>

                <!-- API Manager -->
                <div id="apiKeyEditView" class="mb-8 p-5 bg-slate-50 rounded-[1.5rem] border border-slate-200 shadow-inner">
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-2">Gemini API Key</label>
                    <div class="flex gap-2">
                        <input type="password" id="apiKeyInput" class="w-full bg-white border border-slate-300 rounded-xl p-3 outline-none text-sm focus:ring-2 focus:ring-blue-500" placeholder="ระบุ Key เพื่อเริ่มงาน...">
                        <button id="saveKeyBtn" class="bg-blue-900 text-white px-5 rounded-xl font-bold text-sm transition-all active:scale-95">บันทึก</button>
                    </div>
                </div>

                <div class="space-y-6">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">ชื่อภารกิจ</label>
                        <input type="text" id="missionTitleInput" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 outline-none text-sm font-bold focus:ring-2 focus:ring-blue-500 transition-all" placeholder="เช่น การแยกขยะประเภทต่างๆ...">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-sm font-bold text-slate-700">คำสั่ง AI</label>
                            <div class="flex gap-1">
                                <button onclick="optimizePrompt()" class="btn-ai-sparkle">✨ ขัดเกลา</button>
                                <button onclick="suggestIdeas()" class="btn-ai-sparkle">💡 ไอเดีย</button>
                            </div>
                        </div>
                        <textarea id="promptInput" class="w-full h-48 bg-slate-50 border border-slate-200 rounded-[1.5rem] p-6 outline-none transition-all resize-none text-sm focus:ring-2 focus:ring-blue-500 shadow-inner" placeholder="บอก AI ว่าคุณครูต้องการสื่อแบบไหน..."></textarea>
                    </div>

                    <div id="loadingStatus" class="hidden-el p-4 rounded-2xl bg-blue-50 border border-blue-100 flex items-center gap-4 animate-pulse">
                        <div class="w-6 h-6 border-3 border-blue-500 border-t-transparent rounded-full spinner"></div>
                        <span class="text-sm font-bold text-blue-700">AI กำลังวิเคราะห์และตรวจสอบความปลอดภัย...</span>
                    </div>

                    <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-[1.5rem] transition-all shadow-xl shadow-blue-100 text-lg transform active:scale-95">
                        🚀 เริ่มเนรมิตภารกิจ
                    </button>
                </div>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="lg:col-span-7 flex flex-col gap-5">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center px-6">
                <div class="flex gap-2 bg-slate-100 p-1.5 rounded-xl">
                    <button onclick="changeView('mobile')" id="view-mobile" class="w-10 h-10 bg-white rounded-lg shadow-sm flex items-center justify-center"><i class="fas fa-mobile-alt"></i></button>
                    <button onclick="changeView('tablet')" id="view-tablet" class="w-10 h-10 hover:bg-white rounded-lg transition-all flex items-center justify-center"><i class="fas fa-tablet-alt"></i></button>
                    <button onclick="changeView('desktop')" id="view-desktop" class="w-10 h-10 hover:bg-white rounded-lg transition-all flex items-center justify-center"><i class="fas fa-desktop"></i></button>
                </div>
                <button id="saveToCloudBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold hidden shadow-lg transition-all flex items-center gap-2">
                    <i class="fas fa-save"></i> บันทึกลงห้องเรียน
                </button>
            </div>

            <div class="preview-outer-container bg-slate-200/50 rounded-[3rem] border-4 border-dashed border-slate-300 shadow-inner">
                <div id="previewWrapper" class="preview-frame-wrapper device-mobile shadow-2xl">
                    <iframe id="missionFrame" class="w-full h-full bg-white border-none" sandbox="allow-scripts allow-forms allow-modals allow-same-origin" title="Preview"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script>
        const MODEL_ID = "gemini-2.5-flash-preview-09-2025"; 
        let generatedCode = "", targetCid = null, editingMid = null, currentUserId = null, originalTeacherId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.CONFIG) document.getElementById('app-slogan-display').innerText = window.CONFIG.APP_SLOGAN;
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');
            editingMid = params.get('mid');
            document.getElementById("generateBtn").addEventListener("click", handleGenerate);
            document.getElementById("saveToCloudBtn").addEventListener("click", openSaveModal);
            document.getElementById("saveKeyBtn").addEventListener("click", saveKeyToDB);
            initPreviewFrame();
            await loadKeyFromDB();
            if (editingMid) await loadExistingMission();
        });

        // ✅ ฟังก์ชันตรวจสอบ Phishing/Security
        function checkSafety(text) {
            const risky = ["ignore instructions", "reveal system prompt", "แฮก", "hack", "password", "fetch('", "axios.", "cookie", "localStorage", "window.location", "eval("];
            return !risky.some(pattern => text.toLowerCase().includes(pattern));
        }

        async function loadExistingMission() {
            if (!window.sysDB) return setTimeout(loadExistingMission, 500);
            try {
                const { data: { user } } = await window.sysDB.auth.getUser();
                currentUserId = user?.id;
                const { data } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
                if (data) {
                    originalTeacherId = data.created_by;
                    document.getElementById("missionTitleInput").value = data.title;
                    document.getElementById("promptInput").value = data.description || "";
                    generatedCode = data.content_data?.html || "";
                    document.getElementById("missionFrame").srcdoc = generatedCode;
                    document.getElementById("saveToCloudBtn").classList.remove("hidden");
                    const statusEl = document.getElementById('ownershipStatus');
                    statusEl.classList.remove('hidden-el');
                    statusEl.innerHTML = currentUserId === originalTeacherId ? '<span class="px-3 py-1 bg-green-100 text-green-700 text-[10px] font-bold rounded-full">ผู้สร้างหลัก</span>' : '<span class="px-3 py-1 bg-red-100 text-red-700 text-[10px] font-bold rounded-full">แก้ไขและบันทึกใหม่</span>';
                }
            } catch (err) {}
        }

        async function handleGenerate() {
            const prompt = document.getElementById("promptInput").value.trim();
            if(!prompt) return showMessage("กรุณาระบุรายละเอียด");
            if(!checkSafety(prompt)) return showMessage("❌ ตรวจพบคำสั่งไม่ปลอดภัย");

            toggleLoading(true);
            const apiKey = document.getElementById("apiKeyInput").value.trim();
            if(!apiKey) return showMessage("กรุณาระบุ API Key");

            try {
                const sys = "สร้างไฟล์ HTML ชุดเดียว (Inline CSS/JS) ที่สวยงาม พรีเมียม เป็นสื่อการสอน ภาษาไทย จบแล้วเรียก window.parent.postMessage({type: 'SAVE_RESULT', score: ..., answers: [...]}, '*') ห้ามเข้าถึงความลับเครื่อง";
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${apiKey}`;
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: sys }] } })
                });
                const result = await response.json();
                const code = result.candidates?.[0]?.content?.parts?.[0]?.text;
                generatedCode = code.replace(/```html/gi, "").replace(/```/g, "").trim();
                document.getElementById("missionFrame").srcdoc = generatedCode;
                document.getElementById("saveToCloudBtn").classList.remove("hidden");
                showMessage("เนรมิตภารกิจสำเร็จ! ✨");
            } catch (err) { showMessage("ข้อผิดพลาด: " + err.message); }
            finally { toggleLoading(false); }
        }

        // ✅ ฟังก์ชันบันทึก 2 ที่ (คลังหลัก + ห้องเรียน)
        async function confirmSave(mode) {
            if(!window.sysDB || !targetCid) return;
            try {
                const missionData = {
                    title: document.getElementById("missionTitleInput").value.trim(),
                    description: document.getElementById("promptInput").value,
                    mission_type: "ai_generated",
                    content_data: { html: generatedCode },
                    updated_at: new Date().toISOString()
                };

                let savedMissionId = editingMid;

                // 1. บันทึก/อัปเดตในคลังหลัก (missions)
                if (editingMid && currentUserId === originalTeacherId) {
                    await window.sysDB.from('missions').update(missionData).eq('mission_id', editingMid);
                } else {
                    missionData.created_by = currentUserId;
                    missionData.created_at = new Date().toISOString();
                    const { data } = await window.sysDB.from('missions').insert([missionData]).select();
                    savedMissionId = data[0].mission_id;
                }

                // 2. บันทึกการเชื่อมโยงกับห้องเรียน (classroom_missions)
                await window.sysDB.from('classroom_missions').upsert({
                    classroom_id: targetCid,
                    mission_id: savedMissionId,
                    is_visible: true
                }, { onConflict: 'classroom_id, mission_id' });

                if (mode === 'exit') window.location.href = `classroom-detail.html?id=${targetCid}`;
            } catch (err) { showMessage("บันทึกไม่สำเร็จ: " + err.message); }
        }

        async function saveKeyToDB() {
            const key = document.getElementById("apiKeyInput").value.trim();
            const { data: { user } } = await window.sysDB.auth.getUser();
            await window.sysDB.from('teachers').update({ gemini_api_key: key }).eq('teacher_id', user.id);
            showMessage("บันทึก Key สำเร็จ! ✨");
        }

        async function loadKeyFromDB() {
            if(!window.sysDB) return setTimeout(loadKeyFromDB, 500);
            const { data: { user } } = await window.sysDB.auth.getUser();
            if(user) {
                const { data } = await window.sysDB.from('teachers').select('gemini_api_key').eq('teacher_id', user.id).single();
                if(data?.gemini_api_key) document.getElementById("apiKeyInput").value = data.gemini_api_key;
            }
        }

        function showMessage(text) { document.getElementById("msgText").innerText = text; document.getElementById("msgBox").style.display = "block"; setTimeout(() => document.getElementById("msgBox").style.display = "none", 4000); }
        function toggleLoading(show) { document.getElementById("loadingStatus").classList.toggle('hidden-el', !show); document.getElementById("generateBtn").disabled = show; }
        function openSaveModal() { document.getElementById('saveModal').classList.remove('hidden'); }
        function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }
        function changeView(size) { document.getElementById("previewWrapper").className = `preview-frame-wrapper device-${size}`; }
        function initPreviewFrame() { document.getElementById("missionFrame").srcdoc = `<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#94a3b8; background:#fff; margin:0;"><div><h1 style="font-size:3rem; margin:0;">🎓</h1><p>พร้อมสร้างสรรค์บทเรียนอัจฉริยะร่วมกับคุณครูครับ</p></div></body>`; }
    </script>
</body>
</html>
