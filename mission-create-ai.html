<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator ✨ | FlipSchool</title>

    <!-- ระบบความลับและ Config -->
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    
    <!-- Supabase Integration -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <!-- UI & Fonts -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        
        .preview-outer-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem;
            min-height: 700px;
        }

        .preview-frame-wrapper {
            background: #1e293b;
            border-radius: 2.5rem;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 10px solid #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 800px; border-radius: 1rem; border: 4px solid #334155; }
        .is-landscape.device-mobile { width: 667px; height: 375px; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        
        .custom-message-box {
            position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem;
            background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            z-index: 9999; border-left: 5px solid #FF8C00; display: none;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        .hidden-el { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }

        .edit-badge {
            background: #fef3c7;
            color: #92400e;
            padding: 2px 10px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: bold;
            border: 1px solid #f59e0b;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Notification -->
    <div id="msgBox" class="custom-message-box">
        <p id="msgText" class="text-sm font-bold text-slate-700"></p>
    </div>

    <!-- Modal บันทึก -->
    <div id="saveModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl border border-slate-100">
            <div class="text-center mb-6">
                <div id="saveIcon" class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center text-3xl mx-auto mb-4">💾</div>
                <h3 id="saveModalTitle" class="text-xl font-bold text-slate-800">ยืนยันการบันทึกภารกิจ</h3>
                <p id="saveModalDesc" class="text-sm text-slate-500 mt-2">ผลงานจาก AI พร้อมเข้าสู่ห้องเรียนแล้วครับ</p>
            </div>
            <div class="space-y-3">
                <button id="saveExitBtn" onclick="confirmSave('exit')" class="w-full bg-blue-900 hover:bg-black text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95">
                    ✅ บันทึกและกลับห้องเรียน
                </button>
                <button id="saveContinueBtn" onclick="confirmSave('continue')" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 rounded-2xl transition-all shadow-lg active:scale-95">
                    🚀 บันทึกและทำรายการต่อ
                </button>
                <button onclick="closeSaveModal()" class="w-full text-slate-400 font-semibold py-2 text-sm">ย้อนกลับไปแก้ไข</button>
            </div>
        </div>
    </div>

    <!-- Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-white rounded-xl flex items-center justify-center shadow-inner">
                    <span class="text-blue-900 text-xl">🎓</span>
                </div>
                <span class="text-xl md:text-2xl font-bold tracking-tight">Flip<span class="text-orange-400">School</span></span>
            </div>
            <div class="flex gap-4 items-center">
                <a href="teacher-dashboard.html" class="hover:text-orange-300 text-xs md:text-sm">แดชบอร์ด</a>
                <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs">ย้อนกลับ</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- แผงควบคุม (ซ้าย) -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                <div class="flex justify-between items-start mb-6">
                    <h2 class="text-2xl font-bold text-blue-900 flex items-center gap-3">
                        <span class="text-3xl">🤖</span> 
                        <span id="pageModeDisplay">AI Mission Creator</span>
                    </h2>
                    <div id="editModeBadge" class="hidden-el">
                        <span class="edit-badge">EDIT MODE</span>
                    </div>
                </div>

                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-1">ชื่อภารกิจ <span class="text-rose-500">*</span></label>
                        <input type="text" id="missionTitleInput" 
                            class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 focus:ring-2 focus:ring-blue-600 outline-none text-sm font-bold"
                            placeholder="เช่น ตะลุยโลกแมลง">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">คำสั่งเนรมิตภารกิจ (Prompt)</label>
                        <textarea id="promptInput" 
                            class="w-full h-44 bg-slate-50 border border-slate-200 rounded-[1.5rem] p-5 focus:ring-2 focus:ring-blue-600 outline-none transition-all resize-none text-sm leading-relaxed"
                            placeholder="บอก AI ว่าอยากได้เกมหรือบทเรียนแบบไหน..."></textarea>
                    </div>

                    <div id="loadingStatus" class="hidden-el p-4 rounded-xl bg-orange-50 border border-orange-100 flex items-center gap-4 animate-pulse">
                        <div class="w-5 h-5 border-2 border-orange-500 border-t-transparent rounded-full spinner"></div>
                        <span class="text-sm font-bold text-orange-700 italic">กำลังร่ายเวทมนตร์ AI...</span>
                    </div>

                    <button id="generateBtn" class="w-full bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg text-lg transform active:scale-95">
                        🚀 เริ่มเนรมิตภารกิจใหม่
                    </button>
                </div>
            </div>
        </div>

        <!-- พื้นที่พรีวิว (ขวา) -->
        <div class="lg:col-span-7 flex flex-col gap-4">
            <div class="bg-white p-3 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center px-4">
                <div class="flex gap-2">
                    <button onclick="changeView('mobile')" class="p-2 hover:bg-slate-100 rounded-lg" title="มือถือ">📱</button>
                    <button id="saveToCloudBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded-xl text-xs font-bold hidden transition-all shadow-md">
                        📌 บันทึกการเปลี่ยนแปลง
                    </button>
                </div>
                <div class="text-[10px] font-bold text-slate-400 tracking-widest">LIVE PREVIEW</div>
            </div>

            <div class="preview-outer-container bg-slate-200/50 rounded-[3rem] border-4 border-dashed border-slate-300 shadow-inner">
                <div id="previewWrapper" class="preview-frame-wrapper device-mobile shadow-2xl">
                    <iframe id="missionFrame" class="w-full h-full bg-white border-none" 
                        sandbox="allow-scripts allow-forms allow-modals allow-same-origin"
                        name="missionFrame" title="พรีวิวภารกิจ"></iframe>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-8 mt-auto text-center">
        <p class="text-blue-900 font-bold mb-1 text-sm italic">© 2026 FlipSchool. นวัตกรรมเพื่อการจัดการเรียนรู้ GLORY Model</p>
        <p class="text-slate-400 text-[10px]">พัฒนาโดย ครูไพรัช อินควรชุม | โรงเรียนเทศบาล 1 (ถนนนครนอก)</p>
    </footer>

    <script>
        const MODEL_ID = "gemini-2.5-flash-preview-09-2025"; 
        let generatedCode = "";
        let targetCid = null;
        let editingMid = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');
            editingMid = params.get('mid');

            document.getElementById("generateBtn").addEventListener("click", handleGenerate);
            document.getElementById("saveToCloudBtn").addEventListener("click", openSaveModal);
            
            initPreviewFrame();

            // หากมี mid แสดงว่าเป็นโหมดแก้ไข
            if (editingMid) {
                document.getElementById('editModeBadge').classList.remove('hidden-el');
                document.getElementById('pageModeDisplay').innerText = "แก้ไขภารกิจเดิม";
                document.getElementById('generateBtn').innerText = "🚀 ปรับปรุงภารกิจด้วย AI";
                loadExistingMission(editingMid);
            }
        });

        async function loadExistingMission(mid) {
            if (!window.sysDB) return setTimeout(() => loadExistingMission(mid), 500);
            try {
                const { data, error } = await window.sysDB
                    .from('missions')
                    .select('*')
                    .eq('mission_id', mid)
                    .single();

                if (error) throw error;

                document.getElementById("missionTitleInput").value = data.title;
                document.getElementById("promptInput").value = data.description || "";
                generatedCode = data.content_data?.html || "";
                
                if (generatedCode) {
                    document.getElementById("missionFrame").srcdoc = generatedCode;
                    document.getElementById("saveToCloudBtn").classList.remove("hidden");
                }
            } catch (err) {
                showMessage("ไม่สามารถดึงข้อมูลภารกิจได้: " + err.message);
            }
        }

        async function handleGenerate() {
            const prompt = document.getElementById("promptInput").value.trim();
            if(!prompt) return showMessage("กรุณาระบุรายละเอียดก่อนครับ");

            toggleLoading(true);
            
            const sys = `คุณคือ FlipSchool AI ผู้เชี่ยวชาญ Gamification และสื่อการสอนระดับพรีเมียม
            1. สร้างไฟล์ HTML ชุดเดียว (Inline CSS/JS) ตกแต่งด้วย Tailwind CSS (โหลดผ่าน CDN)
            2. ต้องเป็นบทเรียนแบบโต้ตอบหรือเกมที่สนุกสนาน มีระบบ Feedback
            3. เมื่อจบกิจกรรมต้องเรียก window.parent.postMessage({type: 'SAVE_RESULT', score: ...}, '*')
            4. ใช้ฟอนต์ Sarabun หรือ Kanit เพื่อความสวยงามในภาษาไทย`;

            try {
                // สำหรับ Preview Environment ใช้ API key ว่าง (ระบบจะเติมให้)
                const apiKey = ""; 
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${apiKey}`;
                
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: sys }] }
                    })
                });

                const result = await response.json();
                const code = result.candidates?.[0]?.content?.parts?.[0]?.text;
                const cleanCode = code.replace(/```html/gi, "").replace(/```/g, "").trim();

                generatedCode = cleanCode;
                document.getElementById("missionFrame").srcdoc = cleanCode;
                document.getElementById("saveToCloudBtn").classList.remove("hidden");
                showMessage("เนรมิตภารกิจสำเร็จแล้ว! ✨");
            } catch (err) {
                showMessage("เกิดข้อผิดพลาดในการเชื่อมต่อ AI: " + err.message);
            } finally {
                toggleLoading(false);
            }
        }

        async function confirmSave(mode) {
            if(!window.sysDB || !targetCid) return showMessage("ข้อมูลไม่ครบถ้วน");

            const saveExitBtn = document.getElementById('saveExitBtn');
            const saveContinueBtn = document.getElementById('saveContinueBtn');

            try {
                saveExitBtn.disabled = true;
                saveContinueBtn.disabled = true;
                saveExitBtn.innerText = "กำลังบันทึก...";

                const missionData = {
                    classroom_id: targetCid,
                    title: document.getElementById("missionTitleInput").value.trim(),
                    description: document.getElementById("promptInput").value,
                    mission_type: "ai_generated",
                    content_data: { html: generatedCode },
                    updated_at: new Date().toISOString()
                };

                let result;
                if (editingMid) {
                    // โหมดแก้ไข: ใช้คำสั่ง Update
                    result = await window.sysDB
                        .from('missions')
                        .update(missionData)
                        .eq('mission_id', editingMid);
                } else {
                    // โหมดสร้างใหม่: ใช้คำสั่ง Insert
                    missionData.created_at = new Date().toISOString();
                    result = await window.sysDB
                        .from('missions')
                        .insert([missionData]);
                }

                if(result.error) throw result.error;

                showMessage(editingMid ? "อัปเดตภารกิจสำเร็จ! 🚀" : "บันทึกภารกิจลงคลังสำเร็จ! 🚀");
                
                if (mode === 'exit') {
                    setTimeout(() => window.location.href = `classroom-detail.html?id=${targetCid}`, 1000);
                } else {
                    closeSaveModal();
                    saveExitBtn.disabled = false;
                    saveContinueBtn.disabled = false;
                    saveExitBtn.innerText = "✅ บันทึกและกลับห้องเรียน";
                }
            } catch (err) {
                showMessage("บันทึกไม่สำเร็จ: " + err.message);
                saveExitBtn.disabled = false;
                saveContinueBtn.disabled = false;
            }
        }

        function showMessage(text) {
            const msgBox = document.getElementById("msgBox");
            document.getElementById("msgText").innerText = text;
            msgBox.style.display = "block";
            setTimeout(() => msgBox.style.display = "none", 4000);
        }

        function toggleLoading(show) {
            document.getElementById("loadingStatus").classList.toggle('hidden-el', !show);
            document.getElementById("generateBtn").disabled = show;
        }

        function openSaveModal() { 
            if(!document.getElementById("missionTitleInput").value.trim()) {
                return showMessage("กรุณาใส่ชื่อภารกิจก่อนครับ");
            }
            if(editingMid) {
                document.getElementById('saveModalTitle').innerText = "ยืนยันการแก้ไขภารกิจ";
                document.getElementById('saveModalDesc').innerText = "การเปลี่ยนแปลงนี้จะถูกอัปเดตไปยังนักเรียนทันทีครับ";
            }
            document.getElementById('saveModal').classList.remove('hidden'); 
        }
        
        function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }

        function changeView(size) {
            const wrapper = document.getElementById("previewWrapper");
            wrapper.className = `preview-frame-wrapper device-${size}`;
        }

        function initPreviewFrame() {
            document.getElementById("missionFrame").srcdoc = `<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#94a3b8; text-align:center; background:#fff;"><div><h1 style="font-size:3rem; margin-bottom:10px;">🤖</h1><p>รอรับผลงานจาก AI ของ FlipSchool ครับ</p></div></body>`;
        }
    </script>
</body>
</html>
