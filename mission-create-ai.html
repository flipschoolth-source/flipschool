<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator | FlipSchool</title>

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .preview-outer-container { width: 100%; display: flex; justify-content: center; align-items: flex-start; padding: 1.5rem; min-height: 650px; overflow: hidden; }
        .preview-frame-wrapper { background: #1e293b; border-radius: 2rem; overflow: hidden; transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); border: 8px solid #0f172a; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); position: relative; transform-origin: top center; }
        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 800px; border-radius: 1rem; border: 4px solid #334155; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        .btn-ai-sparkle { background: white; border: 1px solid #e2e8f0; color: #475569; font-size: 0.75rem; padding: 0.5rem 0.8rem; border-radius: 0.75rem; display: flex; align-items: center; gap: 0.4rem; transition: all 0.2s; }
        .btn-ai-sparkle:hover { border-color: #3b82f6; color: #3b82f6; background: #f0f7ff; transform: translateY(-1px); }
        .custom-message-box { position: fixed; top: 20px; right: 20px; padding: 1rem 1.5rem; background: white; border-radius: 1rem; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); z-index: 9999; border-left: 5px solid #3b82f6; display: none; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .hidden-el { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
        .badge-premium { padding: 4px 12px; border-radius: 999px; font-size: 10px; font-weight: bold; text-transform: uppercase; border-width: 1px; display: inline-flex; align-items: center; gap: 4px; }
        .owner-badge { background: #dcfce7; color: #166534; border-color: #86efac; }
        .copy-badge { background: #fee2e2; color: #991b1b; border-color: #fecaca; }
        .new-badge { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

                        <button onclick="toggleKeyEdit(true)" class="text-[10px] bg-white border border-emerald-200 text-emerald-600 px-3 py-1.5 rounded-lg hover:bg-emerald-100 transition-all font-bold">แก้ไข Key</button>

                            <option value="วิทยาศาสตร์และเทคโนโลยี">วิทยาศาสตร์และเทคโนโลยี</option>
                            <option value="สังคมศึกษา">สังคมศึกษา</option>
                            <option value="สุขศึกษา">สุขศึกษา</option>
                            <option value="ศิลปะ">ศิลปะ</option>
                            <option value="การงานอาชีพ">การงานอาชีพ</option>

                    <div id="classroomContextArea" class="hidden p-4 bg-orange-50 border border-orange-100 rounded-2xl">

                            <div class="bg-white p-3 rounded-xl border border-orange-200 mt-1">
                                <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wide mb-1">ระดับการศึกษา</label>
                                <select id="educationLevelSelect" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-sm font-bold text-slate-700 outline-none focus:ring-2 focus:ring-orange-300"><option value="">ไม่กำหนด</option><option value="อ.">อนุบาล (อ.)</option><option value="ป.">ประถมศึกษา (ป.)</option><option value="ม.">มัธยมศึกษา (ม.)</option></select>
                            </div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">ชื่อภารกิจ</label>
                        <input type="text" id="missionTitleInput" class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-4 outline-none text-sm font-bold focus:ring-2 focus:ring-blue-500 transition-all shadow-inner" placeholder="เช่น เกมตามหาคำกริยา...">
                    </div>

                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label id="promptLabel" class="block text-xs font-bold text-slate-500 uppercase tracking-widest">คำสั่งเนรมิต (AI Prompt)</label>
                            <div class="flex gap-1">
                                <button onclick="resetMission()" class="hidden text-xs bg-red-50 text-red-500 px-3 py-1.5 rounded-lg border border-red-100 hover:bg-red-100 transition-all" id="resetBtn"><i class="fas fa-trash-alt"></i> เริ่มใหม่</button>
                                <button onclick="optimizePrompt()" class="btn-ai-sparkle">✨ ขัดเกลา</button>

                    </div>

                    <div id="loadingStatus" class="hidden-el p-4 rounded-2xl bg-blue-50 border border-blue-100 flex items-center gap-4 animate-pulse">
                        <div class="w-6 h-6 border-3 border-blue-500 border-t-transparent rounded-full spinner"></div>

                    </div>

                    <button id="generateBtn" onclick="handleGenerate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-[1.5rem] transition-all shadow-xl shadow-blue-100 text-lg transform active:scale-95 flex items-center justify-center gap-3">

        <div class="lg:col-span-7 flex flex-col gap-5">

                <div class="flex gap-2 bg-slate-100 p-1.5 rounded-xl">
                    <button onclick="changeView('mobile')" id="view-mobile" class="w-10 h-10 bg-white rounded-lg shadow-sm flex items-center justify-center transition-all"><i class="fas fa-mobile-alt"></i></button>
                    <button onclick="changeView('tablet')" id="view-tablet" class="w-10 h-10 hover:bg-white rounded-lg transition-all flex items-center justify-center"><i class="fas fa-tablet-alt"></i></button>
                    <button onclick="changeView('desktop')" id="view-desktop" class="w-10 h-10 hover:bg-white rounded-lg transition-all flex items-center justify-center"><i class="fas fa-desktop"></i></button>
                </div>
                <button id="saveToCloudBtn" onclick="openSaveModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold hidden shadow-lg transition-all flex items-center gap-2 transform active:scale-95">

    <footer class="bg-white border-t border-slate-200 py-10 mt-auto text-center font-sans">
        <p class="text-blue-900 font-bold mb-1 text-sm italic">© 2026 FlipSchool.</p>
        <p class="text-slate-400 text-[10px] tracking-wide uppercase font-black">Powered by Gemini Pro Vision AI</p>
    </footer>

    <script>
        // ✅ ใช้ Model เสถียรสุด
        const MODEL_ID = "gemini-1.5-flash"; 
        
        let generatedCode = "", targetCid = null, editingMid = null, currentUserId = null, originalTeacherId = null;
        let dbSubjectOnly = "", detectedGradeNumber = "";

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');
            editingMid = params.get('mid');
            initPreviewFrame();
            
            const checkDB = setInterval(async () => {
                if(window.sysDB) {
                    clearInterval(checkDB);
                    const { data: { session } } = await window.sysDB.auth.getSession();
                    if (!session) { window.location.href = 'teacher-login.html'; return; }
                    
                    await loadKeyFromDB(); // โหลด Key ก่อน
                    if (targetCid) await fetchClassroomContext();
                    if (editingMid) await loadExistingMission();
                }
            }, 500);
        });

        // --- Logic: Load Key from DB ---
        async function loadKeyFromDB() {
            try {
                const { data: { user } } = await window.sysDB.auth.getUser();
                if(user) {
                    currentUserId = user.id;
                    // ✅ ใช้ maybeSingle() ป้องกัน Error ถ้ายังไม่มี Key
                    const { data, error } = await window.sysDB.from('teachers').select('gemini_api_key').eq('teacher_id', user.id).maybeSingle();
                    
                    if (error) { console.error("DB Error:", error); return; }

                    if(data?.gemini_api_key) {
                        document.getElementById("apiKeyInput").value = data.gemini_api_key;
                        toggleKeyEdit(false);
                    } else {
                        toggleKeyEdit(true); // บังคับกรอกถ้าไม่มี
                    }
                }
            } catch (err) { console.error("Key Load Error:", err); }
        }

        // --- UI Updates ---
        function updateUIMode(mode) {
            const titleEl = document.getElementById('pageModeDisplay');
            const subTitleEl = document.getElementById('pageSubDisplay');
            const iconEl = document.getElementById('modeIcon');
            const statusEl = document.getElementById('ownershipStatus');

            if (mode === 'edit_owner') {
                titleEl.innerText = "แก้ไขภารกิจ";
                subTitleEl.innerText = "Editing your mission";
                iconEl.innerHTML = '<i class="fas fa-edit text-2xl"></i>';
                iconEl.className = "w-12 h-12 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center shadow-inner";
                statusEl.innerHTML = '<span class="badge-premium owner-badge"><i class="fas fa-user-edit"></i> เจ้าของภารกิจ</span>';
            } else if (mode === 'edit_copy') {
                titleEl.innerText = "ทำสำเนาภารกิจ";
                subTitleEl.innerText = "Remixing mission";
                iconEl.innerHTML = '<i class="fas fa-copy text-2xl"></i>';
                iconEl.className = "w-12 h-12 bg-purple-50 text-purple-600 rounded-2xl flex items-center justify-center shadow-inner";
                statusEl.innerHTML = '<span class="badge-premium copy-badge"><i class="fas fa-clone"></i> สำเนาใหม่</span>';
            } else {
                titleEl.innerText = "สร้างภารกิจใหม่";
                subTitleEl.innerText = "Create new mission";
                iconEl.innerHTML = '<i class="fas fa-magic text-2xl"></i>';
                iconEl.className = "w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center shadow-inner";
                statusEl.classList.add('hidden-el');
                return;
            }
            statusEl.classList.remove('hidden-el');
        }

        function validateCodeStandard(code) {
            if (!code) return { valid: false, msg: "ไม่พบโค้ด" };
            const hasBack = code.includes('history.back') || code.includes('window.parent.history.back');
            const hasScore = code.includes('postMessage') || code.includes('SAVE_RESULT');
            let missing = [];
            if (!hasBack) missing.push("ปุ่มย้อนกลับ");
            if (!hasScore) missing.push("ระบบคะแนน");
            if (missing.length > 0) return { valid: false, msg: missing.join(", ") };
            return { valid: true, msg: "ครบถ้วน" };
        }

        async function handleGenerate() {
            const prompt = document.getElementById("promptInput").value.trim();
            const title = document.getElementById("missionTitleInput").value.trim();
            const key = document.getElementById("apiKeyInput").value.trim();

            if(!title) { document.getElementById("missionTitleInput").focus(); return showMessage("⚠️ กรุณาตั้งชื่อภารกิจก่อนครับ"); }
            if(!prompt && !generatedCode) { document.getElementById("promptInput").focus(); return showMessage("⚠️ กรุณาระบุรายละเอียดให้ AI ทราบครับ"); }
            if(!key) { document.getElementById("apiKeyEditView").scrollIntoView(); toggleKeyEdit(true); return showMessage("🔑 กรุณากรอก API Key ก่อนครับ"); }

            toggleLoading(true, generatedCode ? "✨ AI กำลังปรับปรุงโค้ด..." : "🚀 AI กำลังวิเคราะห์และเขียนโค้ด...");
            
            const prefix = document.getElementById('educationLevelSelect').value;
            const fullGrade = prefix + detectedGradeNumber;
            const contextText = targetCid ? `ระดับชั้นผู้เรียน: ${fullGrade || 'ไม่ระบุ'} | วิชา: ${dbSubjectOnly}` : "";
            
            let finalPrompt, sys;

            if (generatedCode) {
                // --- Safe Modify Mode ---
                let instruction = prompt;
                if (!instruction) {
                    const check = validateCodeStandard(generatedCode);
                    if (!check.valid) instruction = `Code ขาดมาตรฐาน: ${check.msg} กรุณาแก้ไขโดยด่วน`;
                    else instruction = "ตรวจสอบความสมบูรณ์และปรับ CSS ให้สวยงามขึ้น";
                }

                finalPrompt = `Original Code:\n${generatedCode}\n\nModification Request:\n${instruction}\n\nTask: Return the COMPLETE modified HTML code.`;
                sys = `คุณคือผู้เชี่ยวชาญด้านการ Refactor Code HTML5.
                กฎ: 
                1. แก้ไขตามคำสั่งโดยยังคงโครงสร้างหลักและ Logic เดิม (ห้ามสร้างใหม่)
                2. สร้าง <meta name="description" content="..."> สรุปการเปลี่ยนแปลง (ภาษาไทย)
                3. ส่งคืนเฉพาะ Code HTML เท่านั้น ห้ามมีคำอธิบาย`;
            } else {
                // --- Create New Mode ---
                finalPrompt = `${contextText}\n${prompt}`;
                sys = `คุณคือผู้เชี่ยวชาญด้านการสร้างสื่อการสอน HTML5 Interactive
                กฎเหล็ก (Mandatory):
                1. **Header Bar**: สร้างแถบด้านบน (ย้อนกลับ+ชื่อ "${title}"+คะแนน)
                2. **Scoring**: เรียก \`window.parent.postMessage({ type: 'SAVE_RESULT', score: ..., answers: ... }, '*')\` เมื่อจบ
                3. **Responsive**: รองรับมือถือเต็มจอ
                4. **Meta Description**: สร้าง tag \`<meta name="description" content="...">\` บรรยายเกม (ภาษาไทย)
                5. **Output**: ส่งคืนเฉพาะ Source Code HTML เท่านั้น`;
            }

            try {
                const code = await callGemini(finalPrompt, sys);
                
                let cleanCode = code;
                const htmlBlock = code.match(/```html([\s\S]*?)```/i);
                if (htmlBlock) cleanCode = htmlBlock[1];
                else { const generalBlock = code.match(/```([\s\S]*?)```/i); if (generalBlock) cleanCode = generalBlock[1]; }
                
                const start = cleanCode.indexOf('<!DOCTYPE html>');
                const end = cleanCode.lastIndexOf('</html>');
                
                if (start !== -1 && end !== -1) {
                    cleanCode = cleanCode.substring(start, end + 7).trim();
                    generatedCode = cleanCode; 
                    
                    document.getElementById("missionFrame").srcdoc = generatedCode;
                    document.getElementById("saveToCloudBtn").classList.remove("hidden");
                    
                    try {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(generatedCode, 'text/html');
                        const metaDesc = doc.querySelector('meta[name="description"]');
                        if (metaDesc && metaDesc.content) {
                            if (document.getElementById("generateBtn").innerText.includes("เริ่ม")) {
                                document.getElementById("promptInput").value = metaDesc.content;
                            } else {
                                document.getElementById("promptInput").value = ""; 
                                document.getElementById("promptInput").placeholder = "พิมพ์คำสั่งแก้ไขเพิ่มเติมที่นี่...";
                            }
                        }
                    } catch (e) {}

                    document.getElementById("promptLabel").innerText = "คำสั่งปรับปรุง (Modification Prompt)";
                    document.getElementById("resetBtn").classList.remove("hidden");
                    showMessage("✅ ดำเนินการสำเร็จ!");
                } else {
                    throw new Error("AI ส่งโค้ดกลับมาไม่สมบูรณ์");
                }

            } catch (err) { 
                console.error(err);
                showMessage("❌ เกิดข้อผิดพลาด: " + err.message); 
            } 
            finally { toggleLoading(false); }
        }

        // --- Helper Functions ---
        function toggleKeyEdit(showEdit) {
            const editView = document.getElementById('apiKeyEditView');
            const configView = document.getElementById('apiKeyConfiguredView');
            const cancelBtn = document.getElementById('cancelKeyEditBtn');
            if (showEdit) { editView.classList.remove('hidden-el'); configView.classList.add('hidden-el'); if(document.getElementById("apiKeyInput").value) cancelBtn.classList.remove('hidden-el'); else cancelBtn.classList.add('hidden-el'); } 
            else { editView.classList.add('hidden-el'); configView.classList.remove('hidden-el'); }
        }
        function showMessage(text) { const msgBox = document.getElementById("msgBox"); document.getElementById("msgText").innerText = text; msgBox.classList.remove('hidden'); setTimeout(() => msgBox.classList.add('hidden'), 5000); }
        function toggleLoading(show, msg = "") { 
            document.getElementById("loadingStatus").classList.toggle('hidden-el', !show); 
            if(msg) document.getElementById("loadingMessage").innerText = msg; 
            const btn = document.getElementById("generateBtn");
            btn.disabled = show;
            if(show) {
                btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>AI กำลังทำงาน...</span>';
                btn.classList.add('opacity-75', 'cursor-not-allowed');
            } else {
                if (generatedCode) {
                    btn.innerHTML = '<i class="fas fa-magic"></i> <span>ปรับปรุงโค้ด (Modify)</span>';
                    btn.className = "w-full bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-5 rounded-[1.5rem] transition-all shadow-xl shadow-orange-100 text-lg transform active:scale-95 flex items-center justify-center gap-3";
                } else {
                    btn.innerHTML = '<i class="fas fa-magic"></i> <span>เริ่มเนรมิตภารกิจด้วย AI</span>';
                    btn.className = "w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-[1.5rem] transition-all shadow-xl shadow-blue-100 text-lg transform active:scale-95 flex items-center justify-center gap-3";
                }
                btn.classList.remove('opacity-75', 'cursor-not-allowed');
            }
        }
        function resetMission() {
            generatedCode = "";
            document.getElementById("promptInput").value = "";
            document.getElementById("promptInput").placeholder = "บอกรายละเอียดสื่อที่คุณครูต้องการให้ AI สร้างครับ...";
            document.getElementById("promptLabel").innerText = "คำสั่งเนรมิต (AI Prompt)";
            document.getElementById("resetBtn").classList.add("hidden");
            initPreviewFrame();
            toggleLoading(false);
            document.getElementById("saveToCloudBtn").classList.add("hidden");
            updateUIMode('new');
        }
        function openSaveModal() { document.getElementById('saveModal').classList.remove('hidden'); }
        function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }
        function changeView(size) { document.getElementById("previewWrapper").className = `preview-frame-wrapper device-${size} shadow-2xl`; }
        function initPreviewFrame() { document.getElementById("missionFrame").srcdoc = `<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:sans-serif; color:#94a3b8; background:#fff; margin:0;"><div><h1 style="font-size:3rem; margin:0; text-align:center;">🎓</h1><p style="text-align:center;">รอรับผลงานจาก AI ของ FlipSchool ครับ</p></div></body>`; }
        function isSafe(text) { const forbidden = ["ignore", "reveal", "แฮก", "hack", "ล้วง", "password", "eval(", "fetch(", "axios."]; return !forbidden.some(p => text.toLowerCase().includes(p)); }
        
        async function callGemini(userPrompt, systemPrompt = "", retries = 5) {
            const key = document.getElementById("apiKeyInput").value.trim();
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${key}`;
            const payload = { contents: [{ parts: [{ text: userPrompt }] }], systemInstruction: { parts: [{ text: systemPrompt }] } };
            try {
                const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                if (!res.ok) {
                    if (res.status === 429 && retries > 0) { await new Promise(r => setTimeout(r, 2000)); return callGemini(userPrompt, systemPrompt, retries - 1); }
                    throw new Error(`Gemini API Error: ${res.status}`);
                }
                const data = await res.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (err) { throw err; }
        }

        async function optimizePrompt() {
            const input = document.getElementById("promptInput").value.trim();
            if(!input) return showMessage("⚠️ กรุณาพิมพ์คำสั่งสั้นๆ ก่อนกดขัดเกลาครับ");
            toggleLoading(true, "✨ AI กำลังปรับแต่งคำสั่ง...");
            try {
                const res = await callGemini(input, "ขยายความคำสั่งนี้ให้ละเอียด ชัดเจน สำหรับการสร้างสื่อการสอน ตอบเป็นภาษาไทย");
                document.getElementById("promptInput").value = res;
            } catch (e) { showMessage("❌ " + e.message); } finally { toggleLoading(false); }
        }
        async function suggestIdeas() {
            toggleLoading(true, "💡 AI กำลังคิดไอเดีย...");
            try {
                const res = await callGemini(`ขอไอเดียเกมการสอน 1 อย่าง`, "แนะนำไอเดียกิจกรรม Gamification สำหรับนักเรียน ตอบภาษาไทยสั้นๆ");
                document.getElementById("promptInput").value = res;
            } catch (e) { showMessage("❌ " + e.message); } finally { toggleLoading(false); }
        }
        async function addContext() {
            const input = document.getElementById("promptInput").value.trim();
            if(!input) return showMessage("⚠️ ต้องมีหัวข้อเรื่องก่อน");
            toggleLoading(true, "📚 AI กำลังค้นคว้าข้อมูล...");
            try {
                const res = await callGemini(input, "สรุปสาระสำคัญ 5 ข้อเกี่ยวกับเรื่องนี้");
                document.getElementById("promptInput").value += "\n\n[สาระความรู้เพิ่มเติม]\n" + res;
            } catch (e) { showMessage("❌ " + e.message); } finally { toggleLoading(false); }
        }

        async function confirmSave(mode) {
            if(!window.sysDB || !targetCid) return;
            toggleLoading(true, "💾 กำลังบันทึก...");
            try {
                const prefix = document.getElementById('educationLevelSelect').value;
                let finalGrade = prefix + detectedGradeNumber;
                if (!prefix && !detectedGradeNumber) finalGrade = "ไม่ระบุ";
                
                const subjectToSave = targetCid ? dbSubjectOnly : document.getElementById("subjectGroup").value;
                
                let finalDesc = "ภารกิจท้าทายความสามารถ";
                try {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(generatedCode, 'text/html');
                    const meta = doc.querySelector('meta[name="description"]');
                    if(meta) finalDesc = meta.content;
                    else if(document.getElementById("promptInput").value) finalDesc = document.getElementById("promptInput").value;
                } catch(e){}

                const missionData = {
                    title: document.getElementById("missionTitleInput").value.trim(),
                    description: finalDesc,
                    subject_group: subjectToSave, 
                    grade_level: finalGrade, 
                    mission_type: "ai_generated",
                    content_data: { html: generatedCode },
                    is_public: true,
                    updated_at: new Date().toISOString()
                };

                let mid = editingMid;
                if (editingMid && currentUserId === originalTeacherId) {
                    await window.sysDB.from('missions').update(missionData).eq('mission_id', editingMid);
                    showMessage("💾 อัปเดตภารกิจเดิมเรียบร้อย!");
                } else {
                    missionData.created_by = currentUserId;
                    missionData.created_at = new Date().toISOString();
                    const { data } = await window.sysDB.from('missions').insert([missionData]).select();
                    mid = data[0].mission_id;
                    showMessage("💾 บันทึกเป็นภารกิจใหม่เรียบร้อย!");
                }

                await window.sysDB.from('classroom_missions').upsert({ classroom_id: targetCid, mission_id: mid, assigned_at: new Date().toISOString() }, { onConflict: 'classroom_id, mission_id' });
                if (mode === 'exit') window.location.href = `classroom-detail.html?id=${targetCid}`;
            } catch (err) { showMessage("❌ บันทึกไม่สำเร็จ: " + err.message); }
            finally { toggleLoading(false); closeSaveModal(); }
        }

        async function saveKeyToDB() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if(!key) return showMessage("⚠️ กรุณากรอก API Key");
            try {
                const { data: { user } } = await window.sysDB.auth.getUser();
                await window.sysDB.from('teachers').update({ gemini_api_key: key }).eq('teacher_id', user.id);
                showMessage("✅ บันทึก Key สำเร็จ!");
                toggleKeyEdit(false);
            } catch (e) { showMessage("❌ ไม่สามารถบันทึกได้"); }
        }

        async function loadExistingMission() {
            const { data } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
            if (data) {
                originalTeacherId = data.created_by;
                document.getElementById("missionTitleInput").value = data.title;
                generatedCode = data.content_data?.html || "";
                document.getElementById("missionFrame").srcdoc = generatedCode;
                document.getElementById("saveToCloudBtn").classList.remove("hidden");
                
                toggleLoading(false); 
                document.getElementById("promptLabel").innerText = "คำสั่งปรับปรุง (Modification Prompt)";
                document.getElementById("resetBtn").classList.remove("hidden");
                document.getElementById("promptInput").placeholder = "พิมพ์คำสั่งแก้ไขเพิ่มเติมที่นี่...";

                if (currentUserId === originalTeacherId) updateUIMode('edit_owner');
                else updateUIMode('edit_copy');
            }
        }
