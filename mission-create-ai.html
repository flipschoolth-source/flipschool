<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator ✨ | FlipSchool</title>
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background: #f8fafc; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        
        /* Preview System Styles */
        .preview-area { 
            background: #1e293b; 
            border-radius: 2rem; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border: 8px solid #334155;
            position: relative;
        }
        
        /* Device Dimensions */
        .size-mobile { width: 375px; height: 667px; }
        .size-tablet { width: 768px; height: 1024px; }
        .size-desktop { width: 100%; height: 100%; border-radius: 0; border: none; }
        
        /* Orientation */
        .landscape { transform: rotate(-90deg); transform-origin: center; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-inner">
                    <span class="text-blue-900 text-2xl">🎓</span>
                </div>
                <span class="text-2xl font-bold tracking-tight brand-name">Flip<span class="text-orange-400">School</span></span>
            </div>
            <div class="flex gap-4 items-center font-medium">
                <a href="mission-create.html" class="hover:text-orange-300 transition-colors">เครื่องมือทั้งหมด</a>
                <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition-all text-sm">ย้อนกลับ</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white border border-slate-200 p-6 rounded-[2.5rem] shadow-sm sticky top-24">
                <h2 class="text-2xl font-bold text-blue-900 mb-6 flex items-center gap-3">
                    <span class="text-3xl">🤖</span> AI Mission Creator
                </h2>

                <div class="mb-6 p-5 bg-blue-50/50 rounded-3xl border border-blue-100">
                    <label class="block text-xs font-bold mb-3 text-blue-600 uppercase tracking-widest">Google Gemini API Key</label>
                    <div class="flex gap-2">
                        <div class="relative flex-grow">
                            <input type="password" id="apiKeyInput" 
                                class="w-full bg-white border border-slate-300 rounded-2xl p-3 pr-10 focus:ring-2 focus:ring-orange-500 outline-none transition-all text-sm"
                                placeholder="AIzaSy...">
                            <button onclick="togglePassword()" class="absolute right-3 top-3 text-slate-400">👁️</button>
                        </div>
                        <button id="saveKeyBtn" class="bg-blue-900 hover:bg-blue-800 text-white px-5 rounded-2xl font-bold transition-all text-sm shadow-md">
                            บันทึก
                        </button>
                    </div>
                    <p id="keyStatus" class="text-[10px] text-slate-500 mt-2 flex items-center gap-1">
                        <span>●</span> คีย์จะถูกเข้ารหัสและเก็บไว้ในโปรไฟล์ผู้สอน
                    </p>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">คำสั่งเนรมิตภารกิจ</label>
                        <textarea id="prompt" 
                            class="w-full h-48 bg-slate-50 border border-slate-200 rounded-3xl p-5 focus:ring-2 focus:ring-blue-600 outline-none transition-all resize-none text-slate-700"
                            placeholder="ตัวอย่าง: สร้างเกมเศรษฐีถามตอบเรื่องอักษรสามหมู่ ธีมป่ามหัศจรรย์ มีระบบคะแนนและเสียงเอฟเฟกต์">สร้างเกมจับคู่พยัญชนะไทยกับสัตว์ ธีมสวนสนุก สีสันสดใส มีเสียงปรบมือเมื่อตอบถูก</textarea>
                    </div>

                    <div id="statusBox" class="p-4 rounded-2xl bg-orange-50 border border-orange-100 hidden">
                        <div id="statusText" class="text-sm font-medium text-orange-700 flex items-center gap-3"></div>
                    </div>

                    <div class="flex gap-3">
                        <button id="generateBtn" class="flex-grow bg-orange-500 hover:bg-orange-600 text-white font-extrabold py-4 rounded-2xl transition-all shadow-lg shadow-orange-200 flex items-center justify-center gap-2 transform active:scale-95">
                            🚀 เริ่มเนรมิตภารกิจ
                        </button>
                        <button id="saveMissionBtn" class="bg-blue-900 hover:bg-black text-white px-6 rounded-2xl font-bold transition-all hidden">
                            📌 บันทึกงาน
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-4">
            <div class="bg-white p-3 rounded-[1.5rem] shadow-sm border border-slate-200 flex flex-wrap justify-between items-center px-6">
                <div class="flex gap-4 items-center">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-tighter">Preview Mode</span>
                    <div class="flex bg-slate-100 p-1 rounded-xl">
                        <button onclick="updateView('mobile')" id="btn-mobile" class="p-2 bg-white shadow-sm rounded-lg text-lg">📱</button>
                        <button onclick="updateView('tablet')" id="btn-tablet" class="p-2 hover:bg-white transition-all rounded-lg text-lg">📑</button>
                        <button onclick="updateView('desktop')" id="btn-desktop" class="p-2 hover:bg-white transition-all rounded-lg text-lg">💻</button>
                    </div>
                </div>
                
                <div class="flex items-center gap-6">
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="orientToggle" class="sr-only peer">
                        <div class="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-orange-500"></div>
                        <span class="ml-3 text-sm font-bold text-slate-600">แนวนอน</span>
                    </label>
                    <button onclick="refreshPreview()" class="text-slate-400 hover:text-blue-600">🔄</button>
                </div>
            </div>

            <div class="flex-grow flex justify-center items-start pt-4">
                <div id="viewWrapper" class="preview-area size-mobile">
                    <iframe id="previewFrame" class="w-full h-full bg-white border-none" name="previewFrame"></iframe>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 mt-auto">
        <div class="container mx-auto px-6 text-center">
            <p class="text-blue-900 font-bold mb-2">© 2026 FlipSchool. นวัตกรรมเพื่อการจัดการเรียนรู้ GLORY Model</p>
            <p class="text-slate-500 text-sm">ออกแบบและพัฒนาโดย ครูไพรัช อินควรชุม</p>
            <p class="text-slate-400 text-xs mt-2">โรงเรียนเทศบาล 1 (ถนนนครนอก) เทศบาลนครสงขลา</p>
        </div>
    </footer>

    <script>
        // --- 1. ตัวแปรและสถานะเริ่มต้น ---
        let currentSize = 'mobile';
        const MODEL_ID = "gemini-1.5-flash"; 
        const frame = document.getElementById("previewFrame");
        const wrapper = document.getElementById("viewWrapper");
        const keyInput = document.getElementById("apiKeyInput");

        // --- 2. การจัดการ API Key กับ Supabase ---
        document.addEventListener('DOMContentLoaded', async () => {
            await loadKey();
            
            document.getElementById("saveKeyBtn").addEventListener("click", saveKey);
            document.getElementById("generateBtn").addEventListener("click", startAI);
            document.getElementById("orientToggle").addEventListener("change", applyOrientation);
            
            // Initial Content
            frame.srcdoc = `<div style="display:flex; flex-direction:column; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun'; color:#cbd5e1; text-align:center; padding:20px;">
                <div style="font-size:60px; margin-bottom:20px;">🪄</div>
                <h2>พร้อมรับคำสั่งเนรมิต...</h2>
                <p>ผลงานจะแสดงผลแบบ Interactive ที่นี่</p>
            </div>`;
        });

        async function saveKey() {
            const key = keyInput.value.trim();
            if(!key) return alert("กรุณากรอก API Key");
            
            try {
                const { data: { user } } = await sysDB.auth.getUser();
                if(!user) return alert("กรุณาเข้าสู่ระบบก่อน");

                const { error } = await sysDB
                    .from('teachers')
                    .update({ gemini_api_key: key })
                    .eq('teacher_id', user.id);

                if(error) throw error;
                alert("บันทึก API Key สำเร็จ ✨");
            } catch (err) { alert("บันทึกไม่สำเร็จ: " + err.message); }
        }

        async function loadKey() {
            const { data: { user } } = await sysDB.auth.getUser();
            if(user) {
                const { data } = await sysDB.from('teachers').select('gemini_api_key').eq('teacher_id', user.id).single();
                if(data?.gemini_api_key) keyInput.value = data.gemini_api_key;
            }
        }

        // --- 3. ระบบ Preview อัจฉริยะ ---
        function updateView(size) {
            currentSize = size;
            wrapper.className = `preview-area size-${size}`;
            
            // อัปเดตสถานะปุ่ม
            ['mobile', 'tablet', 'desktop'].forEach(s => {
                document.getElementById(`btn-${s}`).className = (s === size) 
                    ? "p-2 bg-white shadow-sm rounded-lg text-lg" 
                    : "p-2 hover:bg-white transition-all rounded-lg text-lg";
            });
            applyOrientation();
        }

        function applyOrientation() {
            const isLandscape = document.getElementById("orientToggle").checked;
            if (currentSize === 'desktop') {
                wrapper.style.transform = "none";
                return;
            }
            wrapper.style.transform = isLandscape ? "rotate(-90deg)" : "none";
        }

        function togglePassword() {
            keyInput.type = keyInput.type === 'password' ? 'text' : 'password';
        }

        // --- 4. ระบบ AI Generative & DB Connection ---
        async function startAI() {
            const prompt = document.getElementById("prompt").value;
            const apiKey = keyInput.value;
            
            if(!apiKey) return alert("กรุณาใส่ API Key ก่อน");

            updateStatus("AI กำลังเนรมิตบทเรียน...", "loading");
            
            // กฎเหล็ก: บังคับให้ AI สร้างตัวแปรมาตรฐานสำหรับบันทึกลง DB
            const instruction = `
                คุณคือ FlipSchool AI ทำหน้าที่สร้างสื่อการสอน Single HTML (Tailwind CSS + Sarabun Font).
                ข้อบังคับสำคัญ:
                1. ทุกปุ่มกดจบเกม ต้องเรียกใช้ฟังก์ชัน parent.saveMissionResult(data)
                2. ข้อมูล data ต้องเป็น JSON object: { score: number, total: number, answers: Array, completed: boolean }
                3. ห้ามใช้ Markdown (ไม่ต้องมี \`\`\`html) ให้ส่งเฉพาะ HTML เท่านั้น
                4. เมื่อมีการเล่นซ้ำ (Restart) ให้ทำการล้างค่าคะแนนเก่าเสมอ
            `;

            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: instruction }] }
                    })
                });

                const json = await res.json();
                let html = json.candidates[0].content.parts[0].text;
                html = html.replace(/```html/gi, "").replace(/```/g, "").trim();
                
                frame.srcdoc = html;
                updateStatus("เนรมิตสำเร็จ! ทดลองใช้งานได้เลย", "success");
                document.getElementById("saveMissionBtn").classList.remove("hidden");
            } catch (err) {
                updateStatus("เกิดข้อผิดพลาด: " + err.message, "error");
            }
        }

        // --- 5. ฟังก์ชันรับค่าจาก AI Mission เพื่อบันทึกลง DB Student (Upsert) ---
        window.saveMissionResult = async (data) => {
            console.log("Mission Result Received:", data);
            
            try {
                const { data: { user } } = await sysDB.auth.getUser();
                if(!user) return;

                // ตัวอย่างการบันทึกลง Table student_missions แบบอัปเดตค่าล่าสุด
                const { error } = await sysDB
                    .from('student_missions')
                    .upsert({
                        student_id: user.id,
                        mission_id: "ai_gen_" + Date.now(), // ในระบบจริงควรส่ง ID ภารกิจมาด้วย
                        score: data.score,
                        answers: data.answers,
                        updated_at: new Date()
                    }, { onConflict: 'student_id, mission_id' });

                if(!error) alert(`🎉 ยอดเยี่ยม! บันทึกผลลัพธ์ ${data.score} แต้มแล้ว`);
            } catch (err) { console.error(err); }
        };

        function updateStatus(msg, type) {
            const box = document.getElementById("statusBox");
            const txt = document.getElementById("statusText");
            box.classList.remove("hidden");
            
            let icon = type === 'loading' ? '<div class="w-4 h-4 border-2 border-orange-500 border-t-transparent rounded-full spinner"></div>' : '✅';
            txt.innerHTML = `${icon} <span>${msg}</span>`;
        }
    </script>
</body>
</html>
