<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator | FlipSchool</title>

    <link rel="icon" type="image/png" href="img/favicon.png">

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Sarabun', 'Kanit', sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
        }

        .nav-gradient {
            background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%);
        }

        .preview-outer-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 1.5rem;
            min-height: 650px;
            overflow: hidden;
        }

        .preview-frame-wrapper {
            background: #1e293b;
            border-radius: 2rem;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            border: 8px solid #0f172a;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            position: relative;
            transform-origin: top center;
        }

        .device-mobile {
            width: 375px;
            height: 667px;
        }

        .device-tablet {
            width: 768px;
            height: 1024px;
        }

        .device-desktop {
            width: 100%;
            height: 800px;
            border-radius: 1rem;
            border: 4px solid #334155;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            animation: spin 1s linear infinite;
        }

        .hidden-el {
            display: none !important;
        }

        .modal-overlay {
            background-color: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(4px);
        }

        /* Loading Overlay */
        #initLoading {
            position: fixed;
            inset: 0;
            background: white;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 1rem;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col">

    <div id="initLoading">
        <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full spinner"></div>
        <p class="text-slate-500 font-bold animate-pulse">กำลังตรวจสอบสิทธิ์...</p>
    </div>

    <div id="saveModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl">
            <div class="text-center mb-6">
                <span class="text-4xl">🎓</span>
                <h3 class="text-xl font-bold text-slate-800 mt-4">ยืนยันการบันทึก</h3>
            </div>
            <div class="space-y-3">
                <button onclick="confirmSave('exit')"
                    class="w-full bg-blue-900 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 text-sm">💾
                    บันทึกและกลับห้องเรียน</button>
                <button onclick="closeSaveModal()" class="w-full text-slate-400 font-bold py-2 text-sm">ยกเลิก</button>
            </div>
        </div>
    </div>

    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-lg flex items-center justify-center text-xl">🎓</div>
                <div>
                    <div class="text-xl font-bold">Flip<span class="text-orange-400">School</span></div>
                    <div class="text-[10px] opacity-80">AI Mission Creator</div>
                </div>
            </div>
            <button onclick="history.back()"
                class="bg-white/10 px-4 py-1.5 rounded-lg text-xs font-bold hover:bg-white/20">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white p-6 rounded-[2rem] shadow-sm border border-slate-200">

                <div class="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-200">
                    <label class="block text-[10px] font-bold text-slate-500 uppercase mb-2">Gemini API Key</label>
                    <div class="flex gap-2">
                        <input type="password" id="apiKeyInput" class="w-full p-2 text-sm border rounded-lg"
                            placeholder="กรอก API Key...">
                        <button onclick="saveKeyToDB()"
                            class="bg-blue-900 text-white px-4 rounded-lg text-sm font-bold">บันทึก</button>
                    </div>
                </div>

                <div class="space-y-4">
                    <div id="subjectSelectorArea">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">กลุ่มสาระ</label>
                        <select id="subjectGroup" class="w-full p-3 bg-slate-50 border rounded-xl text-sm font-bold">
                            <option value="ภาษาไทย">ภาษาไทย</option>
                            <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                            <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
                            <option value="สังคมศึกษา">สังคมศึกษา</option>
                            <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                            <option value="อื่นๆ" selected>อื่นๆ</option>
                        </select>
                    </div>

                    <div id="classroomContextArea" class="hidden p-4 bg-orange-50 border border-orange-100 rounded-xl">
                        <div class="flex items-center gap-3">
                            <i class="fas fa-book text-orange-400"></i>
                            <div>
                                <p class="text-[10px] font-bold text-orange-400 uppercase">สร้างสำหรับวิชา</p>
                                <p id="classroomSubjectText" class="text-sm font-bold text-slate-800">กำลังโหลด...</p>
                            </div>
                        </div>
                    </div>

                    <input type="text" id="missionTitleInput"
                        class="w-full p-4 bg-slate-50 border rounded-xl text-sm font-bold"
                        placeholder="ชื่อภารกิจ (เช่น เกมบวกเลข)...">

                    <textarea id="promptInput"
                        class="w-full h-40 p-4 bg-slate-50 border rounded-xl text-sm leading-relaxed"
                        placeholder="อธิบายสิ่งที่อยากให้ AI สร้าง..."></textarea>

                    <div id="loadingStatus"
                        class="hidden-el p-4 bg-blue-50 text-blue-700 text-sm font-bold rounded-xl flex items-center gap-3">
                        <div class="w-4 h-4 border-2 border-blue-600 border-t-transparent rounded-full spinner"></div>
                        <span>กำลังเนรมิต...</span>
                    </div>

                    <button id="generateBtn" onclick="handleGenerate()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95">
                        ✨ เริ่มสร้างภารกิจ
                    </button>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-4">
            <div class="flex justify-end gap-2">
                <button onclick="changeView('mobile')" class="w-8 h-8 bg-white rounded shadow text-slate-600"><i
                        class="fas fa-mobile-alt"></i></button>
                <button onclick="changeView('desktop')" class="w-8 h-8 bg-white rounded shadow text-slate-600"><i
                        class="fas fa-desktop"></i></button>
                <button id="saveToCloudBtn" onclick="openSaveModal()"
                    class="bg-emerald-600 text-white px-4 py-1 rounded shadow text-sm font-bold hidden">
                    <i class="fas fa-cloud-upload-alt"></i> บันทึก
                </button>
            </div>
            <div class="preview-outer-container bg-slate-100 rounded-[2rem] border-4 border-dashed border-slate-300">
                <div id="previewWrapper" class="preview-frame-wrapper device-mobile shadow-2xl bg-white">
                    <iframe id="missionFrame" class="w-full h-full border-none"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script>
        const MODEL_ID = "gemini-2.0-flash";
        let generatedCode = "", targetCid = null, editingMid = null, currentUserId = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            targetCid = params.get('cid');
            editingMid = params.get('mid');

            initPreviewFrame();

            // --- เริ่มต้นระบบ: ตรวจสอบ DB และ Login ---
            const initInterval = setInterval(async () => {
                if (window.sysDB) {
                    clearInterval(initInterval);

                    try {
                        console.log("Checking Auth Session...");
                        // 1. ตรวจสอบ Login
                        const { data: { session }, error } = await window.sysDB.auth.getSession();

                        if (error || !session) {
                            console.warn("No active session found. Redirecting to login.");
                            alert("กรุณาเข้าสู่ระบบครูผู้สอนก่อนใช้งานครับ");
                            window.location.href = 'teacher-login.html';
                            return;
                        }

                        currentUserId = session.user.id;
                        console.log("User Logged In:", currentUserId);

                        // ปิด Loading Overlay
                        document.getElementById('initLoading').style.display = 'none';

                        // 2. โหลดข้อมูลอื่นๆ
                        await loadKeyFromDB();
                        if (targetCid) await fetchClassroomContext();
                        if (editingMid) await loadExistingMission();

                    } catch (err) {
                        console.error("Critical Init Error:", err);
                        alert("เกิดข้อผิดพลาดในการเริ่มต้นระบบ: " + err.message);
                    }
                }
            }, 500); // เช็คทุก 0.5 วินาที
        });

        async function fetchClassroomContext() {
            if (!targetCid) return;
            console.log("Fetching classroom info for:", targetCid);

            try {
                const { data, error } = await window.sysDB
                    .from('classrooms')
                    .select('subject_name, school_id')
                    .eq('classroom_id', targetCid)
                    .maybeSingle();

                if (error) {
                    console.error("DB Error fetching classroom:", error);
                    return;
                }

                if (data) {
                    console.log("Classroom Found:", data);
                    document.getElementById('subjectSelectorArea').classList.add('hidden-el');
                    document.getElementById('classroomContextArea').classList.remove('hidden');
                    document.getElementById('classroomSubjectText').innerText = data.subject_name;
                    document.getElementById('subjectGroup').value = "อื่นๆ";
                } else {
                    document.getElementById('classroomSubjectText').innerText = "(ไม่พบข้อมูลห้องเรียน)";
                }
            } catch (err) {
                console.error("System Error fetching classroom:", err);
            }
        }

        async function loadKeyFromDB() {
            try {
                const { data } = await window.sysDB.from('teachers').select('gemini_api_key').eq('teacher_id', currentUserId).maybeSingle();
                if (data?.gemini_api_key) document.getElementById("apiKeyInput").value = data.gemini_api_key;
            } catch (e) { console.error("Key Load Error:", e); }
        }

        async function loadExistingMission() {
            try {
                const { data } = await window.sysDB.from('missions').select('*').eq('mission_id', editingMid).single();
                if (data) {
                    document.getElementById("missionTitleInput").value = data.title;
                    document.getElementById("promptInput").value = data.description || "";
                    generatedCode = data.content_data?.html || "";
                    document.getElementById("missionFrame").srcdoc = generatedCode;
                    document.getElementById("saveToCloudBtn").classList.remove("hidden");
                }
            } catch (e) { console.error("Load Mission Error:", e); }
        }

        async function handleGenerate() {
            const prompt = document.getElementById("promptInput").value.trim();
            const key = document.getElementById("apiKeyInput").value.trim();

            if (!key) return alert("กรุณาใส่ API Key ก่อนครับ");
            if (!prompt) return alert("กรุณาใส่คำสั่งให้ AI");

            toggleLoading(true);

            try {
                const sysPrompt = "สร้างไฟล์ HTML เกมการศึกษาโต้ตอบ (Interactive) ภาษาไทย ใส่ CSS ในตัว (Tailwind) สวยงามทันสมัย เมื่อจบเกมให้ส่ง message: window.parent.postMessage({type: 'SAVE_RESULT', score: 10}, '*');";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL_ID}:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        systemInstruction: { parts: [{ text: sysPrompt }] }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "AI Error");

                const text = data.candidates[0].content.parts[0].text;
                generatedCode = text.replace(/```html|```/g, "");

                document.getElementById("missionFrame").srcdoc = generatedCode;
                document.getElementById("saveToCloudBtn").classList.remove("hidden");

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                toggleLoading(false);
            }
        }

        async function saveKeyToDB() {
            const key = document.getElementById("apiKeyInput").value.trim();
            if (key) {
                await window.sysDB.from('teachers').update({ gemini_api_key: key }).eq('teacher_id', currentUserId);
                alert("บันทึก Key แล้ว");
            }
        }

        async function confirmSave(mode) {
            if (!generatedCode) return;
            const title = document.getElementById("missionTitleInput").value || "ภารกิจ AI";

            try {
                const { data, error } = await window.sysDB.from('missions').insert([{
                    title: title,
                    description: document.getElementById("promptInput").value,
                    mission_type: 'ai_generated',
                    content_data: { html: generatedCode },
                    created_by: currentUserId,
                    is_public: true
                }]).select();

                if (error) throw error;
                const mid = data[0].mission_id;

                if (targetCid) {
                    await window.sysDB.from('classroom_missions').insert({
                        classroom_id: targetCid,
                        mission_id: mid,
                        assigned_at: new Date()
                    });
                }

                alert("บันทึกสำเร็จ!");
                if (mode === 'exit' && targetCid) window.location.href = `classroom-detail.html?id=${targetCid}`;
                else closeSaveModal();

            } catch (err) {
                alert("บันทึกไม่ผ่าน: " + err.message);
            }
        }

        function toggleLoading(show) { document.getElementById("loadingStatus").classList.toggle('hidden-el', !show); document.getElementById("generateBtn").disabled = show; }
        function openSaveModal() { document.getElementById('saveModal').classList.remove('hidden'); }
        function closeSaveModal() { document.getElementById('saveModal').classList.add('hidden'); }
        function changeView(size) { document.getElementById("previewWrapper").className = `preview-frame-wrapper device-${size} shadow-2xl bg-white`; }
        function initPreviewFrame() { document.getElementById("missionFrame").srcdoc = `<body style="display:flex;justify-content:center;align-items:center;height:100vh;color:#ccc"><h1>🎓 Preview</h1></body>`; }
    </script>
</body>

</html>
