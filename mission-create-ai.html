<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Mission Creator | FlipSchool</title>
    <!-- โหลดค่ากำหนดพื้นฐานและความปลอดภัย -->
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    
    <!-- UI Tools -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f1f5f9; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        
        /* สไตล์พรีวิวรองรับทุกขนาดอุปกรณ์ */
        .preview-outer-container { 
            width: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            padding: 1.5rem; 
            min-height: 600px; 
            background-color: rgba(226, 232, 240, 0.5);
            border-radius: 3rem;
            border: 4px dashed #cbd5e1;
        }

        .preview-frame-wrapper { 
            background: #1e293b; 
            border-radius: 2rem; 
            overflow: hidden; 
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); 
            border: 8px solid #0f172a; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4); 
            position: relative; 
            transform-origin: top center; 
        }

        .device-mobile { width: 375px; height: 667px; }
        .device-tablet { width: 768px; height: 1024px; }
        .device-desktop { width: 100%; height: 750px; border-radius: 1rem; }

        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .spinner { animation: spin 1s linear infinite; }
        
        /* สไตล์ปุ่ม AI ✨ */
        .btn-ai-sparkle { 
            background: white; 
            border: 1px solid #e2e8f0; 
            color: #475569; 
            font-size: 0.75rem; 
            padding: 0.5rem 0.8rem; 
            border-radius: 0.75rem; 
            display: flex; 
            align-items: center; 
            gap: 0.4rem; 
            transition: all 0.2s; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
        .btn-ai-sparkle:hover { 
            border-color: #3b82f6; 
            color: #3b82f6; 
            background: #f0f7ff; 
            transform: translateY(-2px); 
        }

        .hidden-el { display: none !important; }
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ✅ Unified Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <!-- โลโก้หมวกปริญญาสีน้ำเงิน พื้นหลังขาว -->
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0">
                    <svg class="w-7 h-7 text-blue-900" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10.394 2.08a1 1 0 00-.788 0l-7 3a1 1 0 000 1.84L5.25 8.051a.999.999 0 01.356-.257l4-1.714a1 1 0 11.788 1.838L7.667 9.088l1.94.831a1 1 0 00.787 0l7-3a1 1 0 000-1.838l-7-3zM3.31 9.397L5 10.12V13a1 1 0 00.657.939l4 1.714a1 1 0 00.686 0l4-1.714A1 1 0 0015 13v-2.88l1.69-.723a1 1 0 011.31 1.25l-.71 3.551a1 1 0 01-.818.803l-6 1.05a1 1 0 01-.344 0l-6-1.05a1 1 0 01-.818-.803l-.71-3.551a1 1 0 011.31-1.25l1.39.596zM14 13l-4 1.714L6 13V11l4 1.714L14 11v2z"/>
                    </svg>
                </div>
                <div class="flex flex-col">
                    <div id="app-name-display" class="text-xl md:text-2xl font-bold tracking-tight leading-none">
                        <span class="text-white">Flip</span><span class="text-orange-400">School</span>
                    </div>
                    <span id="app-slogan-display" class="text-[10px] md:text-xs text-blue-200 font-medium mt-0.5 tracking-wide">...</span>
                </div>
            </div>
            <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs transition-all flex items-center gap-2 border border-white/10 font-bold">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- ฝั่งซ้าย: แผงควบคุม AI -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            <div class="bg-white p-6 md:p-8 rounded-[2.5rem] shadow-sm border border-slate-200">
                <div class="flex items-center gap-3 mb-8">
                    <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center shadow-inner">
                        <i class="fas fa-robot text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-blue-900 leading-tight">AI Mission Creator</h2>
                </div>

                <div class="space-y-6">
                    <!-- การเลือกกลุ่มสาระ -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">กลุ่มสาระการเรียนรู้</label>
                            <select id="subjectGroup" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm font-bold focus:ring-2 focus:ring-blue-500 transition-all appearance-none">
                                <option value="อื่นๆ">เลือกกลุ่มสาระ...</option>
                                <option value="ภาษาไทย">ภาษาไทย</option>
                                <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                                <option value="วิทยาศาสตร์และเทคโนโลยี">วิทยาศาสตร์และเทคโนโลยี</option>
                                <option value="สังคมศึกษา">สังคมศึกษา ศาสนา และวัฒนธรรม</option>
                                <option value="สุขศึกษา">สุขศึกษาและพลศึกษา</option>
                                <option value="ศิลปะ">ศิลปะ</option>
                                <option value="การงานอาชีพ">การงานอาชีพ</option>
                                <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">ชื่อภารกิจ</label>
                            <input type="text" id="missionTitleInput" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 outline-none text-sm font-bold focus:ring-2 focus:ring-blue-500 transition-all" placeholder="ระบุชื่อภารกิจ...">
                        </div>
                    </div>

                    <!-- พื้นที่คำสั่ง -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest">คำสั่งเนรมิต (Prompt)</label>
                            <div class="flex gap-2">
                                <button onclick="optimizePrompt()" class="btn-ai-sparkle">✨ ปรับแต่ง</button>
                                <button onclick="suggestIdeas()" class="btn-ai-sparkle">✨ ขอไอเดีย</button>
                                <button onclick="addContext()" class="btn-ai-sparkle">✨ เพิ่มสาระ</button>
                            </div>
                        </div>
                        <textarea id="promptInput" class="w-full h-48 bg-slate-50 border border-slate-200 rounded-[1.5rem] p-6 outline-none transition-all resize-none text-sm focus:ring-2 focus:ring-blue-500 shadow-inner" placeholder="คุณครูต้องการให้ AI สร้างสื่อการสอนแบบไหนครับ? เช่น 'สร้างเกมตอบคำถามมาตราตัวสะกด 5 ข้อ พร้อมระบบสะสมแต้ม'"></textarea>
                    </div>

                    <!-- สถานะการทำงาน -->
                    <div id="loadingStatus" class="hidden-el p-4 rounded-2xl bg-blue-50 border border-blue-100 flex items-center gap-4 animate-pulse">
                        <div class="w-6 h-6 border-3 border-blue-500 border-t-transparent rounded-full spinner"></div>
                        <span id="loadingMessage" class="text-sm font-bold text-blue-700 italic">Gemini AI กำลังทำงาน...</span>
                    </div>

                    <button id="generateBtn" onclick="handleGenerate()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-5 rounded-[1.5rem] transition-all shadow-xl shadow-blue-100 text-lg transform active:scale-95 flex items-center justify-center gap-3">
                        <i class="fas fa-bolt"></i> <span>เริ่มเนรมิตภารกิจด้วย AI</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- ฝั่งขวา: พื้นที่ Preview -->
        <div class="lg:col-span-7 flex flex-col gap-5">
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex justify-between items-center px-6">
                <div class="flex gap-2 bg-slate-100 p-1.5 rounded-xl">
                    <button onclick="changeView('mobile')" id="view-mobile" class="w-10 h-10 bg-white rounded-lg transition-all shadow-sm flex items-center justify-center"><i class="fas fa-mobile-alt"></i></button>
                    <button onclick="changeView('tablet')" id="view-tablet" class="w-10 h-10 hover:bg-white rounded-lg transition-all flex items-center justify-center"><i class="fas fa-tablet-alt"></i></button>
                    <button onclick="changeView('desktop')" id="view-desktop" class="w-10 h-10 hover:bg-white rounded-lg transition-all flex items-center justify-center"><i class="fas fa-desktop"></i></button>
                </div>
                <button id="saveToCloudBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-sm font-bold hidden shadow-lg transition-all flex items-center gap-2 transform active:scale-95">
                    <i class="fas fa-save"></i> บันทึกลงห้องเรียน
                </button>
            </div>

            <div class="preview-outer-container">
                <div id="previewWrapper" class="preview-frame-wrapper device-mobile shadow-2xl">
                    <iframe id="missionFrame" class="w-full h-full bg-white border-none" sandbox="allow-scripts allow-forms allow-modals allow-same-origin" title="Live Preview"></iframe>
                </div>
            </div>
            <p class="text-center text-[10px] text-slate-400 font-bold uppercase tracking-[0.2em]">Responsive AI Generation System</p>
        </div>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 mt-auto text-center">
        <p class="text-blue-900 font-bold mb-1 text-sm italic">© 2026 FlipSchool. นวัตกรรมจัดการเรียนรู้ GLORY Model</p>
        <p class="text-slate-400 text-[10px]">Powered by Gemini 2.5 Flash | พัฒนาโดย ครูไพรัช อินควรชุม</p>
    </footer>

    <script>
        const apiKey = ""; // API Key provides at runtime
        const MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
        let generatedCode = "";

        document.addEventListener('DOMContentLoaded', () => {
            if (window.CONFIG) {
                document.getElementById('app-slogan-display').innerText = window.CONFIG.APP_SLOGAN;
            }
            initPreviewFrame();
        });

        // ✅ ฟังก์ชันเรียกใช้ Gemini API พร้อม Exponential Backoff
        async function callGemini(userPrompt, systemInstruction = "", retries = 5, delay = 1000) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_NAME}:generateContent?key=${apiKey}`;
            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    if (response.status === 429 && retries > 0) {
                        await new Promise(res => setTimeout(res, delay));
                        return callGemini(userPrompt, systemInstruction, retries - 1, delay * 2);
                    }
                    throw new Error(`API Error: ${response.status}`);
                }

                const result = await response.json();
                return result.candidates?.[0]?.content?.parts?.[0]?.text;
            } catch (err) {
                if (retries > 0) {
                    await new Promise(res => setTimeout(res, delay));
                    return callGemini(userPrompt, systemInstruction, retries - 1, delay * 2);
                }
                throw err;
            }
        }

        // ✨ ปรับแต่งคำสั่ง (Optimize Prompt)
        async function optimizePrompt() {
            const current = document.getElementById("promptInput").value.trim();
            if (!current) return alert("กรุณากรอกข้อความตั้งต้นก่อนครับ");
            
            toggleLoading(true, "AI กำลังขัดเกลาคำสั่งให้คมชัดขึ้น...");
            try {
                const sys = "คุณคือผู้เชี่ยวชาญการเขียน Prompt สำหรับสร้างสื่อการสอน หน้าที่ของคุณคือขยายความคำสั่งสั้นๆ ให้เป็นคำสั่งที่ละเอียด ชัดเจน และมีโครงสร้างที่ดีที่สุดสำหรับการสร้างเว็บแอปพลิเคชันเพื่อการเรียนรู้ ตอบกลับเป็นภาษาไทยเท่านั้น";
                const result = await callGemini(`ปรับปรุงคำสั่งนี้ให้ละเอียดขึ้น: ${current}`, sys);
                if (result) document.getElementById("promptInput").value = result.trim();
            } catch (err) {
                alert("ขออภัย ระบบขัดข้อง กรุณาลองใหม่ครับ");
            } finally {
                toggleLoading(false);
            }
        }

        // ✨ ขอไอเดียใหม่ (Suggest Ideas)
        async function suggestIdeas() {
            const group = document.getElementById("subjectGroup").value;
            toggleLoading(true, "AI กำลังคิดค้นไอเดียที่เหมาะสมกับกลุ่มสาระ...");
            try {
                const sys = "แนะนำไอเดียการสร้างเกมหรือกิจกรรมการสอนที่น่าสนใจ 1 อย่าง สำหรับกลุ่มสาระการเรียนรู้ที่กำหนด โดยอธิบายสั้นๆ ว่าเกมเล่นอย่างไร และมีประโยชน์ต่อนักเรียนอย่างไร ตอบเป็นภาษาไทย";
                const result = await callGemini(`ขอไอเดียสำหรับกลุ่มสาระ: ${group}`, sys);
                if (result) document.getElementById("promptInput").value = result.trim();
            } catch (err) {
                alert("เกิดข้อผิดพลาดในการขอไอเดีย");
            } finally {
                toggleLoading(false);
            }
        }

        // ✨ เพิ่มสาระความรู้ (Add Context)
        async function addContext() {
            const current = document.getElementById("promptInput").value.trim();
            if (!current) return alert("กรุณาระบุหัวข้อเรื่องก่อนครับ");
            
            toggleLoading(true, "AI กำลังค้นหาข้อมูลสาระเพิ่มเติม...");
            try {
                const sys = "เพิ่มข้อมูลเนื้อหาสาระความรู้ที่สำคัญ 5 ข้อ เกี่ยวกับหัวข้อที่ผู้ใช้กำหนด เพื่อนำไปใช้เป็นคำถามในเกม ตอบเป็นภาษาไทย";
                const result = await callGemini(`เพิ่มสาระความรู้สำหรับเรื่องนี้: ${current}`, sys);
                if (result) document.getElementById("promptInput").value += "\n\n[ข้อมูลสาระเพิ่มเติมจาก AI]\n" + result.trim();
            } catch (err) {
                alert("ขออภัย ไม่สามารถดึงข้อมูลได้ในขณะนี้");
            } finally {
                toggleLoading(false);
            }
        }

        // 🚀 เนรมิตภารกิจ (Main Generate)
        async function handleGenerate() {
            const prompt = document.getElementById("promptInput").value.trim();
            const title = document.getElementById("missionTitleInput").value.trim();
            if (!prompt || !title) return alert("กรุณาระบุชื่อภารกิจและรายละเอียดคำสั่งครับ");

            toggleLoading(true, "AI กำลังเนรมิตบทเรียนอัจฉริยะให้คุณครู...");
            
            const sys = `คุณคือ FlipSchool AI ผู้เชี่ยวชาญการสร้าง Web Application สำหรับการศึกษา 
            กฎสำคัญ:
            1. สร้างไฟล์ HTML ชุดเดียว (Single File) ที่มี CSS และ JavaScript ในตัว
            2. ใช้ Tailwind CSS สำหรับดีไซน์ที่พรีเมียม สวยงาม ทันสมัย
            3. ต้องเป็นบทเรียนที่มีการโต้ตอบ (Interactive) หรือเกมแนว Gamification
            4. เมื่อจบกิจกรรม ต้องเรียกฟังก์ชัน window.parent.postMessage({type: 'SAVE_RESULT', score: ..., answers: [...]}, '*')
            5. ใช้ฟอนต์ Sarabun หรือ Kanit และเขียนเป็นภาษาไทยมาตรฐาน
            6. ห้ามมีโค้ดที่พยายามเข้าถึงความลับของระบบหรือข้อมูลส่วนบุคคลเด็ดขาด`;

            try {
                const code = await callGemini(prompt, sys);
                if (code) {
                    generatedCode = code.replace(/```html/gi, "").replace(/```/g, "").trim();
                    document.getElementById("missionFrame").srcdoc = generatedCode;
                    document.getElementById("saveToCloudBtn").classList.remove("hidden");
                    alert("เนรมิตภารกิจสำเร็จแล้ว! ✨ คุณครูสามารถพรีวิวผลงานได้ทางขวามือครับ");
                }
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            } finally {
                toggleLoading(false);
            }
        }

        function toggleLoading(show, msg = "") {
            const status = document.getElementById("loadingStatus");
            const btn = document.getElementById("generateBtn");
            status.classList.toggle('hidden-el', !show);
            if (msg) document.getElementById("loadingMessage").innerText = msg;
            btn.disabled = show;
            btn.style.opacity = show ? "0.5" : "1";
        }

        function changeView(size) {
            const wrapper = document.getElementById("previewWrapper");
            wrapper.className = `preview-frame-wrapper device-${size} shadow-2xl`;
            ['mobile', 'tablet', 'desktop'].forEach(s => {
                const el = document.getElementById(`view-${s}`);
                el.classList.toggle('bg-white', s === size);
                el.classList.toggle('shadow-sm', s === size);
            });
        }

        function initPreviewFrame() {
            document.getElementById("missionFrame").srcdoc = `<body style="display:flex; justify-content:center; align-items:center; height:100vh; font-family:'Sarabun'; color:#94a3b8; background:#fff; margin:0;"><div><h1 style="font-size:3rem; margin:0; text-align:center;">🎓</h1><p style="text-align:center;">รอรับผลงานชิ้นเอกจาก AI ของ FlipSchool ครับ</p></div></body>`;
        }
    </script>
</body>
</html>
