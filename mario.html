<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Namsai Vocabulary Hunt</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap');

body {
    margin: 0;
    background:#333;
    overflow:hidden;
    font-family:'Sarabun',sans-serif;
    touch-action:none;
}

#game-container {
    position:absolute;
    inset:0;
    background:#5c94fc;
}

canvas {
    width:100%;
    height:100%;
    image-rendering:pixelated;
}

#player-sprite {
    position:absolute;
    width:128px;
    height:128px;
    pointer-events:none;
    image-rendering:pixelated;
    z-index:5;
    display:none;
}

#ui-layer {
    position:absolute;
    inset:0;
    z-index:10;
    pointer-events:none;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
}

.target-word-container {
    margin:20px auto 0;
    background:#fff;
    border:4px solid #e52521;
    border-radius:15px;
    padding:10px 50px;
    box-shadow:0 6px 0 rgba(0,0,0,.2);
}

#target-word {
    font-size:60px;
    font-weight:800;
    color:#e52521;
}

.hud-stats {
    position:absolute;
    top:20px;
    right:20px;
    background:rgba(0,0,0,.5);
    padding:10px 20px;
    border-radius:20px;
    color:#fff;
    font-size:24px;
}

#start-screen,#game-over-screen {
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.85);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    color:#fff;
    z-index:20;
}

h1 {
    font-size:56px;
    color:#ffd700;
    text-shadow:3px 3px #e52521;
}

.btn {
    background:#e52521;
    color:#fff;
    border:4px solid #fff;
    padding:15px 40px;
    font-size:30px;
    border-radius:50px;
    cursor:pointer;
    box-shadow:0 6px 0 #990000;
}

.btn:active {
    transform:translateY(4px);
    box-shadow:0 2px 0 #990000;
}

#mobile-controls {
    display:flex;
    justify-content:space-between;
    padding:20px;
    pointer-events:auto;
}

.control-btn {
    width:80px;
    height:80px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    border:2px solid #fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:30px;
    color:#fff;
}
</style>
</head>

<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<img id="player-sprite">

<div id="ui-layer">
    <div class="target-word-container">
        <div id="target-word">...</div>
    </div>
    <div class="hud-stats" id="score-display">คะแนน: 0</div>
    <div id="mobile-controls">
        <div>
            <div class="control-btn" id="btn-left">←</div>
            <div class="control-btn" id="btn-right">→</div>
        </div>
        <div class="control-btn" id="btn-jump">A</div>
    </div>
</div>

<div id="start-screen">
    <h1>เกมจับคู่คำศัพท์</h1>
    <button class="btn" id="start-btn" disabled>กำลังโหลด...</button>
</div>

<div id="game-over-screen" style="display:none">
    <h1>เยี่ยมมาก!</h1>
    <button class="btn" onclick="resetGame()">เล่นใหม่</button>
</div>
</div>

<script>
/* ---------- CONFIG ---------- */
const IMG_RIGHT="https://www.flipschool.in.th/img/Lesson1/right.gif";
const IMG_LEFT ="https://www.flipschool.in.th/img/Lesson1/left.gif";
const LOGICAL_HEIGHT=600;

/* ---------- CANVAS ---------- */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");
const sprite=document.getElementById("player-sprite");

/* ---------- GAME STATE ---------- */
let scale=1, cameraX=0, score=0;
let keys={left:false,right:false,up:false};
let gameState="START";

/* ---------- PLAYER ---------- */
const player={
    x:100,y:100,w:60,h:90,
    vx:0,vy:0,ground:false,face:true
};

/* ---------- LOAD IMAGES ---------- */
let loaded=0;
[new Image(),new Image()].forEach((img,i)=>{
    img.onload=()=>{ if(++loaded===2){
        startBtn.disabled=false;
        startBtn.innerText="เริ่มเกม";
    }};
    img.src=i?IMG_LEFT:IMG_RIGHT;
});

/* ---------- CONTROLS ---------- */
document.addEventListener("keydown",e=>{
    if(e.key==="ArrowLeft")keys.left=true;
    if(e.key==="ArrowRight")keys.right=true;
    if(e.key===" " && player.ground){player.vy=-22}
});
document.addEventListener("keyup",e=>{
    if(e.key==="ArrowLeft")keys.left=false;
    if(e.key==="ArrowRight")keys.right=false;
});

/* ---------- LOOP ---------- */
function loop(){
    if(gameState==="PLAYING")update();
    draw();
    requestAnimationFrame(loop);
}

function update(){
    if(keys.left){player.vx=-7;player.face=false}
    else if(keys.right){player.vx=7;player.face=true}
    else player.vx*=0.8;

    player.vy+=0.8;
    player.x+=player.vx;
    player.y+=player.vy;

    if(player.y>500){player.y=500;player.vy=0;player.ground=true}
}

function draw(){
    resize();
    ctx.fillStyle="#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    sprite.style.display="block";
    sprite.src=player.face?IMG_RIGHT:IMG_LEFT;
    sprite.style.transform=`translate(${player.x*scale}px,${player.y*scale}px) scale(${scale})`;
}

/* ---------- UTILS ---------- */
function resize(){
    canvas.width=innerWidth;
    canvas.height=innerHeight;
    scale=canvas.height/LOGICAL_HEIGHT;
}

function resetGame(){
    score=0;
    player.x=100;player.y=100;
    gameState="PLAYING";
    document.getElementById("start-screen").style.display="none";
}

document.getElementById("start-btn").onclick=resetGame;
loop();
</script>
</body>
</html>
