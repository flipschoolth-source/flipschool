<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Namsai Vocabulary Hunt</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap');

body {
    margin: 0;
    background: #333;
    overflow: hidden;
    font-family: 'Sarabun', sans-serif;
}

#game-container {
    position: absolute;
    inset: 0;
    background: #5c94fc;
}

canvas {
    width: 100%;
    height: 100%;
    display: block;
    image-rendering: pixelated;
}

#player-sprite {
    position: absolute;
    width: 128px;
    height: 128px;
    z-index: 5;
    pointer-events: none;
    display: none;
}

#ui-layer {
    position: absolute;
    inset: 0;
    z-index: 10;
    pointer-events: none;
}

.target-word-container {
    margin: 20px auto;
    background: #fff;
    border: 4px solid #e52521;
    border-radius: 15px;
    padding: 10px 40px;
    text-align: center;
}

#target-word {
    font-size: 48px;
    color: #e52521;
    font-weight: 800;
}

.hud-stats {
    position: absolute;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,.5);
    color: #fff;
    padding: 10px 20px;
    border-radius: 20px;
    font-size: 22px;
}

#start-screen,
#game-over-screen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,.85);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    z-index: 20;
}

.btn {
    background: #e52521;
    border: 4px solid white;
    color: white;
    font-size: 28px;
    padding: 15px 40px;
    border-radius: 50px;
    cursor: pointer;
}
</style>
</head>

<body>
<div id="game-container">
<canvas id="gameCanvas"></canvas>
<img id="player-sprite">

<div id="ui-layer">
    <div class="target-word-container">
        <div id="target-word">...</div>
    </div>
    <div class="hud-stats">
        <span id="score-display">คะแนน: 0</span>
    </div>
</div>

<div id="start-screen">
    <h1>เกมจับคู่คำศัพท์</h1>
    <button class="btn" id="start-btn" disabled>กำลังโหลด...</button>
</div>

<div id="game-over-screen" style="display:none">
    <h1>เยี่ยมมาก!</h1>
    <button class="btn" onclick="resetGame()">เล่นใหม่</button>
</div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const spriteEl = document.getElementById('player-sprite');

const LOGICAL_HEIGHT = 600;
let scale = 1;

const IMG_LEFT = "img/Lesson1/left.gif";
const IMG_RIGHT = "img/Lesson1/right.gif";

let leftError = false;
let rightError = false;
let loaded = 0;

const imgLeft = new Image();
const imgRight = new Image();

function checkLoaded() {
    loaded++;
    if (loaded === 2) {
        const btn = document.getElementById('start-btn');
        btn.disabled = false;
        btn.textContent = "เริ่มเกม";
    }
}

imgLeft.onload = checkLoaded;
imgRight.onload = checkLoaded;

imgLeft.onerror = () => { leftError = true; checkLoaded(); };
imgRight.onerror = () => { rightError = true; checkLoaded(); };

imgLeft.src = IMG_LEFT;
imgRight.src = IMG_RIGHT;

let gameState = "START";
let score = 0;
let cameraX = 0;
let keys = { left:false, right:false, up:false };

class Player {
    constructor() {
        this.x = 100;
        this.y = 100;
        this.w = 60;
        this.h = 90;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.faceRight = true;
    }

    update() {
        if (keys.left) { this.vx = -6; this.faceRight = false; }
        else if (keys.right) { this.vx = 6; this.faceRight = true; }
        else this.vx *= 0.8;

        if (keys.up && this.grounded) {
            this.vy = -20;
            this.grounded = false;
        }

        this.vy += 0.8;
        this.x += this.vx;
        this.y += this.vy;

        if (this.y > 460) {
            this.y = 460;
            this.vy = 0;
            this.grounded = true;
        }
    }

    draw() {
        const spriteBroken =
            (this.faceRight && rightError) ||
            (!this.faceRight && leftError);

        if (spriteBroken) {
            ctx.fillStyle = "#e52521";
            ctx.fillRect(this.x - cameraX, this.y, this.w, this.h);
            return;
        }

        spriteEl.style.display = "block";
        spriteEl.src = this.faceRight ? IMG_RIGHT : IMG_LEFT;

        const size = 128 * scale;
        spriteEl.style.width = size + "px";
        spriteEl.style.height = size + "px";
        spriteEl.style.transform =
            `translate(${(this.x - cameraX - 34) * scale}px, ${(this.y - 38) * scale}px)`;
    }
}

let player = new Player();

function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    scale = canvas.height / LOGICAL_HEIGHT;
}

function update() {
    player.update();
    cameraX += ((player.x - 300) - cameraX) * 0.1;
}

function draw() {
    ctx.fillStyle = "#87CEEB";
    ctx.fillRect(0,0,canvas.width,canvas.height);

    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate(-cameraX,0);

    ctx.fillStyle = "#5C4033";
    ctx.fillRect(-500,550,6000,200);

    player.draw();
    ctx.restore();
}

function loop() {
    if (gameState === "PLAYING") update();
    draw();
    requestAnimationFrame(loop);
}

function resetGame() {
    score = 0;
    player = new Player();
    gameState = "PLAYING";
    document.getElementById('start-screen').style.display = "none";
    document.getElementById('game-over-screen').style.display = "none";
}

document.getElementById('start-btn').onclick = resetGame;

window.addEventListener('keydown', e => {
    if (e.key === "ArrowLeft") keys.left = true;
    if (e.key === "ArrowRight") keys.right = true;
    if (e.key === "ArrowUp" || e.key === " ") keys.up = true;
});
window.addEventListener('keyup', e => {
    if (e.key === "ArrowLeft") keys.left = false;
    if (e.key === "ArrowRight") keys.right = false;
    if (e.key === "ArrowUp" || e.key === " ") keys.up = false;
});

resize();
addEventListener('resize', resize);
loop();
</script>
</body>
</html>
