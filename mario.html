<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Namsai Vocabulary Hunt</title>
    <!-- Import Standard Thai Fonts: Sarabun (Official, Looped) -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #333;
            overflow: hidden;
            font-family: 'Sarabun', sans-serif;
            touch-action: none;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #5c94fc;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }

        /* Player Sprite (Overlay) - Essential for GIF Animation */
        #player-sprite {
            position: absolute;
            width: 128px;
            height: 128px;
            z-index: 5;
            display: none; /* Hidden until game starts */
            pointer-events: none;
            transform-origin: top left;
            will-change: transform;
            /* Ensure crisp edges for pixel art look */
            image-rendering: pixelated; 
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            z-index: 10;
        }

        .question-box {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .target-word-container {
            background: rgba(255, 255, 255, 0.95);
            border: 4px solid #e52521;
            border-radius: 15px;
            padding: 10px 50px; 
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            text-align: center;
            transform: scale(1.0);
            transition: transform 0.2s;
            min-width: 200px;
        }

        #target-word {
            font-family: 'Sarabun', sans-serif;
            font-size: 60px;
            color: #e52521;
            font-weight: 800;
            line-height: 1.2;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }

        .hud-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            font-size: 24px;
            font-weight: 700;
        }

        #start-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            pointer-events: auto;
            z-index: 20;
        }

        h1 {
            font-family: 'Sarabun', sans-serif;
            font-size: 8vw;
            max-size: 60px;
            margin-bottom: 10px;
            color: #ffd700;
            font-weight: 800;
            text-shadow: 3px 3px 0 #e52521;
        }

        p { 
            font-size: 4vw; 
            max-size: 24px;
            margin-bottom: 30px; 
            color: #ddd; 
            font-weight: 400;
        }

        @media (min-width: 800px) {
            h1 { font-size: 56px; }
            p { font-size: 24px; }
        }

        .btn {
            background: #e52521;
            color: white;
            border: 4px solid white;
            padding: 15px 40px;
            font-size: 30px;
            font-family: 'Sarabun', sans-serif;
            font-weight: 700;
            cursor: pointer;
            border-radius: 50px;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 6px 0 #990000;
        }
        .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #990000; }
        .btn:disabled { background: #666; cursor: not-allowed; border-color: #999; box-shadow: none; }

        #mobile-controls {
            display: flex; 
            width: 100%;
            padding: 20px;
            pointer-events: auto;
            box-sizing: border-box;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 10px;
        }
        
        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid white;
            border-radius: 50%;
            width: 80px; 
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            color: white;
            user-select: none;
            backdrop-filter: blur(2px);
            margin-bottom: 10px;
        }
        .control-btn:active { background: rgba(255, 255, 255, 0.5); }
        .d-pad { display: flex; gap: 20px; }
        .action-btn { background: rgba(229, 37, 33, 0.4); }

        @media (max-width: 800px) {
            #target-word { font-size: 40px; }
            .target-word-container { padding: 5px 20px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <!-- Player Sprite: Simple img tag, controlled by JS -->
    <img id="player-sprite" src="" alt="">

    <div id="ui-layer">
        <div class="question-box">
            <div class="target-word-container" id="target-container">
                <div id="target-word">...</div>
            </div>
        </div>
        
        <div class="hud-stats">
            <span id="score-display">คะแนน: 0</span>
        </div>

        <div id="mobile-controls">
            <div class="d-pad">
                <div class="control-btn" id="btn-left">←</div>
                <div class="control-btn" id="btn-right">→</div>
            </div>
            <div class="control-btn action-btn" id="btn-jump">A</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>เกมจับคู่คำศัพท์<br>ฉบับน้องน้ำใส</h1>
        <p>ช่วยน้องน้ำใสกระโดดเก็บภาพ<br>ให้ตรงกับคำศัพท์ด้านบน!</p>
        <button class="btn" id="start-btn" onclick="startGame()" disabled>กำลังโหลด...</button>
    </div>

    <!-- Game Over removed for endless play -->
</div>

<script>
    // --- Constants & Setup ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const playerSpriteEl = document.getElementById('player-sprite');
    
    const LOGICAL_HEIGHT = 600;
    let gameScale = 1;

    const vocabulary = [
        "กระติก", "ตะกร้า", "ถ้วย", "นั่งยองๆ", "น้ำหวาน", 
        "น้ำแข็ง", "น้ำแข็งกด", "น้ำแข็งไส", "บิน", "ปีก", 
        "ผมทรงน้ำผุ", "ผู้หญิง", "พึ่บพับ", "มอง", "ยิ้ม", 
        "ย่ำเท้า", "รูป", "หลังคา", "เต้นระบำ", "แคร่", 
        "ไม้เสียบ", "ไหว้"
    ];

    let currentTargetWord = "";
    let gameState = 'START';
    let frameCount = 0;
    let score = 0;
    
    // Physics 
    const GRAVITY = 0.8;
    const FRICTION = 0.85;
    const SPEED = 7; 
    const JUMP_FORCE = 23; 
    
    let cameraX = 0;
    const keys = { left: false, right: false, up: false };

    // --- Assets ---
    const IMG_URL_LEFT = "img/Lesson1/left.gif";
    const IMG_URL_RIGHT = "img/Lesson1/right.gif";

    // Preloader (just to ensure connectivity)
    const imgLeft = new Image();
    const imgRight = new Image();
    let imagesLoaded = 0;
    
    function checkImagesLoaded() {
        imagesLoaded++;
        if (imagesLoaded >= 2) {
            const btn = document.getElementById('start-btn');
            btn.innerText = "เริ่มเกม";
            btn.disabled = false;
        }
    }

    imgLeft.onload = checkImagesLoaded;
    imgRight.onload = checkImagesLoaded;
    imgLeft.onerror = checkImagesLoaded; 
    imgRight.onerror = checkImagesLoaded;

    imgLeft.src = IMG_URL_LEFT;
    imgRight.src = IMG_URL_RIGHT;

    // --- Audio System ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    const Sound = {
        init: function() {
            if (!audioCtx) { audioCtx = new AudioContext(); } 
            else if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        },
        playWalk: function() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            // Low pitch square wave for retro footstep
            osc.type = 'square'; 
            osc.frequency.setValueAtTime(120, t);
            osc.frequency.exponentialRampToValueAtTime(60, t + 0.05);
            gain.gain.setValueAtTime(0.02, t); // Quiet volume
            gain.gain.linearRampToValueAtTime(0, t + 0.05);
            osc.start(t);
            osc.stop(t + 0.05);
        },
        playCorrect: function() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(1000, t);
            osc.frequency.exponentialRampToValueAtTime(2000, t + 0.1);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.5);
            osc.start(t);
            osc.stop(t + 0.5);
        },
        playWrong: function() {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.linearRampToValueAtTime(100, t + 0.3);
            gain.gain.setValueAtTime(0.1, t);
            gain.gain.linearRampToValueAtTime(0, t + 0.3);
            osc.start(t);
            osc.stop(t + 0.3);
        },
        playJump: function() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
        }
    };

    const C_SKY = '#87CEEB'; 
    const C_GROUND = '#5C4033'; 
    const C_GRASS = '#7CFC00'; 

    let platforms = [];
    let items = [];
    let particles = [];
    let decors = [];

    class Player {
        constructor() {
            this.width = 60;   // Hitbox width
            this.height = 90;  // Hitbox height
            this.x = 100;
            this.y = 100;
            this.velX = 0;
            this.velY = 0;
            this.isGrounded = false;
            this.facingRight = true;
            this.lastFacingRight = null; 
            this.stepTimer = 0; // Timer for walking sound
        }

        update() {
            if (keys.left) {
                this.velX = -SPEED;
                this.facingRight = false;
            } else if (keys.right) {
                this.velX = SPEED;
                this.facingRight = true;
            } else {
                this.velX *= FRICTION;
            }

            if (keys.up && this.isGrounded) {
                this.velY = -JUMP_FORCE;
                this.isGrounded = false;
                Sound.playJump();
            }

            this.velY += GRAVITY;
            this.x += this.velX;
            this.y += this.velY;

            this.isGrounded = false;
            
            for (let p of platforms) {
                const colDir = this.getCollisionDir(p);
                if (colDir === 'b' && this.velY >= 0) {
                    this.isGrounded = true;
                    this.velY = 0;
                    this.y = p.y - this.height;
                } else if (colDir === 't' && this.velY < 0) {
                    this.velY = 0;
                    this.y = p.y + p.height;
                } else if (colDir === 'l') {
                    this.velX = 0;
                    this.x = p.x + p.width;
                } else if (colDir === 'r') {
                    this.velX = 0;
                    this.x = p.x - this.width;
                }
            }

            // Walking Sound Logic
            // Check if on ground and moving significantly
            if (this.isGrounded && Math.abs(this.velX) > 0.5) {
                if (this.stepTimer <= 0) {
                    Sound.playWalk();
                    this.stepTimer = 15; // Play sound every 15 frames (approx 0.25s)
                }
                this.stepTimer--;
            } else {
                this.stepTimer = 0; // Reset timer when stopped or in air
            }
            
            // Endless walk protection (Respawn near camera if fell too far)
            if (this.y > LOGICAL_HEIGHT + 500) {
                this.y = 100;
                this.x = Math.max(100, cameraX + 100); 
                this.velY = 0;
            }
        }

        getCollisionDir(rect) {
            const dx = (this.x + this.width / 2) - (rect.x + rect.width / 2);
            const dy = (this.y + this.height / 2) - (rect.y + rect.height / 2);
            const w = (this.width + rect.width) / 2;
            const h = (this.height + rect.height) / 2;
            const crossWidth = w * dy;
            const crossHeight = h * dx;

            if (Math.abs(dx) <= w && Math.abs(dy) <= h) {
                if (crossWidth > crossHeight) return (crossWidth > -crossHeight) ? 't' : 'r';
                else return (crossWidth > -crossHeight) ? 'l' : 'b';
            }
            return null;
        }

        draw() {
            // 1. Draw Shadow on Canvas
            const x = Math.round(this.x);
            const y = Math.round(this.y);
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.beginPath();
            ctx.ellipse(x + this.width/2, y + this.height - 5, this.width/2.5, 10, 0, 0, Math.PI*2);
            ctx.fill();

            // 2. Handle DOM Overlay for GIF
            
            // Calculate which image we want
            const desiredSrc = this.facingRight ? IMG_URL_RIGHT : IMG_URL_LEFT;

            // Check if we need to update the source
            if (!playerSpriteEl.src || !playerSpriteEl.src.includes(desiredSrc)) {
                playerSpriteEl.src = desiredSrc;
                this.lastFacingRight = this.facingRight;
            }
            
            // Ensure visible
            playerSpriteEl.style.display = 'block';

            // --- Positioning Calculation ---
            // Visual Size (GIF) = 128x128
            // Hitbox Size = 60x90
            const visualSize = 128; 
            const scaledSize = visualSize * gameScale;
            
            // Center horizontally: Sprite Left = Hitbox Left - ( (VisualW - HitboxW) / 2 )
            const spriteOffsetX = (visualSize - this.width) / 2;
            
            // Align Bottoms: Sprite Top = Hitbox Top - (VisualH - HitboxH)
            const spriteOffsetY = (visualSize - this.height); 

            // Convert World to Screen
            const screenX = (this.x - cameraX - spriteOffsetX) * gameScale;
            // Fine tune Y: +5 pushes sprite down slightly to make feet touch shadow perfectly
            const screenY = (this.y - spriteOffsetY + 5) * gameScale;

            playerSpriteEl.style.width = `${scaledSize}px`;
            playerSpriteEl.style.height = `${scaledSize}px`;
            playerSpriteEl.style.transform = `translate(${screenX}px, ${screenY}px)`;
            playerSpriteEl.style.left = '0';
            playerSpriteEl.style.top = '0';
        }
    }

    class Platform {
        constructor(x, y, w, h, type) {
            this.x = x;
            this.y = y;
            this.width = w;
            this.height = h;
            this.type = type;
        }

        draw() {
            if (this.x + this.width < cameraX || this.x > cameraX + canvas.width/gameScale) return;

            if (this.type === 'ground') {
                ctx.fillStyle = C_GROUND;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = C_GRASS;
                ctx.fillRect(this.x, this.y, this.width, 20); 
            } else {
                ctx.fillStyle = '#c45c26';
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.strokeStyle = '#5a2a10';
                ctx.lineWidth = 4;
                ctx.strokeRect(this.x, this.y, this.width, this.height);
                ctx.fillStyle = 'rgba(0,0,0,0.1)';
                ctx.fillRect(this.x + 4, this.y + 4, this.width - 8, this.height - 8);
            }
        }
    }

    class VocabItem {
        constructor(x, y, word) {
            this.x = x;
            this.y = y;
            this.width = 80;
            this.height = 80;
            this.word = word;
            this.collected = false;
            this.floatY = 0;
            this.offset = Math.random() * Math.PI * 2;
            this.cooldown = 0; 
            
            this.img = new Image();
            this.img.src = "img/Lesson1/" + encodeURIComponent(word) + ".png"; 
        }

        update() {
            if (this.collected) return;
            
            if (this.cooldown > 0) this.cooldown--;

            this.floatY = Math.sin((frameCount / 20) + this.offset) * 5;

            if (this.cooldown <= 0 &&
                player.x < this.x + this.width &&
                player.x + player.width > this.x &&
                player.y < this.y + this.height + this.floatY &&
                player.y + player.height > this.y + this.floatY) {
                
                this.checkCollection();
            }
        }

        checkCollection() {
            if (this.word === currentTargetWord) {
                this.collected = true;
                score += 10;
                Sound.playCorrect();
                createParticles(this.x + this.width/2, this.y + this.height/2, '#7CFC00'); 
                pickNextTarget();
            } else {
                score -= 1; 
                this.cooldown = 60; 
                Sound.playWrong();
                createParticles(this.x + this.width/2, this.y + this.height/2, '#555'); 
            }
            updateUI();
        }

        draw() {
            if (this.collected) return;
            if (this.x + this.width < cameraX || this.x > cameraX + canvas.width/gameScale) return;

            const drawY = this.y + this.floatY;
            
            ctx.fillStyle = 'rgba(255,255,255,0.9)';
            ctx.beginPath();
            ctx.arc(this.x + 40, drawY + 40, 45, 0, Math.PI * 2);
            ctx.fill();
            
            if (this.word === currentTargetWord) {
                ctx.strokeStyle = '#ffd700';
                ctx.lineWidth = 5;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffd700';
            } else {
                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
            }
            
            ctx.stroke();
            ctx.shadowBlur = 0;

            try {
                if (this.img.complete && this.img.naturalHeight !== 0) {
                     ctx.drawImage(this.img, this.x + 10, drawY + 10, 60, 60);
                } else {
                    ctx.fillStyle = '#ccc';
                    ctx.font = '20px Sarabun';
                    ctx.textAlign = 'center';
                    ctx.fillText('...', this.x + 40, drawY + 45);
                }
            } catch(e) {}
        }
    }

    class Particle {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.velX = (Math.random() - 0.5) * 10;
            this.velY = (Math.random() - 0.5) * 10;
            this.life = 20;
            this.color = color;
            this.size = Math.random() * 8 + 4;
        }
        update() {
            this.x += this.velX;
            this.y += this.velY;
            this.life--;
        }
        draw() {
            ctx.fillStyle = this.color;
            ctx.globalAlpha = this.life / 20;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            ctx.globalAlpha = 1.0;
        }
    }

    function createParticles(x, y, color) {
        for(let i=0; i<10; i++) particles.push(new Particle(x, y, color));
    }

    function pickNextTarget() {
        const remainingItems = items.filter(i => !i.collected);
        if (remainingItems.length === 0) {
            // Level cleared? Just regenerate vocab to keep playing endlessly
            items.forEach(i => i.collected = false);
            pickNextTarget();
            return;
        }
        const options = remainingItems.map(i => i.word);
        const uniqueOptions = [...new Set(options)];
        const next = uniqueOptions[Math.floor(Math.random() * uniqueOptions.length)];
        currentTargetWord = next;
        
        const container = document.getElementById('target-container');
        const targetEl = document.getElementById('target-word');
        targetEl.innerText = currentTargetWord;
        
        container.style.transform = "scale(1.2)";
        setTimeout(() => container.style.transform = "scale(1)", 200);
    }

    function generateLevel() {
        platforms = [];
        items = [];
        decors = [];
        
        const TILE_SIZE = 80;
        const FLOOR_Y = 550; 
        const LEVEL_LENGTH = 100000; // Increased length for "Endless" feel
        const SAFE_HEIGHT_ABOVE_SURFACE = 220; 

        // Chunked Ground to avoid physics issues
        for(let gx = -100; gx < LEVEL_LENGTH + 500; gx += 800) {
            platforms.push(new Platform(gx, FLOOR_Y, 802, 200, 'ground'));
        }
        
        for (let i = 0; i < 200; i++) {
            decors.push({x: i * 600 + Math.random()*200, y: Math.random() * 200 + 50, type: 'cloud'});
        }
        for (let i = 0; i < 100; i++) {
            decors.push({x: i * 1000, y: FLOOR_Y, type: 'hill'});
        }

        let cx = 800; 
        
        while(cx < LEVEL_LENGTH - 800) {
            const type = Math.floor(Math.random() * 3);
            
            if (type === 0) {
                const startY = FLOOR_Y;
                platforms.push(new Platform(cx, startY - 100, TILE_SIZE, 100, 'block'));
                platforms.push(new Platform(cx + TILE_SIZE, startY - 200, TILE_SIZE, 200, 'block'));
                platforms.push(new Platform(cx + TILE_SIZE*2, startY - 300, TILE_SIZE*2, 300, 'block'));
                platforms.push(new Platform(cx + TILE_SIZE*4, startY - 200, TILE_SIZE, 200, 'block'));
                platforms.push(new Platform(cx + TILE_SIZE*5, startY - 100, TILE_SIZE, 100, 'block'));
                cx += 800;
            } else if (type === 1) {
                platforms.push(new Platform(cx, FLOOR_Y - 150, TILE_SIZE*2, 40, 'block'));
                platforms.push(new Platform(cx + 250, FLOOR_Y - 300, TILE_SIZE*2, 40, 'block'));
                platforms.push(new Platform(cx + 500, FLOOR_Y - 150, TILE_SIZE*2, 40, 'block'));
                cx += 900;
            } else {
                platforms.push(new Platform(cx, FLOOR_Y - 200, TILE_SIZE, 200, 'block')); 
                platforms.push(new Platform(cx + TILE_SIZE, FLOOR_Y - 200, TILE_SIZE*4, 40, 'block')); 
                platforms.push(new Platform(cx + TILE_SIZE*5, FLOOR_Y - 200, TILE_SIZE, 200, 'block')); 
                cx += 700;
            }
        }

        const potentialX = [];
        for(let px = 600; px < LEVEL_LENGTH - 400; px += 300) {
            potentialX.push(px);
        }
        
        potentialX.sort(() => Math.random() - 0.5);
        
        // More items for longer level
        const count = Math.min(potentialX.length, 100); 
        
        for (let i = 0; i < count; i++) {
            const itemX = potentialX[i];
            let highestSurfaceY = FLOOR_Y;
            const checkX = itemX + 40; 
            
            for (let p of platforms) {
                if (checkX >= p.x && checkX <= p.x + p.width) {
                    if (p.y < highestSurfaceY) {
                        highestSurfaceY = p.y;
                    }
                }
            }
            
            const itemY = highestSurfaceY - SAFE_HEIGHT_ABOVE_SURFACE;
            const word = vocabulary[Math.floor(Math.random() * vocabulary.length)];
            items.push(new VocabItem(itemX, itemY, word));
        }
    }

    function init() {
        resize();
        window.addEventListener('resize', resize);
        
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') {
                keys.up = true;
                if (gameState === 'START' && imagesLoaded >= 2) startGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
            if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
            if (e.key === 'ArrowUp' || e.key === ' ' || e.key === 'w') keys.up = false;
        });

        setupTouchControls();
        resetLevel(); 
        requestAnimationFrame(gameLoop);
    }
    
    function setupTouchControls() {
        const btnLeft = document.getElementById('btn-left');
        const btnRight = document.getElementById('btn-right');
        const btnJump = document.getElementById('btn-jump');
        const addTouch = (elem, key) => {
            elem.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
            elem.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
            elem.addEventListener('mousedown', (e) => { e.preventDefault(); keys[key] = true; });
            elem.addEventListener('mouseup', (e) => { e.preventDefault(); keys[key] = false; });
        };
        addTouch(btnLeft, 'left');
        addTouch(btnRight, 'right');
        addTouch(btnJump, 'up');
    }

    function resetGame() {
        Sound.init();
        score = 0;
        gameState = 'PLAYING';
        document.getElementById('start-screen').style.display = 'none';
        updateUI();
        resetLevel();
        pickNextTarget();
    }

    function startGame() { if(gameState === 'START') resetGame(); }

    function resetLevel() {
        player = new Player();
        cameraX = 0;
        generateLevel();
    }

    function updateUI() {
        document.getElementById('score-display').innerText = "คะแนน: " + score;
    }

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gameScale = canvas.height / LOGICAL_HEIGHT;
    }

    function gameLoop() {
        if (gameState === 'PLAYING') update();
        draw();
        frameCount++;
        requestAnimationFrame(gameLoop);
    }

    function update() {
        player.update();
        items.forEach(i => i.update());
        particles.forEach((p, i) => {
            p.update();
            if (p.life <= 0) particles.splice(i, 1);
        });

        let logicalWidth = canvas.width / gameScale;
        let targetCamX = player.x - logicalWidth / 3;
        
        if (targetCamX < 0) targetCamX = 0;
        
        // Endless walk: Loop back if too far
        if (player.x > 100000) {
             player.x = 100;
             cameraX = 0;
        }

        cameraX += (targetCamX - cameraX) * 0.1;
    }

    function draw() {
        ctx.fillStyle = C_SKY;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.scale(gameScale, gameScale);
        ctx.translate(-cameraX, 0);

        decors.forEach(d => {
            if (d.type === 'cloud') {
                ctx.fillStyle = 'rgba(255,255,255,0.7)';
                ctx.beginPath();
                ctx.arc(d.x, d.y, 60, 0, Math.PI * 2);
                ctx.arc(d.x + 80, d.y + 20, 80, 0, Math.PI * 2);
                ctx.fill();
            } else if (d.type === 'hill') {
                ctx.fillStyle = '#2E8B57';
                ctx.beginPath();
                ctx.moveTo(d.x, 550);
                ctx.lineTo(d.x + 400, 150);
                ctx.lineTo(d.x + 800, 550);
                ctx.fill();
            }
        });

        if (platforms) platforms.forEach(p => p.draw());
        if (items) items.forEach(i => i.draw());
        if (particles) particles.forEach(p => p.draw());
        if (player) player.draw();

        ctx.restore();
    }

    init();

</script>
</body>
