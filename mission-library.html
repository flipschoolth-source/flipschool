<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คลังภารกิจ - FlipSchool</title>
    
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
        }

        body { 
            font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%);
        }

        /* ================= NAVBAR ================= */
        #mainNav { display: flex; justify-content: space-between; align-items: center; padding: 0 clamp(15px, 5%, 50px); height: 90px; background: white; position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; border-bottom: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); border-bottom-color: transparent; }
        
        .nav-left { display: flex; align-items: center; gap: clamp(10px, 2vw, 15px); text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-logo-icon { font-size: clamp(20px, 4vw, 28px); background: white; width: clamp(40px, 5vw, 50px); height: clamp(40px, 5vw, 50px); border-radius: clamp(10px, 2vw, 14px); border: 2.5px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,139,0.1); color: var(--text-main); transition: all 0.3s ease; }
        #mainNav.scrolled .nav-logo-icon { width: 40px; height: 40px; font-size: 20px; border-width: 2px; border-radius: 10px; }
        
        .nav-brand { font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--primary); font-family: 'Kanit'; margin-bottom: -4px; transition: 0.3s;}
        .nav-brand span { color: var(--accent); }
        #mainNav.scrolled .nav-brand { font-size: 22px; }
        .nav-slogan { font-size: 13px; color: var(--text-muted); font-family: 'Sarabun'; transition: 0.3s; }
        #mainNav.scrolled .nav-slogan { font-size: 11px; opacity: 0; display: none; }
        
        .nav-center { display: flex; align-items: center; gap: clamp(15px, 2vw, 30px); }
        .nav-link { color: var(--text-muted); font-family: 'Kanit'; font-weight: 500; font-size: clamp(14px, 1.5vw, 16px); text-decoration: none; transition: 0.2s; display: flex; align-items: center; gap: 8px; position: relative; }
        .nav-link:hover { color: var(--primary); }
        
        .header-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); box-shadow: 0 15px 30px rgba(0, 0, 139, 0.1); border-bottom: 4px solid var(--accent); }
        
        .mobile-menu-btn { display: none; background: #f8faff; border: 1px solid #eef2f7; font-size: 20px; color: var(--primary); cursor: pointer; width: 42px; height: 42px; border-radius: 12px; transition: 0.3s; }
        .mobile-dropdown { display: none; flex-direction: column; background: white; position: absolute; top: 100%; left: 0; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-top: 1px solid #f1f5f9; z-index: 999; }
        .mobile-dropdown.active { display: flex; animation: slideDown 0.3s ease-out; }
        .mobile-dropdown a { padding: 16px 25px; text-decoration: none; color: var(--text-main); font-family: 'Kanit'; font-weight: 500; border-bottom: 1px solid #f8faff; display: flex; align-items: center; gap: 12px; font-size: 15px; transition: 0.2s; }
        
        /* 🌟 Mission Card 🌟 */
        .mission-card { 
            background: white; border-radius: 24px; padding: 0; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #edf2f7; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; 
        }
        .mission-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,139,0.12); }
        
        .preview-image-container { width: 100%; height: 160px; position: relative; overflow: hidden; background: #e2e8f0; }
        .mission-cover-img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s transform; }
        .mission-card:hover .mission-cover-img { transform: scale(1.1); }
        
        .type-badge { position: absolute; top: 12px; left: 12px; padding: 4px 12px; border-radius: 8px; font-family: 'Kanit'; font-weight: 700; font-size: 10px; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 5; }

        .mission-body { padding: 18px; display: flex; flex-direction: column; flex: 1; position: relative; }
        .mission-title { font-family: 'Kanit'; font-weight: 700; font-size: 17px; color: var(--text-main); margin-bottom: 4px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Pagination */
        .page-btn { min-width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: white; border: 1px solid #e2e8f0; color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* FAB */
        .fab-add { position: fixed; bottom: 40px; right: 40px; width: 65px; height: 65px; background: var(--accent); color: white; border-radius: 50%; border:none; font-size: 28px; cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4); transition: 0.3s; }
        .fab-add:hover { transform: scale(1.05) translateY(-5px); }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .spinner { border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(20px) scale(0.9); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        select option { color: #333 !important; background: white !important; }

        @media (max-width: 1024px) {
            .nav-center { display: none; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-family: 'Kanit'; color: var(--primary); font-weight: 600;">กำลังรวบรวมภารกิจ...</div>
    </div>

    <!-- 🌟 Navbar 🌟 -->
    <nav id="mainNav">
        <a href="index.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div class="nav-text-group">
                <div class="nav-brand">Flip<span>School</span></div>
                <div class="nav-slogan slogan">...</div>
            </div>
        </a>
        <div class="nav-center">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="mission-library.html" class="nav-link font-bold text-[var(--primary)]"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
        </div>
        <div class="nav-right">
            <button id="btnLoginLogout" onclick="handleAuthAction()" class="bg-slate-50 text-slate-700 px-4 py-2 rounded-xl font-bold font-['Kanit'] transition-all border-none cursor-pointer text-sm shadow-sm hover:bg-[var(--primary)] hover:text-white">เข้าสู่ระบบ</button>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        </div>
        <div id="mobileMenu" class="mobile-dropdown">
            <a href="index.html"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="dashboard.html"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="mission-library.html"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
            <a href="#" onclick="handleAuthAction()" id="btnMobileAuth" class="text-rose-500 font-bold">เข้าสู่ระบบ</a>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="header-gradient text-white py-8 px-5 md:px-12 relative overflow-hidden rounded-b-[1.5rem] md:rounded-b-[2rem] shadow-sm mb-8">
        <div class="container mx-auto max-w-[1200px] relative z-10 flex flex-col lg:flex-row justify-between lg:items-end gap-6">
            <div class="flex-1">
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight font-['Kanit'] flex items-center gap-3">
                    คลังภารกิจการเรียนรู้
                    <span id="syncIndicator" class="opacity-0 transition-opacity text-xs font-normal text-white/70 bg-white/10 px-3 py-1 rounded-full border border-white/20">
                        <i class="fas fa-sync-alt animate-spin mr-1"></i> ซิงค์ข้อมูล...
                    </span>
                </h1>
                <p class="text-blue-100 font-medium text-sm md:text-lg mt-2 opacity-90 font-sans">คัดเลือกภารกิจที่เหมาะสมและดูพรีวิวจริงก่อนมอบหมายงาน</p>
            </div>
            
            <div class="w-full lg:w-auto flex flex-col sm:flex-row gap-2">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/50"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาภารกิจ..." oninput="applyFilters(true)" class="w-full sm:w-[220px] bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl pl-11 pr-4 py-3 outline-none text-sm font-sans focus:bg-white/20 transition-all">
                </div>
                <div class="flex gap-2">
                    <select id="filterSource" onchange="applyFilters(true)" class="bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 outline-none text-sm cursor-pointer font-sans focus:bg-white/20 flex-1">
                        <option value="all">ทั้งหมด</option>
                        <option value="mine">ของฉัน</option>
                        <option value="public">สาธารณะ</option>
                    </select>
                    <select id="itemsPerPage" onchange="changeItemsPerPage(this.value)" class="bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 outline-none text-sm cursor-pointer font-sans focus:bg-white/20">
                        <option value="8">8/หน้า</option>
                        <option value="12" selected>12/หน้า</option>
                        <option value="24">24/หน้า</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 md:px-6 pb-12 max-w-[1200px] relative">
        <div id="missionGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        <div id="paginationContainer" class="mt-12 flex items-center justify-center gap-2">
            <div id="pageNumbers" class="flex gap-1.5"></div>
        </div>
    </main>

    <button onclick="checkAuthAndCreate()" id="fabAdd" class="fab-add hidden" title="สร้างภารกิจใหม่"><i class="fas fa-plus"></i></button>

    <footer class="footer footer-display-text"></footer>

    <!-- Custom Modal -->
    <div id="customAlertModal" style="display: none; opacity: 0; transition: opacity 0.3s;" class="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm">
        <div class="bg-white rounded-[25px] w-full max-w-[420px] p-8 shadow-2xl text-center transform scale-95 transition-transform" id="customAlertBox">
            <div class="text-[50px] mb-4"><i id="customAlertIcon" class="fas fa-info-circle text-[var(--primary)]"></i></div>
            <h3 id="customAlertTitle" class="text-xl font-bold font-['Kanit'] text-slate-800 mb-2">แจ้งเตือน</h3>
            <p id="customAlertMessage" class="text-slate-500 mb-6 font-['Sarabun']"></p>
            <div class="flex justify-center gap-3">
                <button onclick="closeCustomAlert()" class="bg-[var(--primary)] hover:bg-[var(--primary-light)] text-white px-10 py-3 rounded-full font-bold font-['Kanit'] border-none cursor-pointer">ตกลง</button>
                <button id="customAlertCancelBtn" onclick="closeCustomAlert(true)" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 px-10 py-3 rounded-full font-bold font-['Kanit'] border-none cursor-pointer">ยกเลิก</button>
            </div>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let allMissions = [];
        let filteredMissions = [];
        let currentPage = 1;
        let itemsPerPage = 12;

        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 20) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });
        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('active'); }

        let alertCallback = null;
        function showCustomAlert(msg, type='info', cb=null) { 
            const modal = document.getElementById('customAlertModal');
            const icon = document.getElementById('customAlertIcon');
            const cancelBtn = document.getElementById('customAlertCancelBtn');
            
            document.getElementById('customAlertMessage').innerHTML = msg;
            if(type==='success'){ icon.className='fas fa-check-circle text-emerald-500'; cancelBtn.classList.add('hidden'); }
            else if(type==='confirm'){ icon.className='fas fa-question-circle text-rose-500'; cancelBtn.classList.remove('hidden'); }
            else { icon.className='fas fa-info-circle text-[var(--primary)]'; cancelBtn.classList.add('hidden'); }

            modal.style.display = 'flex';
            setTimeout(() => { modal.style.opacity = '1'; document.getElementById('customAlertBox').classList.remove('scale-95'); }, 10);
            alertCallback = cb;
        }

        function closeCustomAlert(isCancel = false) { 
            const modal = document.getElementById('customAlertModal');
            modal.style.opacity = '0';
            document.getElementById('customAlertBox').classList.add('scale-95');
            setTimeout(() => { 
                modal.style.display = 'none'; 
                if (!isCancel && alertCallback) alertCallback();
                alertCallback = null;
            }, 300);
        }

        function getDB() { return window.sysDB; }

        function getMissionCover(m) {
            if (m.cover_url && m.cover_url.trim() !== '') return m.cover_url;
            const placeholders = {
                quiz: 'https://images.unsplash.com/photo-1543269865-cbf427effbad?q=80&w=400&auto=format&fit=crop',
                match: 'https://images.unsplash.com/photo-1606326608606-aa0b62935f2b?q=80&w=400&auto=format&fit=crop',
                ai_generated: 'https://images.unsplash.com/photo-1677442136019-21780ecad995?q=80&w=400&auto=format&fit=crop',
                competition: 'https://images.unsplash.com/photo-1551818255-e6e10975bc17?q=80&w=400&auto=format&fit=crop',
                html_custom: 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=400&auto=format&fit=crop',
                default: 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?q=80&w=400&auto=format&fit=crop'
            };
            return placeholders[m.mission_type] || placeholders.default;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof initAppUI === 'function') initAppUI();
            try {
                const db = getDB();
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    currentUserId = session.user.id;
                    document.getElementById('btnLoginLogout').innerText = 'ออกจากระบบ';
                    document.getElementById('fabAdd').classList.remove('hidden');
                } else {
                    document.getElementById('filterSource').value = 'public';
                    document.getElementById('filterSource').disabled = true;
                }
                await fetchMissions(db);
            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        });

        async function fetchMissions(db) {
            document.getElementById('syncIndicator').classList.remove('opacity-0');
            try {
                let query = db.from('missions').select('*');
                if (currentUserId) query = query.or(`is_public.eq.true,created_by.eq.${currentUserId}`);
                else query = query.eq('is_public', true);
                
                const { data, error } = await query.order('created_at', { ascending: false });
                if (!error) {
                    allMissions = data || [];
                    applyFilters();
                }
            } finally {
                document.getElementById('syncIndicator').classList.add('opacity-0');
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function applyFilters(reset = false) {
            if (reset) currentPage = 1;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const source = document.getElementById('filterSource').value;

            filteredMissions = allMissions.filter(m => {
                const matchQuery = m.title.toLowerCase().includes(query) || (m.subject_group && m.subject_group.toLowerCase().includes(query));
                let matchSource = true;
                if (source === 'mine') matchSource = (m.created_by === currentUserId);
                else if (source === 'public') matchSource = (m.is_public === true && m.created_by !== currentUserId);
                return matchQuery && matchSource;
            });

            renderMissions();
            renderPagination();
        }

        function renderMissions() {
            const container = document.getElementById('missionGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = filteredMissions.slice(start, start + itemsPerPage);
            
            if (pageData.length === 0) {
                container.innerHTML = `<div class="col-span-full py-24 text-center opacity-40 bg-white rounded-3xl border-2 border-dashed border-slate-200"><i class="fas fa-box-open text-5xl mb-4"></i><p class="font-bold text-lg font-['Kanit']">ยังไม่มีภารกิจในส่วนนี้</p></div>`;
                return;
            }

            container.innerHTML = pageData.map((m, index) => {
                const colors = { quiz:'#f43f5e', match:'#10b981', ai_generated:'#8b5cf6', competition:'#f59e0b', html_custom:'#3b82f6' };
                const labels = { quiz:'ควิซปรนัย', match:'จับคู่', ai_generated:'AI สร้าง', competition:'แข่งขัน', html_custom:'สื่ออัจฉริยะ' };
                const themeColor = colors[m.mission_type] || 'var(--primary-light)';
                const playUrl = currentUserId ? `play-mission.html?mid=${m.mission_id}` : `play-mission.html?mid=${m.mission_id}&mode=guest`;
                const coverImg = getMissionCover(m);

                return `
                <div class="mission-card animate-pop-in" style="animation-delay: ${index * 0.05}s;">
                    <div class="preview-image-container">
                        <div class="type-badge" style="background: ${themeColor};">${labels[m.mission_type] || 'ทั่วไป'}</div>
                        <img src="${coverImg}" class="mission-cover-img" alt="${m.title}" onerror="this.src='https://via.placeholder.com/400x160?text=FlipSchool+Mission'">
                    </div>
                    <div class="mission-body">
                        <h3 class="mission-title" title="${m.title}">${m.title}</h3>
                        <p class="text-[11px] text-slate-500 mb-4 font-['Sarabun'] flex items-center gap-1"><i class="fas fa-tag opacity-70"></i> ${m.subject_group || 'ทั่วไป'}</p>
                        
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-amber-50 text-amber-600 text-[10px] font-bold px-2.5 py-1 rounded-md shadow-sm border border-amber-100"><i class="fas fa-star mr-1"></i>${m.reward_points || 10} แต้ม</span>
                            <span class="text-[10px] text-slate-400 font-bold bg-slate-50 px-2.5 py-1 rounded-md"><i class="fas fa-eye mr-1"></i>${m.view_count || 0}</span>
                        </div>

                        <div class="flex gap-2 mt-auto pt-4 border-t border-slate-50">
                            <button onclick="location.href='${playUrl}'" class="flex-1 bg-[var(--primary)] text-white font-bold py-2.5 rounded-xl transition text-xs border-none cursor-pointer flex justify-center items-center gap-1.5 shadow-md active:scale-95"><i class="fas fa-play"></i> เริ่มภารกิจ</button>
                            ${m.created_by === currentUserId ? `
                                <button onclick="location.href='mission-create.html?mid=${m.mission_id}'" class="bg-amber-50 hover:bg-amber-500 text-amber-600 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer shadow-sm" title="แก้ไข"><i class="fas fa-edit"></i></button>
                                <button onclick="deleteMission('${m.mission_id}', '${m.title.replace(/'/g, "\\'")}')" class="bg-rose-50 hover:bg-rose-500 text-rose-500 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer shadow-sm" title="ลบ"><i class="fas fa-trash-alt"></i></button>
                            ` : `
                                <button onclick="quickShare('${m.mission_id}')" class="bg-indigo-50 hover:bg-indigo-500 text-indigo-600 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer shadow-sm" title="แชร์ด่วน"><i class="fas fa-share-alt"></i></button>
                            `}
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        function renderPagination() {
            const container = document.getElementById('pageNumbers');
            const totalPages = Math.ceil(filteredMissions.length / itemsPerPage);
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = '';
            for(let i=1; i<=totalPages; i++) {
                html += `<button onclick="changePage(${i})" class="page-btn ${currentPage === i ? 'active' : ''}">${i}</button>`;
            }
            container.innerHTML = html;
        }

        function changePage(p) { currentPage = p; renderMissions(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function changeItemsPerPage(val) { itemsPerPage = parseInt(val); currentPage = 1; renderMissions(); renderPagination(); }

        function quickShare(mid) {
            const url = `${window.location.origin}/play-mission.html?mid=${mid}&mode=guest`;
            navigator.clipboard.writeText(url).then(() => showCustomAlert("คัดลอกลิงก์สำหรับแชร์ให้ผู้เล่นทั่วไปแล้ว!", "success"));
        }

        async function handleAuthAction() {
            if (currentUserId) {
                showCustomAlert("คุณต้องการออกจากระบบใช่หรือไม่?", "confirm", async () => {
                    await window.sysDB.auth.signOut();
                    location.reload();
                });
            } else {
                location.href = 'login.html';
            }
        }

        function checkAuthAndCreate() {
            if (!currentUserId) return showCustomAlert("กรุณาเข้าสู่ระบบก่อนสร้างภารกิจครับ");
            const params = new URLSearchParams(window.location.search);
            let targetUrl = 'mission-create.html';
            if (params.get('cid') || params.get('folder')) {
                const url = new URL(targetUrl, window.location.origin);
                if (params.get('cid')) url.searchParams.set('cid', params.get('cid'));
                if (params.get('folder')) url.searchParams.set('folder', params.get('folder'));
                targetUrl = url.href;
            }
            location.href = targetUrl;
        }

        function deleteMission(id, title) {
            showCustomAlert(`ยืนยันลบภารกิจ <b>"${title}"</b> ใช่หรือไม่?`, "confirm", async () => {
                const db = getDB();
                await db.from('missions').delete().eq('mission_id', id);
                allMissions = allMissions.filter(m => m.mission_id !== id);
                applyFilters();
                showCustomAlert("ลบสำเร็จ", "success");
            });
        }
    </script>
</body>
</html>
