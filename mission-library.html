<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังภารกิจอัจฉริยะ | FlipSchool</title>
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f8fafc; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .category-card { transition: all 0.3s ease; cursor: pointer; border: 2px solid white; border-radius: 1.5rem; }
        .category-card.active { border-color: #3b82f6; background-color: #eff6ff; transform: scale(1.05); }
        .mission-item-card { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); border-radius: 2.5rem; }
        .mission-item-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ✅ Unified Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0 border border-slate-50">
                    <span class="text-2xl text-blue-900">🎓</span>
                </div>
                <div class="flex flex-col">
                    <div class="text-xl md:text-2xl font-bold tracking-tight leading-none">
                        <span class="text-white">Flip</span><span class="text-orange-400">School</span>
                    </div>
                    <span class="app-slogan-label text-[10px] text-blue-200 font-medium mt-1 tracking-wide"></span>
                </div>
            </div>
            <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs transition-all flex items-center gap-2 border border-white/10 font-bold">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-10 flex-grow max-w-7xl">
        <!-- Search Section -->
        <section class="mb-10 flex flex-col md:flex-row md:items-end justify-between gap-6">
            <div>
                <h1 class="text-3xl md:text-4xl font-black text-blue-900 mb-2">คลังภารกิจอัจฉริยะ</h1>
                <p class="text-slate-500">รวมรวมบทเรียนคุณภาพเพื่อก้าวสู่ห้องเรียนยุคใหม่</p>
            </div>
            <div class="relative w-full md:w-96">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" oninput="filterMissions()" class="w-full bg-white border border-slate-200 rounded-2xl p-4 pl-12 outline-none focus:ring-4 focus:ring-blue-500/10 font-bold text-slate-700" placeholder="ชื่อภารกิจ หรือวิชา...">
            </div>
        </section>

        <!-- Categories -->
        <section class="mb-10 overflow-x-auto pb-4 no-scrollbar">
            <div class="flex gap-4 min-w-max" id="categoryContainer">
                <div onclick="setCategory('ทั้งหมด')" class="category-card active px-6 py-4 bg-white shadow-sm flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-50 text-blue-600 rounded-xl flex items-center justify-center"><i class="fas fa-th-large"></i></div>
                    <span class="text-sm font-bold text-slate-700">ทั้งหมด</span>
                </div>
                <!-- Dymamic categories -->
            </div>
        </section>

        <section id="missionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Data injected here -->
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-12 text-center mt-auto">
        <p class="text-blue-900 font-bold mb-1 italic">© 2026 FlipSchool. <span class="app-slogan-label"></span></p>
        <p class="text-slate-400 text-[10px] uppercase tracking-widest font-black">GLORY Model Intelligence System</p>
    </footer>

    <script>
        let allMissions = [];
        let currentCategory = 'ทั้งหมด';
        let targetCid = new URLSearchParams(window.location.search).get('cid');

        const categories = [
            { name: "ภาษาไทย", icon: "fas fa-font", color: "rose" },
            { name: "คณิตศาสตร์", icon: "fas fa-calculator", color: "blue" },
            { name: "วิทยาศาสตร์และเทคโนโลยี", icon: "fas fa-flask", color: "emerald" },
            { name: "สังคมศึกษา ศาสนา และวัฒนธรรม", icon: "fas fa-globe-asia", color: "amber" },
            { name: "สุขศึกษาและพลศึกษา", icon: "fas fa-running", color: "orange" },
            { name: "ศิลปะ", icon: "fas fa-palette", color: "pink" },
            { name: "การงานอาชีพ", icon: "fas fa-tools", color: "slate" },
            { name: "ภาษาต่างประเทศ", icon: "fas fa-language", color: "indigo" }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.CONFIG) document.querySelectorAll('.app-slogan-label').forEach(el => el.innerText = window.CONFIG.APP_SLOGAN);
            renderCategories();
            const checkDB = setInterval(() => {
                if (window.sysDB) { clearInterval(checkDB); loadLibraryMissions(); }
            }, 500);
        });

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.onclick = () => setCategory(cat.name);
                div.className = `category-card px-6 py-4 bg-white shadow-sm flex items-center gap-3 category-item-${cat.name}`;
                div.innerHTML = `<div class="w-10 h-10 bg-${cat.color}-50 text-${cat.color}-500 rounded-xl flex items-center justify-center"><i class="${cat.icon}"></i></div><span class="text-sm font-bold text-slate-700">${cat.name}</span>`;
                container.appendChild(div);
            });
        }

        function setCategory(name) {
            currentCategory = name;
            document.querySelectorAll('.category-card').forEach(el => el.classList.remove('active'));
            if(name === 'ทั้งหมด') document.querySelector('.category-card').classList.add('active');
            else document.querySelector(`.category-item-${name}`).classList.add('active');
            filterMissions();
        }

        async function loadLibraryMissions() {
            try {
                const { data, error } = await window.sysDB.from('missions').select('*, teachers(first_name, last_name, profile_pic)').eq('is_public', true).order('created_at', { ascending: false });
                if (data) { allMissions = data; filterMissions(); }
            } catch (err) { console.error(err); }
        }

        function filterMissions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('missionGrid');
            const filtered = allMissions.filter(m => {
                const matchSearch = m.title.toLowerCase().includes(search) || (m.subject_name && m.subject_name.toLowerCase().includes(search));
                const matchCat = currentCategory === 'ทั้งหมด' || m.subject_group === currentCategory;
                return matchSearch && matchCat;
            });

            grid.innerHTML = filtered.map(m => `
                <div class="mission-item-card bg-white p-8 border border-slate-100 flex flex-col h-full relative overflow-hidden">
                    <div class="absolute -top-6 -right-6 w-20 h-20 bg-blue-50 rounded-full opacity-50"></div>
                    <div class="flex justify-between items-start mb-6 relative z-10">
                        <span class="text-[10px] font-black uppercase px-3 py-1.5 bg-blue-600 text-white rounded-full shadow-md">${m.subject_group || 'ทั่วไป'}</span>
                        <div class="text-orange-500 font-black text-sm"><i class="fas fa-crown"></i> ${m.reward_points}</div>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">${m.title}</h3>
                    <p class="text-slate-500 text-sm mb-8 flex-grow line-clamp-2">${m.description || 'เข้าร่วมการเรียนรู้ผ่านกิจกรรมนี้'}</p>
                    <div class="flex items-center justify-between mt-auto pt-6 border-t border-slate-50 relative z-10">
                        <div class="flex items-center gap-3">
                            <img src="${m.teachers?.profile_pic || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + m.teachers?.first_name}" class="w-10 h-10 rounded-full border-2 border-slate-100">
                            <div class="flex flex-col">
                                <span class="text-[10px] text-slate-400 font-black uppercase">ผู้สร้าง</span>
                                <span class="text-sm font-bold text-slate-700 leading-none">ครู${m.teachers?.first_name || 'ไม่ระบุ'}</span>
                            </div>
                        </div>
                        <button onclick="assignMission('${m.mission_id}')" class="bg-slate-900 hover:bg-blue-900 text-white px-6 py-3 rounded-2xl text-xs font-black transition-all">เลือกใช้</button>
                    </div>
                </div>
            `).join('');
        }

        async function assignMission(mid) {
            if(!targetCid) return alert('กรุณาเข้าจากหน้าห้องเรียนครับ');
            if(!confirm('ยืนยันการนำเข้าห้องเรียน?')) return;
            const { error } = await window.sysDB.from('classroom_missions').upsert({ classroom_id: targetCid, mission_id: mid, assigned_at: new Date().toISOString() }, { onConflict: 'classroom_id, mission_id' });
            if (!error) { alert('เพิ่มสำเร็จ! 🚀'); location.href = `classroom-detail.html?id=${targetCid}`; }
        }
    </script>
</body>
</html>
