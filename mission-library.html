 <!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>01คลังภารกิจ - FlipSchool</title>
    
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
        }

        body { 
            font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%);
        }

        /* ================= NAVBAR ================= */
        #mainNav { display: flex; justify-content: space-between; align-items: center; padding: 0 clamp(15px, 5%, 50px); height: 90px; background: white; position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; border-bottom: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); border-bottom-color: transparent; }
        
        .nav-left { display: flex; align-items: center; gap: clamp(10px, 2vw, 15px); text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-logo-icon { font-size: clamp(20px, 4vw, 28px); background: white; width: clamp(40px, 5vw, 50px); height: clamp(40px, 5vw, 50px); border-radius: clamp(10px, 2vw, 14px); border: 2.5px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,139,0.1); color: var(--text-main); transition: all 0.3s ease; }
        #mainNav.scrolled .nav-logo-icon { width: 40px; height: 40px; font-size: 20px; border-width: 2px; border-radius: 10px; }
        
        .nav-text-group { display: flex; flex-direction: column; justify-content: center; }
        .nav-brand { font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--primary); font-family: 'Kanit'; margin-bottom: -4px; transition: 0.3s;}
        .nav-brand span { color: var(--accent); }
        #mainNav.scrolled .nav-brand { font-size: 22px; }
        .nav-slogan { font-size: 13px; color: var(--text-muted); font-family: 'Sarabun'; transition: 0.3s; }
        #mainNav.scrolled .nav-slogan { font-size: 11px; opacity: 0; display: none; }
        
        .nav-center { display: flex; align-items: center; gap: clamp(15px, 2vw, 30px); }
        .nav-link { color: var(--text-muted); font-family: 'Kanit'; font-weight: 500; font-size: clamp(14px, 1.5vw, 16px); text-decoration: none; transition: 0.2s; display: flex; align-items: center; gap: 8px; position: relative; }
        .nav-link i { font-size: 14px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }

        .mobile-menu-btn { display: none; background: #f8faff; border: 1px solid #eef2f7; font-size: 20px; color: var(--primary); cursor: pointer; width: 42px; height: 42px; border-radius: 12px; transition: 0.3s; }
        .mobile-menu-btn:hover { background: #eef2f7; }
        
        .mobile-dropdown { display: none; flex-direction: column; background: white; position: absolute; top: 100%; left: 0; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-top: 1px solid #f1f5f9; z-index: 999; }
        .mobile-dropdown.active { display: flex; animation: slideDown 0.3s ease-out; }
        .mobile-dropdown a { padding: 16px 25px; text-decoration: none; color: var(--text-main); font-family: 'Kanit'; font-weight: 500; border-bottom: 1px solid #f8faff; display: flex; align-items: center; gap: 12px; font-size: 15px; transition: 0.2s; }
        .mobile-dropdown a:hover { background: #f0f4ff; color: var(--primary); padding-left: 30px; }

        .header-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); box-shadow: 0 15px 30px rgba(0, 0, 139, 0.1); }
        
        /* 🌟 Mission Card (เพิ่มแถบสีด้านบน) 🌟 */
        .mission-card { background: white; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #edf2f7; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; border-top-width: 4px; }
        .mission-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,139,0.08); }
        .mission-icon-box { width: 50px; height: 50px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 15px; flex-shrink: 0; }
        .mission-title { font-family: 'Kanit'; font-weight: 700; font-size: 18px; color: var(--text-main); margin-bottom: 5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* FAB */
        .fab-add { position: fixed; bottom: 40px; right: 40px; width: 65px; height: 65px; background: var(--accent); color: white; border-radius: 50%; border:none; font-size: 28px; cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4); transition: 0.3s; }
        .fab-add:hover { transform: translateY(-5px) scale(1.05); box-shadow: 0 15px 35px rgba(255, 140, 0, 0.5); }

        /* Custom Alert */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 5000; display: none; justify-content: center; align-items: center; padding: 15px; transition: opacity 0.3s; opacity: 0; }
        .custom-modal-box { background: white; padding: clamp(25px, 5vw, 35px) clamp(20px, 5vw, 30px); border-radius: 25px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.15); transform: scale(0.95); transition: transform 0.3s; }

        .footer { padding: 25px 20px; font-size: 13px; color: #a4b0be; text-align: center; margin-top: auto; font-family: 'Sarabun', sans-serif; line-height: 1.6; border-top: 1px solid rgba(0,0,0,0.05); background: white; }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .spinner { border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(20px) scale(0.9); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0) scale(1); } }

        /* 🌟 ปรับแต่ง Select Dropdown ใน Header 🌟 */
        select option { color: #333; background: #fff; }

        @media (max-width: 992px) {
            .nav-center { display: none; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
        }
        @media (max-width: 768px) {
            #mainNav { padding: 0 15px; height: 75px; }
            .fab-add { bottom: 25px; right: 25px; width: 55px; height: 55px; font-size: 24px; }
            .mission-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-family: 'Kanit'; color: var(--primary); font-weight: 600;" id="loadingText">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- 🌟 Navbar 🌟 -->
    <nav id="mainNav">
        <a href="index.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div class="nav-text-group">
                <div class="nav-brand">Flip<span>School</span></div>
                <div class="nav-slogan slogan">...</div>
            </div>
        </a>
        
        <div class="nav-center">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="mission-library.html" class="nav-link text-[var(--primary)] font-bold"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
            <a href="#" class="nav-link" onclick="openGloryModal()"><i class="fas fa-star"></i> นวัตกรรม</a>
        </div>

        <div class="nav-right">
            <button onclick="handleLogout()" class="hidden md:flex items-center gap-2 bg-rose-50 text-rose-600 hover:bg-rose-600 hover:text-white px-4 py-2 rounded-xl font-bold font-['Kanit'] transition-colors border-none cursor-pointer text-sm">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </button>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        </div>

        <div id="mobileMenu" class="mobile-dropdown">
            <a href="dashboard.html"><i class="fas fa-th-large"></i> แดชบอร์ดหลัก</a>
            <a href="index.html"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt text-rose-500"></i> ออกจากระบบ</a>
        </div>
    </nav>

    <!-- Header Section (เพิ่มตัวกรองและเรียงลำดับ) -->
    <header class="header-gradient text-white py-8 px-5 md:px-12 relative overflow-hidden rounded-b-[1.5rem] md:rounded-b-[2rem] shadow-sm mb-8">
        <div class="container mx-auto max-w-[1200px] relative z-10 flex flex-col lg:flex-row justify-between lg:items-end gap-5">
            <div class="flex-1">
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight font-['Kanit'] leading-snug flex items-center flex-wrap gap-3">
                    คลังภารกิจการเรียนรู้
                    <span id="syncIndicator" class="opacity-0 transition-opacity text-xs md:text-sm font-normal text-white/80 bg-white/10 px-3 py-1 rounded-full border border-white/20 font-sans">
                        <i class="fas fa-sync-alt animate-spin mr-1"></i> ซิงค์ข้อมูล...
                    </span>
                </h1>
                <p class="text-blue-100 font-medium text-sm md:text-lg mt-2 font-sans opacity-90">จัดการเนื้อหาและข้อสอบทั้งหมดของคุณ (Missions Library)</p>
            </div>
            
            <div class="w-full lg:w-auto mt-2 lg:mt-0 flex flex-col sm:flex-row gap-2">
                <div class="relative w-full sm:w-auto flex-1 sm:flex-none">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-white/50"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาชื่อ, หมวดหมู่..." oninput="applyFilters()" class="w-full sm:w-[220px] bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl pl-11 pr-4 py-3 outline-none focus:bg-white/20 transition-all font-sans text-sm">
                </div>
                <div class="flex gap-2 w-full sm:w-auto">
                    <div class="relative flex-1 sm:flex-none">
                        <select id="filterType" onchange="applyFilters()" class="w-full sm:w-[130px] bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 outline-none focus:bg-white/20 transition-all font-sans text-sm appearance-none cursor-pointer">
                            <option value="all">ทุกประเภท</option>
                            <option value="quiz">ควิซปรนัย</option>
                            <option value="match">จับคู่</option>
                            <option value="ai_generated">AI สร้าง</option>
                            <option value="competition">แข่งขัน</option>
                            <option value="html_custom">Custom HTML</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-white/50 pointer-events-none text-xs"></i>
                    </div>
                    <div class="relative flex-1 sm:flex-none">
                        <select id="sortOrder" onchange="applyFilters()" class="w-full sm:w-[130px] bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 outline-none focus:bg-white/20 transition-all font-sans text-sm appearance-none cursor-pointer">
                            <option value="newest">สร้างล่าสุด</option>
                            <option value="oldest">เก่าสุด</option>
                            <option value="points_desc">คะแนนมากไปน้อย</option>
                            <option value="name_asc">ชื่อ (ก-ฮ)</option>
                        </select>
                        <i class="fas fa-chevron-down absolute right-3 top-1/2 transform -translate-y-1/2 text-white/50 pointer-events-none text-xs"></i>
                    </div>
                </div>
            </div>
        </div>
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 md:px-6 pb-12 max-w-[1200px] relative">
        <div id="missionGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
    </main>

    <button onclick="window.location.href='mission-create.html'" class="fab-add" title="สร้างภารกิจใหม่">
        <i class="fas fa-plus"></i>
    </button>

    <!-- Custom Alert Modal -->
    <div id="customAlertModal" class="custom-modal-overlay" style="display: none; opacity: 0; transition: opacity 0.3s;">
        <div class="custom-modal-box text-center" id="customAlertBox">
            <div class="text-[50px] mb-4"><i id="customAlertIcon" class="fas fa-info-circle text-[var(--primary)]"></i></div>
            <h3 id="customAlertTitle" class="text-xl font-bold font-['Kanit'] text-slate-800 mb-2">แจ้งเตือน</h3>
            <p id="customAlertMessage" class="text-slate-600 mb-6 font-sans text-sm"></p>
            <div style="display: flex; justify-content: center; gap: 10px;">
                <button id="customAlertOkBtn" onclick="closeCustomAlert()" class="bg-[var(--primary)] hover:bg-[var(--primary-light)] text-white px-10 py-3 rounded-full font-['Kanit'] font-semibold transition-all border-none cursor-pointer shadow-md">ตกลง</button>
                <button id="customAlertCancelBtn" onclick="closeCustomAlert(true)" class="hidden bg-slate-100 hover:bg-slate-200 text-slate-700 px-10 py-3 rounded-full font-['Kanit'] font-semibold transition-all border-none cursor-pointer shadow-md">ยกเลิก</button>
            </div>
        </div>
    </div>

    <footer class="footer footer-display-text"></footer>

    <script>
        let currentUserId = null;
        let allMissions = [];

        // UI Helpers
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 20) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });
        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('active'); }

        let alertCallback = null;
        let alertCancelCallback = null;
        function showCustomAlert(msg, type='info', callback=null, cancelCallback=null) {
            document.getElementById('customAlertMessage').innerHTML = msg;
            const icon = document.getElementById('customAlertIcon');
            const cancelBtn = document.getElementById('customAlertCancelBtn');
            const okBtn = document.getElementById('customAlertOkBtn');
            
            alertCallback = callback;
            alertCancelCallback = cancelCallback;

            if(type === 'success') { icon.className = 'fas fa-check-circle text-emerald-500'; cancelBtn.classList.add('hidden'); okBtn.style.background = '#10b981'; }
            else if(type === 'warning') { icon.className = 'fas fa-exclamation-triangle text-amber-500'; cancelBtn.classList.add('hidden'); okBtn.style.background = '#f59e0b'; }
            else if(type === 'confirm') { icon.className = 'fas fa-question-circle text-rose-500'; cancelBtn.classList.remove('hidden'); okBtn.style.background = '#ff4757'; }
            else if(type === 'error') { icon.className = 'fas fa-times-circle text-rose-500'; cancelBtn.classList.add('hidden'); okBtn.style.background = '#ef4444'; }
            else { icon.className = 'fas fa-info-circle text-[var(--primary)]'; cancelBtn.classList.add('hidden'); okBtn.style.background = 'var(--primary)'; }
            
            const modal = document.getElementById('customAlertModal');
            const box = document.getElementById('customAlertBox');
            modal.style.display = 'flex';
            setTimeout(() => { modal.style.opacity = '1'; box.classList.remove('scale-95'); box.classList.add('scale-100'); okBtn.focus(); }, 10);
        }
        
        function closeCustomAlert(isCancel = false) { 
            const modal = document.getElementById('customAlertModal');
            const box = document.getElementById('customAlertBox');
            modal.style.opacity = '0';
            box.classList.remove('scale-100'); box.classList.add('scale-95');
            setTimeout(() => { 
                modal.style.display = 'none'; 
                if (isCancel && alertCancelCallback) { alertCancelCallback(); }
                else if (!isCancel && alertCallback) { alertCallback(); }
                alertCallback = null; alertCancelCallback = null;
            }, 300);
        }

        function getDB() {
            if (typeof window !== 'undefined' && window.sysDB && window.sysDB.auth) return window.sysDB;
            throw new Error("ไม่สามารถเชื่อมต่อฐานข้อมูลได้");
        }

        // ================= 🌟 ฟังก์ชันแยกสีตามประเภทภารกิจ 🌟 =================
        function getThemeForType(type) {
            switch(type) {
                case 'quiz':         return { topColor: '#f43f5e', iconBg: 'bg-rose-50', iconColor: 'text-rose-500' };
                case 'match':        return { topColor: '#10b981', iconBg: 'bg-emerald-50', iconColor: 'text-emerald-500' };
                case 'ai_generated': return { topColor: '#8b5cf6', iconBg: 'bg-purple-50', iconColor: 'text-purple-500' };
                case 'competition':  return { topColor: '#f59e0b', iconBg: 'bg-amber-50', iconColor: 'text-amber-500' };
                case 'html_custom':  return { topColor: '#64748b', iconBg: 'bg-slate-100', iconColor: 'text-slate-500' };
                default:             return { topColor: 'var(--primary-light)', iconBg: 'bg-blue-50', iconColor: 'text-blue-500' };
            }
        }

        function getIconForType(type) {
            return { quiz:'fas fa-tasks', ai_generated:'fas fa-robot', html_custom:'fas fa-code', match:'fas fa-clone', competition:'fas fa-trophy' }[type] || 'fas fa-star';
        }
        function getLabelForType(type) {
            return { quiz:'ควิซปรนัย', ai_generated:'สร้างด้วย AI', html_custom:'Custom HTML', match:'จับคู่', competition:'แข่งขัน' }[type] || 'ทั่วไป';
        }

        // ================= 🌟 SWR Initialization 🌟 =================
        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof initAppUI === 'function') initAppUI();

            try {
                const db = getDB();
                const { data: { session } } = await db.auth.getSession();
                
                if (!session) return window.location.replace('login.html');
                currentUserId = session.user.id;

                // 1. อ่านแคชมาแสดงก่อนทันที (SWR)
                const cacheKey = `flip_cache_missions_lib_${currentUserId}`;
                const cacheData = localStorage.getItem(cacheKey);
                if (cacheData) {
                    allMissions = JSON.parse(cacheData);
                    applyFilters(); // แสดงข้อมูลผ่านระบบฟิลเตอร์ทันที
                    document.getElementById('loadingOverlay').style.display = 'none';
                }

                // 2. ดึงข้อมูลจริงเบื้องหลังแบบเงียบๆ
                const syncInd = document.getElementById('syncIndicator');
                if (syncInd) { syncInd.classList.remove('opacity-0'); syncInd.classList.add('opacity-100'); }

                await fetchFreshMissions(db, cacheKey);

            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
                showCustomAlert("เกิดข้อผิดพลาด: " + err.message, "error");
            }
        });

        async function fetchFreshMissions(db, cacheKey) {
            try {
                const { data, error } = await db.from('missions')
                    .select('*')
                    .eq('created_by', currentUserId)
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                const freshMissions = data || [];
                const freshString = JSON.stringify(freshMissions);

                if (localStorage.getItem(cacheKey) !== freshString) {
                    localStorage.setItem(cacheKey, freshString);
                    allMissions = freshMissions;
                    applyFilters(); // นำข้อมูลใหม่มาเข้าสู่กระบวนการกรองและแสดงผล
                }

            } catch (err) {
                console.error("Fetch Error:", err);
            } finally {
                const loader = document.getElementById('loadingOverlay');
                if (loader.style.display !== 'none') {
                    loader.style.opacity = '0';
                    setTimeout(() => loader.style.display = 'none', 500);
                }
                const syncInd = document.getElementById('syncIndicator');
                if(syncInd) { syncInd.classList.remove('opacity-100'); syncInd.classList.add('opacity-0'); }
            }
        }

        // ================= 🌟 ฟังก์ชัน Filter & Sort 🌟 =================
        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const typeFilter = document.getElementById('filterType').value;
            const sortOrder = document.getElementById('sortOrder').value;

            // 1. กรองข้อมูล (Filter)
            let filtered = allMissions.filter(m => {
                const matchQuery = m.title.toLowerCase().includes(query) || (m.subject_group && m.subject_group.toLowerCase().includes(query));
                const matchType = typeFilter === 'all' || m.mission_type === typeFilter;
                return matchQuery && matchType;
            });

            // 2. เรียงลำดับ (Sort)
            filtered.sort((a, b) => {
                if (sortOrder === 'newest') return new Date(b.created_at) - new Date(a.created_at);
                if (sortOrder === 'oldest') return new Date(a.created_at) - new Date(b.created_at);
                if (sortOrder === 'points_desc') return (b.reward_points || 0) - (a.reward_points || 0);
                if (sortOrder === 'name_asc') return a.title.localeCompare(b.title, 'th');
                return 0;
            });

            renderMissions(filtered);
        }

        function renderMissions(missionsToRender) {
            const container = document.getElementById('missionGrid');
            if (missionsToRender.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400 bg-white rounded-[2rem] border-2 border-dashed border-slate-200">
                        <i class="fas fa-box-open text-6xl text-slate-200 mb-4"></i>
                        <h3 class="text-xl font-bold font-['Kanit'] text-slate-500">ไม่พบภารกิจที่ค้นหา</h3>
                        <p class="text-sm mt-1">ลองเปลี่ยนคำค้นหา หรือกดปุ่ม + เพื่อสร้างภารกิจใหม่</p>
                    </div>`;
                return;
            }

            container.innerHTML = missionsToRender.map((m, index) => {
                const theme = getThemeForType(m.mission_type);
                const dateStr = new Date(m.created_at).toLocaleDateString('th-TH', { year: 'numeric', month: 'short', day: 'numeric' });
                const viewCount = m.view_count || m.play_count || 0;

                return `
                <div class="mission-card animate-pop-in" style="animation-delay: ${index * 0.05}s; border-top-color: ${theme.topColor};">
                    <div class="flex justify-between items-start mb-3">
                        <div class="mission-icon-box ${theme.iconBg} ${theme.iconColor}"><i class="${getIconForType(m.mission_type)}"></i></div>
                        <div class="flex flex-col items-end">
                            <span class="bg-amber-50 text-amber-600 text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1 mb-1" title="คะแนนรางวัล"><i class="fas fa-star"></i> ${m.reward_points || 10}</span>
                            <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1" title="ยอดวิว/จำนวนผู้เข้าเล่น"><i class="fas fa-eye"></i> ${viewCount}</span>
                        </div>
                    </div>
                    
                    <h3 class="mission-title" title="${m.title}">${m.title}</h3>
                    <p class="text-xs text-slate-500 mb-2"><i class="fas fa-tag mr-1 opacity-70"></i> ${m.subject_group || 'ทั่วไป'} | ${getLabelForType(m.mission_type)}</p>
                    <p class="text-[10px] text-slate-400 mb-4 flex-grow"><i class="far fa-clock mr-1"></i> สร้างเมื่อ: ${dateStr}</p>
                    
                    <div class="flex gap-2 mt-auto border-t border-slate-100 pt-4">
                        <button onclick="window.location.href='play-mission.html?mid=${m.mission_id}'" class="flex-1 bg-slate-50 hover:bg-[var(--primary)] text-[var(--primary)] hover:text-white font-bold py-2 rounded-xl transition text-xs border-none cursor-pointer flex justify-center items-center gap-1.5" title="ทดลองเล่น"><i class="fas fa-play"></i> เล่น</button>
                        <button onclick="quickShare('${m.mission_id}')" class="bg-indigo-50 hover:bg-indigo-500 text-indigo-500 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer shrink-0" title="แชร์ให้ผู้เล่นทั่วไป (Guest)"><i class="fas fa-share-alt"></i></button>
                        <button onclick="window.location.href='mission-create.html?mid=${m.mission_id}'" class="bg-amber-50 hover:bg-amber-500 text-amber-500 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer shrink-0" title="แก้ไขภารกิจ"><i class="fas fa-edit"></i></button>
                        <button onclick="deleteMission('${m.mission_id}', '${m.title.replace(/'/g, "\\'")}')" class="bg-rose-50 hover:bg-rose-500 text-rose-500 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer shrink-0" title="ลบภารกิจ"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `}).join('');
        }

        // ================= 🌟 ฟังก์ชันแชร์ภารกิจด่วน 🌟 =================
        function quickShare(mid) {
            const baseUrl = window.location.origin + window.location.pathname.replace('mission-library.html', 'play-mission.html');
            const shareUrl = `${baseUrl}?mid=${mid}&mode=guest`;
            
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(shareUrl).then(() => {
                    showCustomAlert("คัดลอกลิงก์สำหรับ <b>แชร์ด่วน</b> แล้ว!<br><span class='text-xs text-slate-500 block mt-2'>*นักเรียนสามารถคลิกลิงก์เพื่อเข้าเล่นทดสอบความรู้ได้ทันที โดยไม่ต้องล็อกอินเข้าสู่ระบบครับ</span>", "success");
                }).catch(() => fallbackCopy(shareUrl));
            } else {
                fallbackCopy(shareUrl);
            }
        }
        
        function fallbackCopy(text) {
            const el = document.createElement('textarea'); el.value = text;
            document.body.appendChild(el); el.select(); document.execCommand('copy'); document.body.removeChild(el);
            showCustomAlert("คัดลอกลิงก์สำหรับ <b>แชร์ด่วน</b> แล้ว!<br><span class='text-xs text-slate-500 block mt-2'>*นักเรียนสามารถคลิกลิงก์เพื่อเข้าเล่นทดสอบความรู้ได้ทันที โดยไม่ต้องล็อกอินเข้าสู่ระบบครับ</span>", "success");
        }

        // ================= ลบภารกิจ =================
        function deleteMission(id, title) {
            showCustomAlert(`คุณต้องการลบภารกิจ <b>"${title}"</b> ออกจากคลังใช่หรือไม่?<br><span class="text-xs text-rose-500 mt-2 block">*หากลบแล้ว นักเรียนในห้องที่ถูกมอบหมายจะไม่สามารถเล่นได้อีกต่อไป</span>`, 'confirm', async () => {
                document.getElementById('loadingOverlay').style.display = 'flex';
                document.getElementById('loadingOverlay').style.opacity = '1';
                try {
                    const db = getDB();
                    const { error } = await db.from('missions').delete().eq('mission_id', id);
                    if (error) throw error;

                    // อัปเดต State และ Cache ทันที
                    allMissions = allMissions.filter(m => m.mission_id !== id);
                    localStorage.setItem(`flip_cache_missions_lib_${currentUserId}`, JSON.stringify(allMissions));
                    applyFilters();
                    
                    showCustomAlert("ลบภารกิจเรียบร้อยแล้ว", "success");
                } catch (e) {
                    showCustomAlert("เกิดข้อผิดพลาด ไม่สามารถลบได้", "error");
                } finally {
                    document.getElementById('loadingOverlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
                }
            });
        }

        async function handleLogout() {
            showCustomAlert('คุณต้องการออกจากระบบใช่หรือไม่?', 'confirm', async () => {
                const db = getDB();
                await db.auth.signOut();
                window.location.replace('login.html');
            });
        }
    </script>
</body>
</html>
