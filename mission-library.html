<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>คลังภารกิจ - FlipSchool</title>
    
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
        }

        body { 
            font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); color: var(--text-main);
            margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column;
            background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%),
                              radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%);
        }

        /* ================= 🌟 NAVBAR (มาตรฐานเดียวกับ Index/Dashboard) 🌟 ================= */
        #mainNav { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 clamp(15px, 5%, 50px); height: 90px; background: white; 
            position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; 
            border-bottom: 1px solid #f1f5f9; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); border-bottom-color: transparent; }
        
        .nav-left { display: flex; align-items: center; gap: clamp(10px, 2vw, 15px); text-decoration: none; cursor: pointer; transition: 0.3s; }
        .nav-logo-icon { 
            font-size: clamp(20px, 4vw, 28px); background: white; 
            width: clamp(40px, 5vw, 50px); height: clamp(40px, 5vw, 50px); 
            border-radius: clamp(10px, 2vw, 14px); border: 2.5px solid var(--primary); 
            display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,139,0.1); color: var(--text-main); transition: all 0.3s ease;
        }
        #mainNav.scrolled .nav-logo-icon { width: 40px; height: 40px; font-size: 20px; border-width: 2px; border-radius: 10px; }
        
        .nav-text-group { display: flex; flex-direction: column; justify-content: center; }
        .nav-brand { font-size: clamp(20px, 4vw, 26px); font-weight: 700; color: var(--primary); font-family: 'Kanit'; margin-bottom: -4px; transition: 0.3s;}
        .nav-brand span { color: var(--accent); }
        #mainNav.scrolled .nav-brand { font-size: 22px; }
        .nav-slogan { font-size: 13px; color: var(--text-muted); font-family: 'Sarabun'; transition: 0.3s; }
        #mainNav.scrolled .nav-slogan { font-size: 11px; opacity: 0; display: none; }
        
        .nav-center { display: flex; align-items: center; gap: clamp(15px, 2vw, 30px); }
        .nav-link { color: var(--text-muted); font-family: 'Kanit'; font-weight: 500; font-size: clamp(14px, 1.5vw, 16px); text-decoration: none; transition: 0.2s; display: flex; align-items: center; gap: 8px; position: relative; }
        .nav-link i { font-size: 14px; }
        .nav-link:hover { color: var(--primary); }
        .nav-link::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 0; height: 2px; background: var(--primary); transition: width 0.3s ease; }
        .nav-link:hover::after { width: 100%; }
        
        .nav-right { display: flex; align-items: center; gap: 15px; }

        .mobile-menu-btn { display: none; background: #f8faff; border: 1px solid #eef2f7; font-size: 20px; color: var(--primary); cursor: pointer; width: 42px; height: 42px; border-radius: 12px; transition: 0.3s; }
        .mobile-dropdown { display: none; flex-direction: column; background: white; position: absolute; top: 100%; left: 0; width: 100%; box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-top: 1px solid #f1f5f9; z-index: 999; }
        .mobile-dropdown.active { display: flex; animation: slideDown 0.3s ease-out; }
        .mobile-dropdown a { padding: 16px 25px; text-decoration: none; color: var(--text-main); font-family: 'Kanit'; font-weight: 500; border-bottom: 1px solid #f8faff; display: flex; align-items: center; gap: 12px; font-size: 15px; transition: 0.2s; }
        .mobile-dropdown a:hover { background: #f0f4ff; color: var(--primary); padding-left: 30px; }

        .header-gradient { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); box-shadow: 0 15px 30px rgba(0, 0, 139, 0.1); }
        
        /* ================= 🌟 Mission Card (แบบไม่มีรูปหน้าปก) 🌟 ================= */
        .mission-card { 
            background: white; border-radius: 24px; padding: 25px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); border: 1px solid #edf2f7; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; overflow: hidden; display: flex; flex-direction: column; height: 100%; border-top-width: 5px; 
        }
        .mission-card:hover { transform: translateY(-5px); box-shadow: 0 15px 35px rgba(0,0,139,0.08); }
        
        .mission-icon-box { 
            width: 50px; height: 50px; border-radius: 14px; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 24px; margin-bottom: 15px; flex-shrink: 0; 
        }
        .mission-title { font-family: 'Kanit'; font-weight: 700; font-size: 18px; color: var(--text-main); margin-bottom: 5px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        /* Pagination */
        .page-btn { min-width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 12px; background: white; border: 1px solid #e2e8f0; color: var(--text-muted); font-weight: 600; cursor: pointer; transition: 0.2s; }
        .page-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

        /* FAB */
        .fab-add { position: fixed; bottom: 40px; right: 40px; width: 65px; height: 65px; background: var(--accent); color: white; border-radius: 50%; border:none; font-size: 28px; cursor: pointer; z-index: 998; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(255, 140, 0, 0.4); transition: 0.3s; }
        .fab-add:hover { transform: translateY(-5px) scale(1.05); }

        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .spinner { border: 4px solid #f0f4ff; border-top: 4px solid var(--primary); border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite; margin-bottom: 12px; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideDown { from { transform: translateY(-10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; opacity: 0; transform: translateY(20px) scale(0.9); }
        @keyframes popIn { to { opacity: 1; transform: translateY(0) scale(1); } }

        @media (max-width: 992px) {
            .nav-center { display: none; }
            .mobile-menu-btn { display: flex; align-items: center; justify-content: center; }
        }
        @media (max-width: 768px) {
            #mainNav { padding: 0 15px; height: 75px; }
            .mission-card { padding: 20px; }
        }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-family: 'Kanit'; color: var(--primary); font-weight: 600;" id="loadingText">กำลังโหลดข้อมูล...</div>
    </div>

    <!-- 🌟 Navbar (ย่อขยายตามการเลื่อน) 🌟 -->
    <nav id="mainNav">
        <a href="index.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div class="nav-text-group">
                <div class="nav-brand">Flip<span>School</span></div>
                <div class="nav-slogan slogan">...</div>
            </div>
        </a>
        
        <div class="nav-center">
            <a href="index.html" class="nav-link"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="dashboard.html" class="nav-link"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="mission-library.html" class="nav-link font-bold text-[var(--primary)]"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
            <a href="#" class="nav-link" onclick="openGloryModal()"><i class="fas fa-star"></i> นวัตกรรม</a>
        </div>

        <div class="nav-right">
            <button id="btnLoginLogout" onclick="handleAuthAction()" class="bg-slate-50 text-slate-700 hover:bg-[var(--primary)] hover:text-white px-4 py-2 rounded-xl font-bold font-['Kanit'] transition-all border-none cursor-pointer text-sm shadow-sm">
                เข้าสู่ระบบ
            </button>
            <button class="mobile-menu-btn" onclick="toggleMobileMenu()"><i class="fas fa-bars"></i></button>
        </div>

        <div id="mobileMenu" class="mobile-dropdown">
            <a href="index.html"><i class="fas fa-home"></i> หน้าแรก</a>
            <a href="dashboard.html"><i class="fas fa-th-large"></i> แดชบอร์ด</a>
            <a href="mission-library.html"><i class="fas fa-th-list"></i> คลังภารกิจ</a>
            <a href="#" onclick="handleAuthAction()" id="btnMobileAuth" class="text-rose-500 font-bold">เข้าสู่ระบบ</a>
        </div>
    </nav>

    <!-- Header Section -->
    <header class="header-gradient text-white py-8 px-5 md:px-12 relative overflow-hidden rounded-b-[1.5rem] md:rounded-b-[2rem] shadow-sm mb-8">
        <div class="container mx-auto max-w-[1200px] relative z-10 flex flex-col lg:flex-row justify-between lg:items-end gap-6">
            <div class="flex-1">
                <h1 class="text-2xl md:text-4xl font-extrabold tracking-tight font-['Kanit'] leading-snug flex items-center flex-wrap gap-3">
                    คลังภารกิจการเรียนรู้
                    <span id="syncIndicator" class="opacity-0 transition-opacity text-xs font-normal text-white/70 bg-white/10 px-3 py-1 rounded-full border border-white/20">
                        <i class="fas fa-sync-alt animate-spin mr-1"></i> ซิงค์ข้อมูล...
                    </span>
                </h1>
                <p class="text-blue-100 font-medium text-sm md:text-lg mt-2 opacity-90">จัดการเนื้อหาและภารกิจทั้งหมดของคุณเพื่อมอบหมายให้ชั้นเรียน</p>
            </div>
            
            <div class="w-full lg:w-auto flex flex-col sm:flex-row gap-2">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-white/50"></i>
                    <input type="text" id="searchInput" placeholder="ค้นหาภารกิจ..." oninput="applyFilters(true)" class="w-full sm:w-[220px] bg-white/10 border border-white/20 text-white placeholder-white/50 rounded-xl pl-11 pr-4 py-3 outline-none focus:bg-white/20 transition-all text-sm font-sans">
                </div>
                <div class="flex gap-2">
                    <select id="filterSource" onchange="applyFilters(true)" class="bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 outline-none focus:bg-white/20 text-sm font-sans appearance-none cursor-pointer flex-1 sm:flex-none">
                        <option value="all">ภารกิจทั้งหมด</option>
                        <option value="mine">ภารกิจของฉัน</option>
                        <option value="public">ภารกิจสาธารณะ</option>
                    </select>
                    <select id="itemsPerPage" onchange="changeItemsPerPage(this.value)" class="bg-white/10 border border-white/20 text-white rounded-xl px-4 py-3 outline-none focus:bg-white/20 text-sm font-sans appearance-none cursor-pointer">
                        <option value="8">8/หน้า</option>
                        <option value="12" selected>12/หน้า</option>
                        <option value="24">24/หน้า</option>
                    </select>
                </div>
            </div>
        </div>
        <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full blur-3xl pointer-events-none"></div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow container mx-auto px-4 md:px-6 pb-12 max-w-[1200px] relative">
        <div id="missionGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
        <div id="paginationContainer" class="mt-12 flex items-center justify-center gap-2">
            <div id="pageNumbers" class="flex gap-1.5"></div>
        </div>
    </main>

    <button onclick="checkAuthAndCreate()" id="fabAdd" class="fab-add hidden" title="สร้างภารกิจใหม่"><i class="fas fa-plus"></i></button>

    <footer class="footer footer-display-text"></footer>

    <script>
        let currentUserId = null;
        let allMissions = [];
        let filteredMissions = [];
        let currentPage = 1;
        let itemsPerPage = 12;

        // Navbar Scroll Effect (ย่อขยาย)
        window.addEventListener('scroll', () => {
            const nav = document.getElementById('mainNav');
            if (window.scrollY > 20) nav.classList.add('scrolled');
            else nav.classList.remove('scrolled');
        });

        function toggleMobileMenu() { document.getElementById('mobileMenu').classList.toggle('active'); }

        function getDB() { return window.sysDB; }

        function getThemeForType(type) {
            const themes = {
                quiz: { topColor: '#f43f5e', iconBg: 'bg-rose-50', iconColor: 'text-rose-500' },
                match: { topColor: '#10b981', iconBg: 'bg-emerald-50', iconColor: 'text-emerald-500' },
                ai_generated: { topColor: '#8b5cf6', iconBg: 'bg-purple-50', iconColor: 'text-purple-500' },
                competition: { topColor: '#f59e0b', iconBg: 'bg-amber-50', iconColor: 'text-amber-500' }
            };
            return themes[type] || { topColor: 'var(--primary-light)', iconBg: 'bg-blue-50', iconColor: 'text-blue-500' };
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof initAppUI === 'function') initAppUI();

            try {
                const db = getDB();
                const { data: { session } } = await db.auth.getSession();
                
                if (session) {
                    currentUserId = session.user.id;
                    document.getElementById('btnLoginLogout').innerText = 'ออกจากระบบ';
                    document.getElementById('fabAdd').classList.remove('hidden');
                } else {
                    document.getElementById('filterSource').value = 'public';
                    document.getElementById('filterSource').disabled = true;
                }

                await fetchMissions(db);

            } catch (err) {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        });

        async function fetchMissions(db) {
            document.getElementById('syncIndicator').classList.remove('opacity-0');
            try {
                let query = db.from('missions').select('*');
                if (currentUserId) query = query.or(`is_public.eq.true,created_by.eq.${currentUserId}`);
                else query = query.eq('is_public', true);
                
                const { data, error } = await query.order('created_at', { ascending: false });
                if (!error) {
                    allMissions = data || [];
                    applyFilters();
                }
            } finally {
                document.getElementById('syncIndicator').classList.add('opacity-0');
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function applyFilters(reset = false) {
            if (reset) currentPage = 1;
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const source = document.getElementById('filterSource').value;
            filteredMissions = allMissions.filter(m => {
                const matchQuery = m.title.toLowerCase().includes(query) || (m.subject_group && m.subject_group.toLowerCase().includes(query));
                let matchSource = true;
                if (source === 'mine') matchSource = (m.created_by === currentUserId);
                else if (source === 'public') matchSource = (m.is_public === true && m.created_by !== currentUserId);
                return matchQuery && matchSource;
            });
            renderMissions();
            renderPagination();
        }

        function renderMissions() {
            const container = document.getElementById('missionGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const pageData = filteredMissions.slice(start, start + itemsPerPage);
            
            if (pageData.length === 0) {
                container.innerHTML = `<div class="col-span-full py-24 text-center opacity-40 bg-white rounded-3xl border-2 border-dashed border-slate-200"><i class="fas fa-box-open text-5xl mb-4"></i><p class="font-bold">ไม่พบข้อมูลภารกิจ</p></div>`;
                return;
            }

            container.innerHTML = pageData.map((m, index) => {
                const theme = getThemeForType(m.mission_type);
                const isMine = m.created_by === currentUserId;
                const viewCount = m.view_count || 0;
                const labels = { quiz:'ควิซปรนัย', match:'จับคู่', ai_generated:'AI สร้าง', competition:'แข่งขัน' };
                const icons = { quiz:'fas fa-tasks', match:'fas fa-clone', ai_generated:'fas fa-robot', competition:'fas fa-trophy' };
                const playUrl = currentUserId ? `play-mission.html?mid=${m.mission_id}` : `play-mission.html?mid=${m.mission_id}&mode=guest`;

                return `
                <div class="mission-card animate-pop-in" style="animation-delay: ${index * 0.05}s; border-top-color: ${theme.topColor};">
                    <div class="flex justify-between items-start mb-3">
                        <div class="mission-icon-box ${theme.iconBg} ${theme.iconColor}"><i class="${icons[m.mission_type] || 'fas fa-star'}"></i></div>
                        <div class="flex flex-col items-end gap-1">
                            <span class="bg-amber-50 text-amber-600 text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1 shadow-sm"><i class="fas fa-star"></i> ${m.reward_points || 10}</span>
                            <span class="text-slate-400 text-[10px] font-bold px-2 py-1 rounded-md flex items-center gap-1"><i class="fas fa-eye"></i> ${viewCount}</span>
                        </div>
                    </div>
                    <h3 class="mission-title" title="${m.title}">${m.title}</h3>
                    <p class="text-xs text-slate-500 mb-4 flex-grow"><i class="fas fa-tag mr-1 opacity-70"></i> ${m.subject_group || 'ทั่วไป'} | ${labels[m.mission_type] || 'ทั่วไป'}</p>
                    
                    <div class="flex gap-2 mt-auto border-t border-slate-100 pt-4">
                        <button onclick="location.href='${playUrl}'" class="flex-1 bg-slate-50 hover:bg-[var(--primary)] text-[var(--primary)] hover:text-white font-bold py-2 rounded-xl transition text-xs border-none cursor-pointer flex justify-center items-center gap-1.5">
                            <i class="fas fa-play"></i> ${currentUserId ? 'ทดลองเล่น' : 'เล่นโหมด Guest'}
                        </button>
                        ${isMine ? `
                            <button onclick="location.href='mission-create.html?mid=${m.mission_id}'" class="bg-amber-50 hover:bg-amber-500 text-amber-600 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer" title="แก้ไข"><i class="fas fa-edit"></i></button>
                            <button onclick="deleteMission('${m.mission_id}', '${m.title.replace(/'/g, "\\'")}')" class="bg-rose-50 hover:bg-rose-500 text-rose-500 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer" title="ลบ"><i class="fas fa-trash-alt"></i></button>
                        ` : `
                            <button onclick="quickShare('${m.mission_id}')" class="bg-indigo-50 hover:bg-indigo-500 text-indigo-600 hover:text-white w-9 h-9 rounded-xl flex items-center justify-center transition border-none cursor-pointer" title="แชร์ด่วน"><i class="fas fa-share-alt"></i></button>
                        `}
                    </div>
                </div>`;
            }).join('');
        }

        function renderPagination() {
            const container = document.getElementById('pageNumbers');
            const totalPages = Math.ceil(filteredMissions.length / itemsPerPage);
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html = '';
            for(let i=1; i<=totalPages; i++) {
                html += `<button onclick="changePage(${i})" class="page-btn ${currentPage === i ? 'active' : ''}">${i}</button>`;
            }
            container.innerHTML = html;
        }

        function changePage(p) { currentPage = p; renderMissions(); renderPagination(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
        function changeItemsPerPage(val) { itemsPerPage = parseInt(val); currentPage = 1; renderMissions(); renderPagination(); }

        async function handleAuthAction() {
            if (currentUserId) {
                await window.sysDB.auth.signOut();
                location.reload();
            } else {
                location.href = 'login.html';
            }
        }
        function checkAuthAndCreate() { location.href = 'mission-create.html'; }
    </script>
</body>
</html>
