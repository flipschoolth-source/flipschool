<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>คลังสื่อการสอน | FlipSchool</title>

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        
        .mission-card {
            transition: all 0.3s ease;
            background: white; border: 1px solid #e2e8f0;
            border-radius: 1.5rem; overflow: hidden;
            display: flex; flex-direction: column;
            position: relative;
        }
        .mission-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-color: #3b82f6;
        }
        
        .tag-badge { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 99px; }
        .tag-subject { background: #eff6ff; color: #1d4ed8; }
        .tag-grade { background: #f0fdf4; color: #15803d; }
        
        .modal-overlay { background-color: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); }
        .hidden-el { display: none !important; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <div id="importModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-md p-6 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold text-blue-900"><i class="fas fa-school"></i> เลือกห้องเรียน</h3>
                <button onclick="closeImportModal()" class="text-slate-400 hover:text-slate-600"><i class="fas fa-times"></i></button>
            </div>
            <p class="text-sm text-slate-500 mb-4">เลือกห้องเรียนที่ต้องการนำภารกิจนี้ไปใช้:</p>
            
            <div id="classroomList" class="space-y-2 max-h-60 overflow-y-auto pr-2 mb-6">
                <p class="text-center text-slate-400 text-sm py-4">กำลังโหลดห้องเรียน...</p>
            </div>

            <button id="confirmImportBtn" onclick="executeImport()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg active:scale-95 text-sm disabled:bg-gray-300 disabled:cursor-not-allowed">
                ยืนยันการนำเข้า
            </button>
        </div>
    </div>

    <div id="msgBox" class="fixed top-20 right-5 z-[110] hidden bg-white border-l-4 border-green-500 shadow-lg rounded-xl p-4 animate-bounce-in">
        <p id="msgText" class="text-sm font-bold text-slate-700"></p>
    </div>

    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0 border-2 border-white/20">
                    <span class="text-2xl">🎓</span>
                </div>
                <div class="flex flex-col">
                    <div class="text-xl font-bold tracking-tight leading-none">
                        <span class="text-white">Flip</span><span class="text-[#FF8C00]">School</span>
                    </div>
                    <span class="text-[10px] text-blue-100 font-medium opacity-90">คลังสื่อการสอนสาธารณะ</span>
                </div>
            </div>
            <div class="flex gap-4">
                <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs transition-all flex items-center gap-2 border border-white/10 font-bold">
                    <i class="fas fa-arrow-left"></i> ย้อนกลับ
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow container mx-auto px-4 py-8">
        
        <div class="bg-white rounded-[2rem] p-6 shadow-sm border border-slate-200 mb-8">
            <h1 class="text-2xl font-bold text-blue-900 mb-6 flex items-center gap-2">
                <i class="fas fa-layer-group text-orange-500"></i> คลังภารกิจ (Mission Library)
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div class="md:col-span-2 relative">
                    <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="searchInput" onkeyup="filterMissions()" class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm font-bold" placeholder="ค้นหาชื่อภารกิจ, ภาษาไทย, คณิต...">
                </div>
                
                <div>
                    <select id="subjectFilter" onchange="filterMissions()" class="w-full py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-bold text-slate-600 cursor-pointer">
                        <option value="">ทุกกลุ่มสาระ</option>
                        <option value="ภาษาไทย">ภาษาไทย</option>
                        <option value="คณิตศาสตร์">คณิตศาสตร์</option>
                        <option value="วิทยาศาสตร์">วิทยาศาสตร์</option>
                        <option value="ภาษาต่างประเทศ">ภาษาต่างประเทศ</option>
                        <option value="สังคมศึกษา">สังคมศึกษา</option>
                        <option value="การงานอาชีพ">การงานอาชีพ</option>
                        <option value="ศิลปะ">ศิลปะ</option>
                        <option value="สุขศึกษา">สุขศึกษา</option>
                        <option value="อื่นๆ">อื่นๆ</option>
                    </select>
                </div>

                <div>
                    <select id="gradeFilter" onchange="filterMissions()" class="w-full py-3 px-4 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 text-sm font-bold text-slate-600 cursor-pointer">
                        <option value="">ทุกระดับชั้น</option>
                        <option value="อ.">อนุบาล (อ.)</option>
                        <option value="ป.">ประถมศึกษา (ป.)</option>
                        <option value="ม.">มัธยมศึกษา (ม.)</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="missionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-20">
                <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-slate-400 font-bold">กำลังโหลดคลังสื่อ...</p>
            </div>
        </div>

    </main>

    <footer class="bg-white border-t border-slate-200 py-8 mt-auto text-center font-sans">
        <p class="text-blue-900 font-bold text-sm italic">© 2026 FlipSchool Library</p>
    </footer>

    <script>
        let allMissions = [];
        let currentUserId = null;
        let selectedMissionIdForImport = null;

        document.addEventListener('DOMContentLoaded', async () => {
            const checkDB = setInterval(async () => {
                if(window.sysDB) {
                    clearInterval(checkDB);
                    
                    const { data: { user } } = await window.sysDB.auth.getUser();
                    if(user) currentUserId = user.id;

                    await fetchMissions();
                }
            }, 500);
        });

        // 1. ดึงข้อมูลภารกิจ (Select subject_group และ grade_level แทน subject_name)
        async function fetchMissions() {
            try {
                const { data, error } = await window.sysDB
                    .from('missions')
                    .select('*')
                    .eq('is_public', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allMissions = data || [];
                renderMissions(allMissions);
            } catch (err) {
                console.error(err);
                document.getElementById('missionGrid').innerHTML = `<div class="col-span-full text-center text-red-500 font-bold">โหลดข้อมูลล้มเหลว: ${err.message}</div>`;
            }
        }

        // 2. แสดงผลการ์ด
        function renderMissions(missions) {
            const grid = document.getElementById('missionGrid');
            grid.innerHTML = '';

            if (missions.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold text-lg"><i class="fas fa-inbox text-4xl mb-4 block"></i>ไม่พบภารกิจที่ค้นหา</div>`;
                return;
            }

            missions.forEach(m => {
                // ✅ ใช้ subject_group แทน subject_name
                const subject = m.subject_group || 'อื่นๆ';
                const grade = m.grade_level || 'ไม่ระบุ';
                const desc = m.description || 'ไม่มีคำอธิบาย';
                
                // ตรวจสอบไอคอนตามวิชา
                let icon = 'fas fa-cube';
                let colorClass = 'text-blue-500 bg-blue-50';
                if(subject.includes('ภาษาไทย')) { icon = 'fas fa-pen-nib'; colorClass = 'text-pink-500 bg-pink-50'; }
                else if(subject.includes('คณิต')) { icon = 'fas fa-calculator'; colorClass = 'text-orange-500 bg-orange-50'; }
                else if(subject.includes('วิทย์') || subject.includes('เทคโนโลยี')) { icon = 'fas fa-flask'; colorClass = 'text-purple-500 bg-purple-50'; }
                else if(subject.includes('อังกฤษ') || subject.includes('ภาษาต่างประเทศ')) { icon = 'fas fa-language'; colorClass = 'text-teal-500 bg-teal-50'; }
                else if(subject.includes('สังคม')) { icon = 'fas fa-globe-asia'; colorClass = 'text-indigo-500 bg-indigo-50'; }

                const card = document.createElement('div');
                card.className = 'mission-card group';
                card.innerHTML = `
                    <div class="p-6 flex flex-col h-full">
                        <div class="flex justify-between items-start mb-4">
                            <div class="w-12 h-12 rounded-xl ${colorClass} flex items-center justify-center text-xl shadow-sm">
                                <i class="${icon}"></i>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <span class="tag-badge tag-subject">${subject}</span>
                                <span class="tag-badge tag-grade">${grade}</span>
                            </div>
                        </div>
                        
                        <h3 class="text-lg font-bold text-slate-800 mb-2 line-clamp-1 group-hover:text-blue-600 transition-colors">${m.title}</h3>
                        <p class="text-xs text-slate-500 mb-6 line-clamp-2 flex-grow">${desc}</p>
                        
                        <div class="flex gap-2 mt-auto pt-4 border-t border-slate-100">
                            <a href="play-mission.html?mid=${m.mission_id}" target="_blank" class="flex-1 bg-orange-50 hover:bg-orange-100 text-orange-600 py-2.5 rounded-lg text-xs font-bold text-center transition-colors flex items-center justify-center gap-1">
                                <i class="fas fa-play"></i> ทดลองเล่น
                            </a>
                            
                            ${currentUserId ? `
                            <button onclick="openImportModal('${m.mission_id}')" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded-lg text-xs font-bold transition-all shadow-md active:scale-95 flex items-center justify-center gap-1">
                                <i class="fas fa-download"></i> นำเข้า
                            </button>
                            ` : ''}
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 3. ระบบ Filter (แก้ให้ค้นหาจาก subject_group)
        function filterMissions() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const subject = document.getElementById('subjectFilter').value;
            const grade = document.getElementById('gradeFilter').value;

            const filtered = allMissions.filter(m => {
                const matchQuery = m.title.toLowerCase().includes(query) || 
                                   (m.subject_group && m.subject_group.toLowerCase().includes(query)); // ✅ ค้นหาจาก subject_group
                
                const matchSubject = subject === '' || m.subject_group === subject; // ✅ กรองจาก subject_group
                const matchGrade = grade === '' || (m.grade_level && m.grade_level.includes(grade));

                return matchQuery && matchSubject && matchGrade;
            });

            renderMissions(filtered);
        }

        async function openImportModal(mid) {
            selectedMissionIdForImport = mid;
            const modal = document.getElementById('importModal');
            const list = document.getElementById('classroomList');
            const btn = document.getElementById('confirmImportBtn');
            
            modal.classList.remove('hidden');
            list.innerHTML = '<p class="text-center text-slate-400 py-4"><i class="fas fa-spinner fa-spin"></i> กำลังโหลดห้องเรียน...</p>';
            btn.disabled = true;

            try {
                // ดึงรายชื่อห้องเรียนของครู (จากตาราง classrooms ยังคงมี subject_name ได้อยู่ตาม Schema)
                const { data: classrooms } = await window.sysDB
                    .from('classrooms')
                    .select('classroom_id, room_name, subject_name')
                    .eq('teacher_id', currentUserId)
                    .order('created_at', { ascending: false });

                if (!classrooms || classrooms.length === 0) {
                    list.innerHTML = '<p class="text-center text-red-400 py-4 text-sm font-bold">ไม่พบห้องเรียนของคุณ กรุณาสร้างห้องเรียนก่อนครับ</p>';
                    return;
                }

                list.innerHTML = classrooms.map(c => `
                    <label class="flex items-center p-3 border border-slate-100 rounded-xl hover:bg-blue-50 cursor-pointer transition-colors">
                        <input type="radio" name="targetClassroom" value="${c.classroom_id}" class="w-4 h-4 text-blue-600 focus:ring-blue-500 border-gray-300" onchange="document.getElementById('confirmImportBtn').disabled = false">
                        <div class="ml-3">
                            <p class="text-sm font-bold text-slate-700">${c.subject_name}</p>
                            <p class="text-xs text-slate-500">${c.room_name}</p>
                        </div>
                    </label>
                `).join('');

            } catch (err) {
                list.innerHTML = '<p class="text-center text-red-500">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
            }
        }

        function closeImportModal() {
            document.getElementById('importModal').classList.add('hidden');
            selectedMissionIdForImport = null;
        }

        async function executeImport() {
            const radios = document.getElementsByName('targetClassroom');
            let selectedClassId = null;
            for (const r of radios) { if (r.checked) selectedClassId = r.value; }

            if (!selectedClassId || !selectedMissionIdForImport) return;

            const btn = document.getElementById('confirmImportBtn');
            btn.innerText = "กำลังนำเข้า...";
            btn.disabled = true;

            try {
                const { data: sourceMission } = await window.sysDB
                    .from('missions')
                    .select('*')
                    .eq('mission_id', selectedMissionIdForImport)
                    .single();

                if (!sourceMission) throw new Error("ไม่พบข้อมูลต้นฉบับ");

                const newMissionData = {
                    ...sourceMission,
                    mission_id: undefined,
                    created_by: currentUserId,
                    created_at: new Date().toISOString(),
                    updated_at: new Date().toISOString(),
                    is_public: false,
                    origin_mission_id: selectedMissionIdForImport
                };
                delete newMissionData.mission_id;

                const { data: newMission, error: insertError } = await window.sysDB
                    .from('missions')
                    .insert([newMissionData])
                    .select()
                    .single();

                if (insertError) throw insertError;

                await window.sysDB.from('classroom_missions').insert([{
                    classroom_id: selectedClassId,
                    mission_id: newMission.mission_id,
                    assigned_at: new Date().toISOString()
                }]);

                showMessage("✅ นำเข้าภารกิจสำเร็จ! ไปยังห้องเรียนได้เลย");
                setTimeout(() => {
                    window.location.href = `classroom-detail.html?id=${selectedClassId}`;
                }, 1500);

            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
                btn.innerText = "ยืนยันการนำเข้า";
                btn.disabled = false;
            }
        }

        function showMessage(text) {
            document.getElementById('msgText').innerText = text;
            document.getElementById('msgBox').classList.remove('hidden');
            setTimeout(() => document.getElementById('msgBox').classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
