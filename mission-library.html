<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คลังภารกิจอัจฉริยะ | FlipSchool</title>
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&family=Kanit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f1f5f9; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .category-card { transition: all 0.2s ease; cursor: pointer; border: 2px solid transparent; }
        .category-card.active { border-color: #3b82f6; background-color: #eff6ff; }
        .category-card.active .icon-cat { color: #3b82f6; }
        .mission-item-card { transition: all 0.3s ease; }
        .mission-item-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="nav-gradient text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-inner shrink-0">
                    <span class="text-blue-900 text-2xl">🎓</span>
                </div>
                <div class="flex flex-col">
                    <div class="text-xl md:text-2xl font-bold tracking-tight leading-none">
                        <span class="text-white">Flip</span><span class="text-orange-400">School</span>
                    </div>
                    <span id="app-slogan-display" class="text-[10px] md:text-xs text-blue-200 font-medium mt-0.5 tracking-wide">...</span>
                </div>
            </div>
            <button onclick="history.back()" class="bg-white/10 hover:bg-white/20 px-4 py-1.5 rounded-lg text-xs transition-all flex items-center gap-2 border border-white/10">
                <i class="fas fa-arrow-left"></i> ย้อนกลับ
            </button>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <!-- Search & Filter Header -->
        <section class="mb-10">
            <h1 class="text-3xl font-bold text-blue-900 mb-2 font-sans">คลังภารกิจอัจฉริยะ</h1>
            <p class="text-slate-500 mb-6">ค้นหาและเลือกภารกิจที่เหมาะสมกับบทเรียนของคุณครูจากคลังสื่อทั่วประเทศ</p>
            
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-grow">
                    <i class="fas fa-search absolute left-4 top-4 text-slate-400"></i>
                    <input type="text" id="searchInput" oninput="filterMissions()" class="w-full bg-white border border-slate-200 rounded-2xl p-3.5 pl-12 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm font-medium" placeholder="ค้นหาชื่อภารกิจ รายวิชา หรือผู้สร้าง...">
                </div>
            </div>
        </section>

        <!-- Categories Row -->
        <section class="mb-8 overflow-x-auto pb-4 no-scrollbar">
            <div class="flex gap-4 min-w-max" id="categoryContainer">
                <div onclick="setCategory('ทั้งหมด')" class="category-card active px-5 py-3 bg-white rounded-2xl shadow-sm flex items-center gap-3">
                    <i class="fas fa-border-all icon-cat text-slate-400"></i>
                    <span class="text-sm font-bold text-slate-700">ทั้งหมด</span>
                </div>
                <!-- Categories will be rendered here -->
            </div>
        </section>

        <!-- Missions Grid -->
        <section>
            <div id="missionGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Loading State -->
                <div class="col-span-full py-20 text-center">
                    <div class="spinner inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-4"></div>
                    <p class="text-slate-400 font-medium">กำลังเตรียมรายการภารกิจในคลัง...</p>
                </div>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-200 py-10 mt-12 text-center">
        <p class="text-blue-900 font-bold mb-1 italic">© 2026 FlipSchool. คลังสื่อการเรียนรู้ส่วนรวม</p>
        <p class="text-slate-400 text-[10px]">นวัตกรรมจัดการเรียนรู้ GLORY Model</p>
    </footer>

    <script>
        let allMissions = [];
        let currentCategory = 'ทั้งหมด';
        let targetCid = new URLSearchParams(window.location.search).get('cid');

        const categories = [
            { name: "ภาษาไทย", icon: "fas fa-font" },
            { name: "คณิตศาสตร์", icon: "fas fa-calculator" },
            { name: "วิทยาศาสตร์และเทคโนโลยี", icon: "fas fa-flask" },
            { name: "สังคมศึกษา ศาสนา และวัฒนธรรม", icon: "fas fa-globe-asia" },
            { name: "สุขศึกษาและพลศึกษา", icon: "fas fa-running" },
            { name: "ศิลปะ", icon: "fas fa-palette" },
            { name: "การงานอาชีพ", icon: "fas fa-tools" },
            { name: "ภาษาต่างประเทศ", icon: "fas fa-language" },
            { name: "อื่นๆ", icon: "fas fa-ellipsis-h" }
        ];

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.CONFIG) document.getElementById('app-slogan-display').innerText = window.CONFIG.APP_SLOGAN;
            renderCategories();
            await loadLibraryMissions();
        });

        function renderCategories() {
            const container = document.getElementById('categoryContainer');
            categories.forEach(cat => {
                const div = document.createElement('div');
                div.onclick = () => setCategory(cat.name);
                div.className = `category-card px-5 py-3 bg-white rounded-2xl shadow-sm flex items-center gap-3 category-item-${cat.name}`;
                div.innerHTML = `<i class="${cat.icon} icon-cat text-slate-400"></i><span class="text-sm font-bold text-slate-700">${cat.name}</span>`;
                container.appendChild(div);
            });
        }

        function setCategory(name) {
            currentCategory = name;
            document.querySelectorAll('.category-card').forEach(el => el.classList.remove('active'));
            if(name === 'ทั้งหมด') {
                document.querySelector('.category-card').classList.add('active');
            } else {
                document.querySelector(`.category-item-${name}`).classList.add('active');
            }
            filterMissions();
        }

        async function loadLibraryMissions() {
            try {
                // ดึงภารกิจที่เป็น Public ทั้งหมด
                const { data, error } = await window.sysDB
                    .from('missions')
                    .select('*, teachers(first_name, last_name)')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                allMissions = data;
                filterMissions();
            } catch (err) {
                document.getElementById('missionGrid').innerHTML = `<div class="col-span-full py-20 text-center text-red-500 font-bold">ไม่สามารถโหลดคลังภารกิจได้: ${err.message}</div>`;
            }
        }

        function filterMissions() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grid = document.getElementById('missionGrid');
            
            const filtered = allMissions.filter(m => {
                const matchSearch = m.title.toLowerCase().includes(search) || 
                                   (m.subject_name && m.subject_name.toLowerCase().includes(search)) ||
                                   (m.teachers && m.teachers.first_name.toLowerCase().includes(search));
                const matchCat = currentCategory === 'ทั้งหมด' || m.subject_group === currentCategory;
                return matchSearch && matchCat;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-20 text-center opacity-50"><i class="fas fa-search text-6xl mb-4"></i><h3 class="text-xl font-bold">ไม่พบภารกิจที่ตรงกับเงื่อนไข</h3></div>`;
                return;
            }

            grid.innerHTML = filtered.map(m => `
                <div class="mission-item-card bg-white rounded-3xl p-6 shadow-sm border border-slate-100 flex flex-col h-full">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-[10px] font-black uppercase tracking-widest px-3 py-1 bg-blue-50 text-blue-600 rounded-lg">
                            ${m.subject_group || 'ทั่วไป'}
                        </span>
                        <div class="text-orange-500 font-bold text-xs"><i class="fas fa-trophy mr-1"></i>${m.reward_points} แต้ม</div>
                    </div>
                    <h3 class="text-lg font-bold text-slate-800 mb-2 leading-tight">${m.title}</h3>
                    <p class="text-slate-400 text-xs mb-4 flex-grow line-clamp-2">${m.description || 'ไม่มีคำอธิบายภารกิจ'}</p>
                    
                    <div class="flex items-center justify-between mt-6 pt-4 border-t border-slate-50">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-slate-100 rounded-full flex items-center justify-center text-xs text-slate-400">
                                <i class="fas fa-user"></i>
                            </div>
                            <div class="flex flex-col">
                                <span class="text-[10px] text-slate-400 font-bold leading-none">ผู้สร้าง</span>
                                <span class="text-xs font-bold text-slate-700">${m.teachers?.first_name || 'ไม่ระบุ'}</span>
                            </div>
                        </div>
                        <button onclick="assignMission('${m.mission_id}')" class="bg-blue-900 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-black transition-all">
                            <i class="fas fa-plus mr-1"></i> เลือกใช้
                        </button>
                    </div>
                </div>
            `).join('');
        }

        async function assignMission(mid) {
            if(!targetCid) {
                alert('กรุณาเข้าสู่ระบบผ่านหน้าห้องเรียนเพื่อเลือกใช้ภารกิจครับ');
                return;
            }

            if(!confirm('คุณครูต้องการนำภารกิจนี้ไปใช้ในห้องเรียนใช่หรือไม่?')) return;

            try {
                const { error } = await window.sysDB.from('classroom_missions').upsert({
                    classroom_id: targetCid,
                    mission_id: mid,
                    is_visible: true
                }, { onConflict: 'classroom_id, mission_id' });

                if (error) throw error;
                alert('เพิ่มภารกิจลงห้องเรียนสำเร็จแล้ว! 🚀');
                window.location.href = `classroom-detail.html?id=${targetCid}`;
            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
            }
        }
    </script>
</body>
</html>
