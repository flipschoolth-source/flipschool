<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สมัครสมาชิกครู - FlipSchool</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- เพิ่มสคริปต์ Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* --- ธีมหลักและการตั้งค่าพื้นฐาน --- */
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --school-bg: #E6F7FF; 
            --text-main: #333; 
            --text-muted: #555; 
        }
        
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f9f9f9; 
            display: flex; 
            flex-direction: column; 
        }

        /* --- Navbar --- */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 40px; 
            background-color: #ffffff; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-container img { height: 45px; width: auto; }
        .brand-name { font-family: 'Kanit', sans-serif; font-size: 22px; font-weight: 600; color: #333; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 5px; font-family: 'Kanit', sans-serif; transition: color 0.2s; }
        .back-link:hover { color: var(--primary); }

        /* --- โครงสร้างหลัก --- */
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; box-sizing: border-box; }
        .card-glass { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .footer { width: 100%; padding: 25px; font-size: 0.9rem; color: #888; text-align: center; background: #fff; border-top: 1px solid #eee; margin-top: auto; box-sizing: border-box; }
        
        /* --- ปุ่มกด --- */
        .btn-submit { background-color: var(--primary); border: none; color: white; padding: 14px; border-radius: 12px; font-family: 'Kanit', sans-serif; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;}
        .btn-submit:hover:not(:disabled) { background-color: var(--primary-light); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 0, 139, 0.3); }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* --- เส้นคั่น --- */
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #aaa; font-size: 14px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
        .divider::before { margin-right: 10px; } .divider::after { margin-left: 10px; }
        
        /* --- ฟอร์ม Input --- */
        .input-group { margin-bottom: 15px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper input { width: 100%; padding: 12px 12px 12px 40px; border-radius: 12px; border: 1.5px solid #eee; font-family: 'Sarabun', sans-serif; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .input-wrapper input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(0, 0, 139, 0.1); }
        .input-wrapper i.icon { position: absolute; left: 15px; top: 15px; color: #aaa; }
        
        /* --- ส่วนค้นหาโรงเรียน --- */
        .search-results { position: absolute; width: 100%; background: white; border-radius: 0 0 12px 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); z-index: 10; display: none; border: 1px solid #eee; overflow-y: auto; max-height: 200px; }
        .search-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #f8f9fa; font-size: 14px; color: #333; transition: 0.2s; }
        .search-item:hover { background: #f0f4ff; color: var(--primary); }
        .search-item-add { color: var(--primary); font-weight: 600; text-align: center; background: #f0f4ff; }
        .search-item-add:hover { background: #e0e8ff; }
        .form-input { width: 100%; padding: 12px 15px; border: 1.5px solid #eee; border-radius: 12px; font-family: 'Sarabun'; font-size: 14px; box-sizing: border-box; transition: 0.3s; }
        .form-input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(0, 0, 139, 0.1); }

        /* --- กล่องอัปโหลดไฟล์ และ PDPA --- */
        .file-upload-box { border: 2px dashed #ccc; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #fafafa; }
        .file-upload-box:hover { border-color: var(--primary); background: #f0f4ff; }
        .pdpa-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; font-size: 13px; color: #856404; margin-top: 15px; line-height: 1.5; }

        @media (max-width: 768px) {
            nav { padding: 12px 20px; }
            .card-glass { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-container">
            <img src="img/favicon.png" alt="Logo" onerror="this.style.display='none'">
            <div class="brand-name">FlipSchool</div>
        </a>
        <a href="teacher-login.html" class="back-link"><i class="fas fa-arrow-left"></i> กลับไปหน้าล็อกอิน</a>
    </nav>

    <div class="container"> 
        <div class="card-glass">
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 style="font-family: 'Kanit', sans-serif; color: var(--primary); font-weight: 700;">ลงทะเบียนครูผู้สอน</h2>
                <p style="color: var(--text-muted);">สร้างบัญชีเพื่อบริหารจัดการห้องเรียนของคุณ</p>
            </div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">ชื่อ-นามสกุลจริง <span style="color:red;">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="เช่น ครูสมชาย ใจดี" required>
                        <i class="fas fa-user icon"></i>
                    </div>
                </div>

                <!-- ส่วนเลือกโรงเรียนและอักษรย่อที่ถูกอัปเกรด -->
                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">สังกัดโรงเรียน <span style="color:red;">*</span></label>
                    
                    <div class="input-wrapper" id="searchSection">
                        <input type="text" id="schoolInput" placeholder="พิมพ์ชื่อโรงเรียนเพื่อค้นหา..." autocomplete="off">
                        <i class="fas fa-school icon"></i>
                        <div id="resultsBox" class="search-results"></div>
                    </div>
                    
                    <!-- โชว์ชื่อโรงเรียนที่เลือก -->
                    <div id="selectedCard" style="display: none; background: #e0fbfc; border: 1px solid #90e0ef; border-radius: 12px; padding: 12px; margin-top: 10px; position: relative;">
                        <h4 id="showName" style="margin:0; font-family:'Kanit', sans-serif;"></h4>
                        <span id="showAbbr" style="font-size: 12px; color: var(--primary); font-weight: bold;"></span>
                        <i class="fas fa-times-circle" onclick="resetSchool()" style="position: absolute; top: 12px; right: 12px; color: #ff5400; cursor: pointer;"></i>
                    </div>
                    <input type="hidden" id="schoolId" required>

                    <!-- ฟอร์มบังคับกรอกกรณีโรงเรียนเดิม "ไม่มีอักษรย่อ" -->
                    <div id="missingAbbrGroup" style="display: none; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 12px; padding: 15px; margin-top: 10px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 600; color: #856404; font-size: 14px;">
                            <i class="fas fa-exclamation-triangle"></i> โรงเรียนนี้ยังไม่มีอักษรย่อภาษาอังกฤษ
                        </label>
                        <input type="text" id="missingSchoolAbbr" class="form-input" placeholder="ตั้งอักษรย่อ เช่น t1sk (ระบบแนะนำให้อัตโนมัติ)" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toLowerCase()">
                        <p style="font-size: 12px; color: #856404; margin: 5px 0 0 0;">*ใช้สำหรับเป็นลิงก์เข้าสู่ระบบของนักเรียนในรูปแบบ รหัส@อักษรย่อ</p>
                    </div>

                    <!-- ฟอร์มกรณี "เพิ่มโรงเรียนใหม่" -->
                    <div id="newSchoolForm" style="display: none; background: #f8f9fa; border: 1px solid #eef2f7; border-radius: 12px; padding: 15px; margin-top: 10px;">
                        <label style="display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px;">ชื่อโรงเรียนใหม่</label>
                        <input type="text" id="newSchoolName" class="form-input" placeholder="ระบุชื่อโรงเรียนเต็ม" oninput="autoSuggestAbbr('newSchoolName', 'newSchoolAbbr')">
                        
                        <label style="display: block; margin-top: 10px; margin-bottom: 5px; font-weight: 500; font-size: 14px;">อักษรย่อภาษาอังกฤษ <span style="font-size:11px; color:#ff4757;">(ต้องระบุ)</span></label>
                        <input type="text" id="newSchoolAbbr" class="form-input" placeholder="เช่น t1sk" oninput="this.value = this.value.replace(/[^a-zA-Z0-9]/g, '').toLowerCase()">
                        
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <button type="button" class="btn-submit" style="margin-top:0; flex:1; background:#2ed573; padding: 10px; font-size: 14px;" onclick="saveNewSchool()">เพิ่มลงระบบ</button>
                            <button type="button" class="btn-submit" style="margin-top:0; flex:1; background:#ff4757; padding: 10px; font-size: 14px;" onclick="cancelNewSchool()">ยกเลิก</button>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">ภาพถ่ายบัตรข้าราชการ/บัตรประชาชน <span style="color:red;">*</span></label>
                    <div class="file-upload-box" onclick="document.getElementById('idCardImage').click()">
                        <i class="fas fa-id-card" style="font-size: 30px; color: #ccc; margin-bottom: 10px;"></i>
                        <div id="fileNameDisplay" style="font-size: 14px; color: #666;">คลิกเพื่ออัปโหลดไฟล์รูปภาพ (.jpg, .png)</div>
                        <input type="file" id="idCardImage" accept="image/*" style="display: none;" onchange="updateFileName(this)" required>
                    </div>
                </div>

                <!-- เลื่อน PDPA มาไว้ก่อนการเลือกล็อกอิน เพื่อให้ครูที่ล็อกอิน Google กดยอมรับได้เลย -->
                <div class="pdpa-box">
                    <label style="display: flex; align-items: start; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="pdpaCheck" required style="margin-top: 3px;">
                        <span>ข้าพเจ้ายินยอมให้ FlipSchool เก็บและประมวลผลข้อมูลส่วนบุคคลและรูปถ่ายบัตรยืนยันตัวตน เพื่อวัตถุประสงค์ในการตรวจสอบสิทธิ์การเป็นผู้สอนเท่านั้น (ข้อมูลบัตรจะถูกลบหลังจากอนุมัติสำเร็จ)</span>
                    </label>
                </div>

                <!-- กล่องรองรับปุ่ม Google ย้ายมาจัดกลุ่มไว้ตรงนี้ -->
                <div style="display: flex; justify-content: center; width: 100%; margin-top: 20px; margin-bottom: 20px;">
                    <div id="googleSignInBtn" onclick="checkFormFieldsBeforeGoogle()"></div>
                </div>

                <!-- ปุ่ม Toggle เปิด/ปิด ฟอร์มอีเมล -->
                <div class="divider" style="cursor: pointer; color: var(--primary); font-weight: 500;" onclick="toggleEmailForm()">
                    <span id="emailToggleText">หรือ สมัครด้วยอีเมลและรหัสผ่าน</span> <i class="fas fa-chevron-down" id="emailToggleIcon"></i>
                </div>

                <!-- ส่วนอีเมลและรหัสผ่าน (ซ่อนไว้เป็นค่าเริ่มต้น) -->
                <div id="emailAuthSection" style="display: none;">
                    <div class="input-group">
                        <label style="display: block; margin-bottom: 5px; font-weight: 500;">อีเมล <span style="color:red;">*</span></label>
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="name@email.com">
                            <i class="fas fa-envelope icon"></i>
                        </div>
                    </div>

                    <div class="input-group">
                        <label style="display: block; margin-bottom: 5px; font-weight: 500;">รหัสผ่าน <span style="color:red;">*</span></label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="กำหนดรหัสผ่าน (6 ตัวขึ้นไป)" minlength="6">
                            <i class="fas fa-lock icon"></i>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btnSubmit">
                        สมัครสมาชิก <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">© 2026 FlipSchool. All rights reserved.</div>

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>
    
    <script>
        // --- ตั้งค่าระบบ Google Login ---
        const GOOGLE_CLIENT_ID = "450991822360-2t4h354971l21uhk2c5ticjbh8f30jrf.apps.googleusercontent.com";
        let needsAbbrUpdate = false;

        window.onload = function () {
            if(window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    context: "signup"
                });
                google.accounts.id.renderButton(
                    document.getElementById("googleSignInBtn"),
                    { theme: "outline", size: "large", width: 420, text: "signup_with", shape: "rectangular", borderRadius: 12 } 
                );
            }
        };

        function checkFormFieldsBeforeGoogle() {
            if (needsAbbrUpdate) {
                const abbr = document.getElementById('missingSchoolAbbr').value.trim();
                if(!abbr) alert("กรุณาตั้งค่าอักษรย่อโรงเรียนที่ขาดหายไป ก่อนทำการสมัครด้วย Google ครับ");
            }
        }

        // ฟังก์ชันซ่อน/แสดงส่วนของอีเมลและรหัสผ่าน
        function toggleEmailForm() {
            const section = document.getElementById('emailAuthSection');
            const icon = document.getElementById('emailToggleIcon');
            
            if (section.style.display === 'none') {
                section.style.display = 'block';
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
                // เมื่อเปิดฟอร์ม ค่อยบังคับให้ต้องกรอกอีเมลและรหัสผ่าน
                document.getElementById('email').setAttribute('required', 'true');
                document.getElementById('password').setAttribute('required', 'true');
            } else {
                section.style.display = 'none';
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
                // ยกเลิกการบังคับเมื่อซ่อน
                document.getElementById('email').removeAttribute('required');
                document.getElementById('password').removeAttribute('required');
            }
        }

        // ================= ระบบค้นหาและจัดการโรงเรียน =================
        const schoolInput = document.getElementById('schoolInput');
        schoolInput.addEventListener('input', async (e) => {
            const val = e.target.value.trim();
            if (val.length < 2) {
                document.getElementById('resultsBox').style.display = 'none';
                return;
            }
            
            try {
                // ดึงข้อมูลโรงเรียน รวมถึง school_abbr มาด้วย
                const { data, error } = await sysDB.from('schools')
                    .select('school_id, school_name, school_abbr')
                    .ilike('school_name', `%${val}%`)
                    .limit(5);
                
                if (error) throw error;
                    
                let html = '';
                if(data && data.length > 0) {
                    html += data.map(s => 
                        `<div class="search-item" onclick="selectSchool('${s.school_id}', '${s.school_name}', '${s.school_abbr || ''}')">
                            <i class="fas fa-school" style="margin-right: 8px; opacity: 0.5;"></i> ${s.school_name}
                        </div>`
                    ).join('');
                } else {
                    html += `<div style="padding:10px; color:#888; text-align:center;">ไม่พบรายชื่อโรงเรียน</div>`;
                }
                
                // ปุ่มเพิ่มโรงเรียนใหม่
                html += `
                    <div class="search-item search-item-add" onclick="showNewSchoolForm()">
                        <i class="fas fa-plus-circle"></i> + เพิ่มโรงเรียนใหม่เข้าระบบ
                    </div>`;

                document.getElementById('resultsBox').innerHTML = html;
                document.getElementById('resultsBox').style.display = 'block';
            } catch(err) {
                console.error("Search error:", err);
            }
        });

        function selectSchool(id, name, abbr) {
            document.getElementById('schoolId').value = id;
            document.getElementById('showName').innerText = name;
            document.getElementById('showAbbr').innerText = abbr ? `(อักษรย่อ: ${abbr})` : '';
            
            document.getElementById('selectedCard').style.display = 'block';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('resultsBox').style.display = 'none';

            // ตรวจสอบว่าโรงเรียนนี้มีอักษรย่อในระบบหรือยัง
            if (!abbr) {
                needsAbbrUpdate = true;
                document.getElementById('missingAbbrGroup').style.display = 'block';
                document.getElementById('missingSchoolAbbr').value = suggestAbbreviation(name);
            } else {
                needsAbbrUpdate = false;
                document.getElementById('missingAbbrGroup').style.display = 'none';
            }
        }

        function resetSchool() {
            document.getElementById('schoolId').value = '';
            document.getElementById('schoolInput').value = '';
            document.getElementById('selectedCard').style.display = 'none';
            document.getElementById('searchSection').style.display = 'block';
            document.getElementById('missingAbbrGroup').style.display = 'none';
            needsAbbrUpdate = false;
        }

        function showNewSchoolForm() {
            document.getElementById('resultsBox').style.display = 'none';
            document.getElementById('newSchoolForm').style.display = 'block';
            document.getElementById('searchSection').style.display = 'none';
            
            const searchVal = document.getElementById('schoolInput').value;
            document.getElementById('newSchoolName').value = searchVal;
            autoSuggestAbbr('newSchoolName', 'newSchoolAbbr');
        }

        function cancelNewSchool() {
            document.getElementById('newSchoolForm').style.display = 'none';
            document.getElementById('searchSection').style.display = 'block';
        }

        function suggestAbbreviation(thaiText) {
            let txt = thaiText.replace(/โรงเรียน/g, '').replace(/เทศบาล/g, 't').replace(/บ้าน/g, 'b').trim();
            let abbr = '';
            let hasNum = txt.match(/\d+/);
            
            const chars = {
                'ก':'k','ข':'k','ค':'k','ง':'ng', 'จ':'j','ช':'ch','ซ':'s',
                'ญ':'y','ฎ':'d','ฏ':'t','ฐ':'t','ด':'d','ต':'t','ถ':'t','ท':'t','ธ':'t','น':'n',
                'บ':'b','ป':'p','ผ':'p','พ':'p','ฟ':'f','ภ':'p','ม':'m',
                'ย':'y','ร':'r','ล':'l','ว':'w','ศ':'s','ส':'s','ห':'h','อ':'a'
            };
            
            for(let i=0; i<txt.length; i++) {
                if(chars[txt[i]] && abbr.length < 3) {
                    if(abbr.slice(-1) !== chars[txt[i]]) abbr += chars[txt[i]];
                } else if(/[a-zA-Z]/.test(txt[i]) && abbr.length < 4) {
                    abbr += txt[i].toLowerCase();
                }
            }
            if(hasNum) abbr += hasNum[0];
            return abbr || 'sch' + Math.floor(Math.random()*100);
        }

        function autoSuggestAbbr(nameInputId, abbrInputId) {
            const name = document.getElementById(nameInputId).value;
            document.getElementById(abbrInputId).value = suggestAbbreviation(name);
        }

        async function saveNewSchool() {
            const name = document.getElementById('newSchoolName').value.trim();
            const abbr = document.getElementById('newSchoolAbbr').value.trim().toLowerCase();
            
            if(!name || !abbr) return alert('กรุณากรอกชื่อและอักษรย่อโรงเรียนให้ครบถ้วน');
            
            // เช็คอักษรย่อซ้ำ
            const { data: existing } = await sysDB.from('schools').select('school_id').eq('school_abbr', abbr);
            if(existing && existing.length > 0) {
                return alert('❌ อักษรย่อ "' + abbr + '" มีโรงเรียนอื่นใช้งานแล้ว กรุณาเปลี่ยนอักษรย่อใหม่ครับ');
            }
            
            const newId = crypto.randomUUID();
            const { error } = await sysDB.from('schools').insert([{
                school_id: newId,
                school_name: name,
                school_abbr: abbr
            }]);
            
            if(error) return alert('เกิดข้อผิดพลาดในการสร้างโรงเรียน: ' + error.message);
            
            // เมื่อสร้างเสร็จ เลือกโรงเรียนนี้ทันที
            document.getElementById('schoolId').value = newId;
            document.getElementById('showName').innerText = name;
            document.getElementById('showAbbr').innerText = `(อักษรย่อ: ${abbr})`;
            document.getElementById('selectedCard').style.display = 'block';
            document.getElementById('newSchoolForm').style.display = 'none';
            needsAbbrUpdate = false;
            alert('✅ เพิ่มโรงเรียนใหม่สำเร็จ! สามารถดำเนินการสมัครสมาชิกต่อได้เลยครับ');
        }

        // ฟังก์ชันสำหรับอัปเดตอักษรย่อที่ขาดหายไป
        async function processMissingAbbr(schoolId) {
            if (!needsAbbrUpdate) return true; 
            
            const abbr = document.getElementById('missingSchoolAbbr').value.trim().toLowerCase();
            if(!abbr) {
                alert('กรุณาระบุอักษรย่อโรงเรียนที่ขาดหายไป');
                return false;
            }
            
            const { data: existing } = await sysDB.from('schools').select('school_id').eq('school_abbr', abbr);
            if(existing && existing.length > 0) {
                alert('❌ อักษรย่อ "' + abbr + '" มีโรงเรียนอื่นใช้งานแล้ว กรุณาเปลี่ยนอักษรย่อใหม่ครับ');
                return false;
            }
            
            const { error } = await sysDB.from('schools').update({ school_abbr: abbr }).eq('school_id', schoolId);
            if (error) {
                alert('เกิดข้อผิดพลาดในการอัปเดตอักษรย่อ: ' + error.message);
                return false;
            }
            
            needsAbbrUpdate = false; 
            return true;
        }

        // แสดงชื่อไฟล์เมื่ออัปโหลดรูป
        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.innerHTML = `<span style="color: var(--primary); font-weight:bold;">เลือกไฟล์แล้ว: ${input.files[0].name}</span>`;
            } else {
                display.innerHTML = 'คลิกเพื่ออัปโหลดไฟล์รูปภาพ (.jpg, .png)';
            }
        }

        // ================= ล็อกอินด้วย Google =================
        async function handleGoogleCredentialResponse(response) {
            const fullname = document.getElementById('fullname').value.trim().split(' ');
            const fname = fullname[0] || '';
            const lname = fullname.slice(1).join(' ') || '';
            const schoolId = document.getElementById('schoolId').value;
            const idCardFile = document.getElementById('idCardImage').files[0];
            const pdpaCheck = document.getElementById('pdpaCheck').checked;

            if (!fname || !schoolId || !idCardFile || !pdpaCheck) {
                alert("กรุณากรอกข้อมูลและอัปโหลดรูปภาพบัตรให้ครบถ้วนก่อนดำเนินการต่อครับ");
                return;
            }

            // ถ้าโรงเรียนเดิมไม่มีอักษรย่อ ให้อัปเดตอักษรย่อก่อน
            if (needsAbbrUpdate) {
                const isAbbrUpdated = await processMissingAbbr(schoolId);
                if (!isAbbrUpdated) return; 
            }

            try {
                const idToken = response.credential;
                const { data, error } = await sysDB.auth.signInWithIdToken({
                    provider: 'google',
                    token: idToken,
                });

                if (error) throw error;
                const userId = data.user.id;
                const userEmail = data.user.email;

                let cardUrl = '';
                const fileExt = idCardFile.name.split('.').pop();
                const fileName = `${userId}_${Date.now()}.${fileExt}`;
                
                const { error: uploadError } = await sysDB.storage
                    .from('teacher-verifications')
                    .upload(fileName, idCardFile);
                
                if (uploadError) throw uploadError;
                cardUrl = fileName;

                const { error: dbError } = await sysDB.from('teachers').upsert([{
                    teacher_id: userId,
                    first_name: fname,
                    last_name: lname,
                    school_id: schoolId,
                    email: userEmail,
                    verification_card_url: cardUrl,
                    verification_status: 'pending',
                    role: 'teacher'
                }]);

                if (dbError) throw dbError;

                alert("สมัครสมาชิกด้วย Google สำเร็จ! กรุณารอผู้ดูแลระบบโรงเรียนอนุมัติบัญชีของคุณ");
                window.location.href = 'teacher-login.html';

            } catch (err) {
                console.error("Google Auth Error:", err);
                alert("เกิดข้อผิดพลาดในการลงทะเบียนด้วย Google: " + err.message);
            }
        }

        // ================= ล็อกอินด้วย Email =================
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังดำเนินการ...';
            btn.disabled = true;

            const fullname = document.getElementById('fullname').value.trim().split(' ');
            const fname = fullname[0] || '';
            const lname = fullname.slice(1).join(' ') || '';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const schoolId = document.getElementById('schoolId').value;
            const idCardFile = document.getElementById('idCardImage').files[0];

            if (!schoolId) { 
                alert('กรุณาเลือกสังกัดโรงเรียนให้เรียบร้อย'); 
                btn.disabled = false; 
                btn.innerHTML = 'สมัครสมาชิก <i class="fas fa-arrow-right"></i>'; 
                return; 
            }

            // ถ้าโรงเรียนเดิมไม่มีอักษรย่อ ให้อัปเดตอักษรย่อก่อน
            if (needsAbbrUpdate) {
                const isAbbrUpdated = await processMissingAbbr(schoolId);
                if (!isAbbrUpdated) {
                    btn.disabled = false; 
                    btn.innerHTML = 'สมัครสมาชิก <i class="fas fa-arrow-right"></i>'; 
                    return; 
                }
            }

            try {
                const { data: authData, error: authError } = await sysDB.auth.signUp({ 
                    email: email, 
                    password: password 
                });
                if (authError) throw authError;

                const userId = authData.user.id;

                let cardUrl = '';
                if (idCardFile) {
                    const fileExt = idCardFile.name.split('.').pop();
                    const fileName = `${userId}_${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await sysDB.storage
                        .from('teacher-verifications')
                        .upload(fileName, idCardFile);
                    
                    if (uploadError) throw uploadError;
                    cardUrl = fileName; 
                }

                const { error: dbError } = await sysDB.from('teachers').insert([{
                    teacher_id: userId,
                    first_name: fname,
                    last_name: lname,
                    school_id: schoolId,
                    email: email,
                    verification_card_url: cardUrl,
                    verification_status: 'pending',
                    role: 'teacher'
                }]);

                if (dbError) throw dbError;

                alert('สมัครสมาชิกสำเร็จ! กรุณารอผู้ดูแลระบบโรงเรียนอนุมัติบัญชีของคุณ');
                window.location.href = 'teacher-login.html';

            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = 'สมัครสมาชิก <i class="fas fa-arrow-right"></i>';
            }
        }
    </script>
</body>
