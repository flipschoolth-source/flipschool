<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>สมัครสมาชิกครู - FlipSchool</title>
    <link rel="icon" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- เพิ่มสคริปต์ Google Identity Services (วิธีที่ 3) -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* --- ธีมหลักและการตั้งค่าพื้นฐาน --- */
        :root { 
            --primary: #00008B; 
            --primary-light: #0000cd; 
            --accent: #FF8C00; 
            --school-bg: #E6F7FF; 
            --text-main: #333; 
            --text-muted: #555; 
        }
        
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0; 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f9f9f9; 
            display: flex; 
            flex-direction: column; 
        }

        /* --- Navbar --- */
        nav { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 15px 40px; 
            background-color: #ffffff; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05); 
            position: sticky; 
            top: 0; 
            z-index: 1000; 
            width: 100%; 
            box-sizing: border-box; 
        }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; }
        .logo-container img { height: 45px; width: auto; }
        .brand-name { font-family: 'Kanit'; font-size: 22px; font-weight: 600; color: #333; }
        .back-link { color: var(--text-muted); text-decoration: none; font-size: 14px; display: flex; align-items: center; gap: 5px; font-family: 'Kanit'; transition: color 0.2s; }
        .back-link:hover { color: var(--primary); }

        /* --- โครงสร้างหลัก --- */
        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; box-sizing: border-box; }
        .card-glass { background: white; border-radius: 24px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 15px 35px rgba(0,0,0,0.08); border: 1px solid #eee; }
        .footer { width: 100%; padding: 25px; font-size: 0.9rem; color: #888; text-align: center; background: #fff; border-top: 1px solid #eee; margin-top: auto; box-sizing: border-box; }
        
        /* --- ปุ่มกด --- */
        .btn-submit { background-color: var(--primary); border: none; color: white; padding: 14px; border-radius: 12px; font-family: 'Kanit'; font-size: 18px; cursor: pointer; transition: 0.3s; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 20px;}
        .btn-submit:hover:not(:disabled) { background-color: var(--primary-light); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 0, 139, 0.3); }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        /* ลบ .btn-google ออก เพราะเราจะใช้ปุ่มมาตรฐานจาก Google แทน */

        /* --- เส้นคั่น --- */
        .divider { display: flex; align-items: center; text-align: center; margin: 20px 0; color: #aaa; font-size: 14px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eee; }
        .divider::before { margin-right: 10px; } .divider::after { margin-left: 10px; }
        
        /* --- ฟอร์ม Input --- */
        .input-group { margin-bottom: 15px; }
        .input-wrapper { position: relative; width: 100%; }
        .input-wrapper input { width: 100%; padding: 12px 12px 12px 40px; border-radius: 12px; border: 1.5px solid #eee; font-family: 'Sarabun'; font-size: 16px; box-sizing: border-box; transition: 0.3s; }
        .input-wrapper input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(0, 0, 139, 0.1); }
        .input-wrapper i.icon { position: absolute; left: 15px; top: 15px; color: #aaa; }
        
        /* --- กล่องอัปโหลดไฟล์ และ PDPA --- */
        .file-upload-box { border: 2px dashed #ccc; border-radius: 12px; padding: 20px; text-align: center; cursor: pointer; transition: 0.3s; background: #fafafa; }
        .file-upload-box:hover { border-color: var(--primary); background: #f0f4ff; }
        .pdpa-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 15px; border-radius: 8px; font-size: 13px; color: #856404; margin-top: 15px; line-height: 1.5; }

        @media (max-width: 768px) {
            nav { padding: 12px 20px; }
            .card-glass { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo-container">
            <img src="img/favicon.png" alt="Logo" onerror="this.style.display='none'">
            <div class="brand-name">FlipSchool</div>
        </a>
        <a href="teacher-login.html" class="back-link"><i class="fas fa-arrow-left"></i> กลับไปหน้าล็อกอิน</a>
    </nav>

    <div class="container"> 
        <div class="card-glass">
            <div style="text-align: center; margin-bottom: 25px;">
                <h2 style="font-family: 'Kanit'; color: var(--primary); font-weight: 700;">ลงทะเบียนครูผู้สอน</h2>
                <p style="color: var(--text-muted);">สร้างบัญชีเพื่อบริหารจัดการห้องเรียนของคุณ</p>
            </div>
            
            <!-- เปลี่ยนเป็นกล่องรองรับปุ่ม Google แท้ -->
            <div style="display: flex; justify-content: center; width: 100%; margin-bottom: 20px;">
                <div id="googleSignInBtn"></div>
            </div>

            <div class="divider">หรือ สมัครด้วยอีเมล</div>

            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">ชื่อ-นามสกุลจริง <span style="color:red;">*</span></label>
                    <div class="input-wrapper">
                        <input type="text" id="fullname" placeholder="เช่น ครูสมชาย ใจดี" required>
                        <i class="fas fa-user icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">สังกัดโรงเรียน <span style="color:red;">*</span></label>
                    <div class="input-wrapper" id="searchSection">
                        <input type="text" id="schoolInput" placeholder="พิมพ์ชื่อโรงเรียนเพื่อค้นหา..." autocomplete="off">
                        <i class="fas fa-school icon"></i>
                        <div id="resultsBox" style="position: absolute; width: 100%; background: white; border: 1px solid #eee; z-index: 10; display: none; border-radius: 0 0 12px 12px; box-shadow: 0 10px 20px rgba(0,0,0,0.1);"></div>
                    </div>
                    <div id="selectedCard" style="display: none; background: #e0fbfc; border: 1px solid #90e0ef; border-radius: 12px; padding: 12px; margin-top: 10px; position: relative;">
                        <h4 id="showName" style="margin:0; font-family:'Kanit';"></h4>
                        <i class="fas fa-times-circle" onclick="resetSchool()" style="position: absolute; top: 12px; right: 12px; color: #ff5400; cursor: pointer;"></i>
                    </div>
                    <input type="hidden" id="schoolId" required>
                </div>

                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">ภาพถ่ายบัตรข้าราชการ/บัตรประชาชน <span style="color:red;">*</span></label>
                    <div class="file-upload-box" onclick="document.getElementById('idCardImage').click()">
                        <i class="fas fa-id-card" style="font-size: 30px; color: #ccc; margin-bottom: 10px;"></i>
                        <div id="fileNameDisplay" style="font-size: 14px; color: #666;">คลิกเพื่ออัปโหลดไฟล์รูปภาพ (.jpg, .png)</div>
                        <input type="file" id="idCardImage" accept="image/*" style="display: none;" onchange="updateFileName(this)" required>
                    </div>
                </div>

                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">อีเมล <span style="color:red;">*</span></label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="name@email.com" required>
                        <i class="fas fa-envelope icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label style="display: block; margin-bottom: 5px; font-weight: 500;">รหัสผ่าน <span style="color:red;">*</span></label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="กำหนดรหัสผ่าน (6 ตัวขึ้นไป)" minlength="6" required>
                        <i class="fas fa-lock icon"></i>
                    </div>
                </div>

                <div class="pdpa-box">
                    <label style="display: flex; align-items: start; gap: 10px; cursor: pointer;">
                        <input type="checkbox" id="pdpaCheck" required style="margin-top: 3px;">
                        <span>ข้าพเจ้ายินยอมให้ FlipSchool เก็บและประมวลผลข้อมูลส่วนบุคคลและรูปถ่ายบัตรยืนยันตัวตน เพื่อวัตถุประสงค์ในการตรวจสอบสิทธิ์การเป็นผู้สอนเท่านั้น (ข้อมูลบัตรจะถูกลบหลังจากอนุมัติสำเร็จ)</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="btnSubmit">
                    สมัครสมาชิก <i class="fas fa-arrow-right"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="footer">© 2026 FlipSchool. All rights reserved.</div>

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script>
    
    <script>
        // --- ตั้งค่าระบบ Google Login ---
        // ** สำคัญ: ต้องนำ Client ID จาก Google Cloud Console มาใส่ตรงนี้ **
        const GOOGLE_CLIENT_ID = "ใส่_CLIENT_ID_ของ_GOOGLE_ตรงนี้.apps.googleusercontent.com";

        window.onload = function () {
            // โหลดปุ่ม Google ลงในหน้าเว็บ
            if(window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    context: "signup"
                });
                google.accounts.id.renderButton(
                    document.getElementById("googleSignInBtn"),
                    { theme: "outline", size: "large", width: 420, text: "signup_with", shape: "rectangular", borderRadius: 12 } 
                );
            }
        };

        // ฟังก์ชันรับ Token จาก Google แล้วส่งให้ Supabase
        async function handleGoogleCredentialResponse(response) {
            try {
                // 1. รับ Token สดๆ จาก Google ที่ส่งมาจากหน้าเว็บเราเอง
                const idToken = response.credential;

                // 2. ล็อกอินเข้า Supabase แบบเงียบๆ หลังบ้าน
                const { data, error } = await sysDB.auth.signInWithIdToken({
                    provider: 'google',
                    token: idToken,
                });

                if (error) throw error;

                // ล็อกอินสำเร็จ
                alert("เข้าสู่ระบบด้วย Google สำเร็จ!");
                window.location.href = 'teacher-dashboard.html';

            } catch (err) {
                console.error("Google Auth Error:", err);
                alert("เกิดข้อผิดพลาดในการลงทะเบียนด้วย Google: " + err.message);
            }
        }

        // แสดงชื่อไฟล์เมื่ออัปโหลดรูป
        function updateFileName(input) {
            const display = document.getElementById('fileNameDisplay');
            if (input.files && input.files[0]) {
                display.innerHTML = `<span style="color: var(--primary); font-weight:bold;">เลือกไฟล์แล้ว: ${input.files[0].name}</span>`;
            } else {
                display.innerHTML = 'คลิกเพื่ออัปโหลดไฟล์รูปภาพ (.jpg, .png)';
            }
        }

        // ระบบค้นหาโรงเรียน
        const schoolInput = document.getElementById('schoolInput');
        schoolInput.addEventListener('input', async (e) => {
            const val = e.target.value.trim();
            if (val.length < 2) {
                document.getElementById('resultsBox').style.display = 'none';
                return;
            }
            
            try {
                const { data, error } = await sysDB.from('schools')
                    .select('school_id, school_name')
                    .ilike('school_name', `%${val}%`)
                    .limit(5);
                
                if (error) throw error;
                    
                if(data && data.length > 0) {
                    document.getElementById('resultsBox').innerHTML = data.map(s => 
                        `<div style="padding:10px; cursor:pointer; border-bottom:1px solid #eee;" onclick="selectSchool('${s.school_id}', '${s.school_name}')">${s.school_name}</div>`
                    ).join('');
                    document.getElementById('resultsBox').style.display = 'block';
                } else {
                    document.getElementById('resultsBox').innerHTML = '<div style="padding:10px; color:#888;">ไม่พบรายชื่อโรงเรียน</div>';
                    document.getElementById('resultsBox').style.display = 'block';
                }
            } catch(err) {
                console.error("Search error:", err);
            }
        });

        function selectSchool(id, name) {
            document.getElementById('schoolId').value = id;
            document.getElementById('showName').innerText = name;
            document.getElementById('selectedCard').style.display = 'block';
            document.getElementById('searchSection').style.display = 'none';
            document.getElementById('resultsBox').style.display = 'none';
        }

        function resetSchool() {
            document.getElementById('schoolId').value = '';
            document.getElementById('schoolInput').value = '';
            document.getElementById('selectedCard').style.display = 'none';
            document.getElementById('searchSection').style.display = 'block';
        }

        // --- Logic การสมัครสมาชิกและอัปโหลดไฟล์ (ด้วยอีเมล) ---
        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btnSubmit');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังดำเนินการ...';
            btn.disabled = true;

            const fullname = document.getElementById('fullname').value.trim().split(' ');
            const fname = fullname[0] || '';
            const lname = fullname.slice(1).join(' ') || '';
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const schoolId = document.getElementById('schoolId').value;
            const idCardFile = document.getElementById('idCardImage').files[0];

            if (!schoolId) { 
                alert('กรุณาเลือกสังกัดโรงเรียนให้เรียบร้อย'); 
                btn.disabled = false; 
                btn.innerHTML = 'สมัครสมาชิก <i class="fas fa-arrow-right"></i>'; 
                return; 
            }

            try {
                // 1. สร้างบัญชี Auth ใน Supabase
                const { data: authData, error: authError } = await sysDB.auth.signUp({ 
                    email: email, 
                    password: password 
                });
                if (authError) throw authError;

                const userId = authData.user.id;

                // 2. อัปโหลดรูปภาพบัตรขึ้น Storage (ต้องสร้าง Bucket ชื่อ 'teacher-verifications' ไว้ก่อน)
                let cardUrl = '';
                if (idCardFile) {
                    const fileExt = idCardFile.name.split('.').pop();
                    const fileName = `${userId}_${Date.now()}.${fileExt}`;
                    const filePath = `${fileName}`;

                    // สมมติว่าสร้าง Bucket แบบ Private ไว้ชื่อ teacher-verifications
                    const { error: uploadError } = await sysDB.storage
                        .from('teacher-verifications')
                        .upload(filePath, idCardFile);
                    
                    if (uploadError) throw uploadError;
                    
                    // บันทึก Path ไว้ในฐานข้อมูล (เพื่อใช้ดึงรูปผ่าน API ภายหลัง)
                    cardUrl = filePath; 
                }

                // 3. บันทึกข้อมูลลงตาราง teachers พร้อมสถานะ 'pending'
                const { error: dbError } = await sysDB.from('teachers').insert([{
                    teacher_id: userId,
                    first_name: fname,
                    last_name: lname,
                    school_id: schoolId,
                    email: email,
                    verification_card_url: cardUrl,
                    verification_status: 'pending', // สถานะรออนุมัติ
                    role: 'teacher'
                }]);

                if (dbError) throw dbError;

                alert('สมัครสมาชิกสำเร็จ! กรุณารอผู้ดูแลระบบโรงเรียนอนุมัติบัญชีของคุณ');
                window.location.href = 'teacher-login.html';

            } catch (err) {
                alert('เกิดข้อผิดพลาด: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = 'สมัครสมาชิก <i class="fas fa-arrow-right"></i>';
            }
        }

        // ลบฟังก์ชัน registerWithGoogle แบบเก่าทิ้งไปเลย (เพราะใช้ handleGoogleCredentialResponse แทนแล้ว)
    </script>
</body>
</html>
