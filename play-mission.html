<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ภารกิจ | FlipSchool</title>
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #f1f5f9; overflow: hidden; }
        .nav-gradient { background: linear-gradient(135deg, #00008B 0%, #1e3a8a 100%); }
        .mission-container { height: calc(100vh - 70px); width: 100%; position: relative; }
        #missionIframe { width: 100%; height: 100%; border: none; background: white; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- ✅ Unified Navbar -->
    <nav class="nav-gradient text-white shadow-lg z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center shadow-md shrink-0">
                    <span class="text-2xl text-blue-900">🎓</span>
                </div>
                <div class="flex flex-col overflow-hidden">
                    <div class="flex items-center gap-2">
                        <div class="text-base font-bold tracking-tight leading-none text-white">
                            Flip<span class="text-orange-400">School</span>
                        </div>
                        <span class="text-white/30 text-[10px]">|</span>
                        <span id="missionSubtitle" class="text-[10px] text-blue-200 truncate font-medium uppercase tracking-wider">Mission Play</span>
                    </div>
                    <h1 id="missionTitle" class="text-xs font-bold text-white/80 truncate max-w-[200px] mt-0.5 tracking-wide">กำลังโหลด...</h1>
                </div>
            </div>
            
            <div class="flex items-center gap-3 shrink-0">
                <div id="teacherTools" class="hidden flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full border border-white/20">
                    <button id="editBtn" class="text-blue-200 text-xs font-bold hover:text-white transition-colors"><i class="fas fa-edit mr-1"></i> แก้ไข</button>
                </div>
                <div class="bg-white/10 px-4 py-1.5 rounded-full text-xs font-bold border border-white/20 flex items-center gap-2">
                    <i class="fas fa-trophy text-orange-400"></i><span id="scoreText">0</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="mission-container">
        <iframe id="missionIframe" sandbox="allow-scripts allow-forms allow-modals allow-same-origin" title="Mission Workspace"></iframe>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Branding and fetching mission logic...
        });
    </script>
</body>
</html>
