<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ภารกิจ | FlipSchool</title>
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ปรับให้เต็มจอ ไม่มี Scrollbar ของ Browser */
        body { font-family: 'Sarabun', 'Kanit', sans-serif; background-color: #000; overflow: hidden; margin: 0; padding: 0; height: 100vh; width: 100vw; }
        
        /* iframe เต็มพื้นที่ */
        .mission-container { width: 100%; height: 100%; border: none; }
        #missionIframe { width: 100%; height: 100%; border: none; background: white; display: block; }
        
        .modal-overlay { background-color: rgba(15, 23, 42, 0.9); backdrop-filter: blur(4px); }
        
        /* ปุ่มเมนูลอยสำหรับครู */
        .teacher-fab {
            position: fixed; bottom: 20px; right: 20px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; cursor: pointer;
            transition: all 0.2s; border: 1px solid #e2e8f0;
        }
        .teacher-fab:active { transform: scale(0.9); }
        
        .teacher-menu {
            position: fixed; bottom: 80px; right: 20px;
            background: white; padding: 10px; border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2);
            display: flex; flex-direction: column; gap: 8px;
            z-index: 1000; border: 1px solid #f1f5f9;
            transform-origin: bottom right; transition: all 0.2s;
        }
    </style>
</head>
<body class="h-screen w-screen">

    <div id="loader" class="fixed inset-0 z-[2000] bg-white flex flex-col items-center justify-center">
        <div class="w-10 h-10 border-4 border-blue-100 border-t-blue-900 rounded-full animate-spin mb-4"></div>
        <p class="text-blue-900 font-bold animate-pulse text-sm">กำลังเตรียมความพร้อม...</p>
    </div>

    <div id="blocker" class="fixed inset-0 z-[110] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-3xl w-full max-w-sm p-8 shadow-2xl text-center border border-slate-100">
            <div class="text-5xl mb-4">🚫</div>
            <h3 class="text-xl font-bold text-slate-800">ทำภารกิจสำเร็จแล้ว</h3>
            <p class="text-sm text-slate-500 mt-2">คุณครูไม่อนุญาตให้นักเรียนทำภารกิจนี้ซ้ำครับ</p>
            <button onclick="history.back()" class="mt-8 w-full bg-blue-900 text-white font-bold py-3.5 rounded-2xl">กลับสู่ห้องเรียน</button>
        </div>
    </div>

    <div id="settingsModal" class="fixed inset-0 z-[120] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl border border-slate-100">
            <div class="flex justify-between items-center mb-8">
                <h3 class="text-xl font-bold text-blue-900">จัดการห้องเรียน</h3>
                <button onclick="closeSettings()" class="text-slate-400"><i class="fas fa-times"></i></button>
            </div>
            <div class="space-y-6">
                <div class="flex items-center justify-between p-5 bg-slate-50 rounded-2xl border border-slate-100">
                    <div>
                        <p class="text-sm font-bold text-slate-700">อนุญาตให้เล่นซ้ำ</p>
                        <p class="text-[10px] text-slate-400 mt-1">นักเรียนสามารถทำซ้ำเพื่อพัฒนาคะแนนได้</p>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="replayToggle" class="sr-only peer" onchange="updateAssignmentSetting()">
                        <div class="w-11 h-6 bg-gray-200 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <div id="deleteModal" class="fixed inset-0 z-[130] hidden flex items-center justify-center p-4 modal-overlay">
        <div class="bg-white rounded-[2rem] w-full max-w-sm p-8 shadow-2xl text-center">
            <div class="w-16 h-16 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4"><i class="fas fa-trash-alt text-2xl"></i></div>
            <h3 class="text-xl font-bold text-slate-800">ถอนภารกิจ?</h3>
            <div class="mt-8 space-y-2">
                <button onclick="confirmRemove()" class="w-full bg-red-600 text-white font-bold py-3.5 rounded-2xl shadow-lg active:scale-95 text-sm">ยืนยัน</button>
                <button onclick="closeDelete()" class="w-full text-slate-400 font-semibold py-2 text-sm">ยกเลิก</button>
            </div>
        </div>
    </div>

    <main class="mission-container">
        <iframe id="missionIframe" sandbox="allow-scripts allow-forms allow-modals allow-same-origin" title="Mission Player"></iframe>
    </main>

    <div id="teacherTools" class="hidden">
        <div id="teacherMenu" class="teacher-menu hidden">
            <button onclick="openSettings()" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 rounded-xl text-sm font-bold text-slate-600 w-full text-left">
                <i class="fas fa-cog text-blue-500 w-5"></i> ตั้งค่า
            </button>
            <button id="editBtn" class="flex items-center gap-3 px-4 py-3 hover:bg-slate-50 rounded-xl text-sm font-bold text-slate-600 w-full text-left">
                <i class="fas fa-code text-orange-500 w-5"></i> แก้ไขโค้ด
            </button>
            <button onclick="openDelete()" class="flex items-center gap-3 px-4 py-3 hover:bg-red-50 rounded-xl text-sm font-bold text-red-500 w-full text-left">
                <i class="fas fa-trash-alt w-5"></i> ถอนภารกิจ
            </button>
        </div>
        <button onclick="toggleTeacherMenu()" class="teacher-fab text-blue-900">
            <i class="fas fa-tools text-xl"></i>
        </button>
    </div>

    <script>
        let currentMissionId = null, currentUserId = null, assignmentData = null, isTeacher = false;

        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            currentMissionId = params.get('mid');
            if (window.sysDB) initPage();
            else { const c = setInterval(() => { if(window.sysDB){ clearInterval(c); initPage(); }}, 500); }
        });

        async function initPage() {
            try {
                const { data: { user } } = await window.sysDB.auth.getUser();
                currentUserId = user.id;

                const { data: assign } = await window.sysDB.from('classroom_missions').select('*, missions(*), classrooms(teacher_id, subject_name)').eq('mission_id', currentMissionId).single();
                assignmentData = assign;

                isTeacher = (assign.classrooms.teacher_id === currentUserId);
                if (isTeacher) {
                    document.getElementById('teacherTools').classList.remove('hidden');
                    document.getElementById('replayToggle').checked = assign.can_replay;
                    document.getElementById('editBtn').onclick = () => window.location.href = `mission-create-ai.html?cid=${assign.classroom_id}&mid=${currentMissionId}`;
                }

                if (!isTeacher && !assign.can_replay) {
                    const { data: ex } = await window.sysDB.from('student_missions').select('id').eq('mission_id', currentMissionId).eq('student_id', currentUserId).maybeSingle();
                    if (ex) { document.getElementById('blocker').classList.remove('hidden'); document.getElementById('loader').style.display = 'none'; return; }
                }

                document.getElementById('missionIframe').srcdoc = assign.missions.content_data.html;
                document.getElementById('missionIframe').onload = () => document.getElementById('loader').style.display = 'none';
            } catch (err) { history.back(); }
        }

        window.addEventListener('message', async (e) => {
            if (e.data?.type === 'SAVE_RESULT') {
                try {
                    const { data: existing } = await window.sysDB.from('student_missions').select('id').eq('student_id', currentUserId).eq('mission_id', currentMissionId).maybeSingle();
                    const payload = { student_id: currentUserId, mission_id: currentMissionId, score: e.data.score, answers: e.data.answers || [], updated_at: new Date().toISOString() };

                    if (existing) await window.sysDB.from('student_missions').update(payload).eq('id', existing.id);
                    else await window.sysDB.from('student_missions').insert([payload]);
                } catch (err) { console.error("Error saving result:", err); }
            }
        });

        function toggleTeacherMenu() {
            const menu = document.getElementById('teacherMenu');
            menu.classList.toggle('hidden');
        }

        // ปิดเมนูเมื่อคลิกที่อื่น
        document.addEventListener('click', (e) => {
            const menu = document.getElementById('teacherMenu');
            const fab = document.querySelector('.teacher-fab');
            if (!menu.classList.contains('hidden') && !menu.contains(e.target) && !fab.contains(e.target)) {
                menu.classList.add('hidden');
            }
        });

        function openSettings() { document.getElementById('settingsModal').classList.remove('hidden'); toggleTeacherMenu(); }
        function closeSettings() { document.getElementById('settingsModal').classList.add('hidden'); }
        function openDelete() { document.getElementById('deleteModal').classList.remove('hidden'); toggleTeacherMenu(); }
        function closeDelete() { document.getElementById('deleteModal').classList.add('hidden'); }
        async function updateAssignmentSetting() { const v = document.getElementById('replayToggle').checked; await window.sysDB.from('classroom_missions').update({ can_replay: v }).eq('mission_id', currentMissionId).eq('classroom_id', assignmentData.classroom_id); }
        async function confirmRemove() { await window.sysDB.from('classroom_missions').delete().eq('mission_id', currentMissionId).eq('classroom_id', assignmentData.classroom_id); window.location.href = `classroom-detail.html?id=${assignmentData.classroom_id}`; }
    </script>
</body>
</html>
