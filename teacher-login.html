<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบครู - FlipSchool</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="img/favicon.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- เพิ่มสคริปต์ Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        /* --- ธีมหลัก --- */
        :root { 
            --primary: #00008B; 
            --primary-light: #0052D4;
            --accent: #FF8C00; 
            --bg-body: #f4f7fe; 
            --text-main: #2d3436; 
            --text-muted: #636e72; 
        }

        html, body { height: 100%; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); display: flex; flex-direction: column; }

        /* --- Navbar ชิดขอบบน --- */
        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 40px; background-color: #ffffff;
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
            position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box;
        }
        
        .logo-container { display: flex; align-items: center; gap: 15px; cursor: pointer; text-decoration: none; }
        .logo-container img { height: 45px; width: auto; }
        .brand-name { font-size: 22px; font-weight: 700; color: var(--text-main); font-family: 'Kanit', sans-serif; }
        .brand-name span { color: var(--primary); }
        .slogan { font-family: 'Sarabun', sans-serif; font-size: 12px; color: #666; }
        
        .back-link {
            color: var(--text-muted); text-decoration: none; font-size: 15px;
            display: flex; align-items: center; gap: 6px; transition: color 0.2s;
            font-family: 'Kanit', sans-serif; font-weight: 500;
        }
        .back-link:hover { color: var(--primary); }

        .container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 40px 20px; box-sizing: border-box; }
        .card-glass { background: white; border-radius: 30px; padding: 40px; width: 100%; max-width: 450px; box-shadow: 0 15px 35px rgba(0,0,0,0.04); border: 1px solid #edf2f7; }
        .card-header { text-align: center; margin-bottom: 30px; }
        .card-header .icon-circle { width: 80px; height: 80px; background: #f0f4ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 15px; color: var(--primary); font-size: 35px; }
        .card-header h2 { font-family: 'Kanit', sans-serif; color: var(--text-main); font-weight: 700; margin: 0 0 5px 0; font-size: 28px; }
        .card-header p { color: var(--text-muted); margin: 0; font-size: 15px; }
        
        /* --- เส้นคั่น --- */
        .divider { display: flex; align-items: center; text-align: center; margin: 25px 0; color: #a4b0be; font-size: 14px; font-weight: 500; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #eef2f7; }
        .divider::before { margin-right: 15px; } .divider::after { margin-left: 15px; }

        /* --- ฟอร์ม Input --- */
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-label { display: block; margin-bottom: 8px; font-weight: 600; color: var(--text-main); font-size: 14px; }
        .input-wrapper { position: relative; }
        .input-wrapper input { width: 100%; padding: 14px 14px 14px 45px; border: 2px solid #eef2f7; border-radius: 15px; font-family: 'Sarabun', sans-serif; font-size: 15px; box-sizing: border-box; transition: 0.3s; color: #333; background: #fafbfc; }
        .input-wrapper input:focus { border-color: var(--primary-light); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(0, 82, 212, 0.1); }
        .input-wrapper .icon { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: #a4b0be; font-size: 16px; }
        .toggle-password { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #a4b0be; transition: 0.3s; }
        .toggle-password:hover { color: var(--primary); }

        .remember-wrapper { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding: 0 5px; }
        .remember-text { font-size: 14px; color: var(--text-muted); font-weight: 500; cursor: pointer; }
        
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #dcdde1; transition: .4s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .btn-submit { background-color: var(--primary); border-radius: 15px; padding: 16px; font-family: 'Kanit', sans-serif; font-weight: 500; font-size: 18px; color: white; border: none; cursor: pointer; width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .btn-submit:hover:not(:disabled) { background-color: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0, 0, 139, 0.2); }
        .btn-submit:disabled { background-color: #ccc; cursor: not-allowed; transform: none; box-shadow: none; }

        .footer { width: 100%; padding: 25px; font-size: 0.9rem; color: #888; text-align: center; background: #fff; border-top: 1px solid #edf2f7; box-sizing: border-box; margin-top: auto; }

        /* --- Custom Alert Modal --- */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 2000; display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s; }
        .custom-modal-overlay.show { opacity: 1; visibility: visible; }
        .custom-modal-box { background: white; padding: 35px 30px; border-radius: 25px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.15); transform: translateY(-20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .custom-modal-overlay.show .custom-modal-box { transform: translateY(0); }
        .custom-modal-icon { font-size: 60px; margin-bottom: 20px; }
        .custom-modal-title { font-family: 'Kanit', sans-serif; font-size: 24px; font-weight: 600; color: #2d3436; margin: 0 0 10px 0; }
        .custom-modal-message { font-size: 15px; color: #636e72; margin: 0 0 25px 0; line-height: 1.6; font-family: 'Sarabun', sans-serif; }
        .custom-modal-btn { background: var(--primary); color: white; border: none; padding: 14px 40px; border-radius: 50px; font-family: 'Kanit', sans-serif; font-size: 16px; font-weight: 500; cursor: pointer; transition: 0.3s; }
        .custom-modal-btn:hover { background: var(--primary-light); transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0, 82, 212, 0.2); }

        @media (max-width: 768px) { nav { padding: 15px 20px; } .card-glass { padding: 30px 20px; border-radius: 20px; border: none; box-shadow: 0 10px 20px rgba(0,0,0,0.05); } .container { padding: 20px 10px; } }
    </style>
</head>
<body> 
    
    <nav>
        <a href="index.html" class="logo-container">
            <img src="img/favicon.png" alt="Logo" onerror="this.style.display='none'">
            <div class="logo-text-group">
                <div class="brand-name">Flip<span>School</span></div> 
            </div>
        </a>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> กลับหน้าหลัก</a>
    </nav>

    <div class="container">
        <div class="card-glass">
            <div class="card-header">
                <div class="icon-circle">
                    <i class="fas fa-chalkboard-teacher"></i>
                </div>
                <h2>เข้าสู่ระบบครู</h2>
                <p>ยินดีต้อนรับกลับเข้าสู่ระบบ FlipSchool</p>
            </div>
            
            <!-- ปุ่มเข้าสู่ระบบด้วย Google -->
            <div style="display: flex; justify-content: center; width: 100%; margin-bottom: 10px;">
                <div id="googleSignInBtn"></div>
            </div>

            <div class="divider"><span>หรือ เข้าสู่ระบบด้วยอีเมล</span></div>

            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label class="input-label" style="font-family: 'Kanit';">อีเมล</label>
                    <div class="input-wrapper">
                        <input type="email" id="email" placeholder="กรอกอีเมลของคุณ" required>
                        <i class="fas fa-envelope icon"></i>
                    </div>
                </div>

                <div class="input-group">
                    <label class="input-label" style="font-family: 'Kanit';">รหัสผ่าน</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="กรอกรหัสผ่าน" required>
                        <i class="fas fa-lock icon"></i>
                        <i class="fas fa-eye toggle-password" onclick="togglePass()"></i>
                    </div>
                </div>

                <div class="remember-wrapper">
                    <label style="display:flex; align-items:center; gap:10px; cursor:pointer; margin:0;">
                        <div class="switch">
                            <input type="checkbox" id="rememberMe">
                            <span class="slider"></span>
                        </div>
                        <span class="remember-text">จดจำอีเมลในเครื่องนี้</span>
                    </label>
                </div>

                <button type="submit" class="btn-submit" id="btnLogin">
                    เข้าสู่ระบบ <i class="fas fa-sign-in-alt"></i>
                </button>
                
                <div style="text-align: center; margin-top: 25px; font-size: 14px;">
                    <span style="color: #636e72;">ยังไม่มีบัญชีครู?</span>
                    <a href="teacher-register.html" style="color: var(--primary); font-family: 'Kanit', sans-serif; font-weight: 500; text-decoration: none; margin-left: 5px; transition: 0.2s;">ลงทะเบียนใหม่ที่นี่</a>
                </div>
            </form>
        </div>
    </div>

    <div class="footer">© 2026 FlipSchool. All rights reserved.</div> 

    <!-- ================= Custom Alert Modal HTML ================= -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div class="custom-modal-icon">
                <i class="fas fa-exclamation-circle" id="customAlertIcon" style="color: #ff4757;"></i>
            </div>
            <h3 class="custom-modal-title" id="customAlertTitle">แจ้งเตือน</h3>
            <p id="customAlertMessage" class="custom-modal-message"></p>
            <button class="custom-modal-btn" onclick="closeCustomAlert()">ตกลง</button>
        </div>
    </div>

    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="js/supabase-db.js"></script> 
    
    <script>
        // --- ตั้งค่าระบบ Google Login ---
        const GOOGLE_CLIENT_ID = "450991822360-2t4h354971l21uhk2c5ticjbh8f30jrf.apps.googleusercontent.com";
        let alertCallback = null;

        // ================= ฟังก์ชันป๊อปอัปแจ้งเตือน (Custom Alert) =================
        function showCustomAlert(message, type = 'error', callback = null) {
            const modal = document.getElementById('customAlertModal');
            const titleEl = document.getElementById('customAlertTitle');
            const msgEl = document.getElementById('customAlertMessage');
            const iconEl = document.getElementById('customAlertIcon');

            msgEl.innerText = message;
            alertCallback = callback;

            if (type === 'success') {
                iconEl.className = 'fas fa-check-circle';
                iconEl.style.color = '#2ed573';
                titleEl.innerText = 'สำเร็จ!';
            } else if (type === 'warning') {
                iconEl.className = 'fas fa-exclamation-triangle';
                iconEl.style.color = '#ffa502';
                titleEl.innerText = 'ข้อควรระวัง';
            } else {
                iconEl.className = 'fas fa-times-circle';
                iconEl.style.color = '#ff4757';
                titleEl.innerText = 'เกิดข้อผิดพลาด';
            }

            modal.classList.add('show');
        }

        function closeCustomAlert() {
            const modal = document.getElementById('customAlertModal');
            modal.classList.remove('show');
            if (alertCallback) { setTimeout(alertCallback, 300); alertCallback = null; }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof initAppUI === 'function') initAppUI();

            // 1. ตรวจสอบเซสชัน ถ้ามีให้ไปหน้า Dashboard เลย
            if (typeof sysDB !== 'undefined' && sysDB) {
                const { data: { session } } = await sysDB.auth.getSession();
                if (session) {
                    window.location.href = 'teacher-dashboard.html';
                    return;
                }
            }

            // 2. จัดการ Remember Me
            const emailInput = document.getElementById('email');
            const rememberMeCheck = document.getElementById('rememberMe');
            const savedEmail = localStorage.getItem('teacher_remember_email');
            
            if (savedEmail && emailInput) {
                emailInput.value = savedEmail;
                if (rememberMeCheck) rememberMeCheck.checked = true;
            }

            // 3. จัดการโหลดปุ่ม Google Sign in
            if(window.google) {
                google.accounts.id.initialize({
                    client_id: GOOGLE_CLIENT_ID,
                    callback: handleGoogleCredentialResponse,
                    context: "signin"
                });
                google.accounts.id.renderButton(
                    document.getElementById("googleSignInBtn"),
                    { theme: "outline", size: "large", width: 420, text: "signin_with", shape: "rectangular", borderRadius: 15 } 
                );
            }
        });

        // 4. ฟังก์ชันรับ Token และล็อกอินผ่าน Google
        async function handleGoogleCredentialResponse(response) {
            try {
                const idToken = response.credential;
                const { data, error } = await sysDB.auth.signInWithIdToken({
                    provider: 'google',
                    token: idToken,
                });

                if (error) throw error;
                window.location.href = 'teacher-dashboard.html';

            } catch (err) {
                console.error("Google Auth Error:", err);
                showCustomAlert("ไม่สามารถเข้าสู่ระบบด้วย Google ได้: " + err.message, "error");
            }
        }

        // 5. เปิด/ปิด การแสดงรหัสผ่าน
        function togglePass() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-password');
            if (input && input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
                icon.style.color = 'var(--primary)';
            } else if (input) {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
                icon.style.color = '#a4b0be';
            }
        }

        // 6. ฟังก์ชันเข้าสู่ระบบด้วยอีเมล
        async function handleLogin(e) {
            e.preventDefault();
            
            if (typeof sysDB === 'undefined' || !sysDB) { 
                showCustomAlert("ระบบฐานข้อมูลไม่พร้อมใช้งาน กรุณารีเฟรชหน้าจอ", "warning"); 
                return; 
            }

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> กำลังตรวจสอบ...';

            try {
                const { data, error } = await sysDB.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // บันทึก Remember Me
                if (rememberMe) {
                    localStorage.setItem('teacher_remember_email', email);
                } else {
                    localStorage.removeItem('teacher_remember_email');
                }

                window.location.href = 'teacher-dashboard.html';

            } catch (err) {
                console.error(err);
                showCustomAlert('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง', 'error');
                btn.disabled = false;
                btn.innerHTML = 'เข้าสู่ระบบ <i class="fas fa-sign-in-alt"></i>';
            }
        }
    </script>
</body>
</html>
