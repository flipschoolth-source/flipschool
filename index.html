<!-- ไฟล์: index.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>FlipSchool - นวัตกรรมเพื่อการจัดการเรียนรู้</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/favicon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#00008B">

    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #00008B; --primary-light: #0000cd; --accent: #FF8C00; --bg-body: #f4f7fe; --text-main: #2d3436; --text-muted: #636e72; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-body); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; background-image: radial-gradient(circle at top right, #e0e8ff 0%, transparent 40%), radial-gradient(circle at bottom left, #fff0e6 0%, transparent 40%); }

        /* Navbar */
        #mainNav { display: flex; justify-content: space-between; align-items: center; padding: 0 5%; height: 90px; background: white; position: sticky; top: 0; z-index: 1000; width: 100%; box-sizing: border-box; border-bottom: 1px solid #f1f5f9; transition: all 0.3s ease; }
        #mainNav.scrolled { height: 70px; box-shadow: 0 10px 30px rgba(0,0,80,0.08); }
        .nav-left { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--primary); }
        .nav-logo-icon { font-size: 28px; background: white; width: 50px; height: 50px; border-radius: 14px; border: 2.5px solid var(--primary); display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,139,0.1); }
        .nav-brand { font-size: 26px; font-weight: 700; font-family: 'Kanit'; }
        .nav-brand span { color: var(--accent); }

        /* Hero */
        .hero-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 5%; }
        .hero-card { display: flex; flex-direction: row; background: white; width: 100%; max-width: 1150px; border-radius: 35px; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.08); }
        .hero-image-side { flex: 1.2; background: url('img/cover01.jpg') center/cover no-repeat; min-height: 400px; }
        .hero-text-side { flex: 1; padding: 50px; display: flex; flex-direction: column; justify-content: center; }
        .hero-title { font-family: 'Kanit'; font-size: 36px; font-weight: 700; color: var(--primary); margin-bottom: 15px; }
        .hero-title span { color: var(--accent); }

        /* Install Button */
        .btn-install-modern { display: none; background: var(--primary); color: white; padding: 14px 32px; border-radius: 50px; font-family: 'Kanit'; font-size: 18px; font-weight: 600; align-items: center; justify-content: center; gap: 10px; border: none; cursor: pointer; box-shadow: 0 10px 20px rgba(0, 0, 139, 0.2); transition: 0.3s; width: fit-content; margin-top: 20px; }
        .btn-install-modern:hover { transform: translateY(-2px); background: var(--primary-light); }
        .pulse-anim { animation: pulse 2s infinite; }

        /* Custom Modal */
        .custom-modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 5000; display: none; justify-content: center; align-items: center; }
        .custom-modal-box { background: white; padding: 35px; border-radius: 25px; width: 90%; max-width: 420px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.15); }

        @keyframes pulse { 0% { transform: scale(1); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }
        @media (max-width: 768px) { .hero-card { flex-direction: column; } .hero-image-side { min-height: 250px; } .hero-text-side { padding: 30px; text-align: center; align-items: center; } }
    </style>
</head>
<body>

    <nav id="mainNav">
        <a href="index.html" class="nav-left">
            <div class="nav-logo-icon">🎓</div>
            <div class="nav-brand">Flip<span>School</span></div>
        </a>
        <a href="login.html" style="text-decoration:none; background:var(--primary); color:white; padding:8px 20px; border-radius:20px; font-family:'Kanit';">เข้าสู่ระบบ</a>
    </nav>

    <section class="hero-container">
        <div class="hero-card">
            <div class="hero-image-side"></div>
            <div class="hero-text-side">
                <h1 class="hero-title">เรียนรู้ที่บ้าน<br><span>เสริมสร้างประสบการณ์</span><br>ที่โรงเรียน</h1>
                <p style="color:var(--text-muted);">นวัตกรรมเพื่อการจัดการเรียนรู้ GLORY Model</p>
                
                <!-- ปุ่มสลับสถานะ ติดตั้ง / เปิดแอป -->
                <button id="installBtn" class="btn-install-modern" onclick="handleAppAction()">
                    <i class="fas fa-download" id="installBtnIcon"></i> <span id="installBtnText">ติดตั้งแอปพลิเคชัน</span>
                </button>
            </div>
        </div>
    </section>

    <!-- Custom Modal -->
    <div id="customAlertModal" class="custom-modal-overlay">
        <div class="custom-modal-box">
            <div style="font-size: 50px; color: var(--primary); margin-bottom: 20px;"><i class="fas fa-info-circle"></i></div>
            <h3 style="font-family:'Kanit'; font-size:22px; margin-bottom:10px;">คำแนะนำการติดตั้ง</h3>
            <p id="customAlertMessage" style="margin-bottom:25px; line-height:1.6;"></p>
            <button onclick="closeCustomAlert()" style="background:var(--primary); color:white; border:none; padding:12px 40px; border-radius:50px; font-family:'Kanit'; cursor:pointer; font-size:16px;">ตกลง</button>
        </div>
    </div>

    <script>
        let deferredPrompt;
        const installBtn = document.getElementById('installBtn');
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        function showCustomAlert(msg) {
            document.getElementById('customAlertMessage').innerHTML = msg;
            document.getElementById('customAlertModal').style.display = 'flex';
        }
        function closeCustomAlert() { document.getElementById('customAlertModal').style.display = 'none'; }

        // ตรวจสอบสถานะและแสดงปุ่ม
        function checkPWAStatus() {
            const isInstalled = localStorage.getItem('pwa_installed') === 'yes' || isStandalone;
            
            if (isStandalone) {
                installBtn.style.display = 'none'; // อยู่ในแอปแล้วไม่ต้องโชว์
            } else if (isInstalled) {
                installBtn.style.display = 'inline-flex';
                document.getElementById('installBtnIcon').className = 'fas fa-external-link-alt';
                document.getElementById('installBtnText').innerText = 'เปิดใช้งานแอป';
            } else {
                installBtn.style.display = 'inline-flex';
                installBtn.classList.add('pulse-anim');
            }
        }

        // ดักจับ Event ติดตั้ง (สำหรับ Android / PC)
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            checkPWAStatus();
        });

        window.addEventListener('appinstalled', () => {
            localStorage.setItem('pwa_installed', 'yes');
            checkPWAStatus();
        });

        function handleAppAction() {
            if (isStandalone) return;

            // ถ้าติดตั้งแล้ว -> พยายามเปิดแอป (หรือรีโหลดเพื่อให้ระบบจัดการ)
            if (localStorage.getItem('pwa_installed') === 'yes') {
                showCustomAlert("หากคุณติดตั้งแอปแล้ว <br>กรุณากดเปิดที่ไอคอน 🎓 บนหน้าจอโฮมครับ");
                return;
            }

            // ถ้ายังไม่ติดตั้ง
            if (isIOS) {
                showCustomAlert("<b>สำหรับ iPhone/iPad:</b><br>1. กดปุ่ม <b>'แชร์'</b> (สี่เหลี่ยมลูกศรชี้ขึ้น)<br>2. เลือก <b>'เพิ่มไปยังหน้าจอโฮม'</b> (Add to Home Screen)");
            } else if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choice => {
                    if (choice.outcome === 'accepted') localStorage.setItem('pwa_installed', 'yes');
                });
            } else {
                // กรณีเปิดผ่าน LINE หรือเบราว์เซอร์ไม่รองรับ
                const isLine = /Line/i.test(navigator.userAgent);
                if (isLine) {
                    showCustomAlert("<b>คุณกำลังเปิดผ่านแอป LINE:</b><br>กรุณากดจุด 3 จุดมุมขวาบน <br>แล้วเลือก <b>'เปิดด้วยเบราว์เซอร์อื่น'</b> (Open in Default Browser) เพื่อติดตั้งครับ");
                } else {
                    showCustomAlert("กรุณากด <b>'เพิ่มลงในหน้าจอหลัก'</b> <br>จากเมนูของเบราว์เซอร์ (จุด 3 จุดมุมขวาบน) ครับ");
                }
            }
        }

        // เรียกตรวจสอบทันทีที่โหลดหน้า
        window.addEventListener('load', checkPWAStatus);
    </script>
</body>
</html>
