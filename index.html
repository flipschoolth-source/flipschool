<!-- ไฟล์: login.html -->
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - FlipSchool</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='white'/><text x='50%' y='50%' dominant-baseline='central' text-anchor='middle' font-size='65'>🎓</text></svg>">
    
    <script src="js/env-config.js"></script>
    <script src="js/config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-db.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --primary: #00008B; --accent: #FF8C00; --bg-color: #f4f7fe; }
        body { font-family: 'Sarabun', sans-serif; background-color: var(--bg-color); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .login-card { background: white; width: 90%; max-width: 420px; border-radius: 30px; padding: 40px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); text-align: center; border-top: 6px solid var(--accent); position: relative; }
        .logo-emoji { font-size: 42px; background: white; width: 75px; height: 75px; border-radius: 18px; border: 3px solid var(--primary); display: flex; align-items: center; justify-content: center; margin: 0 auto 15px auto; box-shadow: 0 4px 12px rgba(0,0,139,0.15); }
        .brand-name { font-family: 'Kanit'; font-size: 28px; font-weight: 700; color: var(--primary); margin-bottom: 20px; }
        .brand-link { text-decoration: none; display: inline-block; transition: transform 0.3s; }
        .brand-link:hover { transform: translateY(-3px); }
        .form-input { width: 100%; padding: 14px 18px; border: 2px solid #edf2f7; border-radius: 12px; font-size: 15px; margin-bottom: 15px; background: #f8faff; box-sizing: border-box; outline: none; font-family: 'Sarabun'; }
        .form-input:focus { border-color: var(--accent); background: white; }
        .btn-submit { width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 12px; font-family: 'Kanit'; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .btn-submit:hover { opacity: 0.9; transform: translateY(-2px); }
        .divider { margin: 20px 0; color: #a4b0be; font-size: 13px; display: flex; align-items: center; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #edf2f7; }
        .register-link { margin-top: 20px; font-size: 14px; color: #636e72; }
        .register-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .google-btn-container { min-height: 44px; display: flex; justify-content: center; margin-bottom: 15px; }
        
        #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .spinner { border: 5px solid #f0f4ff; border-top: 5px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loadingOverlay">
        <div class="spinner"></div>
        <div style="font-family: 'Kanit'; color: var(--primary); font-weight: 600;" id="loadingText">กำลังตรวจสอบการเข้าสู่ระบบ...</div>
    </div>

    <div class="login-card">
        <button onclick="window.location.href='index.html'" style="position: absolute; top: 15px; left: 15px; background: none; border: none; color: #a4b0be; cursor: pointer; font-size: 20px; transition: 0.2s;" onmouseover="this.style.color='var(--primary)'" onmouseout="this.style.color='#a4b0be'"><i class="fas fa-home"></i></button>
        
        <a href="index.html" class="brand-link" title="กลับหน้าหลัก">
            <div class="logo-emoji">🎓</div>
            <div class="brand-name">Flip<span style="color:var(--accent);">School</span></div>
        </a>
        <p style="color: #636e72; font-size: 14px; margin-bottom: 25px;">ระบบจัดการเรียนรู้สำหรับครูและนักเรียน</p>

        <div id="googleSignInBtn" class="google-btn-container"></div>

        <div class="divider"><span style="padding: 0 10px;">หรือเข้าสู่ระบบด้วยรหัสผ่าน</span></div>

        <form onsubmit="handleEmailLogin(event)">
            <input type="text" id="emailOrCode" class="form-input" placeholder="อีเมล / รหัสนักเรียน@อักษรย่อ" required>
            <input type="password" id="password" class="form-input" placeholder="รหัสผ่าน / ว.ด.ป.เกิด (เช่น 15/05/2010)" required>
            <button type="submit" id="btnLogin" class="btn-submit">เข้าสู่ระบบ <i class="fas fa-sign-in-alt ml-2"></i></button>
        </form>

        <div class="register-link">
            สำหรับผู้ใช้งานใหม่ <br><a href="register.html">สร้างบัญชีที่นี่</a>
        </div>
    </div>

    <script>
        function getDB() {
            if (window.sysDB) return window.sysDB;
            window.sysDB = supabase.createClient(APP_CONFIG.SUPABASE_URL, APP_CONFIG.SUPABASE_KEY);
            return window.sysDB;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            if (typeof initAppUI === 'function') initAppUI();
            
            try {
                const db = getDB();
                const { data: { session } } = await db.auth.getSession();
                
                if (session && session.user) {
                    checkAndRedirect(session.user.id);
                } else if (localStorage.getItem('flip_student_session_id')) {
                    checkAndRedirect(localStorage.getItem('flip_student_session_id'));
                } else {
                    document.getElementById('loadingOverlay').style.opacity = '0';
                    setTimeout(() => document.getElementById('loadingOverlay').style.display = 'none', 500);
                }
            } catch(e) {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        });

        async function checkAndRedirect(userId) {
            const db = getDB();
            const { data: userRecord } = await db.from('users').select('is_super_admin, role').eq('user_id', userId).maybeSingle();
            
            if (userRecord && (userRecord.is_super_admin || userRecord.role === 'super_admin')) {
                window.location.replace('super_admin.html');
            } else {
                window.location.replace('dashboard.html');
            }
        }

        window.onload = function () {
            if (typeof APP_CONFIG !== 'undefined' && APP_CONFIG.GOOGLE_CLIENT_ID) {
                google.accounts.id.initialize({
                    client_id: APP_CONFIG.GOOGLE_CLIENT_ID,
                    callback: handleGoogleLogin
                });
                google.accounts.id.renderButton(
                    document.getElementById("googleSignInBtn"),
                    { theme: "outline", size: "large", text: "signin_with", width: 340, shape: "pill" }
                );
            }
        };

        async function handleGoogleLogin(response) {
            try {
                document.getElementById('loadingOverlay').style.display = 'flex';
                document.getElementById('loadingOverlay').style.opacity = '1';
                
                const db = getDB();
                const { data, error } = await db.auth.signInWithIdToken({ provider: 'google', token: response.credential });
                if (error) throw error;

                const { data: user } = await db.from('users').select('user_id').eq('user_id', data.user.id).maybeSingle();
                if (!user) {
                    await db.from('users').insert([{
                        user_id: data.user.id,
                        first_name: data.user.user_metadata?.full_name || data.user.email.split('@')[0],
                        last_name: '',
                        email: data.user.email,
                        profile_pic: data.user.user_metadata?.avatar_url
                    }]);
                }
                checkAndRedirect(data.user.id);
            } catch (err) {
                alert("เข้าสู่ระบบด้วย Google ไม่สำเร็จ: " + err.message);
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        async function handleEmailLogin(e) {
            e.preventDefault();
            const loginId = document.getElementById('emailOrCode').value.trim();
            const password = document.getElementById('password').value.trim();
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>'; btn.disabled = true;

            try {
                const db = getDB();

                if (loginId.includes('@') && !loginId.includes('.')) {
                    const [code, abbr] = loginId.split('@');
                    const { data: school } = await db.from('schools').select('school_id').eq('school_abbr', abbr.toLowerCase()).maybeSingle();
                    if (!school) throw new Error("อักษรย่อโรงเรียนไม่ถูกต้อง");

                    const { data: studentRecords } = await db.from('user_school')
                        .select('user_id, student_code, birth_date')
                        .eq('school_id', school.school_id)
                        .eq('student_code', code);

                    if (!studentRecords || studentRecords.length === 0) throw new Error("ไม่พบรหัสนักเรียนนี้ในระบบ");

                    let matchedUserId = null;

                    for (let std of studentRecords) {
                        let bDate = std.birth_date;
                        if (!bDate) {
                            const { data: uData } = await db.from('users').select('birth_date').eq('user_id', std.user_id).maybeSingle();
                            if (uData) bDate = uData.birth_date;
                        }

                        if (bDate) {
                            let [y, m, d] = bDate.split('-');
                            let ty = parseInt(y) + 543; 
                            let possibleDates = [ bDate, `${d}/${m}/${y}`, `${d}-${m}-${y}`, `${d}${m}${y}`, `${d}/${m}/${ty}`, `${d}-${m}-${ty}`, `${d}${m}${ty}` ];
                            
                            if (possibleDates.includes(password)) {
                                matchedUserId = std.user_id;
                                break;
                            }
                        }
                    }

                    if (matchedUserId) {
                        localStorage.setItem('flip_student_session_id', matchedUserId);
                        window.location.replace('dashboard.html');
                        return;
                    } else {
                        throw new Error("รหัสผ่าน หรือ ว.ด.ป.เกิด ไม่ถูกต้อง");
                    }
                } 
                else {
                    const { data, error } = await db.auth.signInWithPassword({ email: loginId, password: password });
                    if (error) throw new Error("อีเมลหรือรหัสผ่านไม่ถูกต้อง");
                    checkAndRedirect(data.user.id);
                }

            } catch (err) {
                alert(err.message);
                btn.innerHTML = 'เข้าสู่ระบบ <i class="fas fa-sign-in-alt ml-2"></i>'; btn.disabled = false;
            }
        }
    </script>
</body>
</html>
